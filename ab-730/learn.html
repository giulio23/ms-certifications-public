<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Giulio Stefanica">
  <title>AB-730 Learn | Master the skills</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Scoped typography for injected guide content — matches the app's card style */
    .guide { color:#334155; }
    .guide h2 { font-size:1.2rem; font-weight:700; color:#0f172a; margin:2rem 0 .85rem; padding-bottom:.35rem; border-bottom:1px solid #e2e8f0; }
    .guide h3 { font-size:1rem; font-weight:600; color:#1e293b; margin:1.4rem 0 .5rem; }
    .guide p { margin:0 0 .8rem; line-height:1.65; }
    .guide ul, .guide ol { margin:0 0 .9rem 1.25rem; line-height:1.6; }
    .guide ul { list-style:disc; } .guide ol { list-style:decimal; }
    .guide li { margin-bottom:.4rem; }
    .guide code { background:#f1f5f9; color:#be185d; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.82em; padding:.1rem .35rem; border-radius:.3rem; }
    .guide b, .guide strong { color:#0f172a; }
    .guide .table-wrap { overflow-x:auto; margin:0 0 1rem; border:1px solid #e2e8f0; border-radius:.75rem; }
    .guide table { width:100%; border-collapse:collapse; font-size:.85rem; }
    .guide thead th { background:#f8fafc; text-align:left; font-weight:600; color:#334155; padding:.6rem .7rem; border-bottom:1px solid #e2e8f0; white-space:nowrap; }
    .guide tbody td { padding:.6rem .7rem; border-bottom:1px solid #f1f5f9; vertical-align:top; }
    .guide tbody tr:last-child td { border-bottom:none; }
    .guide .callout { border-radius:.75rem; padding:.85rem 1rem; margin:0 0 1rem; }
    .guide .callout ul { margin-bottom:0; }
    .guide .callout-key { background:#eff6ff; border-left:4px solid #3b82f6; }
    .guide .scenario { background:#fffbeb; border:1px solid #fde68a; border-radius:.75rem; padding:.8rem 1rem; margin:0 0 .9rem; }
    .guide .note-line { font-size:.85rem; color:#64748b; background:#f8fafc; border-radius:.6rem; padding:.6rem .8rem; }
    .guide ol.steps { counter-reset:step; list-style:none; margin-left:0; }
    .guide ol.steps > li { position:relative; padding:.15rem 0 .9rem 2.2rem; margin:0; border-left:2px solid #e2e8f0; margin-left:.75rem; padding-bottom:1rem; }
    .guide ol.steps > li:last-child { border-left-color:transparent; }
    .guide ol.steps > li::before { counter-increment:step; content:counter(step); position:absolute; left:-.85rem; top:0; width:1.6rem; height:1.6rem; background:#3b82f6; color:#fff; border-radius:9999px; font-size:.75rem; font-weight:700; display:flex; align-items:center; justify-content:center; }
    .guide .check { display:inline-block; margin-top:.35rem; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; font-size:.75rem; font-weight:600; padding:.15rem .55rem; border-radius:9999px; }
    .guide .check::before { content:"✓ "; }
    .guide details.answers { background:#f8fafc; border:1px solid #e2e8f0; border-radius:.6rem; padding:.6rem .85rem; margin:.3rem 0 1rem; }
    .guide details.answers summary { cursor:pointer; font-weight:600; color:#1e293b; font-size:.9rem; }
    .guide details.answers[open] summary { margin-bottom:.5rem; }
    .guide ol.quiz > li { margin-bottom:.5rem; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen">
  <!-- hub-home: back to the certification hub root -->
  <a id="hub-home" href="../" title="Back to the certification hub"
     style="position:fixed;top:10px;left:10px;z-index:2147483647;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;background:#0f172a;color:#fff;font:600 12px/1 ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;text-decoration:none;border-radius:9999px;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.82;transition:opacity .15s"
     onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.82">&#8962;&nbsp;Hub</a>

  <!-- NAVBAR -->
  <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 md:px-8 flex items-center justify-between h-14">
      <a href="index.html" class="flex items-center gap-2 text-gray-600 hover:text-gray-900 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        <span class="text-sm">Home</span>
      </a>
      <span class="text-sm font-medium text-gray-700">Learn</span>
      <div class="flex items-center gap-4">
        <a href="study.html" class="text-sm text-gray-500 hover:text-gray-800 transition">Study</a>
        <a href="exam.html" class="text-sm text-blue-500 hover:text-blue-600 transition">Exam</a>
      </div>
    </div>
  </nav>

  <header class="max-w-6xl mx-auto px-4 md:px-8 pt-8 pb-2">
    <h1 class="text-2xl md:text-3xl font-bold tracking-tight">Master AB-730</h1>
    <p class="text-gray-500 text-sm mt-1">Hands-on guides for every study-guide sub-skill — notes, scenario decisions, and a self-check. Read → decide → verify → drill.</p>
  </header>

  <!-- mobile guide picker -->
  <div class="lg:hidden max-w-6xl mx-auto px-4 md:px-8 mt-4">
    <select id="guide-select" class="w-full text-sm border border-gray-300 rounded-lg px-3 py-2 focus:ring-blue-500 focus:border-blue-500"></select>
  </div>

  <main class="max-w-6xl mx-auto px-4 md:px-8 py-6 grid lg:grid-cols-[240px_1fr] gap-8">
    <!-- sidebar -->
    <aside class="hidden lg:block">
      <div id="guide-list" class="sticky top-20"></div>
    </aside>
    <!-- content -->
    <section id="guide-content" class="min-w-0"></section>
  </main>

  <script src="js/questions.combined.js"></script>
  <script src="js/mastery.js"></script>
  <script src="js/learn-app.js"></script>
</body>
</html>
