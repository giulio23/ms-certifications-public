ry table, no code apps in some reports yet, disjointed agent surfaces) and conclude it's the beginning of the end for the CoE Starter Kit, but not the end.", "relevance": "Useful awareness for tracking apps/agents/usage across a Power Platform tenant without deploying the full CoE Starter Kit - relevant if Giulio's Innovation team wants lightweight, native visibility into demo sprawl and Copilot Studio agent usage rather than standing up the full starter kit."}, {"video_id": "EtdVhzISEdI", "title": "Microsoft Learn Extractor: Track Skills & Certifications Easily", "url": "https://www.youtube.com/watch?v=EtdVhzISEdI", "published": "2025-12-16", "duration": "20m 55s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-400", "AB-900"], "topics": ["alternate key", "canvas app", "certifications tracking", "dataverse", "governance", "http connector", "odata", "power automate", "skills database", "upsert"], "summary": "Charles demos his free, open-source Microsoft Learn Extractor: a canvas app plus parent/child Power Automate flows that pull a user's certifications, applied skills, and completed modules from an undocumented Microsoft Learn API and upsert them into Dataverse using alternate keys, with gotchas around OData binds, pluralization, and HTTP batch requests to Dataverse.", "relevance": "A ready-made, deployable pattern Giulio could adapt to auto-track his own and colleagues' Microsoft AI/Power Platform certification progress in Dataverse, then report on team skill coverage via Power BI for the Innovation team's upskilling plan; the upsert-with-alternate-key flow pattern is also directly reusable for other BC-data sync flows."}, {"video_id": "mx8LQZXlyDQ", "title": "Assess before you build in Power Platform", "url": "https://www.youtube.com/watch?v=mx8LQZXlyDQ", "published": "2025-12-09", "duration": "23m 30s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["business value", "citizen developer", "coe starter kit", "dataverse", "governance", "mvp", "power apps", "power platform"], "summary": "Discussion of how to validate a Power Platform app idea before building: reviewing CoE Starter Kit tools (maker command center, developer compliance center, innovation backlog app, business value toolkit), then covering practical assessment questions around value, scale, MVP scope, support lifecycle, governance/connector constraints, and tool/architecture choice, closing with a real story about digitizing meter readings.", "relevance": "Directly useful process framework for Giulio's Innovation-team work: before building each new BC/BI Power Platform or AI demo, he needs a repeatable way to justify scope, MVP size, and governance fit to stakeholders rather than just picking the shiniest technology."}, {"video_id": "DH562HuKs-w", "title": "PPAC expertise with Craig White", "url": "https://www.youtube.com/watch?v=DH562HuKs-w", "published": "2025-12-02", "duration": "37m 46s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["AB-900", "PL-900"], "topics": ["advanced connector policies", "ai builder", "dlp", "generative ai settings", "governance", "managed environments", "mcp", "power platform admin center", "power platform pipelines", "prompt columns"], "summary": "Governance MVP Craig White walks through the Power Platform Admin Center's rapidly expanding AI/Copilot governance controls: generative AI environment-group settings (data residency, preview/experimental models), AI Builder and Dataverse prompt-column credit consumption, Power Platform pipelines, and Advanced Connector Policies for blocking normally-unblockable connectors including MCP servers and specific Dataverse actions.", "relevance": "Directly relevant to Giulio's Innovation-team role driving AI adoption responsibly: covers exactly the settings he'd need to check before turning on generative AI features or MCP-server connectivity for BC/BI agents in a governed tenant, plus a real anecdote of a Dataverse AI prompt column burning 700,000 credits."}, {"video_id": "6fJsrsFdmL0", "title": "Microsoft Ignite 2025 Power Platform & Governance Bombshells!", "url": "https://www.youtube.com/watch?v=6fJsrsFdmL0", "published": "2025-11-24", "duration": "29m 17s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["AB-900", "AB-100", "AB-620"], "topics": ["agent 365", "agent governance", "ai builder", "app builder", "code apps", "copilot studio", "dataverse", "managed platform", "shadow it", "zones"], "summary": "A breakdown of Ignite 2025's governance announcements: the '10,000 agents for 10 users / 10 agents for 10,000 users' concept and its three-tier zone model (safe/personal, supported/collaborative, IT-managed), Agent 365 as a unified cross-M365/Power Platform/Foundry agent governance portal, Copilot Studio's Managed Platform pillars, AI Builder-to-Copilot credit licensing changes, the new maker welcome-message experience, and the App Builder / code apps / Power Apps Studio spectrum.", "relevance": "Gives Giulio a practical framework — the three-tier zone model — for classifying and governing the agents and apps the Innovation team will build across Copilot Studio, M365 Copilot, and Foundry, plus early visibility into Agent 365 as the coming cross-platform governance hub relevant to his AI-adoption remit."}, {"video_id": "i3xzkZS0SoM", "title": "An introduction to Environment Variables in Power Platform", "url": "https://www.youtube.com/watch?v=i3xzkZS0SoM", "published": "2025-11-18", "duration": "32m 08s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "canvas app", "connection reference", "dataverse", "environment variables", "managed solution", "power automate", "power platform", "sharepoint", "solutions"], "summary": "Live-demo walkthrough of environment variables: creating text and data-source variables, wiring them into a canvas app and a Power Automate flow so hardcoded values (email address, SharePoint site/list) become dynamic, then exporting a managed solution and importing it into a second environment where the variable values are set per environment without touching the app's code.", "relevance": "Directly applicable to Giulio's demo-building workflow: any BC/BI demo he moves from his dev sandbox to a test environment needs its BC environment/company reference, notification email, or SharePoint list swapped per environment, which is exactly the pattern shown here."}, {"video_id": "natG5kjFQbc", "title": "Admin tools, community contributions, PCF governance and more with Valentin Mazhar", "url": "https://www.youtube.com/watch?v=natG5kjFQbc", "published": "2025-11-17", "duration": "9m 24s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": [], "topics": ["admin tools", "coe starter kit", "community", "copilot agents", "governance", "licensing", "low code plugins", "managed environments", "pcf components"], "summary": "Power Platform MVP Valentin Mazhar discusses why he builds and freely releases governance tools, the gap in visibility around what PCF components actually call, licensing gaps that persist even with managed environments and the CoE Kit, and his emerging tooling for administering Copilot/agent metadata (deleting orphaned agents, surfacing which tools/agents an agent calls).", "relevance": "Reinforces that even with managed environments and the CoE Kit there are real governance gaps around AI agents (deleting agents, inspecting what tools/agents an agent uses) - relevant context for Giulio as he starts building and administering Copilot Studio agents for BC/BI use cases on the Innovation team."}, {"video_id": "VssfXGZQzy0", "title": "Reducing Power Platform risks with the Endpoint Collector", "url": "https://www.youtube.com/watch?v=VssfXGZQzy0", "published": "2025-11-11", "duration": "9m 56s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["AB-900", "PL-400"], "topics": ["audit", "coe starter kit", "dataverse", "dlp policy", "governance", "hardcoded secrets", "http connector", "power automate", "power bi"], "summary": "A free CoE-kit extension that scans every Power Automate flow using the HTTP connector, converts the flow definition JSON to XML via XPath to reliably find HTTP actions, and stores each endpoint/host/URI plus whether secrets look hardcoded into a Dataverse table with a configurable Power BI dashboard, to inform DLP endpoint whitelisting decisions.", "relevance": "A directly reusable pattern for auditing which Power Automate flows call the Business Central API or other endpoints via the raw HTTP connector, and for catching hardcoded BC credentials before locking the tenant down with stricter DLP policies."}, {"video_id": "DV7cBn_GnmM", "title": "Your Power Platform estate is at risk without the Settings Enforcer!", "url": "https://www.youtube.com/watch?v=DV7cBn_GnmM", "published": "2025-11-04", "duration": "21m 29s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": [], "topics": ["dataverse", "environment groups", "governance", "managed environments", "organization table", "power automate", "power platform", "settings enforcer"], "summary": "Interview with Microsoft MVP Valentine about his free Settings Enforcer tool, which enforces Power Platform environment settings at scale by writing directly to the Dataverse organization table instead of configuring each environment by hand, using policies, setting configurations, and a daily auto-redeployment with random delay to prevent admins from reverting settings.", "relevance": "Governance-tooling context rather than a hands-on build for Giulio, but useful background for the Innovation team's broader case for premium licensing and environment governance if the BC consultancy scales up its number of Power Platform environments beyond what environment groups alone can enforce."}, {"video_id": "mHW_3Sni6ks", "title": "The Case for Power Apps Premium Licensing", "url": "https://www.youtube.com/watch?v=mHW_3Sni6ks", "published": "2025-10-28", "duration": "42m 25s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["business case", "dataverse", "environment routing", "governance", "licensing", "managed environments", "plan designer", "power apps premium", "power platform pipelines", "sharepoint"], "summary": "Charles and his co-host build the business and technical case for Power Apps premium licensing versus SharePoint-backed standard apps, covering Dataverse advantages (model-driven apps, security roles, ERD, Copilot-generated fake data), governance features (managed environments, environment routing, Power Platform pipelines, Plan Designer), and how to build a monetary ROI case and scale an enablement/delivery team.", "relevance": "Gives Giulio a ready-made framework for pitching premium Power Platform licensing internally at his BC consultancy - directly useful when arguing for Dataverse-backed BC/BI solutions over SharePoint-list workarounds, and for justifying Copilot Studio/managed-environment investment to leadership."}, {"video_id": "MwqUsROt8ro", "title": "An introduction to Power Apps licensing (with some special tips)", "url": "https://www.youtube.com/watch?v=MwqUsROt8ro", "published": "2025-10-21", "duration": "25m 47s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["ai builder credits", "dataverse", "governance", "multiplexing", "pay-as-you-go", "power apps licensing", "power automate", "power pages", "premium per app", "premium per user"], "summary": "A conversational primer on Power Platform licensing covering the three core Power Apps license types (premium per user, per app, pay-as-you-go), seeded E3/E5 entitlements, when premium connectors or Dataverse trigger a need for licensing, Power Pages authenticated vs unauthenticated pricing, the multiplexing risk of service accounts and SharePoint-to-Dataverse workarounds, and upcoming AI Builder-to-Copilot credit changes.", "relevance": "Directly informs any business case Giulio needs to build for premium Power Platform licensing at the BC consultancy, and the multiplexing/service-account warning is a real risk to check before wiring a Power Automate flow or code app to Dataverse on behalf of many BC users."}, {"video_id": "CTkRVQCnbc8", "title": "What Are Managed and Unmanaged Solutions in Power Platform?", "url": "https://www.youtube.com/watch?v=CTkRVQCnbc8", "published": "2025-10-14", "duration": "29m 04s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "connection references", "dataverse", "dependencies", "managed solutions", "power platform", "publisher", "solution layering", "solutions", "unmanaged solutions"], "summary": "Explains solutions in Power Platform: unmanaged solutions as editable references vs managed solutions as locked, production-ready containers; solution layering, dependencies, the 'block unmanaged customizations' setting, preferred solutions, publishers, what can/can't be solutionized, and a live demo of exporting/importing a solution plus versioning basics.", "relevance": "Core ALM skill Giulio needs to package any BC-connected canvas app, flow, or Dataverse component he builds in his sandbox into a solution he can move cleanly from dev to a test environment when showing his Innovation team or BI team a working demo, rather than leaving everything unsolutionized in one environment."}, {"video_id": "rK3asrBrsI4", "title": "Inside the COE Starter Kit: Manage Permissions & More", "url": "https://www.youtube.com/watch?v=rK3asrBrsI4", "published": "2025-10-07", "duration": "22m 32s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["coe starter kit", "compliance", "data loss prevention", "dataverse", "governance", "manage permissions", "managed environments", "power apps admin"], "summary": "Two Power Platform admins tour more CoE Starter Kit apps: Data Policy Impact Analysis (testing DLP changes before applying them), the Manage Permissions app (transferring app/flow ownership, inspecting cross-tenant connections), the CoE Command Center (starter kit health and sync-flow errors), and the Developer Compliance Center (makers self-service metadata that surfaces back to admins).", "relevance": "Useful reference for how a BC consultancy's Innovation team could govern a growing library of Power Platform/AI demos and pilots - especially DLP impact analysis before locking down connectors, and ownership handover when a demo moves from Giulio's sandbox to a team-owned solution."}, {"video_id": "Ue0pWsZh-GA", "title": "Getting started with the Center of Excellence (CoE) Starter Kit", "url": "https://www.youtube.com/watch?v=Ue0pWsZh-GA", "published": "2025-09-30", "duration": "25m 30s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900"], "topics": ["admin view", "alm", "canvas apps", "center of excellence", "coe starter kit", "dataverse", "dlp policies", "governance", "inventory", "power bi"], "summary": "Two governance practitioners cover common CoE Starter Kit installation gotchas (direct admin role assignment, Power Apps/Automate/BI licensing, API limits), then demo the setup and upgrade wizard and the Admin View app, showing Dataverse-backed inventory via sync flows, app/flow ownership management, and canvas app quarantining.", "relevance": "The CoE kit's Dataverse inventory tables and Power BI reporting are a direct template for giving the Innovation team visibility into the consultancy's growing app/flow estate, and the ownership/quarantine features map onto real BC-consultancy governance needs as more BI solutions get built."}, {"video_id": "cFFfjAeB6fQ", "title": "Data Policies in Power Platform", "url": "https://www.youtube.com/watch?v=cFFfjAeB6fQ", "published": "2025-09-23", "duration": "25m 25s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900", "PL-400"], "topics": ["connectors", "custom connectors", "data policies", "dataverse", "dlp", "governance", "least privilege", "power platform"], "summary": "Explains what data policies (formerly DLP policies) are and walks through creating one in the admin center: the default group, blocked/non-business/business connector categories, endpoint filtering (preview), custom connector pattern matching, policy scope, and how overlapping policies resolve via least privilege.", "relevance": "Directly relevant to Giulio's demos that connect BC/Dataverse data to Power Automate, Teams, or email: he needs to know how to classify the BC connector and related connectors as 'business' so BC data can't leak to non-business connectors like personal email, which matters when pitching AI adoption to a consultancy that is protective of client data."}, {"video_id": "xF4pYQqkkao", "title": "Environment Creation in Power Platform", "url": "https://www.youtube.com/watch?v=xF4pYQqkkao", "published": "2025-09-16", "duration": "25m 25s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "dataverse", "environment creation", "environment groups", "governance", "managed environments", "pac cli", "power platform admin center", "security groups"], "summary": "Power Squared hosts walk through creating a Power Platform environment from the admin center, covering naming conventions, managed environments, environment groups, region, environment type, Dataverse, security groups, and pay-as-you-go with Azure. They then survey automation options: the Power Platform for Admins connector, pac CLI, Azure DevOps/GitHub pipelines, PowerShell, and the unsupported BAP API.", "relevance": "Directly applicable to Giulio's Innovation-team remit of standing up sandbox environments for BC/BI demos - naming conventions, security groups, and Dataverse decisions matter every time he provisions a new environment for a Copilot Studio or Foundry pilot."}, {"video_id": "18uhsKGbOp0", "title": "Essential Tenant Settings for Power Platform", "url": "https://www.youtube.com/watch?v=18uhsKGbOp0", "published": "2025-09-09", "duration": "24m 45s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900"], "topics": ["admin center", "ai builder credits", "copilot studio", "customer lockbox", "data residency", "governance", "managed environments", "power automate", "tenant isolation", "tenant settings"], "summary": "Power Squared walks through the most important tenant-level settings in the Power Platform admin center: tenant isolation, developer/trial/production environment assignments, environment routing, AI Builder credit allocation, customer lockbox, Power Automate flow-run resubmission, the weekly digest/analytics, and the data-residency risk of preview features like Copilot in Power Apps and Copilot Studio agents.", "relevance": "As BI consultant on the Innovation team piloting AI adoption, these are the exact tenant controls that determine how safely Giulio can trial Copilot Studio/AI Builder against BC data without leaking data cross-region or letting AI Builder credits get consumed unpredictably."}, {"video_id": "NjgShlaLY00", "title": "An introduction to Power Platform Environments", "url": "https://www.youtube.com/watch?v=NjgShlaLY00", "published": "2025-09-02", "duration": "46m 20s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "coe starter kit", "dataverse", "default environment", "environment routing", "environments", "governance", "managed environments", "managed solutions", "power platform"], "summary": "Debut Power Squared episode explaining Power Platform environments: environment types, the messy default environment and how to govern it, ALM strategy (dev/test/prod), managed vs unmanaged solutions, Dataverse data isolation per environment, geographic/security considerations, the CoE Starter Kit, and how premium features (managed environments, environment routing, environment groups) strengthen governance.", "relevance": "Foundational for Giulio's Innovation-team role: any BC/BI Power Platform sandbox work he demos needs a defensible environment/ALM strategy before it can be proposed to the wider BC consultancy, and this maps directly to how his own tenant's default environment and sandbox should be organized."}, {"video_id": "ipdLyyaHthM", "title": "Send & Receive SMS Text Messages In Copilot Studio", "url": "https://www.youtube.com/watch?v=ipdLyyaHthM", "published": "2026-08-23", "duration": "16m 17s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-100", "AB-900"], "topics": ["channels", "copilot studio", "dynamics 365 contact center", "omnichannel", "sms", "twilio"], "summary": "Connects a Copilot Studio agent to real SMS text messaging by setting up Dynamics 365 Contact Center (a standalone product, no CRM required), enabling an SMS channel, adding a Twilio-backed messaging account and phone number, creating an inbound work stream, and linking the Copilot Studio agent so it answers hotel-guest FAQ questions over text message.", "relevance": "Lower direct fit for Giulio's BC/BI work, but useful as awareness of Contact Center as the supported way to put a Copilot Studio agent on an external channel like SMS/voice at scale — relevant background for AB-100/AB-900 governance and channel-architecture discussions if the Innovation team ever considers agent-driven customer channels."}, {"video_id": "BvDGMw_7sbk", "title": "How To Create Agent Skills In Copilot Studio", "url": "https://www.youtube.com/watch?v=BvDGMw_7sbk", "published": "2026-08-09", "duration": "26m 08s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100", "PL-400"], "topics": ["agent skills", "code interpreter", "copilot studio", "orchestrator", "pdf generation", "python", "validation"], "summary": "Shows how to author a Copilot Studio agent Skill entirely by chatting with a 'skill creator' agent: it iteratively writes a skill.md plus a Python script (using pypdf/pdfrw instead of coordinate-based field placement, per the presenter's feedback) that fills a fillable PDF certificate-of-origin from supplied vehicle data, packages it as a downloadable zip, and is then attached to a second agent — with a follow-up round adding a hand-written VIN-validation script as a second step the skill must pass before generating output.", "relevance": "Demonstrates the emerging Skills pattern (conceptually identical to Claude Code/Claude skills) for giving a Copilot Studio agent reusable, Python-backed, document-generation capability beyond stock connectors — directly applicable to any BC document-filling task (e.g. standard forms, compliance PDFs) Giulio wants to automate with validation logic baked in."}, {"video_id": "aZdKeVdiNys", "title": "How To Orchestrate Chat Without Topics In New Copilot Studio", "url": "https://www.youtube.com/watch?v=aZdKeVdiNys", "published": "2026-07-26", "duration": "28m 28s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100", "PL-900"], "topics": ["agent instructions", "copilot studio", "generative orchestration", "orchestration", "sharepoint", "skill.md", "skills", "topics deprecation"], "summary": "Demonstrates the new topic-less Copilot Studio experience, where an entire multi-turn ordering conversation (a fast-food cashier agent) is orchestrated purely through the agent's natural-language instructions plus tools/connectors (a SharePoint-hosted JSON menu, formatting rules, guardrails) and reusable 'skills' (skill.md files) instead of a structured topic flow, including having the agent write its own skill.md from a demonstrated conversation.", "relevance": "Signals a real shift in how Copilot Studio agents should be authored going forward, instructions plus skills instead of topic graphs, important for Giulio to understand before designing new agents (like a BC/BI helpdesk agent) so he builds them in the pattern Microsoft is moving toward; the skill.md self-authoring trick is a fast way to formalize agent behavior."}, {"video_id": "BUM4gUc8QUM", "title": "Build Agents With SharePoint List Knowledge (Copilot Studio)", "url": "https://www.youtube.com/watch?v=BUM4gUc8QUM", "published": "2026-06-28", "duration": "15m 49s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["copilot studio", "email agent", "excel export", "knowledge sources", "natural language query", "semantic search", "sharepoint"], "summary": "Grounds a Copilot Studio agent on a 6,000-row SharePoint list (car inventory), showing the orchestrator autonomously downloading list data to CSV and using a built-in 'analyze CSV/XLSX' skill for accurate natural-language filtering, then adds response-formatting instructions (columns, sort, default filters) and shows the agent generating an Excel export and answering via an email trigger — all with zero custom code.", "relevance": "Highly relevant as a low-effort, high-value demo: a large SharePoint list is a very BC/BI-adjacent data shape (think an exported customer, item, or transaction list), and this shows the built-in analyze-CSV/XLSX skills can answer accurate natural-language filter/sort/export questions over it without any Power Automate or Dataverse work."}, {"video_id": "aX4bcDPTmPY", "title": "The FUTURE of Copilot Studio is HERE (New Agents Preview)", "url": "https://www.youtube.com/watch?v=aX4bcDPTmPY", "published": "2026-06-13", "duration": "22m 40s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100", "AI-102", "PL-900"], "topics": ["agent skills", "ai agents", "copilot studio", "dataverse", "mcp", "memory", "orchestrator", "workflows"], "summary": "Tours the new Copilot Studio agent designer (build/preview/evaluate/monitor modes) built on a Claude-powered orchestrator with a sandboxed code workspace (Python/Node/Bash, dozens of libraries), demonstrated by building a workforce-scheduling agent that uses the Dataverse MCP server for data, agent Skills (markdown files the agent authors and saves itself from a working conversation) to generate formatted multi-tab Excel schedules, and persistent cross-session memory — while flagging that topics, inline child agents, and in-agent triggers are gone, replaced by Workflows and standalone connected agents.", "relevance": "This is the single most strategically important video in the batch for Giulio's Innovation-team AI-adoption remit: it shows where Copilot Studio's architecture is heading (MCP-first tool access, self-authored Skills instead of hand-built topics, native memory) and gives a concrete Dataverse MCP + Skills pattern directly reusable for BC-adjacent structured-data agents."}, {"video_id": "wpgYKz6kBGE", "title": "Typo-Proof Your Copilot Studio Agent With Dataverse Search", "url": "https://www.youtube.com/watch?v=wpgYKz6kBGE", "published": "2026-06-07", "duration": "27m 04s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["PL-400", "AB-620", "PL-900"], "topics": ["agent flows", "copilot studio", "data model", "dataverse", "fuzzy search", "quick find", "search query", "unbound actions"], "summary": "Builds a Copilot Studio agent that uses Dataverse's fuzzy 'search query' unbound action (not a keyword search) to match misspelled car model/make names against a Dataverse table, explains how to enable search and searchable columns and quick-find views, and extends the pattern with an agent flow that calculates min/max price ranges from a related inventory table.", "relevance": "A precise, reusable technique for making any Dataverse-backed Copilot Studio agent tolerant of user typos - directly applicable to a BC-master-data lookup agent (e.g. customer, item, or vendor lookup) where users won't type exact names, and demonstrates unbound actions plus agent-flow chaining, both PL-400-relevant Dataverse skills."}, {"video_id": "JH0Zy1EOJGE", "title": "Transform Copilot With CUSTOM UI Widgets From Power Apps", "url": "https://www.youtube.com/watch?v=JH0Zy1EOJGE", "published": "2026-05-24", "duration": "20m 19s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "AB-100"], "topics": ["coding agent", "copilot studio", "custom widgets", "dataverse", "m365 copilot", "mcp", "mcp apps", "model-driven apps", "power apps"], "summary": "Builds a custom interactive calendar widget rendered inside M365 Copilot chat: enables the built-in MCP server on a Power Apps model-driven app, creates a custom MCP tool (a data-shaping prompt over Dataverse tables) and a custom HTML/JS widget generated with a coding agent (GitHub Copilot CLI) using a dedicated MCP-apps skill, previews it locally against sample JSON, then deploys the declarative agent package to Teams/M365 Copilot.", "relevance": "This is bleeding-edge for the Innovation team's AI-adoption mandate — MCP apps let a Dataverse-backed model-driven app expose rich, interactive visual widgets (not just text) inside M365 Copilot, which is a compelling proof-of-concept for surfacing BC/BI schedules or dashboards directly in Copilot chat rather than a separate Power BI report."}, {"video_id": "o532hBhzSoQ", "title": "NEW Workflows Feature In Copilot Studio (20-Min Full Demo)", "url": "https://www.youtube.com/watch?v=o532hBhzSoQ", "published": "2026-05-12", "duration": "24m 20s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "AB-100"], "topics": ["agent flows", "classify action", "copilot studio", "extract action", "human in the loop", "orchestration", "power automate", "workflows"], "summary": "Full tour of Copilot Studio's rebranded 'Workflows' editor (replacing Agent flows/Power Automate look-and-feel with a draggable canvas, version history/diff, per-action testing, Control-F search) built end to end: an email-triage workflow uses a new Classify action to route messages to either a Copilot Studio agent or an M365 Copilot agent, a Prompt action extracts a salesperson name to forward mail, and a document-submission branch uses new Extract and Human Review actions before writing metadata to a SharePoint list.", "relevance": "Workflows are the evolution of Power Automate/agent flows that Giulio already uses for BC integrations, and the new Classify/Extract/Human-Review actions plus calling either a Copilot Studio or M365 Copilot agent as a step are directly relevant to designing multi-step BC approval or document-intake automations with a human-in-the-loop checkpoint."}, {"video_id": "uPWyhoRqo-0", "title": "How To View Conversation Transcripts In Copilot Studio", "url": "https://www.youtube.com/watch?v=uPWyhoRqo-0", "published": "2026-05-03", "duration": "7m 53s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-900", "PL-900"], "topics": ["admin tooling", "condition groups", "conversation transcripts", "copilot studio", "dataverse", "debugging", "power apps", "traces"], "summary": "Introduces a free vibe-coded Power Apps tool that reads the Dataverse conversation-transcript table to show the full, hidden trace of a Copilot Studio agent conversation - traces, events, and condition-group branch decisions - that the built-in activity pane doesn't surface, including support for cross-environment inspection via JSON import.", "relevance": "A genuinely useful debugging/governance tool for troubleshooting why an agent took a particular branch or failed a condition - directly useful once Giulio ships non-trivial agents with branching topics/flows and needs to diagnose behavior beyond the standard activity pane."}, {"video_id": "qAWu-xYnSzc", "title": "No More Manual Replies: Build An Email Agent In Copilot Studio", "url": "https://www.youtube.com/watch?v=qAWu-xYnSzc", "published": "2026-04-19", "duration": "33m 54s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400"], "topics": ["agent flows", "channels", "citations", "copilot studio", "email agent", "html formatting", "power automate", "triggers"], "summary": "End-to-end build of an email-triggered auto-reply agent: SharePoint/Excel knowledge and a filtered-search tool, HTML email-formatting instructions, a 'when a new email arrives in a shared inbox' Power Automate trigger, citation-stripping via the continue-response system variable, channel/trigger-type detection to branch between chat and email replies, and a final reply-to-email action.", "relevance": "A complete blueprint for a BC/BI 'inbox agent' — e.g. auto-answering routine finance/report-status questions sent to a shared team mailbox using BC data, with the exact channel-detection and citation-removal techniques needed to make an agent behave correctly whether it's tested in chat or triggered by a real email."}, {"video_id": "dUXE4FTx9Cw", "title": "Copilot Studio: Publish To A Website With Single Sign-On", "url": "https://www.youtube.com/watch?v=dUXE4FTx9Cw", "published": "2026-04-05", "duration": "21m 36s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-900", "PL-400"], "topics": ["app registration", "authentication", "azure blob storage", "copilot studio", "direct line api", "entra id", "single sign-on", "web chat client"], "summary": "Publishes a Copilot Studio agent to a custom web page with Microsoft-authenticated single sign-on: creates an Entra app registration with the Copilot Studio invoke permission, wires a Microsoft-provided Node.js Direct Line web chat client (index.html/js/settings.js) to the agent, tests it locally with VS Code Live Server, styles it with custom CSS, and hosts the static site on Azure Blob Storage.", "relevance": "This is the concrete recipe for exposing an internal BC/BI helpdesk agent on a proper branded webpage restricted to authenticated colleagues rather than only inside Teams or the Copilot Studio test panel, which matters for governance and for demoing Innovation team work outside M365 chat surfaces."}, {"video_id": "isClxl1O_Zs", "title": "Computer Use Agent: Extract Web Page Data In Copilot Studio", "url": "https://www.youtube.com/watch?v=isClxl1O_Zs", "published": "2026-03-22", "duration": "20m 57s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100", "AI-102"], "topics": ["autonomous agents", "cloud pc", "computer use", "copilot studio triggers", "excel connector", "orchestration", "outlook connector", "web automation"], "summary": "Builds an autonomous agent that uses the Copilot Studio computer-use tool (a cloud-based virtual PC with mouse/keyboard control) to browse government bid-listing websites, extract key RFP details with a goal-based instruction rather than scripted steps, look up the correct bid team in an Excel table, and forward the triggering email automatically.", "relevance": "Shows how to handle data with no API/connector at all by giving an agent a goal and letting it navigate a webpage visually - a useful fallback pattern for BC-adjacent portals or supplier sites without APIs, and a strong AB-100 example of designing a multi-tool autonomous agent (trigger, computer use, Excel lookup, email action)."}, {"video_id": "c9IaXLj0NMc", "title": "Question Nodes vs Topic Inputs In Copilot Studio", "url": "https://www.youtube.com/watch?v=c9IaXLj0NMc", "published": "2026-03-08", "duration": "27m 50s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400"], "topics": ["conversation design", "copilot studio", "entities", "generative orchestration", "power fx", "question nodes", "regular expressions", "topic inputs"], "summary": "A side-by-side build comparing question nodes (structured, s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "AI-102"], "topics": ["azure container apps", "copilot studio tools", "docker", "fastmcp", "mcp", "pro-code", "python"], "summary": "Builds a Python MCP server from scratch using FastMCP (tools decorated with @mcp.tool, async HTTPX calls, docstrings as tool descriptions), deploys it to an Azure Container App via azd, tests it with MCP Inspector, and connects it to Copilot Studio as an MCP tool so the agent can call a live currency-conversion API.", "relevance": "Core, hands-on AB-620/PL-400 pro-code skill - building and hosting a custom MCP server is exactly the capability Giulio would need to expose custom BC logic or calculations to a Copilot Studio agent when no native connector exists."}, {"video_id": "qM4YtQfd8R0", "title": "Copilot Studio: Dataverse Knowledge Complete Setup Guide", "url": "https://www.youtube.com/watch?v=qM4YtQfd8R0", "published": "2026-01-18", "duration": "23m 01s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-900", "PL-400"], "topics": ["copilot studio", "data glossary", "dataverse", "knowledge sources", "natural language query", "synonyms", "unstructured data search"], "summary": "Creates a Dataverse table from an Excel import, connects it as Copilot Studio knowledge, and progressively improves natural-language search accuracy using response-format instructions, column synonyms, column descriptions, and a data glossary to resolve abbreviations (e.g. 'AP' = apartment) — finishing with unstructured data search over a multi-line text/file column.", "relevance": "Directly applicable to grounding a Copilot Studio agent on Dataverse-mirrored BC data — synonyms, column descriptions, and a data glossary are the exact levers Giulio would pull to make an agent correctly interpret BC-specific codes/abbreviations (account codes, dimension codes) when answering natural-language questions over synced BC tables tudio so the agent correctly interprets column names, abbreviations (like state codes), and domain terms when answering natural-language questions.", "relevance": "One of the most directly transferable videos for Giulio: Azure SQL as agent knowledge, with service-principal auth and glossary/synonym tuning, maps closely onto grounding an agent on a BC-fed SQL data warehouse or reporting database rather than SharePoint or Dataverse."}, {"video_id": "xtPlDde4Yv0", "title": "Master Multi-Agent Orchestration In Copilot Studio", "url": "https://www.youtube.com/watch?v=xtPlDde4Yv0", "published": "2025-11-16", "duration": "30m 26s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100"], "topics": ["ai agents", "child agents", "code interpreter", "copilot studio", "instructions design", "multi-agent orchestration"], "summary": "Builds a document-reviewer agent that reads an uploaded Excel expense report into a global JSON variable, then delegates checks to two embedded child agents (duplicate detection, misclassification) plus a standalone connected agent (a travel-policy FAQ agent), demonstrating how to split long instructions into smaller, more reliable, reusable child agents.", "relevance": "This is the core AB-100/AB-620 multi-agent architecture pattern — splitting a large instruction set into focused child agents with their own knowledge/tools is exactly how Giulio would design a BC/BI 'data quality reviewer' that checks an exported ledger or report for duplicates, misclassifications, or policy violations before it reaches a stakeholder."}, {"video_id": "vd5DLiu1_6Y", "title": "Incredible Excel-Writing Autonomous Agent In Copilot Studio", "url": "https://www.youtube.com/watch?v=vd5DLiu1_6Y", "published": "2025-11-09", "duration": "26m 41s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-100", "PL-400"], "topics": ["agent flows", "autonomous agents", "code interpreter", "copilot studio", "excel", "generative orchestration", "knowledge sources", "microsoft graph api"], "summary": "Builds a fully autonomous, generative-orchestration Copilot Studio agent that triggers when a file lands in a SharePoint library, uses a code-interpreter prompt to read an Excel expense report into JSON, matches line items against a knowledge PDF of valid accounting codes, then writes the resulting account codes back into the Excel cells via a reusable agent-flow tool that calls the Microsoft Graph API directly.", "relevance": "This is a near-exact template for an accounting/finance automation Giulio could pitch on the Innovation team: an autonomous agent that reads uploaded expense or GL export files, classifies line items against a BC chart-of-accounts knowledge source, and writes the classification back into the file — combining code interpreter, Graph API HTTP calls, and generative orchestration."}, {"video_id": "qh4YRqZgaQU", "title": "Copilot Studio Test Automation: STOP Testing Manually!!", "url": "https://www.youtube.com/watch?v=qh4YRqZgaQU", "published": "2025-10-26", "duration": "24m 05s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "AB-900", "PL-400"], "topics": ["alm", "app registration", "copilot studio kit", "entra id", "generative answers", "governance", "multi-turn testing", "test automation"], "summary": "Demonstrates installing the Copilot Studio Kit, configuring an agent connection using an Entra ID app registration with Microsoft authentication, and building automated test sets (response match, generative answers, multi-turn, topic match, plan validation) to validate an agent before deploying it to production.", "relevance": "Establishes a real QA/release-gate process for Copilot Studio agents, directly applicable to Giulio's Innovation-team responsibility for shipping trustworthy agents (e.g. a BC/BI helpdesk agent) rather than manually re-testing in the chat pane every time."}, {"video_id": "JMlUcxqnU30", "title": "Copilot Studio Create An Excel File Using Prompts - MAGIC!!", "url": "https://www.youtube.com/watch?v=JMlUcxqnU30", "published": "2025-09-28", "duration": "26m 03s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400"], "topics": ["agent flows", "code interpreter", "copilot studio", "excel", "onedrive", "power automate", "prompts"], "summary": "Builds an expense-report agent that reads a PDF of receipts, extracts structured data with one prompt, generates an Excel file with a second code-interpreter prompt, then uses an agent flow (OneDrive create-file, HTTP request for drive URL, base64 decode) to produce a downloadable link posted back into the chat.", "relevance": "The receipt-to-Excel pattern maps closely to BI/finance requests Giulio gets — turning unstructured input (PDF statements, scanned invoices) into a structured spreadsheet output via an agent flow, and the OneDrive file-link plumbing is a reusable technique for any 'give me this as a file' agent."}, {"video_id": "NC920kXuSWk", "title": "Copilot Studio: Change The Agent's Welcome Message", "url": "https://www.youtube.com/watch?v=NC920kXuSWk", "published": "2025-09-22", "duration": "6m 43s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["chat design", "conversation start", "copilot studio", "system topics", "topics", "user experience"], "summary": "Shows three strategies for an agent's first message via the system 'Conversation start' topic: a plain descriptive welcome message, a multiple-choice question with buttons that redirect straight into other topics (skipping the need to type), and disabling the welcome message entirely to save pay-as-you-go message costs at the expense of user experience.", "relevance": "A quick, practical UX and cost-control lesson for any Copilot Studio agent Giulio publishes internally (e.g. a BC/BI helpdesk or reporting agent) — the button-driven welcome pattern
