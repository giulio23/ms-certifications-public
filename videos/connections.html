i app builder", "app agent", "canvas apps", "dataverse", "generative pages", "low-code", "model-driven apps", "power apps"], "summary": "Rebuilds an existing hand-coded canvas app (an ideas-management portal) as a generative page inside a model-driven app, feeding the app agent a screenshot for design inspiration plus Dataverse table context. Iteratively adds filters, a flyout submission form, voting, dark mode, a year filter chart, Excel export, and a comments feature purely through natural-language instructions to the agent.", "relevance": "Demonstrates how much UI work generative pages can replace compared to hand-built canvas apps, directly relevant to how fast Giulio could stand up internal BC/BI tools (e.g., an idea board, an approvals dashboard) on top of Dataverse without deep canvas-app formula work."}, {"video_id": "CVjh8uaNCNI", "title": "Introducing Generative Pages in Microsoft Power Apps – AI-Powered App Creation!", "url": "https://www.youtube.com/watch?v=CVjh8uaNCNI", "published": "2025-07-21", "duration": "7m 26s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["app agent", "dataverse", "gen pages", "generative pages", "low-code", "model-driven apps", "react", "vibe coding"], "summary": "First look at generative (gen) pages for model-driven Power Apps: describing a page in natural language against a Dataverse table context (optionally with a reference image) causes an app agent to write React code for a custom UI - a card gallery, a Kanban board with drag-and-drop status updates, and a multi-step full-CRUD form - all iteratively refined through further prompts (styling, brand colors, dark mode, click-through behavior).", "relevance": "Gen pages let a maker replace the standard model-driven grid/form UX with a custom React front end purely by prompting, which is directly applicable to building a more polished internal UI over BC-linked Dataverse tables (e.g. an order Kanban or customer card gallery) without hand-coding React."}, {"video_id": "WISe73gZsrQ", "title": "SharePoint Lists as Knowledge in Microsoft Copilot Studio | Tutorial", "url": "https://www.youtube.com/watch?v=WISe73gZsrQ", "published": "2025-07-14", "duration": "10m 30s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["ai agents", "authentication", "citations", "copilot studio", "generative orchestration", "knowledge sources", "sharepoint"], "summary": "Demonstrates adding SharePoint lists (small and large, 10,000+ rows) as a real-time, authenticated knowledge source in Copilot Studio agents using generative orchestration, including citations, column indexing for large lists, and up to 15 lists per agent.", "relevance": "A practical AB-620 grounding pattern Giulio could reuse for a BC/BI helpdesk-style agent where the source of truth is a SharePoint list (e.g. a tracker or reference table) rather than files, with real-time updates and per-user security respected automatically."}, {"video_id": "Gop1igQdkiQ", "title": "AI Prompt Columns in Microsoft Dataverse Explained", "url": "https://www.youtube.com/watch?v=Gop1igQdkiQ", "published": "2025-07-07", "duration": "17m 23s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400", "AI-900"], "topics": ["azure ai foundry", "copilot", "data classification", "dataverse", "generative ai", "low-code", "prompt columns", "tables"], "summary": "End-to-end walkthrough of Dataverse prompt columns: a new column data type whose value is generated by an AI prompt that can reference the row's own data plus related-table columns. Builds a customer feedback table with prompt columns for sentiment classification, feedback category, suggested next-best-action (with business-rule logic like refund thresholds), and a drafted email response, all testable in-place before saving.", "relevance": "Prompt columns are a low-code way to attach Gen AI classification/generation sign"], "summary": "Step-by-step build of a modern canvas Power Apps UI (an idea-management home screen) from a shared design image, using Plan Designer to auto-generate the Dataverse data model, then building it out with responsive containers, modern controls, named formulas, and dynamic gallery styling.", "relevance": "Directly applicable to Giulio's canvas app skills: shows the responsive-container + modern-controls pattern he'd use for any BC/BI-facing Power Apps front end, plus Plan Designer as a fast way to scaffold a Dataverse data model from a natural-language description or reference image."}, {"video_id": "oKH1Ajldl3I", "title": "Power Apps JUST Got Better with AI Insight Cards (Row Summaries)", "url": "https://www.youtube.com/watch?v=oKH1Ajldl3I", "published": "2025-03-31", "duration": "9m 08s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900"], "topics": ["ai insight cards", "copilot", "dataverse", "model-driven apps", "preview feature", "row summary"], "summary": "Walkthrough of the preview AI Insight Cards (customizable row summary) feature for Dataverse tables: enabling the environment setting, writing a Copilot prompt that selects and formats key columns, testing and applying the summary to main forms, and viewing/copying the generated summary on a live record.", "relevance": "A ready-made AI-adoption demo: adding a Copilot-generated summary card to the top of a complex Dataverse form so BC/BI stakeholders instantly see the key fields (e.g. customer, invoice status, amount) without scrolling through the whole form."}, {"video_id": "upTohmZNJdI", "title": "How to Manage Public Views with Security Roles in Power Apps", "url": "https://www.youtube.com/watch?v=upTohmZNJdI", "published": "2025-03-24", "duration": "8m 01s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["dataverse", "governance", "model-driven apps", "organization settings editor", "public views", "security roles", "system views"], "summary": "A tutorial on restricting which public (system) views appear in model-driven/D365 apps based on security roles: installing the community Organization Settings Editor tool to enable the 'role-based system views' setting, then assigning a specific security role to a table's public view so only relevant users see it.", "relevance": "Security-role-driven UX (showing each user only the views/data relevant to their role) is core PL-400/PL-900 Dataverse security material, and directly applicable to tailoring a BC/BI Dataverse app so different consultancy roles see only the views they need."}, {"video_id": "JA3u3S8uYA8", "title": "How to Embed HTML or Canvas App in Model-Driven App Side Pane", "url": "https://www.youtube.com/watch?v=JA3u3S8uYA8", "published": "2025-03-17", "duration": "9m 55s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "canvas app", "customizations.xml", "dataverse", "javascript web resource", "model-driven apps", "side pane", "xrm.app.sidepane"], "summary": "Part 2 of embedding a Canvas app or HTML web resource into a model-driven app's side pane: writing a JS web resource that uses Xrm.App.sidePane to create panes and navigate to a web resource or entity list, wiring it to a contact form's OnLoad event, and editing the exported solution's customizations.xml so the side pane loads on app launch without opening a form.", "relevance": "A pro-code PL-400 customization technique Giulio could use to surface contextual info (e.g. a Power BI report or a small canvas app showing BC account KPIs) directly alongside a Dataverse record without leaving the model-driven app."}, {"video_id": "h4q_Byl7-mw", "title": "Step-by-Step: Embedding Canvas Apps in Model-Driven Forms Made Simple! | Part 1", "url": "https://www.youtube.com/watch?v=h4q_Byl7-mw", "published": "2025-03-10", "duration": "8m 24s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["  pattern (execution context, form events, web resource registration) is exactly what Giulio would use to add validation or auto-population logic to Dataverse forms tied to BC data."}, {"video_id": "IUjkZTYWDow", "title": "How to Update SECURITY ROLES in Power Platform Admin Center (Tutorial)", "url": "https://www.youtube.com/watch?v=IUjkZTYWDow", "published": "2023-09-13", "duration": "7m 20s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["access control", "dataverse", "governance", "power platform admin center", "privileges", "security roles", "user management"], "summary": "Compares the classic single-click privilege editor against the modern security-role UI in the Power Platform Admin Center: creating a role in a solution, editing table and miscellaneous privileges with dropdowns, compact view and filters, then adding and removing users from the role via environment settings.", "relevance": "Security roles and Dataverse governance are core PL-900/PL-400 admin knowledge, directly relevant to Giulio's Innovation-team responsibility for securing Power Platform/Dataverse environments that touch BC data and for governing who can access BI/Copilot sandbox environments."}, {"video_id": "gpoQZfjDMfc", "title": "Create Power App with Copilot (ChatGPT) | Step by Step", "url": "https://www.youtube.com/watch?v=gpoQZfjDMfc", "published": "2023-08-28", "duration": "6m 56s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900"], "topics": ["ai app builder", "canvas apps", "copilot", "dataverse", "developer environment", "natural language", "power apps"], "summary": "Tutorial on building a Power App using the natural-language Copilot prompt in Power Platform: setting up a developer environment in a Copilot-supported region, enabling the Copilot feature toggle in the admin center, describing an app idea in plain English, and refining the generated Dataverse table and app in App Studio.", "relevance": "A concrete, low-effort example of AI-assisted low-code app creation that supports Giulio's Innovation-team mandate to demonstrate AI adoption; also covers the admin-center prerequisites (region, feature toggle) needed to enable Copilot in any environment, including a BC-connected sandbox."}, {"video_id": "GIIrmMz3qW0", "title": "How to create a PowerApps PCF control | Tutorial", "url": "https://www.youtube.com/watch?v=GIIrmMz3qW0", "published": "2023-08-15", "duration": "10m 45s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "dataverse", "model-driven apps", "node.js", "pcf control", "power platform cli", "powerapps component framework", "xrmtoolbox"], "summary": "A hands-on build of a custom PowerApps Component Framework (PCF) field control that validates South African ID numbers, covering environment setup (Node.js, VS Code, Power Platform CLI), scaffolding via CLI or the XrmToolBox PCF Builder plugin, writing the validation logic, and packaging/deploying it onto a model-driven app form.", "relevance": "PCF is a core PL-400 pro-code skill; directly applicable if Giulio wants to build a custom field control for validating BC-related identifiers (e.g. VAT numbers, customer codes) or improving UX on a model-driven app form beyond out-of-the-box controls."}, {"video_id": "vUhh_ZXZhoM", "title": "How to Write SQL Queries for Power Platform using CDS TDS", "url": "https://www.youtube.com/watch?v=vUhh_ZXZhoM", "published": "2023-08-01", "duration": "7m 40s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["cds", "dataverse", "fetchxml", "m query", "power bi", "sql queries", "tds endpoint", "xrmtoolbox"], "summary": "Shows how to enable the TDS (Tabular Data Stream) endpoint in the Power Platform admin center to query Dataverse with SQL instead of FetchXML, connect via SQL Server Management Studio (read-only), and use the XrmToolBox 'SQL 4 CDS' plugin to run, format, update, and convert queries to FetchXML or Power BI M queries.", "relevance": "Directly useful for Giulio's BI work: enabling the TDS endpoint gives a fast SQL-based way to explore Dataverse tables, and SQL 4 CDS can generate ready-made Power BI M queries to blend Dataverse data alongside his BC Cloud source in a single model."}, {"video_id": "rsNVqOwvpRg", "title": "Git Integration In Power Apps | Tutorial", "url": "https://www.youtube.com/watch?v=rsNVqOwvpRg", "published": "2023-07-24", "duration": "7m 19s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "canvas apps", "collaboration", "git integration", "github", "power apps studio", "version control"], "summary": "Walks through the experimental Git version control feature in Power Apps Studio, connecting a canvas app to a private GitHub repository via a personal access token so saved changes sync automatically, giving ALM-style version control and multi-editor collaboration without running Git CLI commands.", "relevance": "ALM and source control for canvas apps is a PL-400 topic; relevant if Giulio's Innovation team builds canvas apps and wants a lighter-weight version-history/collaboration workflow comparable to how BC AL extensions are managed in Azure DevOps."}, {"video_id": "zezLd9DGa8M", "title": "How to Create Power Apps from Excel with Data | Step-by-Step Tutorial", "url": "https://www.youtube.com/watch?v=zezLd9DGa8M", "published": "2023-07-19", "duration": "4m 28s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900"], "topics": ["canvas apps", "dataverse", "excel", "low-code", "onedrive", "power apps"], "summary": "Short beginner tutorial on generating a Power Apps canvas app directly from an Excel file saved in OneDrive for Business, using the 'Start with data' upload option so Power Apps auto-generates a Dataverse table and app that can then be tested and published.", "relevance": "A fast, low-code entry point for turning a one-off BC data export (e.g. a spreadsheet extract) into a working app for quick review or data capture, useful when a full Dataverse integration isn't justified yet."}, {"video_id": "gwN12Ica4mI", "title": "How to Debug Dynamics 365 Plugins | Plugin Profiler & Plugin Trace Viewer Tutorial", "url": "https://www.youtube.com/watch?v=gwN12Ica4mI", "published": "2023-07-13", "duration": "8m 06s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["dataverse", "debugging", "dynamics 365", "plugin registration tool", "plugin trace viewer", "plugins", "visual studio", "xrmtoolbox"], "summary": "A tutorial on diagnosing broken Dynamics 365 plugins in production using the Plugin Registration Tool's profiler and XrmToolBox's Plugin Trace Viewer, then attaching Visual Studio to the process to set breakpoints, catch exceptions, and rebuild/redeploy the fix.", "relevance": "Directly maps to PL-400 pro-dev skills (plugin lifecycle, debugging, ALM rebuild/redeploy) that Giulio would need if his Innovation team ever writes custom Dataverse plugins to bridge BC data or business logic into Power Platform."}, {"video_id": "XUby9j0tLCU", "title": "Getting Started with Power Platform Tools for Visual Studio | Power Platform Tutorial", "url": "https://www.youtube.com/watch?v=XUby9j0tLCU", "published": "2023-07-07", "duration": "8m 02s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "dataverse", "deployment", "plugin profiler", "plugins", "power platform tools", "pro-code", "visual studio"], "summary": "A step-by-step tutorial installing the Power Platform Tools extension for Visual Studio and using it to create a plugin/workflow project, connect to Dataverse, register a plugin step, sign the assembly, and build and deploy it to an environment.", "relevance": "Directly maps to PL-400 pro-code plugin development, which is the closest analogue to writing BC AL business logic — this is how Giulio would extend Dataverse behavior server-side when Power Apps low-code isn't enough."}, {"video_id": "FZZL6FLD33Q", "title": "Power Query Builder: Embedding Power BI Dashboard in Dynamics 365 | Tutorial", "url": "https://www.youtube.com/watch?v=FZZL6FLD33Q", "published": "2023-07-03", "duration": "8m 05s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["dashboards", "dataverse", "fetchxml", "m query", "model-driven app", "power bi embedded", "power query", "xrmtoolbox"], "summary": "Demonstrates the XrmToolBox 'Power Query Builder' plugin to auto-generate M queries and FetchXML against Dataverse, pull case entity data into Power BI Desktop, build and publish a report, then surface it inside a Dynamics 365 model-driven app as a Power BI embedded dashboard.", "relevance": "Directly maps to Giulio's BI + Power Platform work: building Power BI reports against Dataverse data and embedding them in a model-driven app is the same embedded-analytics pattern he'd use to surface BC-derived reporting inside a D365-style app rather than a standalone Power BI workspace."}, {"video_id": "rPn2BOtl0AA", "title": "How to Embed a Power BI report in Dynamics 365 Forms", "url": "https://www.youtube.com/watch?v=rPn2BOtl0AA", "published": "2023-06-27", "duration": "8m 01s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["crm forms", "dynamics 365", "embedded reports", "model-driven apps", "power bi", "solutions", "xrmtoolbox"], "summary": "Step-by-step tutorial embedding a Power BI report into a Dynamics 365 contact form using the XrmToolBox Power BI Embedded plugin: creating a solution, adding the contact entity, inserting a form section, connecting XrmToolBox, and pasting the Power BI embed code into the plugin before publishing the form.", "relevance": "Directly applicable to Giulio's BI consultancy work: surfacing Power BI visuals of BC data inside Dataverse/CRM forms so business users see report insights without leaving their record. XrmToolBox is a common ALM/customization tool alongside pro-code approaches."}, {"video_id": "1VGlL1BBdGA", "title": "How to Setup Dynamics 365 integration with SharePoint| Step-by-Step", "url": "https://www.youtube.com/watch?v=1VGlL1BBdGA", "published": "2023-06-21", "duration": "4m 59s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-900"], "topics": ["dataverse", "document management", "dynamics 365", "entities", "power platform admin center", "server-based integration", "sharepoint online"], "summary": "A concise walkthrough of enabling server-based SharePoint Online integration with Dynamics 365, covering licensing/permission prerequisites, configuring document management settings from the Power Platform admin center, selecting entities, and verifying document upload and folder creation.", "relevance": "Document management on Dynamics 365 records mirrors the kind of admin-center configuration work Giulio does around Power Platform environments; useful background if BC-adjacent Dataverse environments ever need SharePoint document storage for cases or projects."}, {"video_id": "MuLYPOSeqB0", "title": "JQuery Deprecations In Power Apps", "url": "https://www.youtube.com/watch?v=MuLYPOSeqB0", "published": "2023-06-14", "duration": "3m 02s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "client-side scripting", "deprecation", "javascript", "jquery", "model-driven apps", "power apps", "web resources"], "summary": "A short news-style update warning that Microsoft is removing jQuery 2.1.1 from model-driven apps in October 2023 for security reasons. Covers how to check whether web resource code depends on the library, and two remediation options: a new JS web resource with a minified jQuery build, or referencing an updated version from a CDN.", "relevance": "Low direct relevance to Giulio's BI-focused work, but useful governance awareness if his consultancy maintains any model-driven app customizations with legacy client-side script that could break on this deprecation."}, {"video_id": "06w_Jx1oZOM", "title": "How to Create Custom API Using Plugin Registration Tool", "url": "https://www.youtube.com/watch?v=06w_Jx1oZOM", "published": "2023-06-09", "duration": "5m 10s", "ch": "Tiyani 365", "accent": "#d97706", "axis_label": "cert", "tags": ["PL-400"], "topics": ["csdl metadata", "custom api", "dataverse", "dynamics 365", "plugin registration tool", "plugins", "postman", "pro-code"], "summary": "Short walkthrough of using the Plugin Registration Tool's designer feature to create a custom API in Dataverse: connecting to an environment, registering request parameters and response properties, managing/editing existing APIs, retrieving CSDL metadata, assigning a plugin, and testing the finished API in Postman.", "relevance": "Core PL-400 pro-dev skill — custom APIs are the standard way to expose reusable server-side logic and integration points from Dataverse, directly applicable if Giulio needs to expose BC-related business logic as a callable Dataverse action for Power Automate, canvas apps, or a Copilot Studio agent."}, {"video_id": "V4rgxmBQpk0", "title": "Direct Lake vs Import vs Direct Lake+Import | Fabric semantic models (May 2025)", "url": "https://www.youtube.com/watch?v=V4rgxmBQpk0", "published": "2025-05-13", "duration": "1h 34m 32s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2", "M2", "P1"], "topics": ["calculated columns", "composite models", "direct lake", "fabric", "import mode", "lakehouse", "onelake", "reframing", "semantic model", "storage mode", "transcoding", "vertipaq"], "summary": "Comprehensive Fabric conference session covering: Import mode architecture (private VertiPaq copy, full Power Query/calculated column flexibility, refresh cost); Direct Lake architecture (metadata-only model, query-time transcoding, reframing, current limits on calculated columns/tables and Power Query, and the Direct Lake on OneLake vs SQL endpoint distinction); classic composite models mixing separate Import and Direct Lake semantic models (expensive cross-model relationships, no blank row on invalid keys); and the new Direct Lake + Import composite mode, which lets each table in a single semantic model pick its own storage mode while staying in one VertiPaq 'continent' for near-import performance with import-level flexibility on dimensions.", "relevance": "The single most important DP-600 S1/S2/M2 video in this batch - it covers exactly the Fabric storage-mode decision tested on DP-600 and gives a concrete pattern for a Fabric-hosted BC semantic model: Direct Lake for large BC ledger/fact tables plus Import for BC dimension tables (customer, item, date) that need aesthetic or business-driven transformations."}, {"video_id": "ANTQFzen-Ig", "title": "Context transition in DAX explained visually", "url": "https://www.youtube.com/watch?v=ANTQFzen-Ig", "published": "2024-09-10", "duration": "27m 13s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculate", "context transition", "filter context", "iterators", "keepfilters", "removefilters", "row context"], "summary": "Visual whiteboard breakdown of context transition — triggered by CALCULATE/CALCULATETABLE or any measure reference — showing step by step how each row context becomes a new filter merged into the existing filter context; extends this to two advanced scenarios: using CALCULATE with REMOVEFILTERS inside an iterator to strip the context-transition filter before comparing per-row vs. total values, and using KEEPFILTERS around an iterator to prevent a context-transition filter from wiping out an existing multi-column filter (year+month), fixing an incorrect monthly-average calculation.", "relevance": "Context transition is one of the most exam-relevant and error-prone DP-600 S1 DAX concepts; the KEEPFILTERS-around-an-iterator fix for multi-column filters is exactly the kind of bug that would silently corrupt a BC report averaging by combined year+month or combined dimension+period filters."}, {"video_id": "XSWXw-orvI4", "title": "Filter columns, not tables, in DAX", "url": "https://www.youtube.com/watch?v=XSWXw-orvI4", "published": "2024-08-27", "duration": "20m 36s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["calculate", "dax studio", "expanded table", "filter", "filter columns not tables", "keepfilters", "multiple fact tables", "query optimization"], "summary": "Proves the 'filter columns, not tables' rule with a two-fact-table model (Sales and Receipts): filtering CALCULATE with FILTER(Sales, ...) and FILTER(Receipts, ...) expands both tables to all related dimension tables, so the two filters intersect over shared dimensions (store, product, date), producing both a wrong (too-small) result and a 200x slowdown (10s vs 53ms) compared to filtering just the relevant numeric columns with KEEPFILTERS.", "relevance": "A must-know S1/S2 rule for any BC semantic model with more than one fact table (e.g. Sales plus Purchases, or Sales plus a second transaction source): table-level filters in CALCULATE/FILTER can silently produce wrong numbers through expanded-table intersection, not just slow queries, making this a top code-review check for BC models."}, {"video_id": "sEEzx5rO33s", "title": "Row context in DAX explained visually", "url": "https://www.youtube.com/watch?v=sEEzx5rO33s", "published": "2024-07-30", "duration": "21m 45s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["cardinality", "dax guide", "filter context", "iterators", "row context", "selectcolumns", "summarize", "sumx"], "summary": "Visual explanation of row context as 'a copy of the table with just one row' during iteration, how iterators (SUMX, ADDCOLUMNS, etc.) produce it, how to identify iterator functions via DAX Guide, how the filter context still applies inside row-context expressions (e.g. via SELECTEDVALUE), and how table functions like SELECTCOLUMNS versus SUMMARIZE change the cardinality being iterated.", "relevance": "Foundational DP-600 S1/P3 concept underpinning every iterator-based measure over BC data; the SELECTCOLUMNS-versus-SUMMARIZE cardinality distinction directly explains subtle wrong totals that can appear in row-by-row BC calculations when duplicate rows silently affect a SUMX."}, {"video_id": "L5WR-imfyYI", "title": "Filter context in DAX explained visually", "url": "https://www.youtube.com/watch?v=L5WR-imfyYI", "published": "2024-06-18", "duration": "24m 40s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculate", "dax", "filter context", "keepfilters", "percent of total", "removefilters", "visual modeling", "year over year"], "summary": "Teaches a visual planning method for CALCULATE: represent the filter context as a set of filter tables, draw the starting cell's filter context and the target cell's filter context, then write the minimal ADD/REMOVE/REPLACE operation that bridges them. Walks through percent-of-total (REMOVEFILTERS on one column), a fixed-brand comparison (adding a filter), a year-over-year benchmark (a filter on the same column replacing the existing one), and a large-transactions filter that needs KEEPFILTERS to intersect with an existing report-level filter instead of replacing it.", "relevance": "This is arguably the single most practical DP-600 DAX-authoring video in the batch — the ADD/REMOVE/REPLACE/KEEPFILTERS framework is exactly how to reason through real BC measures like percent-of-total-sales-by-customer-group, year-over-year comparisons against a fixed period, or large-transaction thresholds that must respect existing report-level filters."}, {"video_id": "vTrzcbbVcEc", "title": "Optimizing time intelligence in DirectQuery", "url": "https://www.youtube.com/watch?v=vTrzcbbVcEc", "published": "2024-02-13", "duration": "18m 08s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "P3", "S1"], "topics": ["calculate", "dax studio", "directquery", "helper columns", "performance tuning", "sameperiodlastyear", "sql query", "time intelligence"], "summary": "Demonstrates that SAMEPERIODLASTYEAR forces day-level grouping in the generated SQL even for a month-level DirectQuery report, producing a huge inline static-table query. Rewrites the calculation using a YearMonthNumber helper column and simple arithmetic (subtract 12) to force month-level grouping, cutting execution time from 3.3s to 1.9s; also shows that a DATESBETWEEN-based rewrite can end up even slower than the original.", "relevance": "Highly relevant for DP-600 S2/P3: BC semantic models often run DirectQuery against G/L entries or ledger tables, and this YearMonthNumber-helper-column technique is directly applicable to speeding up YoY/MoM growth measures over BC financial data."}, {"video_id": "jR0Hhn3X0M8", "title": "Optimizing callbacks in a SUMX iterator", "url": "https://www.youtube.com/watch?v=jR0Hhn3X0M8", "published": "2023-10-24", "duration": "14m 10s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["callbacks", "dax studio", "formula engine", "iterators", "query plan", "storage engine", "summarize", "sumx"], "summary": "Shows how wrapping a simple multiplication in ROUND inside a SUMX iterator over 200M rows forces a callback to the formula engine on every row, turning an 87ms query into a multi-second one; fixes it by pre-aggregating with SUMMARIZE on the low-cardinality column (net price, only ~24,000 distinct values), computing ROUND once per distinct value, and multiplying by the grouped quantity sum — cutting storage engine CPU by ~120x — while also showing a variables-based ADDCOLUMNS variant that reintroduces a costly second table scan.", "relevance": "This is a core DP-600 S2 optimization pattern — recognizing and eliminating formula-engine callbacks by reducing iterator cardinality — that Giulio can apply to any BC measure that rounds, formats, or applies non-additive logic inside a row-by-row iterator over sales or ledger lines."}, {"video_id": "0rAqTjy3aLw", "title": "Using field parameters and calculation groups for conditional formatting", "url": "https://www.youtube.com/watch?v=0rAqTjy3aLw", "published": "2023-10-10", "duration": "20m 36s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["calculation groups", "conditional formatting", "dax", "disconnected table", "dynamic format strings", "field parameters", "selectedvalue"], "summary": "Shows how to detect which option a user selected: for a field parameter, using MAX of the parameter's measure/field column (since SELECTEDVALUE fails due to the parameter's composite-key group-by design); for a calculation group, using a disconnected helper table filtered inside each calculation item so a dependent measure can read SELECTEDVALUE on that helper table - both applied to dynamically coloring a card visual.", "relevance": "A practical S1 pattern for BC dashboards that let users toggle between KPIs (sales, cost, margin) via a field parameter or a calculation group and need conditional formatting or dynamic titles/colors that react to that choice, while avoiding the common SELECTEDVALUE error on field parameters."}, {"video_id": "dK82cBUfwK4", "title": "Introducing RANK window function in DAX", "url": "https://www.youtube.com/watch?v=dK82cBUfwK4", "published": "2023-06-20", "duration": "15m 23s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["context transition", "dax", "rank", "rankx", "ties", "variables", "window functions"], "summary": "Introduces the DAX RANK window function as a simpler, more reliable replacement for RANKX, handling ties, multi-column ORDER BY, and automatic blanking on subtotals, and demonstrates the variable-based 'source table' pattern for readability and for correctly controlling which columns the context transition overrides.", "relevance": "RANK is DP-600 S1 window-function material directly useful for BC reports like ranking customers or items by sales, or top-N vendors; the demonstrated bug of a missing hidden sort column (month number) when overriding the filter context is a realistic pattern in BC date-table-driven visuals."}, {"video_id": "eNRZU6QkIZ4", "title": "Introducing dynamic format strings for DAX measures", "url": "https://www.youtube.com/watch?v=eNRZU6QkIZ4", "published": "2023-05-23", "duration": "27m 08s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["currency formatting", "dax", "dax studio", "dynamic format strings", "format string", "performance", "selected measure", "selectedvalue"], "summary": "Hands-on introduction to dynamic format strings: enabling the preview feature, writing DAX expressions (using SELECTEDVALUE and SELECTEDMEASURE) to show per-row currency codes or auto-switch between units/thousands/millions, and then a deep DAX Studio investigation of how the engine creates a hidden \"format string measure\" queried alongside the real measure — showing that the storage-engine part is cached and shared, but the formula-engine part is duplicated when SELECTEDMEASURE is used.", "relevance": "A concrete DP-600 S1/S2 topic — dynamic format strings are explicitly named in the DP-600 skills outline, and this shows exactly how to build a currency-aware or magnitude-aware format for BC sales data (which spans multiple currencies) while being aware of the formula-engine duplication cost."}, {"video_id": "-8j4iYIYXSk", "title": "Optimizing fusion optimization for DAX measures", "url": "https://www.youtube.com/watch?v=-8j4iYIYXSk", "published": "2023-03-28", "duration": "18m 11s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["calculate", "dax studio", "fusion optimization", "in operator", "nested measures", "performance tuning", "query plan", "storage engine"], "summary": "Shows how the engine's horizontal fusion optimization combines several brand-filtered measures summed together into a single storage engine query grouped by an extra column, and how manually rewriting a 'sum of filtered measures' pattern as one CALCULATE with an IN filter avoids the redundant table scans, roughly halving storage engine CPU time on a 225-million-row table at the cost of maintainability.", "relevance": "DP-600 S1/S2 advanced DAX optimization technique, useful once a BC semantic model accumulates many nested measures (e.g. sales broken out by BC dimension/department buckets) that start to feel slow at scale."}, {"video_id": "1clPMlMtxqE", "title": "Using calculation groups or many-to-many relationships for time intelligence selection", "url": "https://www.youtube.com/watch?v=1clPMlMtxqE", "published": "2023-02-28", "duration": "24m 26s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["bidirectional relationships", "calculation groups", "dax studio", "formula engine", "many-to-many", "server timings", "storage engine", "time intelligence"], "summary": "Compares two techniques for user-selectable time periods (last month, last 6 months, last year, etc.): a calculation group using DAX time-intelligence functions (formula-engine heavy) versus a disconnected period configuration table joined via a bidirectional many-to-many relationship (mostly pushed to the storage engine); benchmarks both with DAX Studio server timings on a 10M-row and a 1.4B-row model, finding negligible difference on small models but up to 2x faster storage-engine execution for the many-to-many pattern on very large models with additive measures, and near-identical performance for non-additive measures like distinct count.", "relevance": "Directly compares two DP-600 S1 design patterns (calculation groups vs. many-to-many/disconnected tables) for a very common BC reporting need — period selection — and gives Giulio a performance-tested framework (DAX Studio server timings, query plan row count) to decide which pattern fits his model size instead of guessing."}, {"video_id": "bxSWQNSQ8rQ", "title": "Introducing window functions in DAX", "url": "https://www.youtube.com/watch?v=bxSWQNSQ8rQ", "published": "2023-01-31", "duration": "40m 57s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["allselected", "apply semantics", "index", "moving average", "offset", "order by", "partition by", "running total", "window", "window functions"], "summary": "Deep-dive introduction to DAX's window functions - INDEX (absolute row by sort order, with PARTITION BY for per-group top rows), OFFSET (relative row navigation such as previous day or previous year), and WINDOW (a full moving or expanding table window for moving averages and running totals) - covering ORDER BY, PARTITION BY, the risky default of omitting the source table (which falls back to ALLSELECTED), and a first mention of 'apply semantics'.", "relevance": "These functions replace much harder classic DAX patterns (RANKX/TOPN/EARLIER-style tricks) for common BC scenarios like previous-period comparisons, moving averages, and running totals on BC transaction data, and are directly relevant to DP-600 S1's DAX functions and table-filtering/windowing study point."}, {"video_id": "0JONn0K9S8Y", "title": "Many-to-Many Relationships - The Whiteboard #12", "url": "https://www.youtube.com/watch?v=0JONn0K9S8Y", "published": "2022-12-28", "duration": "13m 23s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["bidirectional relationship", "bridge table", "budget model", "cardinality relationship", "many to many", "star schema"], "summary": "Distinguishes two different \"many-to-many\" concepts: a true business many-to-many (e.g. customers and bank accounts) that requires a bridge table with real ownership data plus a bidirectional filter, versus Power BI's many-to-many cardinality relationship used to join tables on a non-unique column (e.g. Product to Budget by Brand), which is really shorthand for two one-to-many relationships through an implicit intermediate table.", "relevance": "Complements S1 relationship-design knowledge with the specific BC scenario of joining a budget/forecast table to actuals at a coarser grain (e.g. by item category or department instead of item), common in BC/Power BI budget-vs-actual reports; also flags the performance caveat that many-to-many cardinality relationships degrade with high-cardinality join columns."}, {"video_id": "yWEz-LSrBXE", "title": "One-to-One Relationships - The Whiteboard #11", "url": "https://www.youtube.com/watch?v=yWEz-LSrBXE", "published": "2022-12-14", "duration": "12m 16s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["bidirectional filter", "data modeling", "one-to-one relationships", "relationships", "star schema", "unique keys"], "summary": "Whiteboard episode explaining that a one-to-one relationship is always bidirectional and effectively a \"zero-or-one to zero-or-one\" relationship that can produce blank rows on either side. Argues it's rarely the right choice; usually the two tables should be merged into a single table with a validated unique key instead of linked via a 1:1 relationship, to avoid unnecessary bidirectional filtering risk.", "relevance": "Directly relevant to DP-600 relationship-design decisions when BC exposes near-duplicate tables (e.g. Item and Item Attribute extension tables) that get auto-detected as 1:1 in Power BI — this explains why merging them at the query/Dataflow layer is usually safer than keeping a 1:1 relationship."}, {"video_id": "5yadHXE9R4k", "title": "Regular and Limited Relationships - The Whiteboard #10", "url": "https://www.youtube.com/watch?v=5yadHXE9R4k", "published": "2022-11-30", "duration": "11m 18s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["blank row", "composite models", "data islands", "directquery", "limited relationships", "one-to-many", "regular relationships"], "summary": "Explains regular vs limited relationships: a regular relationship (same import/data source) generates a blank row for unmatched keys that still shows up when drilling into details, while a limited relationship (crossing data islands in a DirectQuery composite model) silently drops orphaned rows from detail views entirely, though they still count toward the grand total.", "relevance": "Directly relevant to DP-600 S1 composite model design; matters whenever a BC DirectQuery table is combined with an imported dimension, since sales lines referencing deleted or missing customers behave very differently depending on relationship type."}, {"video_id": "XvZyo9Kgyio", "title": "Invalid Relationships - The Whiteboard #09", "url": "https://www.youtube.com/watch?v=XvZyo9Kgyio", "published": "2022-11-16", "duration": "12m 40s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["blank row", "data quality", "dax studio", "invalid relationships", "referential integrity", "star schema", "vertipaq analyzer"], "summary": "Whiteboard walkthrough of 'invalid' (referential-integrity-violating) relationships: when many-side rows reference key values missing from the one-side table, VertiPaq injects an extra blank row on the one side to absorb them, causing surprising blank categories and shifted totals; shows how to detect and quantify this using DAX Studio/VertiPaq Analyzer's RI Violations column and relationship detail panes.", "relevance": "BC-sourced fact tables (sales lines, ledger entries) frequently reference dimension keys that got deleted or renamed upstream, exactly the invalid-relationship scenario shown here; this is a direct DP-600 P2/S1 data-quality diagnostic Giulio can apply whenever a BC report shows an unexpected blank category row."}, {"video_id": "U72hlqGjtXg", "title": "Introducing horizontal fusion in DAX", "url": "https://www.youtube.com/watch?v=U72hlqGjtXg", "published": "2022-11-08", "duration": "16m 57s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["dax studio", "horizontal fusion", "preview features", "query optimization", "server timings", "storage engine scans", "vertical fusion"], "summary": "Introduces horizontal fusion, a then-preview VertiPaq optimization that merges storage-engine scans across different filter contexts (e.g. the same measure sliced by two different countries) into a single scan when the contexts differ by exactly one column with one value each, complementing the older vertical fusion which merges multiple measures within the same filter context.", "relevance": "Explains an under-the-hood S2 optimization that can automatically speed up BC dashboards containing many similarly-sliced measures (e.g. the same KPI compared across two company codes or two periods); knowing its limits (exactly one differing column/value, no DISTINCTCOUNT) helps when designing comparison measures and visuals over BC data."}, {"video_id": "-0RRgICKeiY", "title": "One-to-Many Relationships - The Whiteboard #08", "url": "https://www.youtube.com/watch?v=-0RRgICKeiY", "published": "2022-10-19", "duration": "7m 29s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["blank row", "data modeling", "one to many relationships", "referential integrity", "relationships", "star schema"], "summary": "Whiteboard explanation of what a one-to-many relationship actually enforces in a Tabular model: a uniqueness constraint on the \"one\" side key column only, with no referential-integrity requirement on the \"many\" side (unlike a SQL foreign key), and how filters propagate from the one side to the many side.", "relevance": "Fundamental DP-600 S1 star-schema modeling knowledge that explains exactly why BC dimension tables (Customer, Item) can have unmatched keys on the fact side without breaking the model — instead producing the automatic blank row — which is critical for diagnosing unexpected blanks in BC-sourced Power BI reports."}, {"video_id": "SHoG0sUBG50", "title": "Storage Engine (VertiPaq) - The Whiteboard #07", "url": "https://www.youtube.com/watch?v=SHoG0sUBG50", "published": "2022-10-05", "duration": "10m 25s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["additive measures", "dax studio", "distinct count", "formula engine", "query plan", "storage engine", "subtotals", "vertipaq"], "summary": "Whiteboard explanation of how VertiPaq handles additive vs. non-additive measures in a matrix with subtotals: an additive SUM needs only one storage-engine query, with the formula engine adding subtotal/grand-total rows on top; a non-additive DISTINCT COUNT needs one storage-engine query per grouping granularity because subtotals can't simply be summed.", "relevance": "Explains a common DP-600 S2 performance surprise — why a DISTINCT COUNT of Customer or Item over a BC fact table is inherently more expensive than a SUM, generating multiple storage-engine round trips, which matters when designing BC KPIs like \"active customers\" or \"unique items sold\"."}, {"video_id": "b0flvnOI-Fk", "title": "Formula Engine - The Whiteboard #06", "url": "https://www.youtube.com/watch?v=b0flvnOI-Fk", "published": "2022-09-21", "duration": "10m 24s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["dax studio", "directquery", "formula engine", "performance", "query plan", "server timings", "storage engine", "vertipaq"], "summary": "Explains the split between the formula engine (executes any DAX, can generate tables from thin air) and the storage engine (VertiPaq or DirectQuery SQL), using DAX Studio query plans and server timings to show that a function like UPPER runs in the formula engine against a VertiPaq import table but gets pushed down into the generated SQL when the source is DirectQuery.", "relevance": "DP-600 S2 optimization fundamental for understanding why some DAX measures are slow over BC models, and how to read DAX Studio logical/physical query plans to see whether a calculation was pushed down to the storage engine."}, {"video_id": "Gr8LjtnGNlA", "title": "Variables - The Whiteboard #05", "url": "https://www.youtube.com/watch?v=Gr8LjtnGNlA", "published": "2022-09-07", "duration": "12m 39s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculate", "dax variables", "evaluation order", "filter context", "measure reference"], "summary": "Whiteboard explainer showing that a DAX variable is a frozen constant computed once in the filter context where it's defined — reusing it later inside a different CALCULATE filter context does not re-trigger its formula — illustrated with a common beginner bug where a variable is wrongly expected to react to a new filter, contrasted with the fix of using a measure reference (which does re-evaluate under CALCULATE).", "relevance": "This is a foundational DP-600 S1 DAX concept (variables vs. measure references, evaluation order) that directly explains subtle wrong-number bugs Giulio may hit writing multi-step measures over BC sales/purchase data, especially when trying to reuse an intermediate value across differently filtered CALCULATE statements."}, {"video_id": "aIt4TdMGyJ0", "title": "Expanded Table - The Whiteboard #04", "url": "https://www.youtube.com/watch?v=aIt4TdMGyJ0", "published": "2022-08-25", "duration": "14m 01s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["expanded table", "filter columns not tables", "filter context", "many-to-one relationships", "removefilters", "star schema"], "summary": "Whiteboard explainer on expanded tables: referencing a table name in DAX (e.g. inside REMOVEFILTERS or FILTER) pulls in every column of tables reachable through many-to-one regular relationships, which is why table-level filters can silently remove filters on unrelated columns and are more expensive than the equivalent column-level filter.", "relevance": "Lays out the theory behind the 'filter columns, not tables' rule that governs every measure written over a BC star schema; understanding expanded tables explains unexpected filter-context behavior when using REMOVEFILTERS(table) or FILTER(table, ...) against BC fact and dimension tables."}, {"video_id": "0y1rCOL8DTs", "title": "Context Transition - The Whiteboard #03", "url": "https://www.youtube.com/watch?v=0y1rCOL8DTs", "published": "2022-08-10", "duration": "13m 42s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculate", "context transition", "dax", "filter context", "iterators", "row context"], "summary": "Visual whiteboard explanation of context transition: how a measure reference inside a row-context iterator (e.g. MAXX over Customer) triggers an implicit CALCULATE that copies the current row — or, as an optimization, just the key column — into the filter context, replacing the row context.", "relevance": "Context transition is one of the trickiest DP-600 S1/P3 DAX concepts and a common source of wrong numbers in BC reports built with per-customer or per-document iterators; the \"row context becomes a copied filter context\" mental model helps debug iterator-based BC measures."}, {"video_id": "V9NVDP5ZwhQ", "title": "Row Context - The Whiteboard #02", "url": "https://www.youtube.com/watch?v=V9NVDP5ZwhQ", "published": "2022-07-27", "duration": "9m 02s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculated columns", "evaluation context", "filter context", "iterators", "row context", "sumx"], "summary": "Whiteboard-style walkthrough of row context using SUMX(Sales, Quantity * NetPrice): shows that the iterated table is first filtered by the existing filter context, then a row context is created for every remaining row so column references resolve, before the results are aggregated. Distinguishes this clearly from the filter context covered in the companion video.", "relevance": "Nails down the row-context half of DP-600's DAX evaluation-context requirement, which underlies every iterator (SUMX, AVERAGEX, FILTER) Giulio would write over BC sales/ledger lines — critical for writing correct line-level calculated measures like margin or quantity-weighted averages."}, {"video_id": "OJFCKg7wDLc", "title": "Filter Context - The Whiteboard #01", "url": "https://www.youtube.com/watch?v=OJFCKg7wDLc", "published": "2022-07-14", "duration": "8m 20s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["all", "calculate", "dax fundamentals", "filter context", "percent of total", "removefilters"], "summary": "Whiteboard explainer describing the filter context as a set of filter tables, one per active report filter, illustrated on a Contoso report cell. Shows how CALCULATE adds a filter (sales of red products) and how REMOVEFILTERS/ALL strips a filter to build a 'percent of year' ratio measure.", "relevance": "DP-600 S1 core DAX concept, directly usable for percent-of-total measures over BC dimensions, e.g. a customer's or item category's share of total sales."}, {"video_id": "TufnsAxJsjs", "title": "Fields parameters in Power BI", "url": "https://www.youtube.com/watch?v=TufnsAxJsjs", "published": "2022-05-24", "duration": "20m 38s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["calculated table", "dynamic dimensions", "excel limitation", "field parameters", "nameof", "performance analyzer"], "summary": "Explains field parameters end to end: creating them via Modeling > New Parameter, how they generate a calculated table using the NAMEOF function, how to hand-edit that table to build multi-level hierarchies (e.g., table-then-column), and how the client tool (Power BI) runs a two-query pattern to resolve which column to use — with a call-out that Excel/MDX does not support field parameters.", "relevance": "Field parameters are explicitly listed under DP-600 S1 (dynamic slicing/what-if style modeling); this is directly usable for a BC report where users need to swap between dimensions (e.g., customer country vs. item category) in one matrix without duplicating visuals, and clarifies the performance story (negligible overhead) and the Excel/PivotTable limitation to watch for."}, {"video_id": "lMuDz6ViU1w", "title": "Understanding context transition", "url": "https://www.youtube.com/watch?v=lMuDz6ViU1w", "published": "2022-05-10", "duration": "18m 25s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["calculate", "calculated columns", "context transition", "filter context", "row context", "running total", "sumx"], "summary": "Foundational explainer on context transition - what happens when CALCULATE meets a row context, either explicitly via a SUMX iteration or hidden inside a measure reference or a calculated column - shown through a 'sales of big customers' measure and a running-total measure that breaks when an unwanted context transition sneaks in via a measure call inside FILTER.", "relevance": "This is core DP-600 S1 DAX theory that underlies every BC semantic-model measure: unnoticed context transition (e.g. calling a measure inside FILTER or an iterator) is the most common cause of wrong running-total, YTD, or customer-level calculations over BC transaction data."}, {"video_id": "HxZLkmpY6BA", "title": "Introducing CALCULATE in DAX", "url": "https://www.youtube.com/watch?v=HxZLkmpY6BA", "published": "2022-04-26", "duration": "13m 56s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculate", "context transition", "dax", "filter context", "filter function", "keepfilters"], "summary": "Foundational walkthrough of CALCULATE: how it modifies the filter context, how a boolean filter argument is syntax sugar for a FILTER(ALL(...)) table filter, how multiple filter arguments combine independently, and the KEEPFILTERS modifier, plus the rule to always filter columns rather than whole tables.", "relevance": "Core DP-600 S1/P3 DAX foundation — CALCULATE underlies almost every measure Giulio writes over BC data (e.g. sales filtered by item category), and reinforces the \"filter columns not tables\" performance rule relevant to BC's wide dimension tables like Item and Customer."}, {"video_id": "lX2ztEh3tuA", "title": "Filter Context in DAX", "url": "https://www.youtube.com/watch?v=lX2ztEh3tuA", "published": "2022-04-12", "duration": "16m 03s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["bidirectional filter", "calculate", "dax", "filter context", "matrix visuals", "relationships", "row context"], "summary": "Foundational theory video explaining that a measure like SUMX(Sales, ...) only ever scans the rows visible in the current filter context, that a matrix row/column defines a filter context (not a row context — a common beginner mistake), and how filter context propagates from dimension to fact tables through relationships (including the danger of bidirectional cross-filtering). Introduces CALCULATE as the tool for changing filter context.", "relevance": "Core DP-600 DAX theory — this is exactly the mental model needed to reason about how measures behave differently across BC report matrices (by Customer, by Posting Date, by Dimension) and why enabling bidirectional filters on BC dimension relationships is risky and can silently produce wrong or ambiguous numbers."}, {"video_id": "Nm9x83J-SBk", "title": "Row Context in DAX", "url": "https://www.youtube.com/watch?v=Nm9x83J-SBk", "published": "2022-03-29", "duration": "20m 42s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculated columns", "dax", "filter function", "iterators", "measures", "nested context", "row context", "sumx"], "summary": "Foundational explainer of row context: it exists by default in calculated columns but not in measures unless introduced by an iterator like SUMX or FILTER; walks through progressively more complex nested-iterator code (FILTER inside SUMX inside SUMX) to show which function provides the row context for each column reference.", "relevance": "Core DP-600 S1 DAX fundamental for writing correct iterator-based measures over BC data, such as margin calculations that must multiply quantity by price row-by-row rather than aggregate-then-multiply."}, {"video_id": "q8hQa8aiRV8", "title": "Scripting syntax for DAX calculation groups", "url": "https://www.youtube.com/watch?v=q8hQa8aiRV8", "published": "2022-02-01", "duration": "6m 15s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "M2"], "topics": ["calculation groups", "dax scripting", "format strings", "ordinal", "precedence", "tabular editor"], "summary": "Introduces Tabular Editor's DAX scripting (Script DAX) syntax for calculation groups — CALCULATIONGROUP / CALCULATIONITEM keywords capturing name, precedence, ordinal, and format string — as a portable, copy-pasteable way to document, share, and re-apply calculation group definitions instead of describing them property-by-property in the UI.", "relevance": "Calculation groups are a named DP-600 S1 exam topic; this shows the practical authoring/documentation workflow Giulio would use in Tabular Editor to build and version time-intelligence or unit calculation groups for BC semantic models, including precedence handling when multiple calculation groups coexist."}, {"video_id": "7Spn2FDxvGw", "title": "Understanding the interactions between composite models and calculation groups", "url": "https://www.youtube.com/watch?v=7Spn2FDxvGw", "published": "2022-01-04", "duration": "17m 06s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["calculation groups", "composite models", "limited relationships", "lookupvalue", "related", "time intelligence", "wholly vs retail execution"], "summary": "Demonstrates that a calculation group defined in the remote (published) model of a composite model only applies correctly to measures executed 'wholly' against the remote side; a local measure that mixes local tables via a limited relationship (using LOOKUPVALUE because RELATED cannot cross it) executes 'retail' locally, and the remote calculation group silently fails to apply to it, producing wrong numbers unless the measure is rewritten to stay mostly wholly-executed.", "relevance": "Directly informs DP-600 S1 composite-model architecture decisions: if a BC-based remote model is going to be extended by other teams via composite models, defining calculation groups (e.g. time intelligence) on the remote side is risky, since local measures mixing local and remote data will silently bypass them - the video's guidance (put calc groups locally, or avoid composite extension) should shape model design."}, {"video_id": "dEgBOsQGHBA", "title": "Different options to model many to many relationships in Power BI and Tabular", "url": "https://www.youtube.com/watch?v=dEgBOsQGHBA", "published": "2021-12-07", "duration": "34m 30s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["bidirectional relationship", "bridge table", "dax studio", "formula engine", "many to many", "relationships", "server timings", "star schema", "storage engine"], "summary": "Compares the classic bridge-table plus bidirectional-relationship approach to many-to-many modeling against a newer pattern using a native many-to-many cardinality relationship directly to the fact table, benchmarking both on a 1.4-billion-row model with DAX Studio server timings across several filter scenarios.", "relevance": "High-value DP-600 S1 relationship-design content (bridge tables, M2M cardinality, bidirectional filters) that matches BC many-to-many scenarios such as items in multiple item categories or salespeople on multiple teams; the storage-engine vs formula-engine comparison teaches choosing a modeling pattern based on expected query patterns rather than habit."}, {"video_id": "Lijqx2mIXlw", "title": "Analyzing the parallelism of storage engine operations in DAX Studio", "url": "https://www.youtube.com/watch?v=Lijqx2mIXlw", "published": "2021-11-23", "duration": "7m 31s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["batch statements", "bidirectional filter", "dax studio", "many-to-many relationships", "parallelism", "query plan", "storage engine"], "summary": "Introduces DAX Studio's improved handling of \"batch\" statements — groups of internal storage-engine sub-queries generated when the engine must build temporary tables to resolve many-to-many/bidirectional relationships. Shows how earlier DAX Studio versions mis-attributed batch consumption time to the formula engine, and how the new version reports per-scan parallelism plus a batch row with its own duration/CPU/parallelism.", "relevance": "Directly useful for DP-600 S2 optimization work: BC models often need many-to-many or bridge relationships (e.g. dimension-set entries, multiple posting groups), and this shows how to correctly read DAX Studio server timings when those relationships generate batch statements instead of misreading the cost as formula-engine work."}, {"video_id": "R8SaJ__UMHI", "title": "Header-detail vs star schema models in Tabular and Power BI", "url": "https://www.youtube.com/watch?v=R8SaJ__UMHI", "published": "2021-10-12", "duration": "27m 26s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P2", "S2"], "topics": ["bidirectional relationships", "data modeling", "dax studio", "denormalization", "distinct count", "header detail", "performance", "relationships", "star schema"], "summary": "Deep dive comparing a normalized header/detail model (e.g. invoice header + lines) against a proper star schema in Tabular. Shows that header-detail violates star schema rules (a relationship between two fact tables), and proves with DAX Studio timings that slicing the detail table by attributes linked to the header causes massive slowdowns (236,000ms vs 15,000ms storage engine CPU), with bidirectional relationships making it catastrophically worse (minutes instead of milliseconds).", "relevance": "Extremely relevant since BC data is inherently header/line structured (Sales Header/Sales Line, Purchase Header/Line, G/L entries). This is essentially the playbook for why and how to flatten BC header+line pairs into a single fact table for DP-600 S1/P2 star schema design."}, {"video_id": "Bc4dvZ_DoNM", "title": "Explaining segment size in Power BI Premium - Unplugged #29", "url": "https://www.youtube.com/watch?v=Bc4dvZ_DoNM", "published": "2021-07-24", "duration": "35m 19s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["compression", "dax studio", "parallelism", "power bi premium", "segment size", "server timings", "vertipaq"], "summary": "Benchmarks a 4-billion-row table with VertiPaq's default 1-million-row segment size against Power BI Premium's larger 8-million-row segment size, using DAX Studio server timings; shows that larger segments reduce the number of parallel tasks and per-segment fixed dispatch cost, with the biggest wins on small, highly-compressed columns and large tables with thousands of segments, and negligible impact on small tables.", "relevance": "Explains a low-level VertiPaq internal (segmentation, fixed cost per segment vs. scan cost) that underpins DP-600 S2 storage/compression reasoning; Giulio's BC models won't hit billions of rows, but understanding segment mechanics helps him reason correctly about why large fact tables in Fabric capacity benefit from Premium/Fabric's bigger segment size."}, {"video_id": "PF-8sRNxuR0", "title": "Understanding eager vs. strict evaluation in DAX", "url": "https://www.youtube.com/watch?v=PF-8sRNxuR0", "published": "2021-05-25", "duration": "18m 33s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["dax", "dax studio", "eager evaluation", "if function", "if.eager", "query scans", "server timings", "strict evaluation", "variables"], "summary": "Explains DAX's two strategies for evaluating IF/conditional statements - strict evaluation (compute only the needed branch, the default) versus eager evaluation (compute both branches, then discard one) - and shows on a 4-billion-row fact table that forcing eager evaluation, via variables or the new IF.EAGER function, can cut storage-engine scans from four to three and runtime nearly in half for simple aggregation branches.", "relevance": "Useful S2 knowledge for large BC fact tables with conditional logic in measures (e.g. branching between YTD vs budget calculations): knowing that strict evaluation is usually best but that forcing eager evaluation with variables or IF.EAGER can reduce scan count for simple branch aggregations gives another lever when a conditional measure is slow."}, {"video_id": "XHmiAItzuwg", "title": "Increasing compression in Power BI and Analysis Services - Unplugged #15", "url": "https://www.youtube.com/watch?v=XHmiAItzuwg", "published": "2021-04-17", "duration": "22m 56s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["cardinality", "compression", "dax studio", "encoding hint", "tabular editor", "vertipaq", "xmla endpoint"], "summary": "Uses Tabular Editor's unsupported/experimental properties on a Power BI Desktop model to change Encoding Hint (forcing value encoding over dictionary encoding, and fixed decimal versus double data type) and Available in MDX (hiding columns from MDX hierarchies) on high-cardinality price columns, cutting a 750MB Contoso model to roughly 170MB.", "relevance": "Deep DP-600 S2 VertiPaq optimization content directly applicable to shrinking large BC fact tables (Sales Line, G/L Entry) where numeric columns like unit price or amount have huge cardinality; shows a concrete, measurable technique beyond \"just remove unused columns.\""}, {"video_id": "qEWrYO1ioe0", "title": "Star schema or single table in Power BI", "url": "https://www.youtube.com/watch?v=qEWrYO1ioe0", "published": "2021-04-13", "duration": "35m 54s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2", "P2"], "topics": ["dax studio", "denormalization", "query performance", "relationships", "single table model", "slicers", "star schema", "storage engine", "vertipaq"], "summary": "Rigorous benchmark on a 4-billion-row model comparing a normalized star schema (\"slim\") against a fully denormalized single fat table, measured in DAX Studio's server timings across simple sums, distinct counts, multi-column grouping, YTD calculations, and slicer-population queries. Concludes that the fat table is only faster for trivial single-relationship sum queries; the star schema wins decisively once queries get complex, involve time intelligence, or populate slicers (where the fat model has to scan the entire fact table just to list distinct slicer values).", "relevance": "Directly answers the DP-600 S1/P2 star-schema-design question with hard numbers instead of opinion — validates the standard BC-to-Power BI approach of building dimension tables (Customer, Item, G/L Account) around a fact table rather than flattening everything into one wide query, and explains why slicers/time-intelligence get slow on denormalized BC extracts."}, {"video_id": "iV8uv9cH6gY", "title": "DAX Tools - VertiPaq Analyzer 13 - VertiPaq Analyzer vs. DAX Studio", "url": "https://www.youtube.com/watch?v=iV8uv9cH6gY", "published": "2021-03-05", "duration": "1m 59s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["dax studio", "model size", "optimization", "tooling", "vertipaq analyzer", "vpax"], "summary": "Short comparison of two model-analysis tools: DAX Studio has a built-in metrics view good for a quick overview of table/column sizes, while VertiPaq Analyzer (via an exported VPAX file) gives a much more detailed breakdown of column encoding and space usage for deep troubleshooting of large models.", "relevance": "DP-600 S2 tooling knowledge - knowing when to reach for DAX Studio vs VertiPaq Analyzer is directly useful when auditing the size and column encoding of a BC-based semantic model that's grown too large."}, {"video_id": "kpAZD7AeRQw", "title": "Understanding memory used by Power BI - Unplugged #7", "url": "https://www.youtube.com/watch?v=kpAZD7AeRQw", "published": "2021-02-20", "duration": "41m 00s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["analysis services engine", "context transition", "memory", "performance troubleshooting", "power query", "task manager", "vertipaq"], "summary": "Deep dive using Windows Task Manager to explain how Power BI Desktop splits work across processes (Analysis Services engine for DAX/VertiPaq, Mashup engine for Power Query, browser subprocesses for UI), the difference between physical RAM (working set) vs. virtual/committed memory, and how a badly written iterating measure with context transition can spike memory and trigger disk paging that tanks performance.", "relevance": "Gives Giulio a diagnostic method for real-world slow BC reports beyond DAX Studio: distinguishing whether a slow report is CPU-bound, memory-bound, or paging to disk, and linking a bad iterator/context-transition measure directly to observed RAM spikes — core DP-600 S2 troubleshooting skill."}, {"video_id": "UtDP8KnWXy8", "title": "Optimizing nested iterators in DAX", "url": "https://www.youtube.com/watch?v=UtDP8KnWXy8", "published": "2021-02-11", "duration": "17m 30s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["cardinality", "context transition", "dax studio", "iterators", "nested iterators", "performance optimization", "related", "summarizecolumns", "sumx"], "summary": "Walks through optimizing a discounted-sales measure that nests two SUMX iterators (customer x product, 18,000 x 2,500 = ~45 million evaluations), progressively rewriting it to iterate over the fact table with RELATED, then over VALUES of the distinct discount columns, and finally SUMMARIZE by the two discount columns, cutting runtime from ~1.5s down to ~21-25ms.", "relevance": "BC sales/discount-style measures often nest iterators at customer and item level, silently multiplying row-context evaluations; this progressive rewrite pattern (collapse to fact-table iteration, then reduce to distinct-value granularity) is a direct template for DP-600 S2 iterator optimization on BC datasets."}, {"video_id": "-x2dLTtKiR8", "title": "Comparing DAX calculated columns with Power Query computed columns", "url": "https://www.youtube.com/watch?v=-x2dLTtKiR8", "published": "2021-01-28", "duration": "18m 04s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2", "P2"], "topics": ["calculated columns", "compression", "dax studio", "incremental refresh", "model optimization", "power query", "vertipaq"], "summary": "Benchmarks creating the same derived column in DAX (calculated column) versus Power Query (computed column) on a 12-million-row Contoso model, comparing development iteration speed, refresh/partition behavior, and VertiPaq compression size using DAX Studio's VertiPaq Analyzer.", "relevance": "Central to DP-600 S2 VertiPaq optimization and P2 transform tradeoffs Giulio hits constantly moving BC data through Power Query versus adding DAX columns — shows calculated columns get recomputed on every table refresh (bad for partitioned/incremental-refresh fact tables) while Power Query columns usually compress smaller but shift size elsewhere in the model."}, {"video_id": "g-nRxDVt3To", "title": "Unboxing new Power BI composite models", "url": "https://www.youtube.com/watch?v=g-nRxDVt3To", "published": "2020-12-17", "duration": "23m 38s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P1", "M2"], "topics": ["analysis services", "calculated columns", "chained datasets", "composite models", "dax studio", "directquery", "local model", "many-to-many relationships"], "summary": "Demo of the (then-new) DirectQuery-over-Analysis-Services composite model feature: connecting live to a cloud Power BI dataset, adding a local model, and extending it with calculated columns, sort-by-column, and a locally-loaded Excel budget table joined via a many-to-many relationship. Shows Performance Analyzer + DAX Studio traces of the generated DEFINE COLUMN statements sent to the remote model.", "relevance": "This is the direct ancestor of DP-600 composite models over Fabric semantic models/OneLake — Giulio could use this pattern to extend a shared BC semantic model with his own local calculated columns or a budget/forecast table without owning the base model, which matches real BC + local-augmentation scenarios."}, {"video_id": "tDIsCVB7mnI", "title": "Import vs DirectQuery in Power BI", "url": "https://www.youtube.com/watch?v=tDIsCVB7mnI", "published": "2020-11-19", "duration": "7m 23s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "S2", "P1"], "topics": ["dax studio", "directquery", "import mode", "performance", "server timings", "storage mode", "vertipaq"], "summary": "Performance comparison of Import vs DirectQuery storage modes using DAX Studio server timings: switching an unoptimized demo model from DirectQuery to Import is ~1000x faster, and even on a well-tuned 4-billion-row SQL Server model, Import is still 4-10x faster than DirectQuery.", "relevance": "Core DP-600 S1/S2 storage mode decision, directly applicable to BC semantic models where large ledger/entry tables are often tempting to leave in DirectQuery for 'real-time' data but pay a large performance penalty."}, {"video_id": "x3m7qzsVJqQ", "title": "Bidirectional relationships and ambiguity", "url": "https://www.youtube.com/watch?v=x3m7qzsVJqQ", "published": "2020-11-17", "duration": "14m 01s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["ambiguity", "bidirectional relationships", "cross filter direction", "filter context", "relationships", "star schema"], "summary": "Walks through a star-schema-like model where turning on a bidirectional relationship to sync two slicers silently creates an ambiguous model, causing the engine to blend two filter paths and produce unpredictable, wrong totals; shows how to detect the ambiguity and instead fix the original slicer-sync problem with a simple measure filter (KEEPFILTERS/ISBLANK pattern) rather than bidirectional cross-filtering.", "relevance": "Directly covers a DP-600 S1 modeling pitfall — bidirectional relationships and ambiguous filter propagation — that BC models with multiple fact tables (sales, purchases) are prone to when consultants reach for bidirectional filtering to 'fix' a slicer UX issue instead of solving it at the measure level."}, {"video_id": "hc-x4DBv0V4", "title": "Formula engine and storage engine in DAX", "url": "https://www.youtube.com/watch?v=hc-x4DBv0V4", "published": "2020-11-09", "duration": "25m 49s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["dax studio", "directquery", "formula engine", "query plan", "server timings", "storage engine", "vertipaq", "xmsql"], "summary": "Explains the two-engine DAX architecture using a book-scanning analogy, then demos on a DirectQuery model (SQL Server) versus an Import model (VertiPaq/xmSQL) how the storage engine executes aggregations and simple multiplications while the formula engine handles operations the storage engine cannot, such as division/percentage calculations, inspecting query plans and server timings in DAX Studio.", "relevance": "Core S2 foundational knowledge: understanding which parts of a measure push down to the storage engine versus run in the formula engine explains why ratio/percentage-style measures on BC semantic models (e.g. margin %) are consistently slower than plain sums, and this is prerequisite for every later DAX optimization technique."}, {"video_id": "PTaZxL8KPzE", "title": "Dynamic format strings with calculation groups", "url": "https://www.youtube.com/watch?v=PTaZxL8KPzE", "published": "2020-10-06", "duration": "9m 34s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculation groups", "dax", "dynamic format strings", "naturalleftouterjoin", "selectedmeasureformatstring", "unit conversion"], "summary": "Shows two advanced calculation group patterns: dynamically blanking a measure's total when it can't be meaningfully summed (weight with mixed units of measure), and performing dynamic unit conversion using SELECTEDMEASUREFORMATSTRING, NATURALLEFTOUTERJOIN, and a conversion-factor table.", "relevance": "Directly maps to DP-600 S1 dynamic format strings and a real BC pattern — item weight/unit-of-measure, currency, or quantity fields with mixed units across companies — showing how to build a calc group that safely blanks non-additive totals instead of showing a misleading aggregate."}, {"video_id": "Tk-7gBt9CDE", "title": "CALCULATE in DAX #01: Filters are tables", "url": "https://www.youtube.com/watch?v=Tk-7gBt9CDE", "published": "2020-09-10", "duration": "2m 37s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["all function", "calculate", "dax", "filter arguments", "filter context", "filters are tables"], "summary": "Short primer showing that CALCULATE's boolean-style filter arguments (e.g. product color = \"Green\") are internally rewritten by the engine into FILTER(ALL(column), condition) table expressions. Demonstrates with a matrix that CALCULATE first evaluates ALL to remove the outer filter, then applies the filter table, overriding the existing filter context.", "relevance": "This is the core mechanic behind every CALCULATE-based measure Giulio will write over BC data (e.g. filtering to specific document types or posting groups) — understanding that conditions become table filters explains why CALCULATE overrides rather than adds to context in simple cases, which is foundational for DP-600 DAX authoring."}, {"video_id": "ePPi1LLX0sA", "title": "Measures vs. calculated columns in DAX and Power BI", "url": "https://www.youtube.com/watch?v=ePPi1LLX0sA", "published": "2020-09-03", "duration": "5m 59s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1"], "topics": ["best practices", "calculated columns", "dax", "filter context", "measures", "model size", "row context"], "summary": "Explains the core difference between measures and calculated columns: calculated columns are computed row-by-row at refresh time, stored in the model, and evaluated with a row context but no filter context; measures are computed at query time in a filter context but have no row context by default. Demonstrates the classic errors that appear when you swap the wrong DAX expression between the two.", "relevance": "This is a DP-600 S1 fundamental for any BC semantic model: choosing column vs measure affects both model size (BC tables can be huge) and correctness of totals, and the 'single value cannot be determined' error is one Giulio will hit constantly writing DAX over BC sales/ledger tables."}, {"video_id": "oP41X_IVa4k", "title": "Introducing VertiPaq Analyzer in DAX Studio", "url": "https://www.youtube.com/watch?v=oP41X_IVa4k", "published": "2020-07-23", "duration": "4m 39s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2"], "topics": ["compression", "dax studio", "metrics", "model size",
