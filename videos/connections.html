ar expects, and it's directly usable for pulling BC API pages into a lakehouse."}, {"video_id": "prDn4r8EaZw", "title": "Make Your Fabric Notebooks POP! Secret Color Formatting Revealed!", "url": "https://www.youtube.com/watch?v=prDn4r8EaZw", "published": "2025-02-20", "duration": "4m 07s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["ansi color codes", "markdown", "notebook formatting", "print statements", "productivity tip"], "summary": "A short tip video showing ANSI escape codes to colorize Python print() output in Fabric notebooks and HTML span styling to colorize markdown cells.", "relevance": "Pure cosmetic/productivity trick with no DP-600 exam relevance; not useful beyond making his own sandbox notebooks slightly nicer to read."}, {"video_id": "xwLF0YLMbqY", "title": "Eventstream Windowing Functions in Microsoft Fabric | DP-700 Exam", "url": "https://www.youtube.com/watch?v=xwLF0YLMbqY", "published": "2025-02-18", "duration": "29m 55s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["dp-700", "eventstream", "real-time analytics", "session window", "tumbling window", "windowing functions"], "summary": "Deep dive into Fabric Eventstream's five Group By window types (tumbling, hopping, sliding, session, snapshot) for real-time stream aggregation, with visual and table walkthroughs plus DP-700 practice questions.", "relevance": "Real-time streaming/Eventstream content scoped to DP-700, not DP-600; Giulio's BC data isn't a streaming source, so this is tangential to his current study and demo needs."}, {"video_id": "HWaMVulAFDA", "title": "Over 100 Free Practice Questions for Microsoft Fabric DP-700 Exam!", "url": "https://www.youtube.com/watch?v=HWaMVulAFDA", "published": "2025-02-10", "duration": "5m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["cert.com", "certification prep", "dp-700", "exam questions", "practice exams"], "summary": "Introduces the author's cert.com practice-exam website, walks through its module-based DP-700 question sets with instant explanations and doc links, and mentions DP-600 and DP-900 tracks are coming soon.", "relevance": "Not DP-600 content at time of filming (DP-700 questions only), but flags a free practice-question resource Giulio should revisit now that DP-600 question sets exist on the same site."}, {"video_id": "aSULzTTQcJY", "title": "Eventstream in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=aSULzTTQcJY", "published": "2025-02-05", "duration": "30m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["custom endpoint", "dp-700", "eventhouse", "eventstream", "kql database", "real-time data", "stream transformations"], "summary": "DP-700-focused deep dive into Fabric Eventstream: sources (external services, fabric/OneLake events, custom endpoints), the seven transformations (filter, manage fields, aggregate, join, group by, union, expand), and destinations (Eventhouse/KQL, Lakehouse, Activator), demoed end-to-end with a simulated temperature sensor feed writing to a KQL database.", "relevance": "Real-time ingestion via Eventstream/Eventhouse is explicitly out of DP-600 scope (per this channel's own DP-700 vs DP-600 comparison) and is not part of Giulio's BC/Power BI batch-oriented workflow, so this is honestly not relevant to his current work."}, {"video_id": "O9cNIJdNfD0", "title": "What No One Told Me About the Microsoft Fabric DP-700 Exam...", "url": "https://www.youtube.com/watch?v=O9cNIJdNfD0", "published": "2025-01-28", "duration": "6m 51s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certification prep", "dp-700 exam", "exam sandbox", "exam strategy", "microsoft learn documentation"], "summary": "Personal post-exam debrief on the Fabric DP-700 (data engineering) exam - the official learning path didn't cover everything asked, the exam felt harder than DP-600 pre-scope-change, and a concrete tip to flag unsure questions and only use the in-exam Microsoft Learn documentation split-screen at the very end to save time.", "relevance": "Not DP-600 content itself, but the exam-taking strategy (full pass first, flag uncertain questions, use the in-exam Learn docs split-screen only on flagged ones) applies equally to sitting DP-600, and the warning that the learning path alone isn't enough is a useful gut-check for Giulio's own DP-600 prep plan."}, {"video_id": "qpeAs7KQOmo", "title": "DP-700 Exam Prep: Programming Languages | Microsoft Fabric Data Engineer", "url": "https://www.youtube.com/watch?v=qpeAs7KQOmo", "published": "2025-01-23", "duration": "34m 46s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P3"], "topics": ["group by", "joins", "kql", "pyspark", "query languages", "sql", "syntax comparison", "tsql"], "summary": "Side-by-side comparison of SQL, KQL, and PySpark syntax for select/filter/count/order-by/join operations, demoed against identical sample tables in a warehouse (TSQL), an event house (KQL), and a lakehouse notebook (PySpark and Spark SQL) respectively, ending with exam-style syntax-spotting questions.", "relevance": "Though framed as DP-700 prep, the syntax comparison itself is squarely DP-600 P3 material -- SQL and KQL are explicitly the query-and-analyze languages tested -- and getting comfortable enough to move between the SQL analytics endpoint, notebooks, and (if used) KQL is directly useful when working with BC data landed in Fabric."}, {"video_id": "YoO2-OpRe7U", "title": "Microsoft Fabric: Core Structure and Terminology | DP-700 Exam", "url": "https://www.youtube.com/watch?v=YoO2-OpRe7U", "published": "2025-01-16", "duration": "28m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "P1"], "topics": ["capacity", "delta parquet", "domain", "fabric terminology", "onelake", "shortcuts", "tenant", "workspace"], "summary": "Foundational walkthrough of Fabric's hierarchy — tenant → capacity → workspace → domain/subdomain → items → objects — plus a deep dive into OneLake as the single unified Delta Parquet data lake behind every Fabric item, its shortcuts feature for virtualizing external data (S3, ADLS, Dataverse), and a live demo creating a workspace, lakehouse, and warehouse and inspecting capacity tiers.", "relevance": "Though labeled DP-700, this is exactly the Fabric structural/OneLake terminology DP-600 also assumes as baseline knowledge, and it explains why his BC data, once landed via OneLake shortcuts or a lakehouse table, is stored once as Delta Parquet no matter which tool (lakehouse, warehouse, Power BI) reads it."}, {"video_id": "DWUuuGAxwlI", "title": "DP-700 Exam Prep: Scope, Skills & Essential Tools | Microsoft Fabric Data Engineer", "url": "https://www.youtube.com/watch?v=DWUuuGAxwlI", "published": "2025-01-08", "duration": "21m 53s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["data pipeline", "dataflow gen2", "dp-700", "event house", "exam scope", "lakehouse", "notebook", "warehouse"], "summary": "Overviews the DP-700 exam's three scored sections (implement/manage analytics solution, ingest/transform data, monitor/optimize), then tours the core Fabric tools (data pipeline, Dataflow Gen2, notebook, Eventstream) and data stores (lakehouse, warehouse, event house) at a high level.", "relevance": "This is a DP-700 (Data Engineer) exam-scoping video, a different certification than Giulio's target DP-600. The tool tour overlaps with general Fabric fundamentals but is framed around data-engineering exam objectives (T-SQL/Spark SQL/KQL, orchestration) rather than DP-600's semantic-model and Power BI focus."}, {"video_id": "tynojQxL9WM", "title": "DP-700 Exam Prep: Course Intro | Microsoft Fabric Data Engineer", "url": "https://www.youtube.com/watch?v=tynojQxL9WM", "published": "2025-01-02", "duration": "8m 33s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["career development", "certification", "dp-700", "exam prep series", "fabric data engineer"], "summary": "Introduces a video series preparing for the DP-700 (Fabric Data Engineer) exam: explains the exam scope (data engineering pipelines, notebooks, Spark, SQL/KQL, governance/CI-CD, explicitly excluding Power BI and semantic models), who should take it, and the three-part lesson structure (theory, hands-on demo, practice questions) used throughout the series.", "relevance": "Explicitly a different certification track than DP-600 — the presenter states Power BI and semantic models are out of scope for DP-700 — so this is background context only, not direct DP-600 prep, though the same channel's DP-700 series shares Fabric fundamentals he'll also need."}, {"video_id": "qoVhkiU_XGc", "title": "Learn Microsoft Fabric Notebooks in 2026 - Full Course!", "url": "https://www.youtube.com/watch?v=qoVhkiU_XGc", "published": "2024-12-30", "duration": "3h 01m 13s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "P3"], "topics": ["csv ingestion", "delta", "exit values", "fabric notebooks", "notebookutils", "pipeline parameters", "spark sql", "temp views"], "summary": "A 15-lesson compilation course on Fabric notebooks for data engineering: notebook overview and UI, notebookutils, reading CSVs with different delimiters/headers/schemas into Delta tables, passing parameters and exit values between pipelines and notebooks, and using Spark SQL (including temp views to bridge Python data frames into SQL cells). Later lessons (not fully covered in this transcript excerpt) go on to cover explode/JSON processing, parallel API calls, T-SQL notebooks, Excel processing, pure Python notebooks, metadata-driven notebooks, and schema drift handling.", "relevance": "This is the single richest hands-on resource in the batch for the Prepare pillar of DP-600 — it walks through exactly the mechanics Giulio needs to land raw BC API/CSV extracts into a lakehouse Delta table, parameterize that logic through a pipeline, and query it with Spark SQL, which is the backbone of any BC-to-Fabric-to-Power-BI pipeline."}, {"video_id": "T_cDQetuoP4", "title": "How to Handle Changing File Columns in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=T_cDQetuoP4", "published": "2024-12-16", "duration": "16m 29s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["json schema enforcement", "lakehouse tables", "medallion architecture", "mergeschema", "notebooks", "pyspark", "schema drift"], "summary": "Demonstrates handling changing JSON file schemas in a Fabric notebook: appending data with a new column triggers a schema-mismatch error, fixed with mergeSchema=true; shows that missing columns are handled automatically; then builds a controlled, config-driven approach that enforces a JSON-defined schema on read and merges on write, avoiding uncontrolled schema drift.", "relevance": "Directly applicable: BC API exports commonly add or drop columns over time (new fields, deprecated fields), so this is exactly the pattern Giulio would need to safely land BC data into a lakehouse table without breaking his pipeline. Strong DP-600 P2 (transform/clean) content."}, {"video_id": "JRtK50gI1B0", "title": "DP-700 vs. DP-203: What is different? Scopes compared!", "url": "https://www.youtube.com/watch?v=JRtK50gI1B0", "published": "2024-12-09", "duration": "14m 11s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "certification comparison", "dp-203", "dp-700", "fabric data engineering"], "summary": "Compares the Azure Data Factory-focused DP-203 exam to the newer Fabric-focused DP-700 exam side by side across tools, data stores, languages, and governance scope, plus a tip about using Microsoft Learn documentation access during the exam.", "relevance": "Purely a DP-700/DP-203 certification comparison, not DP-600; useful only as background context on how the Fabric data-engineering certs relate to each other, not for Giulio's DP-600 study or hands-on BC work."}, {"video_id": "cLEUiQhxfjA", "title": "Build Dynamic & Fast Notebooks in Microsoft Fabric – Here's How!", "url": "https://www.youtube.com/watch?v=cLEUiQhxfjA", "published": "2024-12-02", "duration": "14m 13s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["concurrent futures", "config-driven ingestion", "error handling", "lakehouse tables", "metadata-driven notebooks", "parallel processing"], "summary": "Builds a metadata-driven Fabric notebook that reads a JSON config file (source file, destination table, write mode) and loops through it to load CSVs into lakehouse tables, then parallelizes the loads with concurrent.futures and adds error handling.", "relevance": "Strongly relevant to DP-600 P2 — this is exactly the pattern Giulio needs to scale beyond one-off scripts: one generic notebook driven by a config file that can ingest many BC entity exports (customers, items, sales orders) without rewriting code per table."}, {"video_id": "XdJysZ8SVbY", "title": "Vanilla Python Notebooks in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=XdJysZ8SVbY", "published": "2024-11-28", "duration": "15m 20s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["deltalake library", "duckdb", "fabric capacity", "lakehouse tables", "notebookutils", "pandas", "parameter cells", "python notebooks"], "summary": "Demonstrates Fabric's new non-Spark Python notebooks: using pandas, the deltalake library, and duckdb to read/write Lakehouse files and Delta tables without spinning up a Spark cluster, plus notebookutils, parameter cells, exit values, and current limitations (no pipeline scheduling yet).", "relevance": "Useful lightweight alternative to Spark for Giulio's sandbox work: his BC data volumes are small, so a vanilla Python notebook (pandas/duckdb) could clean and write BC exports to a Delta table far more cheaply than a full PySpark notebook, saving Fabric capacity."}, {"video_id": "sjCDtDHej90", "title": "Effortlessly Process Excel Files in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=sjCDtDHej90", "published": "2024-11-25", "duration": "9m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["delta", "excel ingestion", "fabric notebooks", "messy source files", "pandas", "skiprows/skipfooter", "spark dataframe conversion"], "summary": "Shows how to read Excel files into Fabric notebooks with pandas, convert them to Spark DataFrames, and write them to lakehouse Delta tables - first a simple single-sheet file, then a messier real-world file requiring skiprows/skipfooter/header options to skip title text and blank rows around the actual data table.", "relevance": "Very concretely applicable - Giulio regularly deals with business-user Excel exports around his BC/Power BI work; this is the exact pandas-to-Spark-to-Delta recipe for landing a messy Excel export as a clean lakehouse table."}, {"video_id": "VvgF0MGyCKY", "title": "Microsoft Fabric Copy Jobs: No-Code Solution for Incremental Data Copies!", "url": "https://www.youtube.com/watch?v=VvgF0MGyCKY", "published": "2024-11-18", "duration": "17m 50s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["copy job", "fabric data factory", "incremental copy", "lakehouse ingestion", "no-code data movement", "watermark column"], "summary": "Demonstrates Fabric's no-code Copy Job item doing incremental copies from a warehouse into a lakehouse, both table-to-table and table-to-CSV, using a per-table watermark column (e.g., an updated timestamp) to fetch only new/changed rows, plus its current limitations (no deletion capture, and incremental mode can't use a lakehouse as its source).", "relevance": "Copy Job is a genuinely simpler alternative to hand-building incremental-load pipeline logic for landing BC data in a Fabric lakehouse -- directly applicable if Giulio ever moves the landing step of his BC API pages -> Power BI pipeline into Fabric instead of pulling straight into Power Query."}, {"video_id": "0PjuNHYiX00", "title": "Learn Azure Data Factory in 2026 - Full Course!", "url": "https://www.youtube.com/watch?v=0PjuNHYiX00", "published": "2024-11-11", "duration": "3h 16m 18s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["azure data factory", "copy data activity", "foreach activity", "get metadata", "linked services", "lookup activity", "pipeline parameters", "triggers"], "summary": "A compiled 15-lesson ADF masterclass covering setup, linked services (blob, Azure SQL via managed identity), copy activity, triggers (schedule/tumbling window/storage/custom event), parameters and variables, dynamic content, if/switch conditionals, ForEach, Lookup, Get Metadata, naming/error-handling best practices, pipeline return values, configuration-driven pipelines, the Script activity, and handling JSON.", "relevance": "This is classic Azure Data Factory branded, but Fabric Data pipelines are built on the same engine and nearly identical UI/activities, so every core building block here (linked services, triggers, ForEach/Lookup/Get Metadata, dynamic content, JSON handling) transfers directly to designing a Fabric pipeline for his BC API ingestion. Treat it as a thorough Fabric-pipelines primer under an ADF label rather than DP-600 exam content itself."}, {"video_id": "6qs8xlIT-2g", "title": "Fetch API Data Faster: Parallel API Calls in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=6qs8xlIT-2g", "published": "2024-11-04", "duration": "13m 16s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["concurrent.futures", "error handling", "notebooks", "parallel processing", "rest api ingestion", "threadpoolexecutor"], "summary": "Teaches parallelizing REST API calls inside a Fabric notebook using Python's concurrent.futures ThreadPoolExecutor, covering max_workers tuning and proper error handling, then applies it to fetch Pokemon/Berry API endpoints simultaneously instead of sequentially.", "relevance": "Directly applicable to Giulio's own BC API pages to Power BI pipeline: his notebook-based ingestion of multiple BC OData/API endpoints could run in parallel instead of looping sequentially, cutting ingestion time, with the error-handling pattern preventing a failed BC endpoint from silently dropping data."}, {"video_id": "ZP0Fb7yVcrw", "title": "Schedule Logic App to pause Microsoft Fabric Capacity", "url": "https://www.youtube.com/watch?v=ZP0Fb7yVcrw", "published": "2024-10-28", "duration": "8m 48s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["automation", "azure logic apps", "capacity pause/resume", "cost management", "fabric capacity", "managed identity"], "summary": "Builds a consumption-plan Azure Logic App that checks a Fabric capacity's status daily via the Azure management API and automatically pauses it if still running, including the managed-identity role assignment required to grant the Logic App contributor access to the capacity.", "relevance": "Not DP-600 exam content, but a practical cost-control pattern worth knowing for his own trial/sandbox Fabric capacity so it doesn't keep running (and burning credits) between study sessions."}, {"video_id": "xDzbXLAvTjM", "title": "Automate Microsoft Fabric Capacity Pausing and Save Money", "url": "https://www.youtube.com/watch?v=xDzbXLAvTjM", "published": "2024-10-22", "duration": "14m 22s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["azure management api", "cost management", "data factory automation", "fabric capacity", "managed identity", "pause capacity"], "summary": "Builds a simple Azure Data Factory pipeline that calls the Azure Management REST API (via a system-assigned managed identity with Contributor rights) to check a Fabric capacity's status and auto-pause it if still running, then schedules it daily to avoid forgetting to turn off a capacity.", "relevance": "Directly applicable cost-control pattern for a personal/sandbox Fabric capacity like Giulio's — he mentions running his own budget-limited environment, and unpaused capacities are the single easiest way to blow a small monthly budget; this also touches DP-600's capacity/governance awareness even though the automation itself uses ADF rather than a Fabric-native tool."}, {"video_id": "FgULDbnF0sU", "title": "Guide to T-SQL Notebooks in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=FgULDbnF0sU", "published": "2024-10-21", "duration": "11m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P3"], "topics": ["cross-database query", "save as view", "sql analytics endpoint", "t-sql notebook", "three-part naming", "warehouse"], "summary": "Shows T-SQL notebooks as a git/markdown-friendly alternative to the standard SQL query editor for querying Warehouses and Lakehouse SQL endpoints, including per-cell execution sessions, cross-database three-part-name queries, saving query results as tables/views, scheduling, and pipeline integration — noting T-SQL notebooks were still preview with git/deployment pipeline limitations at time of recording.", "relevance": "Directly useful for how Giulio would document and query his BC Warehouse/Lakehouse SQL endpoint with markdown notes alongside SQL, and the cross-database query pattern is exactly how he'd combine BC sales data sitting in a Warehouse with reference data in a Lakehouse."}, {"video_id": "1PGE9bWqY2g", "title": "Learn Microsoft Fabric Data Pipelines in 2026 - Full Course!", "url": "https://www.youtube.com/watch?v=1PGE9bWqY2g", "published": "2024-10-14", "duration": "3h 06m 54s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["best practices", "copy data", "fabric pipelines", "for each", "get metadata", "if condition", "lookup", "monitoring", "parameters", "scheduling", "variables"], "summary": "A 20-lesson compilation covering Fabric pipeline fundamentals end-to-end: activities/connections/parameters/variables, copy data (binary and typed), expressions, if condition, for each, lookup, get metadata, scheduling/monitoring, return values, activity inputs/outputs, switch activity, best practices (retries, timeouts, concurrency), delete data, and (per the course outline) filter, warehouse copy, stored procedures, and config-driven pipelines.", "relevance": "A comprehensive pipeline-engineering reference useful background for building and maintaining his own BC-to-Fabric ingestion pipeline, but most of this content sits in DP-700 (data engineering) territory rather than being directly examined in DP-600, aside from basic P1 'ingest data' concepts."}, {"video_id": "0iz0wyLkf7w", "title": "REST API Pagination in Microsoft Fabric Notebooks: Fetch & Write JSON to Lakehouse", "url": "https://www.youtube.com/watch?v=0iz0wyLkf7w", "published": "2024-10-09", "duration": "15m 44s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["fabric notebooks", "json ingestion", "lakehouse files", "pagination", "python requests", "rest api"], "summary": "Uses a Fabric notebook with Python's requests library to call the public PokeAPI, handle its 'next' URL pagination in a while loop, and write the paginated JSON responses to a Lakehouse Files folder, including a timestamped folder pattern and looping over multiple endpoints.", "relevance": "Near-exact template for Giulio's own BC API pages -> Power BI pipeline: his BC OData/API endpoints likely paginate, and this shows the notebook pattern (requests + while-loop on next-link + timestamped Lakehouse writes) he can adapt directly for pulling BC sales/customer data into a lakehouse."}, {"video_id": "2mNb8b35KJY", "title": "Run Azure Data Factory Pipelines from Fabric with Parameters & Return Values!", "url": "https://www.youtube.com/watch?v=2mNb8b35KJY", "published": "2024-10-07", "duration": "8m 01s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["azure data factory", "fabric orchestration", "invoke pipeline activity", "pipeline parameters", "return values"], "summary": "Demos the Fabric \"Invoke Pipeline\" activity connecting to an external Azure Data Factory pipeline, passing a parameter in, and capturing a return value back into a Fabric pipeline variable.", "relevance": "Loosely relevant — most of the content lives in ADF, but the Fabric-side Invoke Pipeline activity and cross-tool connection setup is a real P1 orchestration pattern if Giulio's org still has legacy ADF pipelines that need to feed a Fabric pipeline."}, {"video_id": "5B3kKNhkTsc", "title": "DP-700 vs DP-600: What is different? - Exam Scope Comparison!", "url": "https://www.youtube.com/watch?v=5B3kKNhkTsc", "published": "2024-10-02", "duration": "6m 42s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["analytics engineer", "certification planning", "data engineer", "dp-600", "dp-700", "exam scope", "medallion architecture"], "summary": "Compares the DP-600 (Analytics Engineer) and DP-700 (Data Engineer) certifications using an architecture diagram: DP-600 covers end-to-end analytics up through semantic models and Power BI (needs DAX), while DP-700 adds streaming/mirroring/KQL data-engineering topics and excludes Power BI/DAX in favor of KQL.", "relevance": "Directly relevant as exam-planning content for Giulio, who is studying DP-600 specifically: confirms his effort should center on lakehouse/warehouse/semantic-model/Power BI topics and that KQL, eventstreams, and streaming (this channel's DP-700 series) are largely out of his exam scope."}, {"video_id": "zezVlIULLBo", "title": "How to Run Notebooks Inside Notebooks in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=zezVlIULLBo", "published": "2024-09-25", "duration": "11m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["dag orchestration", "fabric notebooks", "modular notebooks", "notebookutils", "parameters and exit values", "run magic command", "run_multiple"], "summary": "Compares three ways to run one Fabric notebook from another - the %run magic command (shared execution context, a failing sub-notebook halts everything), notebookutils.notebook.run (isolated context, safe exit values), and run_multiple/DAG (parallel and dependency-ordered execution of several notebooks with parameter and exit-value passing plus a visual DAG).", "relevance": "Directly useful for structuring a real BC data-prep solution in Fabric notebooks - splitting shared helper functions from per-entity transform notebooks and orchestrating them with dependencies - which is the kind of modular transform Giulio would build for BC sales data."}, {"video_id": "ULy_ZLwc1oI", "title": "How to Flatten JSON Files with Notebooks in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=ULy_ZLwc1oI", "published": "2024-09-17", "duration": "12m 55s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["data normalization", "delta", "explode function", "json flattening", "notebooks", "spark sql", "star schema prep"], "summary": "Uses a Fabric notebook with Spark SQL (temp views plus the explode function) to flatten a hierarchical JSON file with nested arrays into three normalized Delta tables, carrying foreign keys (e.g., zoo ID, animal ID) down through each explode step so the tables can be joined back together.", "relevance": "Directly useful transform technique: BC API pages often return nested JSON (e.g., sales headers with nested order lines or dimension arrays), and this notebook explode/flatten pattern is exactly how Giulio could normalize that JSON into clean, joinable Delta tables before modeling it in Power BI, rather than fighting with copy-activity JSON mappings."}, {"video_id": "UwiEy3myCSY", "title": "Explode Function in Fabric Notebooks: Flatten Arrays Like a Pro!", "url": "https://www.youtube.com/watch?v=UwiEy3myCSY", "published": "2024-09-11", "duration": "6m 57s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2", "P3"], "topics": ["array flattening", "explode function", "fabric notebooks", "nested json", "pyspark", "spark sql"], "summary": "Explains PySpark/Spark SQL's explode() function for flattening array columns into multiple rows (including nested arrays requiring repeated explode calls), demoed in both Spark SQL and PySpark syntax inside a Fabric notebook, and notes the row-duplication tradeoff it introduces.", "relevance": "Directly relevant to processing BC API JSON responses in a Fabric notebook: BC OData/API endpoints frequently return nested arrays (e.g. sales order lines, dimension sets) that need exactly this explode pattern to flatten into clean fact tables before they reach a semantic model."}, {"video_id": "4SSq8hj6kWM", "title": "Using SparkSQL with PySpark in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=4SSq8hj6kWM", "published": "2024-09-09", "duration": "7m 04s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2", "P3"], "topics": ["lakehouse", "notebooks", "pyspark", "sparksql", "sql magic", "temp view"], "summary": "A short beginner-friendly demo on combining PySpark and Spark SQL in the same Fabric notebook — reading a CSV into a Lakehouse Delta table, querying it with %%sql magic cells, running the same query via spark.sql() in Python, and the createOrReplaceTempView trick needed to query a DataFrame with SQL.", "relevance": "Good primer for Giulio if he wants to use notebooks (rather than dataflows) to transform BC API exports, since he can stay SQL-first with %%sql cells while still having PySpark available for anything SQL alone can't express."}, {"video_id": "LOIQCE0Szsc", "title": "Parameters & Exit Values in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=LOIQCE0Szsc", "published": "2024-09-04", "duration": "6m 36s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["exit value", "notebook parameters", "notebookutils", "pipeline-notebook integration", "set variable"], "summary": "Demonstrates passing pipeline parameters into a Fabric notebook via the Notebook activity's parameter cell, and returning a value from the notebook back to the pipeline using notebookutils.notebook.exit(), captured downstream with a Set Variable activity.", "relevance": "Notebook parameterization and exit values matter for orchestrating Prepare-stage transformations; relevant background for a notebook-based ingestion/cleaning step over BC data that reports status or row counts back to the calling pipeline."}, {"video_id": "tpw_AgItcRU", "title": "CSV File to Lakehouse Table using Fabric Notebooks", "url": "https://www.youtube.com/watch?v=tpw_AgItcRU", "published": "2024-09-02", "duration": "8m 17s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["csv ingestion", "delta", "fabric notebooks", "lakehouse", "pyspark", "schema definition", "spark.read"], "summary": "Walks through reading CSV files into a Fabric lakehouse Delta table using a PySpark notebook, covering the header option, custom delimiters (semicolon-separated files), defining an explicit StructType schema for headerless files, and generating a JSON schema from an existing dataframe for reuse.", "relevance": "Directly applicable groundwork for his BC API to Fabric pipeline — once BC sales or finance data is exported as CSV, this is exactly the PySpark pattern needed to land it correctly into lakehouse Delta tables (right headers, delimiters, and schema) before building a semantic model on top."}, {"video_id": "rjT8x_uCvzY", "title": "The Ultimate Guide to NotebookUtils in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=rjT8x_uCvzY", "published": "2024-08-26", "duration": "17m 26s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["dag dependencies", "exit values", "key vault secrets", "lakehouse utilities", "notebook orchestration", "notebookutils"], "summary": "Comprehensive tour of notebookutils (the successor to mssparkutils) across all five command groups: file-system ops, notebook orchestration (run/runMultiple with DAG dependencies and exit values), lakehouse management (create/list/get), Key Vault credential access, and runtime context.", "relevance": "The most complete single reference on notebookutils, the toolkit he'd reach for whenever a Fabric notebook needs to move files, chain notebooks, or read secrets while landing and transforming BC data in a lakehouse — directly supports the Prepare-data pillar of DP-600."}, {"video_id": "vR66EnyQwmo", "title": "Master Dynamic Data Mapping in Microsoft Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=vR66EnyQwmo", "published": "2024-08-19", "duration": "11m 25s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["column type conversion", "configuration file", "dynamic content mapping", "for each activity", "lookup activity", "metadata-driven pipeline"], "summary": "Builds a metadata-driven Fabric pipeline that reads a JSON configuration file (via a Lookup activity) describing per-file source paths, destination tables, and column mappings/type conversions, then uses a For Each plus Copy Data activity with dynamic-content mapping to process multiple CSVs into differently-typed lakehouse tables from one reusable pipeline.", "relevance": "A genuinely useful reusable pattern for ingesting multiple BC API pages with one configuration-driven pipeline instead of one pipeline per entity. Touches DP-600's P1 (ingest) and P2 (column mapping/typing), though the pipeline-authoring depth is more DP-700 flavored."}, {"video_id": "x7z5D7A7L_A", "title": "How to build Metadata-Driven Data Pipelines in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=x7z5D7A7L_A", "published": "2024-08-12", "duration": "13m 31s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["for each activity", "json configuration", "lookup activity", "metadata-driven pipelines", "reusable pipelines", "version control"], "summary": "Builds a generic, configuration-driven Fabric pipeline that reads a JSON config file via Lookup, loops with For Each, and uses dynamic content to copy different files based on a config ID parameter, arguing for JSON config files over database tables for version control.", "relevance": "A strong reusable-pipeline pattern Giulio could apply to his BC API pages -> Power BI pipeline: instead of one hardcoded pipeline per BC table/endpoint, drive ingestion off a JSON config listing BC API endpoints and destinations, exactly the kind of reusable-asset design DP-600 expects."}, {"video_id": "UvPcQ4Kb7m4", "title": "Master Stored Procedures in Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=UvPcQ4Kb7m4", "published": "2024-08-07", "duration": "11m 37s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["copy activity", "fabric data warehouse", "lookup activity", "script activity", "sql", "stored procedures"], "summary": "Shows multiple ways to run and return data from SQL stored procedures inside Fabric Data Warehouse pipelines: the Stored Procedure activity, Script activity (query vs non-query), Lookup activity, and a pre-copy script on Copy Data.", "relevance": "Directly relevant to DP-600 P1/P2 — stored procedures in a Fabric Warehouse are a natural place to encapsulate transform/aggregation logic for BC sales data, and knowing which activity returns data to the pipeline matters for orchestration."}, {"video_id": "MUMKPVEmdVE", "title": "How to Copy a CSV File to Microsoft Fabric Data Warehouse", "url": "https://www.youtube.com/watch?v=MUMKPVEmdVE", "published": "2024-08-05", "duration": "6m 49s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["auto create table", "copy data activity", "fabric data warehouse", "lakehouse vs warehouse", "pre-copy script", "schema creation", "truncate table"], "summary": "Tutorial showing a Fabric pipeline copy-data activity that reads a CSV from a Lakehouse files folder and writes it into a Fabric Data Warehouse table, using the auto-create-table feature (which also creates the schema) and the pre-copy script option for truncate-before-load patterns.", "relevance": "Shows the alternate Fabric data store (Warehouse vs. Lakehouse) for landing BC data, plus the pre-copy truncate pattern Giulio would need for a repeatable refresh of BC sales data into a Warehouse table that a DP-600 semantic model could sit on top of."}, {"video_id": "To6rxgayUGo", "title": "Using Filter Activity in Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=To6rxgayUGo", "published": "2024-08-01", "duration": "7m 20s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["@item() expression", "array filtering", "child items", "fabric pipelines", "filter activity", "get metadata"], "summary": "Demonstrates the Filter activity in Fabric pipelines - looping over an array with an @item() expression to drop items that don't meet a condition - first with a simple number array, then a realistic case filtering a Get Metadata child-items list down to only .csv files.", "relevance": "Another DP-700-flavored pipeline-activity building block; the get-metadata-then-filter-by-extension pattern is a reusable trick for a folder-based BC export pipeline where only certain files should be picked up, but it isn't DP-600 exam content."}, {"video_id": "msUAV6nbdJ0", "title": "Mastering the Delete Data Activity eline (minute/hourly/daily/weekly, one schedule per pipeline), a workaround for getting trigger time via system variables since scheduled runs can't pass custom parameter values, and using the cross-workspace Monitoring Hub to review pipeline runs.", "relevance": "Directly applicable operational knowledge for running Giulio's BC ingestion pipeline on a recurring schedule and monitoring its runs in his Fabric sandbox; this orchestration know-how underlies DP-600's data-ingestion scope even though the exam doesn't test scheduling UI mechanics directly."}, {"video_id": "b4g13fPKROI", "title": "Terraform vs Bicep: The One To Use For Azure IaC?", "url": "https://www.youtube.com/watch?v=b4g13fPKROI", "published": "2024-07-03", "duration": "5m 14s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["arm templates", "azure devops", "bicep", "iac tooling", "infrastructure as code", "terraform"], "summary": "Compares Terraform and Bicep for Azure infrastructure-as-code across language/syntax, multi-cloud provider support, maturity, tooling, state management, and learning curve.", "relevance": "Not DP-600 relevant — general Azure infrastructure-as-code comparison with no Fabric or Power BI content."}, {"video_id": "s4PKeE3xJNc", "title": "Why Data Factory is not worth learning in 2026", "url": "https://www.youtube.com/watch?v=s4PKeE3xJNc", "published": "2024-06-27", "duration": "3m 49s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "career strategy", "fabric pipelines", "tool comparison"], "summary": "Opinion piece arguing that new learners should focus on Microsoft Fabric's pipeline tool rather than classic Azure Data Factory, since the interfaces and concepts are nearly identical but Fabric is where Microsoft's investment is going.", "relevance": "Strategic/career framing rather than hands-on content - reinforces that Giulio's time is well spent studying Fabric pipelines (which he needs for DP-600) over standalone ADF, but teaches no specific technique to apply."}, {"video_id": "8jaCztDtJy8", "title": "Get Metadata Activity in Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=8jaCztDtJy8", "published": "2024-06-25", "duration": "8m 37s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["fabric pipelines", "file structure", "get metadata activity", "if condition", "lakehouse files", "last modified"], "summary": "Explains the Get Metadata activity in Fabric pipelines - fetching properties like last-modified timestamp, exists, and column structure from a file - then demos reading a CSV's metadata in a lakehouse and using the 'exists' output to drive an If Condition branch.", "relevance": "A specific pipeline-activity building block more aligned with DP-700 data engineering than DP-600, but the check-before-you-copy pattern is directly usable for a lightweight 'only reload if the BC export changed' guard in a Fabric pipeline."}, {"video_id": "q2sc1BaIJAs", "title": "Mastering Lookup Activity in Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=q2sc1BaIJAs", "published": "2024-06-17", "duration": "11m 09s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["configuration table", "data factory", "dynamic content", "foreach activity", "lookup activity", "metadata-driven pipelines"], "summary": "Explains the Fabric Data Factory Lookup activity -- retrieving either the first row or all rows (up to 5,000 rows / 4MB) from a file or table -- then demos feeding its output into a ForEach loop as the building block for metadata/configuration-driven pipelines.", "relevance": "Classic ADF-style pipeline activity mechanics (DP-700 data-engineering territory, not the DP-600 exam scope); Giulio's BC API pipeline runs through Power Query / Power BI rather than Fabric Data Factory pipelines, so this activity isn't directly applicable to his current workflow."}, {"video_id": "BCMVECMzwtQ", "title": "Crush the DP-600 Exam: Top Tips from a Microsoft Certified Pro!", "url": "https://www.youtube.com/watch?v=BCMVECMzwtQ", "published": "2024-06-12", "duration": "5m 28s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certification prep", "dp-600 exam", "exam strategy", "microsoft learn lookup", "practice exam", "study tips"], "summary": "Aleksi's own DP-600 pass strategy: start with Microsoft's free practice exam to find weak areas, skim familiar sections of the official study material and focus only on gaps, skip the hands-on labs for exam efficiency, and use YouTube courses to fill knowledge holes. The key tip: the real exam gives you live access to Microsoft Learn docs, so answer everything first, flag unsure questions, then use remaining time to look up just the flagged ones.", "relevance": "Directly about Giulio's current goal of passing DP-600 — a concrete study-and-exam-day strategy (practice exam first to find weak spots, in-exam Microsoft Learn lookup technique) he can apply as-is rather than a technical Fabric topic."}, {"video_id": "QxhWkhzaYtc", "title": "ForEach Activity in Microsoft Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=QxhWkhzaYtc", "published": "2024-06-07", "duration": "13m 24s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["array iteration", "data pipelines", "foreach activity", "lakehouse tables", "metadata-driven ingestion", "parallel execution"], "summary": "Explains the ForEach activity in Fabric Data Pipelines conceptually (array iteration, @item reference, sequential vs parallel execution) then demos looping a single Copy activity over an array parameter to load two CSV files into two Lakehouse tables.", "relevance": "Data pipeline orchestration sits outside DP-600's core taxonomy (that's DP-700 territory), but the ForEach/parameter pattern is the same mechanism that could drive Giulio's own BC API-pages ingestion into Lakehouse tables."}, {"video_id": "cVxRAoQqAjI", "title": "If Condition Activity in Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=cVxRAoQqAjI", "published": "2024-06-03", "duration": "12m 11s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["conditional logic", "expression language", "fabric data pipelines", "if condition activity", "switch activity", "true/false branches"], "summary": "Explains the If Condition activity in Fabric Data Pipelines conceptually and hands-on: the condition expression must resolve to a boolean, true/false branches route execution, and a worked example runs a bigger extraction on Sundays vs a smaller daily one; also covers the limitation that If activities can't be nested (use Switch or an Invoke Pipeline workaround instead).", "relevance": "Squarely Fabric Data Pipeline orchestration logic (DP-700 territory rather than DP-600's Power BI/semantic-model focus), but the exact \"full load on Sunday, incremental the rest of the week\" pattern is a real, reusable design for his own BC API to Power BI ingestion pipeline."}, {"video_id": "G8_BREsJA6U", "title": "Platform Comparison - Game Over for Databricks?", "url": "https://www.youtube.com/watch?v=G8_BREsJA6U", "published": "2024-05-28", "duration": "13m 24s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["capacity pricing", "delta parquet", "f64", "fabric vs databricks", "onelake", "platform maturity"], "summary": "High-level, conceptual comparison of Microsoft Fabric vs. Azure Databricks: setup complexity (SaaS vs. PaaS), the F64 capacity paywall for private networking, feature breadth (OneLake, low/no-code tools, Power BI integration), and platform maturity/migration considerations.", "relevance": "Useful conceptual grounding for DP-600's coverage of OneLake and capacity/licensing, but it's a strategic buy/build comparison rather than hands-on skill-building, so it mostly reinforces vocabulary (OneLake as single access point, Delta Parquet as the shared format, capacity-based pricing) rather than testable technique."}, {"video_id": "80fLHIxhSVY", "title": "Microsoft Fabric Data Pipeline Expression & Dynamic Content Tutorial!", "url": "https://www.youtube.com/watch?v=80fLHIxhSVY", "published": "2024-05-22", "duration": "13m 06s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["concat function", "data pipelines", "dynamic content", "expression builder", "pipeline expressions", "utcnow function"], "summary": "Explains Fabric's pipeline expression language conceptually (string, date, logical, math, collection, conversion functions), then builds a copy-data pipeline that uses concat and utcNow() to dynamically timestamp a copied file's name.", "relevance": "Pipeline expressions are the same orchestration mechanics Giulio would use to build a dynamic BC API-to-lakehouse ingestion pipeline, e.g. dynamically named/dated landing files. Falls under DP-600's P1 'get data' area but leans more toward DP-700 pipeline-engineering depth."}, {"video_id": "0K4CmEmdgaM", "title": "Microsoft Fabric Data Pipeline Variable Tutorial", "url": "https://www.youtube.com/watch?v=0K4CmEmdgaM", "published": "2024-05-16", "duration": "10m 53s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["append variable", "fabric data pipelines", "pipeline variables", "set variable", "system variables"], "summary": "Covers Fabric data pipeline variables (string, integer, boolean, array), the Set Variable and Append Variable activities, system variables like pipeline name, and how variable scope differs from parameters that are passed into a pipeline from outside.", "relevance": "Foundational Fabric pipeline orchestration mechanics; useful background for building any Fabric ingestion pipeline for BC data, but this is basic plumbing rather than an explicit DP-600 exam topic - most relevant as a get-data/ingestion pipeline building block."}, {"video_id": "gp3alTEcZBE", "title": "How to use Data Pipeline Parameters in Fabric", "url": "https://www.youtube.com/watch?v=gp3alTEcZBE", "published": "2024-05-13", "duration": "10m 31s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["copy activity", "dynamic content", "fabric data pipelines", "lakehouse ingestion", "pipeline parameters"], "summary": "Explains and demos Fabric Data Pipeline parameters — defining string parameters at the pipeline level and using them dynamically in a Copy Data activity's source/destination file paths, then inspecting parameter values at runtime.", "relevance": "Directly useful for DP-600 P1 (get data / ingest) — parameterized pipelines are how Giulio would build one reusable pipeline to land multiple BC API page exports instead of one pipeline per entity."}, {"video_id": "BFoY3L_PAyQ", "title": "Microsoft Fabric Pipeline Copy Data Tutorial - For Beginners!", "url": "https://www.youtube.com/watch?v=BFoY3L_PAyQ", "published": "2024-04-29", "duration": "12m 44s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["binary copy", "column mapping", "copy data activity", "data types", "delimited text", "fabric pipelines", "lakehouse files vs tables"], "summary": "Deep dive on the Fabric pipeline copy-data activity: explains binary vs. format-aware copy, supported source/destination file types, and walks through two tutorials - copying a file between Lakehouse folders, and copying a CSV into a new Lakehouse table with type mapping.", "relevance": "Directly useful for Giulio's own BC API pages -> Power BI pipeline: shows how to move raw exports through a Fabric Lakehouse (files section) and load them into governed Delta tables, which is the P1/P2 groundwork DP-600 expects before building a semantic model."}, {"video_id": "01gii5HrU9s", "title": "A Beginner's Guide to Microsoft Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=01gii5HrU9s", "published": "2024-04-22", "duration": "12m 14s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["activities", "connections", "expression language", "fabric pipelines", "monitoring hub", "parameters vs variables", "scheduling"], "summary": "A conceptual and hands-on intro to Fabric Data Pipelines covering activities, connections, parameters vs variables, the pipeline expression language, scheduling, and the Monitoring Hub, then walks through the pipeline canvas UI adding a Wait and a Copy Data activity.", "relevance": "Solid foundation-level orientation to Fabric's orchestration tool; relevant background if Giulio wants to move his current BC API to Power BI extract into a scheduled, monitored Fabric pipeline rather than manual refreshes, though DP-600 itself only lightly tests pipelines under 'get data.'"}, {"video_id": "jQKK0TBt-m4", "title": "Microsoft Fabric: Lakehouse, Data Warehouse and KQL Database comparison!", "url": "https://www.youtube.com/watch?v=jQKK0TBt-m4", "published": "2024-04-11", "duration": "24m 19s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "P3"], "topics": ["data warehouse", "delta format", "kql database", "lakehouse", "medallion architecture", "onelake", "shortcuts", "sql endpoint"], "summary": "Compares Fabric's three core analytical data stores — Lakehouse (files + Delta tables, Spark-native, read-only SQL endpoint), Data Warehouse (full T-SQL read/write, familiar relational objects), and KQL Database (event/streaming data) — and shows how all three land data into OneLake as Delta Parquet under the hood, demonstrated live in the Fabric UI.", "relevance": "This is the foundational choose-your-data-store decision Giulio needs for DP-600 and for deciding where his BC sales data should land in his Fabric sandbox — Lakehouse for raw/staged BC API exports vs. Warehouse for the modeled gold layer that feeds Power BI."}, {"video_id": "x67Q46OsCsk", "title": "Get Started with Microsoft Fabric Data Engineering in 2026!", "url": "https://www.youtube.com/watch?v=x67Q46OsCsk", "published": "2024-04-02", "duration": "13m 45s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["data engineering", "dataflow gen2", "delta format", "microsoft fabric overview", "notebooks", "onelake", "pipelines"], "summary": "Introduction to a Fabric data engineering series: explains what data engineers do (ingest, store, clean, pipeline, govern, optimize), then gives a conceptual tour of OneLake as the single tenant-wide data lake, the Delta Parquet format underneath it, and Fabric's three main build tools -- pipelines, Dataflow Gen2, and notebooks.", "relevance": "Good orientation-level overview of OneLake and Delta, which underpin every DP-600 Prepare-data topic, and a useful map of which Fabric tool (low-code pipeline/dataflow vs. code-first notebook) to reach for -- but it's entirely conceptual with no hands-on build, so it's a primer rather than something to demo directly."}, {"video_id": "PKOdWsDvme0", "title": "Secrets From Azure Key Vault in Microsoft Fabric Notebooks", "url": "https://www.youtube.com/watch?v=PKOdWsDvme0", "published": "2024-03-18", "duration": "4m 01s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "P2"], "topics": ["credentials", "fabric notebooks", "key vault", "mssparkutils", "notebook secrets", "rbac"], "summary": "Shows how to fetch a secret from Azure Key Vault inside a Fabric notebook using mssparkutils.credentials.getSecret(vaultURL, secretName), including the RBAC gotcha: you need the 'Key Vault Secrets User' role assigned on the vault, not just Owner/Contributor, or you get a 403.", "relevance": "Directly usable pattern for Giulio's own BC API pipeline: instead of hardcoding BC API credentials/connection strings in a notebook, store them in Key Vault and pull them at runtime, which is exactly the kind of secure-credential practice DP-600's governance material expects."}, {"video_id": "4Xy60Q_qgPM", "title": "Microsoft Fabric Event Stream - No-Code data stream to Delta table!", "url": "https://www.youtube.com/watch?v=4Xy60Q_qgPM", "published": "2024-03-11", "duration": "14m 08s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["delta", "event hub", "eventstream", "lakehouse destination", "no-code transform", "real-time ingestion"], "summary": "End-to-end no-code demo streaming simulated temperature readings from an Azure Event Hub into a Fabric Eventstream, applying a filter/round transform in the event processor, and landing the result in a Lakehouse Delta table updated every 60 seconds.", "relevance": "Eventstream and near-real-time ingestion sit under DP-600's 'get data' objective; useful context for how Fabric streams data into a Delta table that Power BI or a Direct Lake model can read, though Giulio's BC data pipeline is batch-based, not streaming."}, {"video_id": "T4nxq0g1cNY", "title": "Top 5 tips to save up development time with Fabric Notebooks", "url": "https://www.youtube.com/watch?v=T4nxq0g1cNY", "published": "2024-03-05", "duration": "4m 16s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["copilot in notebooks", "delta", "drag and drop ingestion", "fabric notebooks", "notebook shortcuts", "pyspark snippets"], "summary": "Shares five Fabric notebook productivity tips: drag-and-drop a lakehouse file straight into a Delta table with no code, drag-and-drop a table into a code cell to auto-generate query code, use notebook keyboard shortcuts, browse a built-in PySpark code-snippet library, and use Copilot inside notebooks.", "relevance": "Directly useful groundwork for his Fabric/BC side project — the no-code drag-and-drop file-to-Delta-table trick is a fast way to land a BC data export into a lakehouse table while he's still learning PySpark, and the snippet library speeds up notebook development."}, {"video_id": "iHJvkj6GXAc", "title": "Microsoft Fabric Notebooks: MSSparkUtils Tutorial", "url": "https://www.youtube.com/watch?v=iHJvkj6GXAc", "published": "2024-02-26", "duration": "13m 01s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["file system operations", "key vault secrets", "lakehouse", "mssparkutils", "notebook utilities", "run notebook"], "summary": "Demos MSSparkUtils inside a Fabric notebook: file-system operations against a lakehouse and Azure Blob Storage (ls, cp, fastcp, mkdir), running one or multiple notebooks from a parent notebook (with dependencies), and fetching secrets from Azure Key Vault.", "relevance": "Directly useful for the Prepare-data pillar of DP-600 — notebooks are one of the core ways to land and orchestrate data in a Fabric lakehouse, which is exactly the pattern Giulio would use to bring BC API extracts into OneLake before modeling them in Power BI."}, {"video_id": "4hh1e6oy2A4", "title": "Microsoft Fabric Notebook Copilot Tutorial", "url": "https://www.youtube.com/watch?v=4hh1e6oy2A4", "published": "2024-02-05", "duration": "10m 09s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["chat magic commands", "code generation", "copilot", "data visualization", "fabric notebooks", "lakehouse", "pyspark"], "summary": "Demonstrates Fabric notebook Copilot's chat-magic commands (%%code, %%chat, %%describe, %%addcomments, %%fixerrors, %%translate) to generate PySpark transformations, fix a runtime error, add code comments, translate a SQL query to PySpark, and build a bar chart, all from natural-language prompts against a lakehouse table.", "relevance": "Directly useful for Giulio's BC-data lakehouse work: Copilot in notebooks speeds up writing and debugging PySpark transformations on BC sales data landed in a lakehouse, a core DP-600 'prepare data' skill."}, {"video_id": "O_qlF0_bk1A", "title": "How to Parametrize Notebooks in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=O_qlF0_bk1A", "published": "2024-01-22", "duration": "4m 27s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["data pipelines", "fabric notebooks", "notebook activity", "parameters", "reusability"], "summary": "Shows how to add a parameters cell to a Fabric notebook, mark it as the designated 'parameter cell', then call the notebook from a data pipeline's Notebook activity passing base parameters that override the notebook's default values at runtime.", "relevance": "Directly useful for Giulio's Fabric side project: parametrizing notebooks lets him reuse one BC data-ingestion notebook across multiple BC environments or date ranges instead of hardcoding values, a Prepare-data pattern conceptually within DP-600 scope."}, {"video_id": "xzFeuL9Whgk", "title": "Microsoft Fabric Notebooks - Get Started in 2026!", "url": "https://www.youtube.com/watch?v=xzFeuL9Whgk", "published": "2024-01-11", "duration": "8m 34s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "P3"], "topics": ["charts", "data exploration", "fabric notebooks", "lakehouse", "markdown documentation", "pyspark", "spark sql"], "summary": "Intro tour of Fabric notebooks — UI tabs, attaching a Lakehouse, writing PySpark and Spark SQL cells, drag-and-drop table loading, markdown documentation, comments, quick charts, and the data-inspect tool.", "relevance": "Directly relevant — notebooks are a core P1/P2/P3 tool for DP-600. Shows the basic mechanics Giulio would use to load and explore BC data files landed in a Fabric lakehouse."}, {"video_id": "37Ftt3JNQ0U", "title": "Copy data from Azure Blob to Fabric Lakehouse Delta Table", "url": "https://www.youtube.com/watch?v=37Ftt3JNQ0U", "published": "2024-01-04", "duration": "6m 44s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["blob storage connection", "column mapping", "copy data activity", "data types", "delta", "fabric data pipeline", "lakehouse"], "summary": "Hands-on tutorial: create a Fabric data pipeline copy-data activity that connects to an Azure Blob container (via account key), reads a CSV, and writes it into a new Lakehouse table, including setting column data types in the mapping tab and using the overwrite table action.", "relevance": "This is exactly the pattern Giulio would use to land his BC API extracts (currently going straight to Power BI) into a Fabric Lakehouse delta table instead - the P1 ingest step of a proper Fabric pipeline for his BC sales data before it hits a semantic model."}, {"video_id": "RmSyByDsH1A", "title": "Microsoft Fabric Data Factory compared to Azure Data Factory", "url": "https://www.youtube.com/watch?v=RmSyByDsH1A", "published": "2023-12-20", "duration": "9m 15s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["azure data factory comparison", "connections", "dataflow gen2", "fabric data factory", "linked services", "monitoring hub", "triggers"], "summary": "Walks through Microsoft Fabric's brand-new Data Factory experience six months after Fabric's GA, comparing it activity-by-activity to classic Azure Data Factory: connections vs linked services, no separate dataset objects, Dataflow Gen2 vs ADF Data Flows/Power Query, schedule-only triggers, and the cross-workspace Monitoring Hub.", "relevance": "Useful orientation for what Fabric's pipeline canvas can and can't do relative to ADF, relevant if Giulio ever moves his manual BC API extraction into an orchestrated, scheduled Fabric pipeline; not core DP-600 exam content but touches the 'choose a data store/connection' side of Prepare data."}, {"video_id": "9MJ9DMqguoo", "title": "How to copy a JSON File from Blob to Azure SQL DB", "url": "https://www.youtube.com/watch?v=9MJ9DMqguoo", "published": "2023-12-15", "duration": "10m 13s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["auto-create table", "azure sql", "blob storage", "collection reference", "copy activity", "data factory", "json mapping"], "summary": "Walks through building a Data Factory copy activity that reads a nested JSON file from Blob storage and flattens its array of objects into an auto-created Azure SQL table via the copy activity's collection reference mapping.", "relevance": "Classic Azure Data Factory copy-activity JSON mapping technique using the copy activity's built-in mapping UI; outside DP-600 scope entirely (no Fabric involved), though the underlying problem -- flattening nested JSON when landing API data -- recurs elsewhere on this channel using notebooks, which is the DP-600-relevant version of this technique."}, {"video_id": "u78beL696o8", "title": "Using Script Activity in Azure Data Factory", "url": "https://www.youtube.com/watch?v=u78beL696o8", "published": "2023-11-29", "duration": "6m 19s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "linked service", "logging", "query vs non-query", "script activity", "sql"], "summary": "Demonstrates ADF's Script activity, which runs raw SQL (query or non-query mode) against Azure SQL DB, dedicated SQL pool, SQL Server, Oracle, or Snowflake linked services directly from a pipeline, including parameters, timeouts, and logging print statements to activity output.", "relevance": "Classic Azure Data Factory, not Fabric; the Script activity itself has a near-identical counterpart usable inside Fabric pipelines against a warehouse, but this video is a narrow how-to on the activity's UI rather than anything DP-600 tests."}, {"video_id": "i8fU-vtb8dA", "title": "Configurable Pipelines in Azure Data Factory", "url": "https://www.youtube.com/watch?v=i8fU-vtb8dA", "published": "2023-11-13", "duration": "12m 48s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "configurable pipelines", "foreach activity", "json configuration", "lookup activity", "metadata-driven pipeline"], "summary": "Shows how to build a configuration-driven ADF pipeline that reads an array of copy instructions from a JSON config file (via Lookup activity) instead of a database table, then loops through it with ForEach to run one generic copy activity across many file pairs.", "relevance": "Classic ADF metadata-driven orchestration pattern, not Fabric or DP-600 material. Giulio's Fabric pipelines would use the equivalent Lookup/ForEach activities, but the video is framed entirely around ADF, making it tangential to DP-600 prep."}, {"video_id": "nQn46Vw6QLg", "title": "How to use Pipeline Return Values in Data Factory", "url": "https://www.youtube.com/watch?v=nQn46Vw6QLg", "published": "2023-11-02", "duration": "7m 35s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["data factory", "dynamic content", "fabric pipelines", "nested pipelines", "pipeline return values", "set variable activity"], "summary": "Demonstrates how to configure pipeline return values in Azure Data Factory's Set Variable activity so a nested/child pipeline can pass string, expression, and array values back to a parent pipeline via dynamic content, replacing the older pattern of writing intermediate values to a file.", "relevance": "Classic Azure Data Factory content (near-identical to Fabric Data Factory pipelines) — this is DP-700 orchestration territory rather than DP-600 semantic-model content, but the pattern is directly reusable if he splits his BC API extraction into child pipelines per entity and needs to pass values like row counts back to a master pipeline."}, {"video_id": "Mf_W6ENjnAY", "title": "Top 5 Azure Data Factory Best Practices to Follow in 2026", "url": "https://www.youtube.com/watch?v=Mf_W6ENjnAY", "published": "2023-10-25", "duration": "3m 50s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "best practices", "concurrency", "iterative pipelines", "naming conventions", "retry policy"], "summary": "Short list of five ADF hygiene practices: consistent naming conventions, setting activity retries, adjusting activity timeouts, capping pipeline concurrency to 1, and using iterative (ForEach/loop) logic instead of duplicating activities.", "relevance": "Pure Azure Data Factory operational advice, not Fabric or DP-600 material. The underlying discipline (naming conventions, retries, concurrency control) is good general practice that would carry over if he ever orchestrates a Fabric Data Pipeline, but nothing here is exam-relevant."}, {"video_id": "Az6qshar9Pc", "title": "Top 5 Programming Languages for Azure Data Engineers in 2026", "url": "https://www.youtube.com/watch?v=Az6qshar9Pc", "published": "2023-10-16", "duration": "4m 43s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data engineer", "career advice", "kql", "powershell", "pyspark", "python", "sql", "t-sql"], "summary": "Career-advice listicle ranking Python (via PySpark), KQL, SQL/T-SQL, and PowerShell as the languages Azure data engineers should learn, explaining where each is typically used (notebooks, Data Explorer/Sentinel, relational databases, automation/CI-CD).", "relevance": "General skills advice rather than hands-on Fabric or DP-600 content. SQL and, to a lesser extent, PySpark/KQL genuinely underpin DP-600's P2/P3 areas, but the video teaches no technique Giulio could apply directly."}, {"video_id": "AnffigXTi60", "title": "Get Metadata Activity explained in 2026", "url": "https://www.youtube.com/watch?v=AnffigXTi60", "published": "2023-10-08", "duration": "8m 11s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["data factory", "dynamic content", "file metadata", "get metadata activity", "pipeline activities"], "summary": "Explains the ADF/Fabric-pipeline Get Metadata activity, the 10 metadata types it can retrieve (last modified, exists, structure, child items, etc.), how to use its output as dynamic content in later activities, and a demo checking a CSV file's last-modified timestamp and structure.", "relevance": "Classic Azure Data Factory activity walkthrough; not part of the DP-600 syllabus, though the same activity exists in Fabric Data Factory pipelines. Only loosely useful if Giulio ever builds conditional Fabric pipeline logic around his BC file drops."}, {"video_id": "oCxT4Y-AKz4", "title": "How to use Lookup Activity in Azure Data Factory", "url": "https://www.youtube.com/watch?v=oCxT4Y-AKz4", "published": "2023-10-03", "duration": "9m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "configuration table", "dynamic pipelines", "foreach activity", "lookup activity", "sql database"], "summary": "Demonstrates the ADF Lookup activity — pulling the first row or all rows from a SQL config table — and chains it into a ForEach loop to build configuration-driven, iterative pipelines.", "relevance": "Pure Azure Data Factory content, not Fabric or DP-600 syllabus. The underlying pattern (lookup + ForEach for config-driven pipelines) is conceptually reusable in Fabric Data Pipelines, but this video is ADF Studio, not Fabric."}, {"video_id": "GMBM-c9FfSA", "title": "Top 4 Azure Resources for Data Engineers to Learn in 2026", "url": "https://www.youtube.com/watch?v=GMBM-c9FfSA", "published": "2023-09-28", "duration": "3m 47s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure sql database", "azure storage account", "career advice", "data factory", "databricks", "lakehouse architecture"], "summary": "Opinion video naming the four Azure resources the creator considers essential for data engineers: Storage Account, Databricks, Azure SQL Database, and Data Factory, with a short rationale for each.", "relevance": "Career-advice content aimed at classic Azure data engineers, predates Fabric and doesn't mention it. Not relevant to DP-600 or Giulio's BC/Power BI/Fabric work."}, {"video_id": "qMXp9Xnh8T8", "title": "Use ForEach to Bulk Load Data in Data Factory", "url": "https://www.youtube.com/watch?v=qMXp9Xnh8T8", "published": "2023-09-23", "duration": "14m 53s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "bulk copy", "copy activity", "dynamic content", "foreach activity", "metadata-driven pipeline", "pipeline parameters"], "summary": "Explains the ForEach activity in classic Azure Data Factory as a way to loop a single copy activity over a parameterized list of files/tables instead of duplicating copy activities, then builds a live demo bulk-copying two CSVs from Blob Storage into auto-created Azure SQL tables using pipeline parameters and dynamic content.", "relevance": "This is classic Azure Data Factory, not Fabric, and predates the DP-600/DP-700 exam scope, but the ForEach + parameterized copy pattern is exactly the metadata-driven approach Giulio would use in a Fabric pipeline to loop over multiple BC API pages/entities with one reusable copy activity."}, {"video_id": "gMU9qyEHjAU", "title": "IF & SWITCH activities in Data Factory in 2026", "url": "https://www.youtube.com/watch?v=gMU9qyEHjAU", "published": "2023-09-20", "duration": "16m 35s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["conditional logic", "data factory", "expression language", "if condition", "pipeline branching", "switch activity"], "summary": "Explains Data Factory / Fabric Data Factory If Condition and Switch activities for branching pipeline logic based on boolean or string expressions, demoed live with a day-of-week routing example and a file-extension switch example.", "relevance": "Pure Azure Data Factory / Fabric Data Factory pipeline branching mechanics; this is DP-700 data-engineering pipeline territory, not part of the DP-600 Analytics Engineer scope, and Giulio's current BC API -> Power BI pipeline doesn't rely on Fabric Data Factory conditional branching."}, {"video_id": "UfwJ0yru3pE", "title": "Dynamic Content and Functions in Azure Data Factory Made Easy!", "url": "https://www.youtube.com/watch?v=UfwJ0yru3pE", "published": "2023-09-14", "duration": "17m 45s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "concat function", "dynamic content", "expression builder", "parameters", "utcnow function"], "summary": "Introduces Azure Data Factory's dynamic content / expression language: where 'Add dynamic content' appears in an activity, the built-in function library (collection, conversion, date, logical, math, string), and a hands-on demo building the concat() and utcnow() functions to dynamically name a copied file with a timestamp.", "relevance": "This is pure classic Azure Data Factory (not Fabric), but Fabric Data pipelines use the exact same expression language and function library, so the concat/utcnow patterns transfer directly to any Fabric pipeline Giulio might build to orchestrate his BC API ingestion."}, {"video_id": "LIbAcN8O5ao", "title": "Parameters and Variables in Azure Data Factory", "url": "https://www.youtube.com/watch?v=LIbAcN8O5ao", "published": "2023-09-07", "duration": "23m 32s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "dataset parameters", "dynamic content", "global parameters", "pipeline parameters", "variables"], "summary": "Introduces Azure Data Factory parameters (linked service, dataset, pipeline, global) and variables, showing how parameterizing dataset and pipeline objects lets one copy activity reuse across multiple source/sink files instead of duplicating pipeline objects for each file.", "relevance": "Pure Azure Data Factory content from 2023, predating Fabric; ADF is not part of the DP-600 scope. Fabric data pipelines use a near-identical UI, but the video itself teaches ADF, not Fabric, so it is tangential to Giulio's DP-600 study."}, {"video_id": "zyBJ1FUIwYM", "title": "Master Azure Resource Naming with Best Practices", "url": "https://www.youtube.com/watch?v=zyBJ1FUIwYM", "published": "2023-09-02", "duration": "3m 42s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure naming conventions", "azure resource manager", "environment identifiers", "governance", "resource naming"], "summary": "Covers five Azure resource naming best practices: use Microsoft's recommended abbreviations, ensure globally unique names where required, embed a common project identifier, respect resource name length limits, and append environment identifiers (dev/test/prod) at the end of names.", "relevance": "Pure Azure resource-naming conventions for ARM resources, not Fabric or DP-600 content, though the environment-suffix and common-identifier ideas are reusable when naming his own Fabric workspaces, lakehouses, and pipelines."}, {"video_id": "p78BJ3A-EvQ", "title": "How To Use Data Factory Triggers - Easy To Understand!", "url": "https://www.youtube.com/watch?v=p78BJ3A-EvQ", "published": "2023-08-30", "duration": "25m 30s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["azure data factory", "pipeline orchestration", "schedule trigger", "storage event trigger", "triggers", "tumbling window"], "summary": "Walks through Azure Data Factory's four trigger types (schedule, tumbling window, storage event, custom event), explaining their concurrency, retry, and pipeline-relationship differences, then demos building each trigger type live in ADF against simple wait-activity pipelines.", "relevance": "This is classic Azure Data Factory (ADF), not Microsoft Fabric, and predates DP-600. The trigger concepts (schedule vs. event-based, concurrency/retry policies) map loosely to Fabric Data Pipeline scheduling and storage-event triggers, but the video itself never touches Fabric, OneLake, or semantic models, so rface BC/Dataverse data with a custom UI control (e.g. a visual status or rating indicator) beyond what out-of-the-box controls offer."}, {"video_id": "fL8BAoyqIZM", "title": "Spend Days Making Your Power Apps? Use This Tool: Power Hour Podcast #29 - Lukas Pavelka #2", "url": "https://www.youtube.com/watch?v=fL8BAoyqIZM", "published": "2025-09-23", "duration": "31m 53s", "ch": "Powercademy", "accent": "#7c3aed", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "design kit", "documentation", "figma", "power apps", "power bi", "prototyping", "responsive layout"], "summary": "Demo of major updates to the Design Kit for Power Apps Figma plugin — a new UI, beta responsive layout containers, icon swapping, clickable prototypes, style/theme editing, multi-screen clipboard export, and automatic PDF documentation — plus a first look at a companion free Design Kit for Power BI aimed at importing/exporting Power Query data flows between Figma and Power BI.", "relevance": "A concrete productivity tool for designing and documenting canvas apps and (soon) Power BI data flows faster, directly applicable to how Giulio mocks up UI before building BC-facing apps and reports."}, {"video_id": "JYcgN8TzQFw", "title": "Pre-Sales, Trust & Content: Power Hour Podcast #28 - Dian Taylor", "url": "https://www.youtube.com/watch?v=JYcgN8TzQFw", "published": "2025-08-12", "duration": "47m 18s", "ch": "Powercademy", "accent": "#7c3aed", "axis_label": "cert", "tags": ["AB-620", "AB-730"], "topics": ["content creation", "copilot studio", "customer service agents", "discovery", "dynamics 365", "mcp", "pre-sales"], "summary": "Six-time MVP Dian Taylor (pre-sales engineer at RSM) discusses discovery-driven demoing, treating customers as trusted advisors, and shares which Dynamics 365/Copilot features excite her most right now: Copilot Studio's ability to connect to MCP servers instead of hand-built actions, and the new customer service intent, knowledge, and case-management agents.", "relevance": "The Copilot Studio + MCP server point is directly relevant to Giulio's AB-620 interest: connecting Copilot Studio agents to MCP servers instead of one-off custom actions is exactly the kind of integration pattern he could use to expose BC data to an agent, and the 'discovery before demo' pre-sales mindset is a good model for internal BC/BI demo sessions."}, {"video_id": "CRCMcZzzCVE", "title": "Microsoft MVP Secrets & Community Super-powers: Power Hour Podcast #27 - Cat Schneider", "url": "https://www.youtube.com/watch?v=CRCMcZzzCVE", "published": "2025-08-05", "duration": "57m 11s", "ch": "Powercademy", "accent": "#7c3aed", "axis_label": "cert", "tags": [], "topics": ["accessibility", "community", "json parsing", "microsoft mvp", "networking", "power apps design", "power automate", "screen readers"], "summary": "Microsoft MVP Cat Schneider ('the JSON whisperer') shares her career journey from state government business user to consultant, advice on contributing to and networking within the Power Platform community as an introvert with ADHD, the right (and wrong) reasons to pursue MVP status, and closes on accessibility in Power Apps design (screen readers, avoiding emoji-as-information) via the UX/UI Allies user group she co-leads.", "relevance": "Mostly career and community storytelling; the closing accessibility segment (screen readers, emoji-as-information) is a genuinely applicable design checklist for any Power Apps or model-driven forms Giulio builds for BC/BI users."}, {"video_id": "S5x5qzsFpmo", "title": "Dynamics 365 Business Central - What, Why, How: Power Hour Podcast #26 - Andrew Wingate", "url": "https://www.youtube.com/watch?v=S5x5qzsFpmo", "published": "2025-07-29", "duration": "57m 34s", "ch": "Powercademy", "accent": "#7c3aed", "axis_label": "cert", "tags": [], "topics": ["ai agents", "alm", "appsource", "business central", "copilot", "dataverse integration", "erp", "isv"], "summary": "Business Central expert Andrew Wingate
