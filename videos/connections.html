 "vertipaq analyzer", "vpax file"], "summary": "Quick intro to VertiPaq Analyzer inside DAX Studio: enabling the Export Metrics feature, connecting to a live model, viewing table/column sizes via View Metrics, and exporting a small .vpax file that captures schema and statistics (no row data) for offline analysis or sharing.", "relevance": "This is the entry point for every model-size and compression investigation Giulio will need for DP-600 S2 optimize work on his BC semantic models — instead of guessing why a .pbix is large, he can open DAX Studio, view the matrix, and see per-table/per-column memory cost directly."}, {"video_id": "C5HBhlLUFsE", "title": "Analyzing a slow report query in DAX Studio", "url": "https://www.youtube.com/watch?v=C5HBhlLUFsE", "published": "2020-07-16", "duration": "10m 33s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S2", "P3"], "topics": ["clear cache", "dax studio", "filter columns not tables", "formula engine", "performance analyzer", "query optimization", "server timings", "storage engine"], "summary": "Demonstrates the standard workflow for diagnosing a slow report visual: capture the DAX query with Performance Analyzer, replay it in DAX Studio with a cleared cache to get a worst-case timing, then read Server Timings (formula engine vs storage engine split, SE query count) to find that the measure violates the 'filter columns, not tables' rule.", "relevance": "This is the exact triage workflow needed for DP-600 S2 (optimize) work: whenever a BC-sourced Power BI visual feels sluggish, capture its query with Performance Analyzer, clear cache in DAX Studio, and read the formula-engine/storage-engine split before touching the measure code."}, {"video_id": "a4zYT-N-zsU", "title": "Creating calculation groups in Power BI Desktop using Tabular Editor", "url": "https://www.youtube.com/watch?v=a4zYT-N-zsU", "published": "2020-07-15", "duration": "15m 28s", "ch": "SQLBI", "accent": "#4f46e5", "axis_label": "DP-600", "tags": ["S1", "M2"], "topics": ["calculation groups", "dax", "external tools", "format string", "selectedmeasure", "tabular editor", "time intelligence"], "summary": "Demonstrates building a Time Intelligence calculation group in Tabular Editor connected to Power BI Desktop, creating calculation items (PY, YOY, YOY%, Current) with SELECTEDMEASURE, controlling their display order via the Ordinal property, and overriding the format string per calculation item.", "relevance": "Calculation groups are core DP-600 S1 material (reusable DAX transformations) and directly replace the \"one time-intelligence measure per base measure\" pattern common in BC-sourced semantic models — one calc group applies PY/YOY to Sales, Cost, and Margin measures over BC data without duplicating DAX."}, {"video_id": "jzIxYmlboMA", "title": "New Copilot in Outlook: Run Your Whole Inbox (2026)", "url": "https://www.youtube.com/watch?v=jzIxYmlboMA", "published": "2026-08-20", "duration": "13m 55s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["agentic actions", "allow actions", "automation", "calendar management", "copilot in outlook", "email rules", "inbox prioritization"], "summary": "Tours the current Copilot-in-Outlook experience: inbox-wide chat and summarization, attachment summarization, help-me-reply drafting, the new (Frontier) 'allow actions' capability for creating rules, subfolders, and categorization, schedule-with-Copilot for meeting creation from email threads, proactive calendar instructions (auto-decline/auto-accept), and inbox prioritization and custom draft-style settings.", "relevance": "A day-to-day productivity feature set rather than a Power Platform/agent-building one; still useful for Giulio to reclaim time from BC/BI stakeholder email and meeting overhead and as an easy adoption win to showcase to the Innovation team."}, {"video_id": "vf2Myhycf-c", "title": "Copilot in Excel Can Do That?!?!", "url": "https://www.youtube.com/watch?v=vf2Myhycf-c", "published": "2026-07-24", "duration": "14m 34s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["automation", "custom instructions", "excel", "finance", "governance", "personalization", "skills", "workbook rules"], "summary": "Covers new Excel Copilot personalization (custom instructions applied in allow-editing mode), shared worksheet 'rules' (a .rules sheet enforcing formatting/formula/naming conventions for everyone editing a shared workbook), and Skills — pre-built finance skills like due-diligence meeting prep plus building custom skills from workbook analysis (e.g., a cross-model cost-comparison skill).", "relevance": "High relevance for Giulio's BI/Excel-adjacent work — the workbook-rules concept for enforcing shared formatting/naming conventions across collaborators, and custom Skills for repeatable analysis, map well to standardizing BC financial analysis workflows his BI team could reuse."}, {"video_id": "edTZ8k1NuOw", "title": "Master Copilot Cowork: The Complete End-to-End Workshop", "url": "https://www.youtube.com/watch?v=edTZ8k1NuOw", "published": "2026-07-20", "duration": "17m 27s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-900", "AB-620"], "topics": ["agent 365", "automation", "browsing", "copilot cowork", "cost management", "plugins", "prompt planning", "skills"], "summary": "An end-to-end Cowork workshop covering when to use Cowork versus regular Copilot chat, cost-conscious planning (using Prompt Coach to build a step-by-step plan before spending credits), the task/schedule/customize UI, running a multi-skill financial-research plugin with per-skill Word outputs, tracking spend with /cost, fixing poorly formatted skill outputs in-app rather than re-running Cowork, and an early-preview browser-control capability.", "relevance": "The cost-governance discipline (plan first, use /cost, prefer in-app edits over re-running automations) is directly relevant to piloting Cowork for BC/BI reporting on a licensing budget, and building a cost-benefit case ('$X automated a process saving $Y') is exactly the kind of evidence the Innovation team needs to justify AI-adoption spend to leadership."}, {"video_id": "4tYpYG9w-Tc", "title": "Agent 365 Walkthrough", "url": "https://www.youtube.com/watch?v=4tYpYG9w-Tc", "published": "2026-05-22", "duration": "11m 58s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-900", "AB-620", "AB-100"], "topics": ["admin", "agent 365", "agent registry", "agent templates", "ai teammates", "governance", "mcp", "shadow ai"], "summary": "Detailed tour of the Agent 365 governance platform: the agent registry and interactive agent map, agent-request approvals, Shadow AI detection, the MCP tools/registry-sync area (approving third-party providers like Bedrock, Vertex AI, Salesforce, Databricks), and tenant-level settings — ownerless-agent reassignment, allowed agent types, sharing controls, agent templates with AI-teammate identities, and user access.", "relevance": "Core AB-620/AB-900 material and directly relevant to Giulio's Innovation-team remit of governing AI/agent adoption — understanding the agent registry, MCP server approval flow, and Shadow AI detection shapes how his organization could safely roll out Copilot Studio agents."}, {"video_id": "NguK7PNG42k", "title": "Full Microsoft 365 Copilot Chat Training for Enterprise Users", "url": "https://www.youtube.com/watch?v=NguK7PNG42k", "published": "2026-05-20", "duration": "18m 04s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["copilot chat", "copilot memory", "copilot pages", "custom instructions", "data visualization", "prompt coach", "unlicensed users", "vision"], "summary": "A broad walkthrough of the unlicensed Microsoft 365 Copilot chat experience: navigation, Copilot memory (custom instructions and saved memories), the prompt gallery, iterative prompt refinement with Prompt Coach, the reasoning/'think deeper' model, Copilot pages, image generation and editing, vision-based image analysis with dual explanation styles, chart/data visualization, file grounding, and the newly Copilot-enabled Outlook chat experience.", "relevance": "Useful baseline for understanding exactly what unlicensed colleagues can and cannot do, which matters when driving org-wide AI adoption across a mixed-license Business Central/BI team and setting realistic expectations for what needs a premium Copilot license versus what's free today."}, {"video_id": "4t66bIyOu-w", "title": "I Tested Two Prompting Styles in Microsoft 365 Copilot… The Results Surprised Me", "url": "https://www.youtube.com/watch?v=4t66bIyOu-w", "published": "2026-05-19", "duration": "9m 47s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["cowork", "natural language", "prompt coach", "prompt engineering", "prompting", "skills"], "summary": "An experiment comparing natural, conversational voice prompting versus a highly structured prompt (refined via the Prompt Coach agent) to build the same Cowork skill — a customer-workshop content generator producing a facilitator's guide and customer-facing PDF — finding both approaches land at similar time and quality.", "relevance": "A practical lesson for Giulio on how much prompt-engineering rigor is actually needed when building Cowork skills or Copilot Studio agents for Innovation-team workflows; suggests iterative natural-language prompting is often sufficient, with Prompt Coach as an optional structuring aid."}, {"video_id": "PTXcq0ulnAs", "title": "Copilot Cowork: Building Skills and Plugins", "url": "https://www.youtube.com/watch?v=PTXcq0ulnAs", "published": "2026-05-12", "duration": "13m 35s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-900", "AB-620"], "topics": ["admin", "agent 365", "automation", "copilot cowork", "governance", "mcp", "plugins", "skills"], "summary": "Shows building a personal Cowork 'skill' (a weekly status email automation) with the skill-management skill, iterating on it with HTML branding and executive tone, then covers the new enterprise plugin capability - packaging multiple skills plus an MCP server data connector (SEC Edgar) into a plugin, publishing it via Agent 365 with security-policy and permission review, and using it end to end.", "relevance": "The plugin structure (bundled skills + an MCP connector) is conceptually close to what he'd build to connect a Foundry or Copilot Studio agent to BC data, and the Agent 365 publish flow with policy/permission review is a concrete governance model relevant to how the Innovation team would roll out custom AI tools org-wide."}, {"video_id": "IuIVuS3vKm0", "title": "Copilot in PowerPoint Has Changed: The New Create and Edit Experience Explained", "url": "https://www.youtube.com/watch?v=IuIVuS3vKm0", "published": "2026-04-29", "duration": "19m 44s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["agent", "allow editing", "brand templates", "citations", "image generation", "powerpoint", "presentations"], "summary": "Tours the current PowerPoint Copilot experience: three creation paths (PowerPoint agent, Create module, in-app), the new 'allow editing' chat mode for direct slide edits, applying an organization's brand template library, fixing text/table overflow, AI image generation and background removal, design suggestions, speaker notes, and translation.", "relevance": "Relevant for Giulio's Innovation-team communication work — building branded, source-grounded presentations (BC/BI adoption decks, executive QBRs) grounded in enterprise docs — though less core to his hands-on Power Platform/BI build work than the Excel or agent-focused videos in this batch."}, {"video_id": "8zIAaGsq1xI", "title": "5 Copilot Prompts That Save Me 10 Hours a Week (+ 1 That Runs on Autopilot)", "url": "https://www.youtube.com/watch?v=8zIAaGsq1xI", "published": "2026-04-20", "duration": "14m 52s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["automation", "copilot cowork", "copilot prompts", "inbox triage", "scheduling", "teams", "weekly status report"], "summary": "Shares five copy-paste Copilot chat prompts (welcome-back briefing, inbox triage into four action buckets, weekly status report, document Q&A with page citations and confidence ratings, and a citation-safe customer follow-up email) plus a bonus: a scheduled Copilot Cowork task that runs a multi-skill morning briefing automatically and delivers it to Teams.", "relevance": "The weekly status report and inbox triage prompts are directly reusable for Giulio's own reporting cadence to leadership, and the scheduled Cowork briefing pattern is a concrete, low-effort automation he could pilot to demonstrate AI-adoption value to the Innovation team."}, {"video_id": "XZ_-XoTIpRc", "title": "Microsoft Planner + Cowork: Automated Weekly Briefings That Send Themselves", "url": "https://www.youtube.com/watch?v=XZ_-XoTIpRc", "published": "2026-04-10", "duration": "12m 03s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730", "AB-100"], "topics": ["ai agents", "automation", "cowork", "graph api", "planner", "scheduled prompts", "weekly briefing"], "summary": "Shows how to use Cowork with Graph API calls to pull Microsoft Planner task data (including comments pulled from notification emails) and auto-generate a branded weekly briefing email — executive summary, updated tasks, overdue items, upcoming milestones — then schedule the prompt to run automatically every week via Cowork's scheduled-prompt feature.", "relevance": "Directly applicable pattern for Giulio's Innovation-team project tracking — an automated weekly status briefing pulling from Planner or a Power Platform/Dataverse-tracked initiative list could save reporting time and demonstrate agentic automation value to stakeholders."}, {"video_id": "doP5pPiukOo", "title": "Microsoft 365 Copilot Prompt Coach: The Complete Guide", "url": "https://www.youtube.com/watch?v=doP5pPiukOo", "published": "2026-04-08", "duration": "10m 29s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["agent builder", "agent templates", "prompt coach", "prompt engineering", "structured prompting"], "summary": "Demonstrates the built-in Prompt Coach agent: using its guided goal/context/source Q&A flow to build a structured prompt from scratch, feeding it an existing prompt for critique and improvement, and finally using Prompt Coach as an agent-builder template to create a custom, personalized prompting agent.", "relevance": "A foundational prompting-technique video that improves the quality of every other AI workflow Giulio runs (BI reporting prompts, Copilot Studio agent instructions, Cowork automations); also shows how to spin up a reusable custom prompting agent, useful for standardizing prompt quality across the Innovation team."}, {"video_id": "LXVbdZKWenA", "title": "NEW! Microsoft 365 Copilot Researcher: Critique & Council Explained (With Real Prompts)", "url": "https://www.youtube.com/watch?v=LXVbdZKWenA", "published": "2026-03-31", "duration": "13m 11s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["claude", "competitive intelligence", "council mode", "critique mode", "frontier program", "gpt", "multi-model", "researcher agent"], "summary": "Introduces two new Researcher agent modes: Critique (GPT drafts the report, Claude fact-checks and refines it) and Council (GPT and Claude research in parallel, with a third model judging agreement/disagreement), demoed against competitive-intelligence, regulatory/compliance, and technology-evaluation research prompts.", "relevance": "Useful for Giulio's Innovation-team research work — evaluating AI/Power Platform vendors, BC ecosystem competitors, or AI compliance requirements — where multi-model cross-checking reduces single-model bias before a strategic recommendation."}, {"video_id": "Tm7q0uiVDmw", "title": "Edit With Copilot In Word | Microsoft 365 Copilot Changes Everything", "url": "https://www.youtube.com/watch?v=Tm7q0uiVDmw", "published": "2026-03-30", "duration": "12m 58s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["accessibility formatting", "agent mode", "copilot in word", "document editing", "edit with copilot", "web grounding"], "summary": "Covers Word's newest Copilot capabilities: document summaries and snapshots, in-line pinpoint rewriting, and the new 'edit with Copilot' (formerly agent mode) chat pane that can traverse an entire document to tighten language, reformat for accessibility, and insert new sections pulled from live web data - all reviewable via change tracking.", "relevance": "A document-editing productivity skill more than a Power Platform/AI-architecture one; useful for Giulio when producing polished proposals, business cases, or governance documents for the Innovation team, but has limited direct BC/BI or agent-building application."}, {"video_id": "GbA8X8anu5Y", "title": "The Future of Excel Workflows: Agent Mode + Microsoft 365 Copilot Chat", "url": "https://www.youtube.com/watch?v=GbA8X8anu5Y", "published": "2026-02-27", "duration": "18m 48s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730", "AI-102"], "topics": ["agent mode", "claude opus", "data cleaning", "excel", "financial planning", "forecasting", "gpt-5", "variance analysis"], "summary": "Demonstrates the merged Copilot Chat + Agent Mode experience in Excel: using chat to audit data quality (duplicates, inconsistent dimensions, blanks) via Python reasoning, then agent mode to directly clean data, build actual-vs-forecast variance worksheets with driver analysis, generate charts, and pull public web data (US , "study guide"], "summary": "Walkthrough of the redesigned Copilot Notebooks: a unified home screen with recommended/shared notebooks, sharing notebooks with colleagues, the researcher agent built directly into notebook chat, an auto-generated summary/overview page that refreshes as source documents change, and creating pages, audio overviews, and study guides from grounded content.", "relevance": "Notebooks could become Giulio's go-to way to organize and share grounded knowledge (BC documentation, BI definitions, Innovation-team research) with colleagues, with the built-in researcher agent adding deep research on top of internal docs."}, {"video_id": "ICCOaYckWTk", "title": "Level Up Your Performance Reviews with Copilot Notebooks and the Researcher Agent", "url": "https://www.youtube.com/watch?v=ICCOaYckWTk", "published": "2026-01-23", "duration": "13m 01s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-730"], "topics": ["agent mode", "copilot notebooks", "grounding data", "infographics", "prompting", "researcher agent", "word"], "summary": "Walks through building a Copilot notebook grounded on personal role docs, usage data, and a logged accomplishments file, then running the researcher agent with a fillable prompt to draft a performance review (including a short/long output toggle and an auto-generated infographic), and finally using Word's agent mode to reformat the resulting document into structured bullets.", "relevance": "Demonstrates a repeatable pattern - grounding a Copilot notebook on curated source files rather than open enterprise search - that Giulio could reuse for his own BC/BI work reporting and for coaching Innovation-team colleagues on getting sharper AI output by feeding it specific evidence instead of relying on broad retrieval."}, {"video_id": "NwJyrSbOzLw", "title": "Inside Microsoft 365 Copilot Controls: What Your Admin Can See and Set", "url": "https://www.youtube.com/watch?v=NwJyrSbOzLw", "published": "2026-01-20", "duration": "19m 09s", "ch": "M365 Copilot", "accent": "#db2777", "axis_label": "cert", "tags": ["AB-900", "AB-620"], "topics": ["admin center", "adoption", "agent 365", "ai agents", "governance", "licensing", "mcp", "purview"], "summary": "Tour of the Microsoft 365 Copilot admin control system: usage/licensing reports, security and health dashboards, connectors, search bookmarks, pay-as-you-go billing, and the four-part settings menu (individual access, data access, actions, other), plus a walkthrough of the new Agent 365 governance area (agent registry, agent map, MCP tools, agent templates, security/compliance).", "relevance": "As part of the Innovation team driving AI adoption, this maps directly to what Giulio needs to configure or at least understand when proposing a Copilot/agent rollout for the BC consultancy — usage reporting, sensitivity-label impacts on Copilot grounding, and Agent 365 governance for any Copilot Studio agents his team builds."}, {"video_id": "yyui7FV9NmY", "title": "DAX UDFs, Query REST API & Outbound Access Protection | Fabric Insider Ep. 13 | Kay Unkroth", "url": "https://www.youtube.com/watch?v=yyui7FV9NmY", "published": "2026-07-31", "duration": "28m 43s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2", "M1", "M2"], "topics": ["arrow format", "custom calendar", "dax udf", "governance", "outbound access protection", "rest api", "semantic model settings", "time intelligence", "user defined functions", "xmla"], "summary": "Interview with Microsoft PM Kay Unkroth covering several recent semantic-model features: DAX User-Defined Functions (UDFs) going GA with optional parameters (reusable, readable, IntelliSense-documented custom DAX functions, reusable across models via TMDL/Git), the new 'execute queries v2' Arrow-based REST API for running DAX queries at scale from notebooks/Python without the JSON API's row/value limits, Outbound Access Protection (a workspace-level network security feature restricting which data sources a semantic model/report can connect to, to prevent unauthorized data blending or data exfiltration), and upcoming changes to the semantic model settings pane and custom calendar/time-intelligence UX.", "relevance": "DAX UDFs are a new S1 DAX authoring capability directly useful for packaging reusable BC calculation logic (e.g. a standard fiscal-period or currency-conversion function) across multiple semantic models; the Arrow REST API supports S2/M2 automation and monitoring workflows (e.g. exporting large result sets or running INFO functions from a notebook); Outbound Access Protection is an M1 governance/security feature for locking down which data sources a workspace's models can reach."}, {"video_id": "d0BGZymdTxY", "title": "OneLake Security RLS: Define Security Once, Enforce It Everywhere — Microsoft Fabric", "url": "https://www.youtube.com/watch?v=d0BGZymdTxY", "published": "2026-07-28", "duration": "19m 28s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1", "S1"], "topics": ["direct lake", "governance", "onelake security", "row-level security", "security groups", "sql analytics endpoint", "user identity access mode"], "summary": "Demonstrates OneLake security: defining row-level security once at the data layer (via the SQL analytics endpoint's Manage Row-Level Security, using SQL WHERE-clause-style role definitions) so it's automatically enforced everywhere downstream — Lakehouse, SQL analytics endpoint, Direct Lake semantic model, and Power BI report — without configuring RLS separately in the semantic model. Requires Direct Lake on OneLake storage mode and User Identity access mode, and best practice is assigning security groups (not individuals) to roles.", "relevance": "Directly maps to DP-600 M1 (security & governance, RLS) and S1 (Direct Lake design) — a newer, more governed alternative to defining RLS per-semantic-model, relevant if Giulio's BC data lands in a Fabric Lakehouse/Warehouse and multiple downstream artifacts (reports, SQL queries) need consistent row-level security by region/company."}, {"video_id": "2OlsibKp7vo", "title": "Power BI File Formats Explained: PBIX vs PBIT vs PBIP vs PBIR", "url": "https://www.youtube.com/watch?v=2OlsibKp7vo", "published": "2026-05-14", "duration": "21m 10s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M2"], "topics": ["automation", "file formats", "pbip", "pbir", "pbit", "pbix", "source control", "tmdl"], "summary": "Compares Power BI's four file formats - the single-file PBIX, the data-less PBIT template, and the newer project-based PBIP/PBIR/TMDL split (separate report and semantic-model folders as text files) - and demonstrates editing a PBIR file's connection string directly in a text editor to repoint a report to a different semantic model without opening Power BI Desktop.", "relevance": "PBIP/PBIR/TMDL is explicit DP-600 M2 content (reusable assets, .pbip, source control, automation); this is the file format Giulio should adopt for BC reports to get real Git diffs and scriptable bulk changes across multiple report files."}, {"video_id": "RO4qgH59bxE", "title": "Different Versions of Dataflow in Power BI and Fabric", "url": "https://www.youtube.com/watch?v=RO4qgH59bxE", "published": "2026-04-08", "duration": "30m 13s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M2", "P1", "P2"], "topics": ["ci/cd", "dataflow gen1", "dataflow gen2", "fabric", "git integration", "licensing", "migration", "onelake", "parameters", "power query"], "summary": "Reza Rad compares Dataflow Gen1, Gen2, and Gen2 CI/CD end to end: licensing requirements (Pro/PPU for Gen1 vs Fabric/Premium capacity for Gen2), destination options (Gen1 locked to internal ADLS Gen2 CSV vs Gen2's choice of lakehouse/warehouse/KQL database/Azure SQL/SharePoint), CI/CD-only features (parameters passed from a pipeline, git integration, performance tuning), and how to migrate an existing Gen1/Gen2 dataflow via Save As or export/import a Power Query template (.pqt).", "relevance": "This is squarely DP-600's dev-lifecycle objective (M2): choosing Gen2 CI/CD for git-connected, parameterized, pipeline-driven ETL is the recommended pattern for a governed BC reporting solution, and knowing the Gen1-vs-Gen2 destination and licensing differences matters when deciding where a BC-sourced dataflow should write its output (lakehouse vs plain CSV)."}, {"video_id": "kX2bDuMbMek", "title": "Time Travel in Microsoft Fabric - Get the previous version of data", "url": "https://www.youtube.com/watch?v=kX2bDuMbMek", "published": "2025-12-15", "duration": "15m 08s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["delta", "describe history", "fabric notebook", "lakehouse", "restore table", "spark sql", "time travel", "version control"], "summary": "Reza uses a Fabric notebook (PySpark and Spark SQL) against a Delta table in a Lakehouse to run DESCRIBE HISTORY, query a prior version with TIMESTAMP AS OF / VERSION AS OF, save that prior version as a separate comparison table, and RESTORE TABLE back to an earlier version — noting Delta's time travel window is limited to 30 days.", "relevance": "Relevant to DP-600 P1/M2 (Lakehouse data management, troubleshooting/versioning) rather than the semantic-model layer directly: if a BC-fed Lakehouse table gets corrupted by a bad refresh or transformation, Giulio can use DESCRIBE HISTORY plus TIMESTAMP/VERSION AS OF to inspect or restore prior data, and build a before/after comparison report in Power BI."}, {"video_id": "nYqdyeOudqw", "title": "Shortcut to OneDrive or SharePoint from Microsoft Fabric", "url": "https://www.youtube.com/watch?v=nYqdyeOudqw", "published": "2025-12-08", "duration": "9m 27s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1"], "topics": ["data ingestion", "delta", "fabric", "lakehouse", "onedrive", "onelake", "sharepoint", "shortcuts"], "summary": "Reza Rad demonstrates the (preview) OneLake shortcut to OneDrive/SharePoint: creating an unmanaged shortcut from a Lakehouse's Files section to a OneDrive/SharePoint folder without copying data, browsing and previewing the linked files (CSV, images, etc.) as if native to the Lakehouse, optional light shortcut transformation for simple structured files, and loading a shortcut CSV into a Delta table, plus accessing the shortcut path from a notebook.", "relevance": "OneLake shortcuts (managed and unmanaged) are DP-600 P1 'get data / choose stores without copying' material; useful if any BC-adjacent reference files (price lists, manual adjustment spreadsheets) live in SharePoint/OneDrive and need to feed a Fabric-based semantic model without a separate ingestion pipeline."}, {"video_id": "7rWmKwlpNYM", "title": "Find the Most Expensive Column in Power BI using DAX", "url": "https://www.youtube.com/watch?v=7rWmKwlpNYM", "published": "2025-11-24", "duration": "10m 50s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2"], "topics": ["auto date/time", "date table", "dax info functions", "dax query view", "model size", "performance tuning", "storage table columns", "vertipaq"], "summary": "Reza Rad uses DAX INFO functions (INFO.STORAGETABLECOLUMNS, INFO.TABLES) directly in the DAX query view to find which columns consume the most memory in a semantic model, no third-party tool required. He diagnoses a 25GB model down to a hidden auto-generated date table (from Power BI's default 'Auto date/time' feature) spanning from 1990 to a far-future placeholder date with 2 million+ rows, then fixes it by disabling Auto date/time.", "relevance": "This is a hands-on DP-600 S2 optimization technique — using INFO functions in DAX query view to profile column-level VertiPaq storage cost is exactly the kind of diagnostic skill tested for semantic-model optimization, and the specific 'Auto date/time' pitfall is common in BC-connected models with many date columns that silently balloon model size."}, {"video_id": "q1G5ur-aMG0", "title": "Fiscal Calendar YTD DAX Calculation in Power BI", "url": "https://www.youtube.com/watch?v=q1G5ur-aMG0", "published": "2025-10-31", "duration": "17m 22s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["auto date time", "calculate", "calendar options", "date table", "dates ytd", "dax", "fiscal calendar", "time intelligence"], "summary": "Reza demonstrates Power BI's newer Calendar Options feature (preview, Desktop-only) for defining named calendars (e.g. 'fiscal', 'standard') mapped to custom year/quarter/month columns without marking a table as a date table, then writes CALCULATE(SUM(...), DATESYTD('Date'[Date], \"fiscal\")) style measures that respect a fiscal year starting in July or August without changing DAX when the fiscal start month changes.", "relevance": "Business Central companies frequently run non-calendar fiscal years, and DATESYTD/time-intelligence over a proper fiscal calendar is a core S1 DAX skill; this newer Calendar Options approach is a cleaner alternative to manual fiscal-column time-intelligence patterns for BC-sourced date tables."}, {"video_id": "BSws9dAsyM4", "title": "Create a Snapshot of Power BI Data using Microsoft Fabric Dataflow and Pipeline", "url": "https://www.youtube.com/watch?v=BSws9dAsyM4", "published": "2025-10-16", "duration": "20m 58s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2", "M2"], "topics": ["dataflow gen2", "formatdatetime", "orchestration", "parameters", "pipeline", "sharepoint destination", "snapshots", "xmla endpoint"], "summary": "Reza Rad builds an end-to-end snapshot solution: a Dataflow Gen2 connects to an existing Power BI semantic model via the XMLA endpoint/Analysis Services connector, selects columns/measures into a table, and exports it to SharePoint as a timestamped CSV using a dataflow parameter; a Pipeline then triggers the dataflow and dynamically generates that timestamp filename via formatDateTime expressions, enabling daily/weekly/monthly point-in-time snapshots that a standard Power BI import model can't natively produce.", "relevance": "Directly solves the recurring BC/Power BI need to snapshot semantic model values (e.g. month-end sales or inventory as reported at that moment) for later comparison - combines P1 (XMLA endpoint connection to a semantic model as a data source), P2 (dataflow transformation/export), and M2 (pipeline orchestration and parameterization) into a reusable pattern."}, {"video_id": "A43QqYCrOOM", "title": "Power BI Performance Tip - No Direct Query", "url": "https://www.youtube.com/watch?v=A43QqYCrOOM", "published": "2025-10-02", "duration": "19m 51s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["composite model", "direct lake", "directquery", "import mode", "incremental refresh", "performance analyzer", "row level security", "vertipaq"], "summary": "Reza runs a live side-by-side Performance Analyzer comparison of DirectQuery vs Import on the same 400K-row table, showing Import is roughly 3-5x+ faster, then systematically debunks common reasons people choose DirectQuery (avoiding data duplication, table-size limits, refresh-time concerns, security/RLS limitations), arguing performance should drive the decision and recommending Import (or Direct Lake, or composite with aggregations) over DirectQuery in nearly all cases.", "relevance": "This is a direct, practical DP-600 S2 performance-tuning argument relevant to any BC Power BI model still on DirectQuery against Business Central's SQL/API layer: it gives concrete evidence and counter-arguments (incremental refresh, RLS still works, composite models with aggregations for huge tables, Direct Lake as a Fabric-native alternative) for migrating to Import."}, {"video_id": "OAoWet1NmeM", "title": "Power BI Performance Tip — Query Folding in Power Query", "url": "https://www.youtube.com/watch?v=OAoWet1NmeM", "published": "2025-09-30", "duration": "19m 40s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S2"], "topics": ["incremental refresh", "m", "native query", "performance tuning", "power query", "query folding", "sql profiler"], "summary": "Explains query folding: how Power Query translates M transformations (remove column, filter, group by, add column) into native query language (SQL) sent to a query-capable data source, versus non-foldable sources like Excel/CSV that always load everything. Demonstrates checking fold status via View Native Query, SQL Profiler/Extended Events tracing, and the online dataflow editor's green-bar fold indicator, and shows a transformation (list-index access) that breaks folding, forcing the rest of the load into Power Query memory.", "relevance": "Critical DP-600 P2/S2 performance skill — query folding directly determines whether BC data pulled via SQL/OData is filtered at the source or dragged in full before transformation, which matters a lot for refresh performance and for enabling incremental refresh on BC datasets."}, {"video_id": "koV0EunuPbQ", "title": "Power BI Live Connection Demystified", "url": "https://www.youtube.com/watch?v=koV0EunuPbQ", "published": "2025-09-25", "duration": "29m 56s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "M2"], "topics": ["directquery", "enterprise architecture", "live connection", "report level measure", "semantic model", "shared dataset", "thin report"], "summary": "Clarifies that Live Connection (report-to-semantic-model, limited to SSAS/AAS/Power BI semantic models) is fundamentally different from DirectQuery (semantic-model-to-source), explains thin reports, shared/reusable semantic models with centrally-maintained measures, and report-level measures created in a thin report that other reports can't see.", "relevance": "The report vs semantic-model separation and live-connection reuse pattern is central to DP-600 S1/M2 enterprise design; Giulio could publish one shared BC semantic model and have multiple thin reports (sales, finance) live-connect to it instead of duplicating the model."}, {"video_id": "LqJk3GUe5W8", "title": "Use Power BI Field Parameter to Enhance Your Report with No Code", "url": "https://www.youtube.com/watch?v=LqJk3GUe5W8", "published": "2025-09-05", "duration": "13m 10s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["dax", "dynamic report", "field parameters", "power bi desktop", "slicer", "table constructor", "what-if parameters"], "summary": "Reza Rad demonstrates field parameters (a type of what-if/DAX parameter), showing how to create one from a group of fields (e.g. customer attributes) or a group of measures, auto-generating a small DAX table via a curly-brace table constructor plus an auto-added slicer, so end users can swap the axis field or the displayed measures in a visual at report-consumption time with zero DAX.", "relevance": "Field parameters are explicitly called out in the DP-600 S1 taxonomy - this is a practical no-code way to let BC report users toggle between dimensions (e.g. slice sales by customer group vs. salesperson vs. item category) or swap which measures show in a table (e.g. sales vs. margin vs. YTD) without building separate report pages."}, {"video_id": "DKM8oov5YqE", "title": "Merge tables based on Dates Between in Power Query and Power BI", "url": "https://www.youtube.com/watch?v=DKM8oov5YqE", "published": "2025-08-20", "duration": "14m 53s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "P1"], "topics": ["dates between", "duration", "list.dates", "m language", "merge queries", "power query", "range join", "slowly changing dimension"], "summary": "Reza Rad shows how to merge two Power Query tables on a date falling between a from/to range (not supported by the default equi-join merge): compute a Duration between from/to dates, use List.Dates to expand each customer record into one row per day in its valid range, expand to new rows, then merge that expanded table with the fact table on customer ID + date using a normal equi-join.", "relevance": "BC has several from/to-date-ranged dimensions (e.g. dimension value validity periods, price list validity dates, currency exchange rate periods) that need exactly this date-between join technique in Power Query to attach the correct attribute to each transaction row when building a DP-600-style star schema."}, {"video_id": "KEvTErF10_8", "title": "Power BI Model Analysis using DAX INFO Functions", "url": "https://www.youtube.com/watch?v=KEvTErF10_8", "published": "2025-06-11", "duration": "12m 20s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["dax info functions", "dax query view", "dmv", "model metadata", "model optimization", "relationships", "storage table columns", "vertipaq"], "summary": "Reza demonstrates the INFO.* family of tabular DAX functions (about 68 of them, run via EVALUATE in DAX Query View) for pulling model metadata: INFO.CALCDEPENDENCY for calculation dependencies, the friendlier INFO.VIEW.TABLES/COLUMNS/MEASURES/RELATIONSHIPS views, and INFO.STORAGETABLECOLUMNS for per-column dictionary size in MB (sorted to find the biggest space consumers), noting these can be combined with FILTER/SELECTCOLUMNS and are a simplified alternative to classic DMVs.", "relevance": "Squarely DP-600 S2 (semantic model optimization/VertiPaq): this is a fast, no-extra-tool way to audit a BC-fed semantic model's structure and find which columns are bloating dictionary size, useful before deciding what to remove, disable auto date/time on, or restructure in a large BC-sourced model."}, {"video_id": "FQag67J6uqw", "title": "Medallion Architecture in Microsoft Fabric Why What and How", "url": "https://www.youtube.com/watch?v=FQag67J6uqw", "published": "2025-06-10", "duration": "17m 31s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2", "S1", "M1"], "topics": ["bronze silver gold", "data architecture", "endorsement", "lakehouse", "medallion architecture", "semantic model", "star schema", "warehouse"], "summary": "Reza Rad explains the bronze/silver/gold medallion architecture conceptually — why it exists (data quality is a spectrum, not binary, and self-service users can't wait months for fully cleansed data), what each layer represents (bronze = raw 1:1 copy, silver = cleansed/conformed, gold = curated star schema/semantic model), and how it maps to Fabric items, recommending Lakehouse for bronze, Warehouse for silver, and a Power BI semantic model for gold. Clears up misconceptions (medallion is technology-agnostic, not exclusive to or dependent on Fabric).", "relevance": "Medallion architecture and layer-to-item mapping is core DP-600 P1/P2/S1 architecture knowledge — it gives Giulio a concrete framework for structuring a BC-to-Power-BI pipeline: raw BC OData/API extracts as bronze, cleansed/conformed tables as silver, and the final star-schema semantic model as gold, with certification/endorsement marking the gold layer."}, {"video_id": "8HMQTPtDKKQ", "title": "Power BI Performance Tuning: Aggregations Multiple Layers (Part 5)", "url": "https://www.youtube.com/watch?v=8HMQTPtDKKQ", "published": "2025-02-21", "duration": "13m 31s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2"], "topics": ["aggregation awareness", "aggregations", "direct query", "dual storage mode", "performance tuning", "precedence", "sql profiler", "star schema"], "summary": "Continuing a performance-tuning series, Reza Rad shows how to stack multiple aggregation tables with different precedence levels so queries fall through layer by layer (smallest/most-specific aggregation tried first) before finally hitting the DirectQuery fact table, monitored live via SQL Profiler. He demonstrates two aggregation tables (one covering customer/date/product, a second adding promotion) and explains the precedence setting that controls try-order.", "relevance": "Directly targets DP-600 S2 (semantic model optimization) — multi-layer aggregations over a DirectQuery or large import fact table are a named performance technique for exam scenarios, and this pattern would meaningfully speed up any BC fact table (e.g. large ledger entries) queried via DirectQuery or Direct Lake."}, {"video_id": "T4aXxvB_Vug", "title": "Control the Execution Order and Output State in Fabric Data Pipeline", "url": "https://www.youtube.com/watch?v=T4aXxvB_Vug", "published": "2025-02-05", "duration": "15m 42s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["control flow", "data factory", "fabric data pipeline", "on failure", "on success", "orchestration", "output state", "semantic model refresh"], "summary": "Reza explains Fabric Data Factory pipeline orchestration: activities with no incoming arrow start in parallel, connected activities run sequentially, and the four output states (On Success, On Failure, On Completion, On Skip) control branching; he shows fan-in patterns where multiple parallel staging activities must all succeed before a downstream activity (e.g. populate fact/dimension tables, then refresh the semantic model) runs.", "relevance": "Covers P1/M2 pipeline orchestration skills for building the ingestion layer feeding a BC semantic model - e.g. staging multiple BC-related sources in parallel before populating fact/dimension tables and triggering a semantic model refresh, a pattern Giulio could reuse directly."}, {"video_id": "yV6xMj9BVAk", "title": "Power BI Append in Power Query — Things You Need to Know", "url": "https://www.youtube.com/watch?v=yV6xMj9BVAk", "published": "2025-01-20", "duration": "14m 31s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2"], "topics": ["append", "column matching", "data quality", "enable load", "power query", "remove duplicates", "union all"], "summary": "Reza Rad covers the practical gotchas of Append (Union All) in Power Query: mismatched columns create extra columns full of nulls, column names must match exactly including case, Append does not automatically remove duplicate rows, and unused source queries feeding an append should have 'Enable Load' turned off to avoid loading redundant tables into the model.", "relevance": "These are P2 data-preparation hygiene rules directly applicable whenever combining multi-period or multi-company BC exports with Append - mismatched casing/column sets silently produce null-filled columns and duplicate rows rather than errors, which is exactly the kind of subtle bug that corrupts BC-sourced reporting."}, {"video_id": "rXopUBnunb0", "title": "Power BI Performance Tuning Step 3: Aggregation Dual Storage Mode", "url": "https://www.youtube.com/watch?v=rXopUBnunb0", "published": "2025-01-01", "duration": "11m 44s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["aggregations", "composite model", "directquery", "dual storage mode", "import mode", "performance tuning", "star schema"], "summary": "Third video in Reza's aggregation series: explains Power BI's three table storage modes (Import, DirectQuery, Dual), and specifically when and why a dimension table connected to both an imported aggregation table and a DirectQuery fact table must be set to Dual storage mode so PBI automatically picks import or DirectQuery behavior depending on which fact table a visual hits, including how Dual propagates automatically along one-to-many relationship chains.", "relevance": "Dual storage mode is a specific DP-600 S1/S2 concept (composite models, storage mode) that's easy to get wrong; this shows exactly how to configure dimension tables correctly in a composite BC model that mixes an imported aggregation with a DirectQuery fact table for performance."}, {"video_id": "fw56vPYdVYc", "title": "Power BI Performance Tuning — Aggregation Part 1 — Overview", "url": "https://www.youtube.com/watch?v=fw56vPYdVYc", "published": "2024-11-02", "duration": "17m 40s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["aggregations", "composite model", "directquery", "performance tuning", "precedence", "query diagnostics", "vertipaq"], "summary": "Explains the concept of aggregation tables for performance: a small, pre-summarized imported table sits in front of a large DirectQuery/composite fact table, and Power BI automatically routes visuals to the aggregation when possible, falling back to the detail table only when needed. Demonstrates with SQL Profiler that visuals answered by an aggregation send zero queries to the source, shows multi-layer (precedence-ordered) aggregations, and notes aggregation tables can be built in DAX, Power Query, or as physical Lakehouse/Warehouse tables in Fabric.", "relevance": "Directly targets DP-600 S2 (semantic model optimization) — a heavily tested performance pattern for large fact tables, applicable if Giulio's BC ledger entry tables grow large enough that DirectQuery/composite models over BC data become slow."}, {"video_id": "GvBdzv69FUc", "title": "Combining Dimension Table in Power BI and Fabric Using Power Query", "url": "https://www.youtube.com/watch?v=GvBdzv69FUc", "published": "2024-10-09", "duration": "22m 40s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["data modeling", "denormalization", "dimension table", "join kind", "merge queries", "power query", "star schema"], "summary": "Demonstrates flattening a snowflaked product/subcategory/category structure into one denormalized dimension table using Power Query Merge (not Append), covering join-kind choice (left vs full outer) to avoid silently dropping rows, and disabling load on the intermediate staging tables to keep the model lean.", "relevance": "Star-schema denormalization via Merge is core DP-600 P2/S1 content; BC's normalized item/customer hierarchy tables (e.g., item category, customer group) are a near-identical real-world case for flattening into single dimension tables."}, {"video_id": "3PoSUNMDAD8", "title": "Power BI and Fabric Certification Exams", "url": "https://www.youtube.com/watch?v=3PoSUNMDAD8", "published": "2024-10-02", "duration": "16m 47s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2", "P1", "P2", "P3", "M1", "M2"], "topics": ["certification", "data analyst associate", "dp-600", "exam prep", "fabric analytics engineer", "microsoft fabric", "pl-300", "study guide"], "summary": "Reza Rad breaks down the three Microsoft Power BI/Fabric certification exams - PL-300 (Power BI Data Analyst Associate, focused purely on Power BI: prepare/model/visualize/manage), DP-600 (Fabric Analytics Engineer Associate, covering plan/prepare/serve/model/explore across the wider Fabric platform including data warehousing and light data engineering but excluding real-time intelligence and data science), and the then-beta DP-700 (data engineering, heavier on KQL/Eventhouse) - explaining what each exam measures and how to use the skills-measured document to study.", "relevance": "This is a direct meta-map of the DP-600 exam itself - it confirms the exam's four skill areas (plan/implement/manage a solution, prepare and serve data, implement and manage semantic models, explore and analyze data) and clarifies scope boundaries (no real-time intelligence, no data science) that should shape Giulio's DP-600 study plan and distinguish it from what he already knows via PL-300-level Power BI work on BC data."}, {"video_id": "ejY64shaa-Y", "title": "Power BI DAX What If Parameter to make calculations dynamic", "url": "https://www.youtube.com/watch?v=ejY64shaa-Y", "published": "2024-09-29", "duration": "12m 17s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["conditional formatting", "dax", "dynamic titles", "field parameters", "generateseries", "parallelperiod", "selectedvalue", "time intelligence", "what-if parameter"], "summary": "Reza Rad distinguishes Power Query parameters (developer/ETL-time) from What If parameters (user-facing, added via Modeling > New Parameter), builds a numeric-range What If parameter backed by a GENERATESERIES calculated table and a SELECTEDVALUE measure, and wires it into a PARALLELPERIOD time-intelligence measure plus a dynamic table title built by concatenating text with the parameter's measure.", "relevance": "DP-600's semantic-model objectives call out field parameters and dynamic calculations by name; the underlying pattern here (GENERATESERIES + SELECTEDVALUE driving a parameterized time-intelligence measure) is directly reusable for a BC report where users want to flex 'sales vs N months ago' without you building ten separate measures."}, {"video_id": "61fUUciDnks", "title": "Power BI Dynamic Row Level Security with Organizational Hierarchy", "url": "https://www.youtube.com/watch?v=61fUUciDnks", "published": "2024-09-24", "duration": "13m 33s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1", "S1"], "topics": ["dynamic security", "organizational hierarchy", "parent-child", "path function", "pathcontains", "pathitem", "rls", "row level security", "userprincipalname"], "summary": "Reza builds dynamic RLS where a manager sees their own data plus everyone beneath them in a self-referencing organizational hierarchy: a PATH() calculated column on the user table encodes the full manager chain, USERPRINCIPALNAME() plus LOOKUPVALUE() finds the logged-in user's ID, and a role rule uses PATHCONTAINS(path, that ID) to filter — with an optional PATHITEM()-based level breakdown for a slicer hierarchy visual.", "relevance": "This is DP-600 M1 (security/governance) core content and highly applicable if Giulio's BC-based reports need manager-sees-team-data security — BC often has a resource/employee hierarchy (approver chains, department managers) that maps directly onto this PATH/PATHCONTAINS pattern for row level security."}, {"video_id": "vnkqnPRs1uY", "title": "Migrate from Power BI dataflow gen1 to Fabric Dataflow gen2", "url": "https://www.youtube.com/watch?v=vnkqnPRs1uY", "published": "2024-09-11", "duration": "10m 19s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["data ingestion", "dataflow gen2", "fabric", "lakehouse", "m", "migration", "power query", "warehouse"], "summary": "Reza Rad shows the practical migration path from Power BI Dataflow Gen1 to Fabric Dataflow Gen2: export the Gen1 flow as a Power Query template (.pqt), import it when creating a new Gen2 dataflow in a Fabric-enabled workspace, re-enter connection credentials, and set a Gen2-only destination (Lakehouse, Warehouse, Azure SQL DB, or KQL database) per table before publishing.", "relevance": "DP-600 P1/M2 practical skill: knowing how to move existing Power Query/dataflow logic into Fabric with a proper destination (Lakehouse/Warehouse) is directly applicable if Giulio's BC-sourced Power Query transformations currently live in Gen1 dataflows and need to move into a Fabric-based medallion pipeline."}, {"video_id": "-MwysbrdVO0", "title": "Dynamic Row Level Security in Power BI with Many to Many — Best Practice", "url": "https://www.youtube.com/watch?v=-MwysbrdVO0", "published": "2024-09-10", "duration": "17m 16s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "M1"], "topics": ["best practice", "bidirectional relationship", "bridge table", "filter", "lookupvalue", "many to many", "row level security", "selectcolumns"], "summary": "Reza Rad tackles dynamic RLS when users and profiles have a many-to-many relationship (via a bridge table), where the naive fix is a bidirectional relationship — which he explicitly warns against for performance and ambiguity reasons. Instead he shows the best-practice DAX pattern: use LOOKUPVALUE + FILTER + SELECTCOLUMNS to derive the current user's allowed profile IDs and apply the role filter on the bridge-adjacent table, keeping all relationships single-directional.", "relevance": "This is an advanced DP-600 M1 + S1 crossover: many-to-many/bridge-table modeling (S1) combined with governance (M1) is exactly the kind of scenario the exam probes, and Giulio's BC models often have many-to-many patterns (e.g. salespeople across multiple territories/companies) where bidirectional relationships would otherwise be the tempting but wrong fix."}, {"video_id": "HvB5pEGkvOk", "title": "Power Query Basics of M Scripting in Power BI and Fabric", "url": "https://www.youtube.com/watch?v=HvB5pEGkvOk", "published": "2024-09-09", "duration": "19m 36s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "P3"], "topics": ["advanced editor", "dataflow gen2", "functions", "let in", "m language", "m scripting", "power query", "variables"], "summary": "Reza introduces the M language behind Power Query: the let/in block structure, variable definitions and data-type inference, case sensitivity, multi-variable steps, literals (text/number/date), naming variables with special characters using #\"...\", single- vs. multi-line comments, and calling functions (e.g. Date.Year), then reads through a full generated M script step by step.", "relevance": "M scripting fundamentals apply equally in Power BI Desktop, Dataflow Gen2 and Fabric pipelines (P2/P3); understanding the let/in structure and function syntax lets Giulio hand-edit or debug M steps generated against BC data sources rather than relying only on the UI."}, {"video_id": "wzydf4fHkbM", "title": "Duplicate VS Reference in Power Query in Power BI and Fabric Dataflows", "url": "https://www.youtube.com/watch?v=wzydf4fHkbM", "published": "2024-09-05", "duration": "13m 05s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S2"], "topics": ["aggregation", "append", "dataflow gen2", "duplicate query", "power query", "query dependency", "reference query"], "summary": "Reza Rad contrasts Power Query's Duplicate (creates a fully independent copy of a query with the same steps, useful for repeating the same transformation against a different but similarly-structured source, then appending results) against Reference (creates a dependent query whose source is the original query, so changes/filters on the original automatically propagate - ideal for building an aggregated table off a detail table), shown via the Query Dependency diagram.", "relevance": "Choosing Duplicate vs Reference correctly is a fundamental P2 transformation-design decision - Reference is the right pattern for building a pre-aggregated BC sales summary table that must always reflect filters/changes applied to the detail table, while Duplicate suits pulling structurally-identical BC exports (e.g. per company) that should append into one table."}, {"video_id": "QlgKYqh8C9I", "title": "Power BI Direct Lake Reframe: What is it in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=QlgKYqh8C9I", "published": "2024-08-30", "duration": "9m 16s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "P1"], "topics": ["delta", "direct lake", "microsoft fabric", "onelake", "parquet", "reframe", "semantic model refresh"], "summary": "Reza explains 'reframe' — the process labeled as 'Refresh' in a Direct Lake semantic model's settings that is not actually a data refresh (Direct Lake has no copy of the data) but rather PBI re-reading the Delta transaction log's JSON files to pick up the latest set of Parquet files after an ETL load. He also covers why you might disable automatic reframe (to avoid showing a half-loaded report mid-ETL) and how to trigger reframe manually/via pipeline instead.", "relevance": "Reframe vs refresh is a specific, exam-relevant DP-600 S2 nuance for Direct Lake models; understanding it matters for any BC-to-Fabric Direct Lake design where you need reports to reflect new data only after a full ETL load completes, not mid-load."}, {"video_id": "yow69cBN8mQ", "title": "Creating a Shared Dimension in Power BI Using Power Query — Basics and Foundations of Modeling", "url": "https://www.youtube.com/watch?v=yow69cBN8mQ", "published": "2024-08-29", "duration": "18m 18s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["append", "deduplication", "many-to-many", "modeling foundations", "power query", "relationships", "shared dimension", "star schema"], "summary": "Shows why many-to-many relationships between fact tables sharing a similar-but-not-identical dimension field (e.g. product) are a weak, unreliable modeling pattern, and demonstrates the fix: appending the distinct values from all fact tables' dimension columns into one unique, deduplicated 'shared dimension' table via Power Query (uppercase/trim/remove duplicates), then building proper one-to-many star-schema relationships from that shared dimension to each fact table.", "relevance": "Core DP-600 S1/P2 star-schema modeling technique — highly applicable when Giulio has multiple BC fact tables (sales, purchases, inventory) whose 'item' or 'customer' values aren't perfectly consistent, and needs one authoritative dimension table instead of many-to-many relationships."}, {"video_id": "znk1dRkPKlM", "title": "Dynamic Row Level Security in Power BI with Manager Level Access", "url": "https://www.youtube.com/watch?v=znk1dRkPKlM", "published": "2024-08-22", "duration": "11m 16s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1", "S1"], "topics": ["dax", "dynamic security", "governance", "lookupvalue", "rls", "row level security", "userprincipalname"], "summary": "Builds a single dynamic RLS role that uses USERPRINCIPALNAME and LOOKUPVALUE against a user/sales-rep table to filter each user to their own rows, but grants managers full access via an IF/blank-handling condition, avoiding a separate static manager role.", "relevance": "Dynamic RLS with LOOKUPVALUE and USERPRINCIPALNAME is squarely DP-600 M1 (security and governance); directly applicable to restricting BC sales or financial data by salesperson or approver in Giulio's reports."}, {"video_id": "uFqdxaz74aQ", "title": "Use Power Query Parameters to Make Power BI and Fabric ETL Dynamic", "url": "https://www.youtube.com/watch?v=uFqdxaz74aQ", "published": "2024-08-20", "duration": "15m 29s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2", "M2"], "topics": ["connections", "dataflow gen2", "deployment", "dynamic etl", "m language", "parameters", "power query", "semantic model"], "summary": "Reza Rad shows how to parameterize a data source (e.g. an Excel file path or SQL Server connection detail) in Power Query, both inside Power BI Desktop and in a Fabric Dataflow Gen2, then demonstrates that a Power BI Desktop parameter can be edited and refreshed directly from the Power BI service (semantic model settings) without reopening Desktop, while a Dataflow Gen2 parameter currently must be edited inside the dataflow editor itself.", "relevance": "Parameterized connections are a DP-600 dev-lifecycle/reusable-asset topic (M2) and a P1/P2 skill - directly useful for making a BC semantic model's source path/server or a Dataflow Gen2's source configurable across dev/test/prod environments without redeploying the PBIX, which matters for BC solutions promoted through deployment pipelines."}, {"video_id": "4_0XrR8vLxE", "title": "Microsoft Fabric Glossary", "url": "https://www.youtube.com/watch?v=4_0XrR8vLxE", "published": "2024-07-22", "duration": "18m 59s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2", "P3", "S1", "S2", "M2"], "topics": ["composite model", "dax", "delta", "direct lake", "fabric glossary", "lakehouse", "m language", "onelake", "semantic model", "spark", "sql analytics endpoint", "warehouse"], "summary": "Reza Rad runs through a rapid-fire glossary covering nearly every core Fabric/Power BI term: Lakehouse vs Warehouse vs Data Mart, SQL analytics endpoint, semantic model, OneLake vs ADLS Gen2, SQL/KQL, Eventhouse/Eventstream, Dataflow vs Data Factory vs ADF, Data Pipeline, Notebook, Spark, Delta Lake, Parquet, Spark Job Definition, M vs DAX, and connection modes (DirectQuery, Import, Composite, Live Connection, Direct Lake), plus SemPy and SparkML.", "relevance": "This is close to a spoken DP-600 study-point taxonomy in itself — it maps almost every term the exam's Prepare/Semantic-model/Maintain objectives use (lakehouse vs warehouse read/write differences, Direct Lake vs Import vs DirectQuery vs Composite, SQL analytics endpoint) and is a fast way to check terminology gaps before deeper study on any one area."}, {"video_id": "sIIrfrFzjLI", "title": "SCD Type 2 in Microsoft Fabric and Power BI", "url": "https://www.youtube.com/watch?v=sIIrfrFzjLI", "published": "2024-07-17", "duration": "23m 01s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "M2", "S1"], "topics": ["data pipeline", "dataflow gen2", "lakehouse staging", "scd type 2", "slowly changing dimension", "star schema", "stored procedures", "surrogate key", "warehouse"], "summary": "Full build of a slowly changing dimension type 2 pipeline in Fabric: stage source data (Excel) into a Lakehouse via Dataflow Gen2, use a stored procedure in a Warehouse to upsert a customer dimension with surrogate key, from-date/to-date columns (closing the old row, inserting a new row on change), a second stored procedure to insert fact rows against the correct surrogate key, orchestrated by a Data Factory pipeline, then a Power BI semantic model and report showing history preserved across the change.", "relevance": "Directly relevant to DP-600 P2 (star schema / SCD modeling) and M2 (pipeline orchestration in Fabric): BC natively doesn't track full attribute history, so this is the pattern Giulio would use to build a proper SCD2 customer or item dimension in a Fabric Warehouse when BC's own change history isn't sufficient, with surrogate keys distinct from BC's natural IDs."}, {"video_id": "7tGPVoq7DK4", "title": "SCD Slowly Changing Dimension - An Ultimate Guide", "url": "https://www.youtube.com/watch?v=7tGPVoq7DK4", "published": "2024-07-16", "duration": "13m 04s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["data warehousing", "dimension table", "dimensional modeling", "scd", "slowly changing dimension", "star schema", "surrogate key"], "summary": "Reza Rad walks through the concept of slowly changing dimensions and the common types: Type 0 (reject change), Type 1 (overwrite, no history), Type 2 (full history via new row + surrogate key + from/to date), Type 3 (limited history via extra previous-value columns), Type 4 (separate current-value table plus history table), and briefly Types 5-7 as rarely-used hybrids. Explains why a surrogate key is required for Type 2 to preserve fact-table history correctly.", "relevance": "SCD modeling is core DP-600 P2/S1 dimensional-modeling knowledge; BC customer, item, and salesperson attributes change over time (address, dimension values, price groups), so choosing SCD Type 1 vs Type 2 with a surrogate key directly affects whether historical BC transactions stay correctly attributed after a source record changes."}, {"video_id": "a-nj-bE0_eA", "title": "What is Spark in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=a-nj-bE0_eA", "published": "2024-06-19", "duration": "13m 57s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P3"], "topics": ["apache spark", "autoscale", "data engineering", "delta", "fabric", "lakehouse", "notebook", "spark pool"], "summary": "Reza Rad explains Apache Spark's role inside Fabric's data engineering/data science workloads: spark pools (starter vs. custom), spark instances/sessions, and the driver/executor node model, plus autoscale and dynamic executor allocation settings configured at the workspace level. He demonstrates running a notebook that reads a CSV into a Spark dataframe and writes it out as a Delta table in a Lakehouse.", "relevance": "Covers DP-600 P1/P3 territory (data engineering compute and query/analyze with notebooks) — while Giulio's BC-to-Power-BI work is mostly DAX/modeling, understanding what's actually running behind a Fabric notebook (Spark pools, sessions, Delta writes) is needed for the exam's data-engineering-workload questions and for any future scenario where BC data volumes justify a Lakehouse/notebook layer instead of pure Power Query."}, {"video_id": "IKhKjtoPjG8", "title": "Power BI Default Semantic Model or Custom - A guide for using in Fabric Environment", "url": "https://www.youtube.com/watch?v=IKhKjtoPjG8", "published": "2024-06-12", "duration": "12m 36s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "M1", "P1"], "topics": ["calculation groups", "default semantic model", "direct lake", "fabric", "lakehouse", "row level security", "semantic model", "warehouse", "web model editor"], "summary": "Reza compares the auto-created default semantic model on a Lakehouse/Warehouse (limited editor, no calculation groups, no hierarchies, no easy RLS) against a custom semantic model built via the enhanced web model editor, which supports calc groups, RLS, hierarchies and still uses Direct Lake, and explains the different data-access paths (default model, custom model, or bypassing to the SQL endpoint) from Power BI Desktop.", "relevance": "Directly maps to S1 semantic-model design decisions in a Fabric Lakehouse/Warehouse setup: when building a BC-fed Lakehouse, Giulio should know to create a custom semantic model (not rely on the default) to get RLS, calculation groups and hierarchies, matching the multi-layer architecture DP-600 expects."}, {"video_id": "VToVnhDCT9Y", "title": "Time Travel in Fabric Warehouse — Query Snapshots of the Data at Any Point in Time", "url": "https://www.youtube.com/watch?v=VToVnhDCT9Y", "published": "2024-05-23", "duration": "7m 14s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "S2"], "topics": ["data retention", "delta", "fabric warehouse", "snapshots", "sql endpoint", "time travel", "vacuum"], "summary": "Reza Rad demonstrates the FOR TIMESTAMP AS OF clause in a Fabric Warehouse SQL query to read table state as it existed at a specific past UTC timestamp, leveraging Delta Lake's change history (with a 7-day retention window before vacuum maintenance clears it), noting the same capability already existed in Lakehouse via notebook.", "relevance": "Delta Lake time travel underpins Fabric Warehouse/Lakehouse history and retention behavior (P1/S2 territory) - relevant background for reasoning about Direct Lake refresh/versioning and for understanding why a 'snapshot as of a point in time' isn't natively available in a standard Power BI import model over BC data without extra engineering."}, {"video_id": "EEkyCbT-bdc", "title": "Delta Lake Table Structure Demystified in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=EEkyCbT-bdc", "published": "2024-04-30", "duration": "15m 33s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "S2"], "topics": ["acid transactions", "delta", "lakehouse", "microsoft fabric", "notebooks", "onelake", "parquet", "time travel"], "summary": "Reza demystifies the Delta Lake table format used by Fabric Lakehouse/Warehouse: it's an open-source storage structure (a folder of Parquet data files plus a _delta_log folder of JSON change-log files) that provides ACID transactions, time travel/versioning, and auditing; he walks through the file structure in OneLake File Explorer, shows how an UPDATE changes the Parquet/JSON files, runs DESCRIBE HISTORY, and demonstrates time-travel queries in a notebook.", "relevance": "Delta Lake internals (Parquet + transaction log, ACID, time travel, OPTIMIZE/VACUUM) are the storage foundation for DP-600 P1/S2 topics like Direct Lake mode and Lakehouse table design, and understanding this file structure explains why Direct Lake reads are fast and why 'reframe' (a later video in this batch) is needed."}, {"video_id": "ZAjWnigtqt0", "title": "Mirroring Snowflake in Fabric — Supercharged Analytics at No Extra Costs", "url": "https://www.youtube.com/watch?v=ZAjWnigtqt0", "published": "2024-04-15", "duration": "22m 35s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "S2"], "topics": ["change data capture", "direct lake", "directquery", "fabric warehouse", "mirroring", "onelake", "snowflake"], "summary": "Demonstrates Fabric's mirroring feature for Snowflake (also available for Azure SQL DB and Cosmos DB): a near real-time, change-data-capture-based replicated copy of source tables landed in OneLake at no storage cost, avoiding slow/costly DirectQuery and long ETL projects. Shows setting up mirroring end-to-end, building a Power BI report on Direct Lake against the mirrored warehouse, and confirming automatic sync after inserting new rows in Snowflake.", "relevance": "Directly maps to DP-600 P1 (choose the right data store/connection method) and S2 (Direct Lake) — while BC itself isn't currently mirrorable, this is the pattern Microsoft is expanding (Azure SQL DB is supported) and explains when mirroring beats DirectQuery/import for external source systems feeding a BC-adjacent Fabric model."}, {"video_id": "khDFh98bX-I", "title": "Version Control in Power BI and Fabric", "url": "https://www.youtube.com/watch?v=khDFh98bX-I", "published": "2023-11-15", "duration": "14m 04s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M2"], "topics": ["azure devops", "branching", "deployment", "fabric workspace", "git integration", "source control", "version control"], "summary": "Walks through connecting a Fabric/Power BI workspace to an Azure DevOps Git repo, syncing items, committing report changes, viewing commit history/diffs, and the branch-per-developer plus merge-to-main workflow, noting which item types support Git integration.", "relevance": "Git integration for workspaces is explicit DP-600 M2 content (dev lifecycle management); this is the mechanism Giulio would use to source-control BC-based reports and semantic models across dev/test/prod workspaces."}, {"video_id": "w_0H9Bk_S7k", "title": "Real Time Analytics in Microsoft Fabric using KQL Database", "url": "https://www.youtube.com/watch?v=w_0H9Bk_S7k", "published": "2023-10-19", "duration": "17m 03s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P3"], "topics": ["eventhouse", "eventstream", "kql", "kql database", "microsoft fabric", "onelake", "real-time analytics", "streaming data"], "summary": "Reza Rad introduces Fabric's Real-Time Analytics workload - Eventstream as the ingestion hub, KQL Database for storage, and KQL Queryset as the query studio - then builds a live demo: a custom Node.js app streams temperature/humidity events through Eventstream into a KQL database, queried with simple KQL (table take 100), and visualized in a Power BI report with a 1-second page refresh.", "relevance": "Real-time analytics/KQL is explicitly in DP-600's 'prepare and serve data' and 'explore and analyze data' areas (P1/P3) via Eventstream and Eventhouse/KQL databases - good breadth-building since it's outside BC's normal batch-refresh world but is exam-testable, and the KQL basics (take, where, join) parallel SQL you already know from BC."}, {"video_id": "SqbgUiaFvTU", "title": "What is OneLake in Microsoft Fabric, and Why You Should Care", "url": "https://www.youtube.com/watch?v=SqbgUiaFvTU", "published": "2023-10-04", "duration": "10m 19s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M1"], "topics": ["data lake", "delta parquet", "direct lake", "domains", "fabric", "onecopy", "onelake", "security", "shortcuts", "workspaces"], "summary": "Reza Rad explains OneLake as the single logical storage layer for all Fabric items (built on ADLS Gen2, storing objects in Delta Parquet), covers domains/workspaces as its governance structure, shortcuts and OneCopy for avoiding data duplication across items, the four ways to access it (OneLake Data Hub, File Explorer, URI/ABFS path, API), and OneSecurity for applying row/column/table-level security once at the storage layer.", "relevance": "This is core DP-600 'get data / choose the right store' conceptual material — understanding that lakehouse/warehouse tables all live in one logical OneLake, and that shortcuts avoid copying a BC-sourced lakehouse table into every workspace that needs it, directly informs how you'd architect a Fabric-based BC reporting solution instead of many disconnected Power BI imports."}, {"video_id": "fqXRY6o3mtw", "title": "Saying Yes to Fabric OneLake Shortcuts, No to Duplicate", "url": "https://www.youtube.com/watch?v=fqXRY6o3mtw", "published": "2023-09-26", "duration": "10m 49s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["data mesh", "domains", "duplication", "lakehouse", "onelake", "shortcuts", "sql endpoint"], "summary": "Reza explains OneLake shortcuts as pointers that let a table or file physically stored in one Lakehouse/domain (or an external source like ADLS Gen2, S3, or Dataverse) appear and be queried as if it were a native table in another Lakehouse, avoiding data duplication across domains — demonstrated by shortcutting a customer table into a second Lakehouse and joining it with a local fact table in both the Lakehouse Explorer and the SQL endpoint.", "relevance": "Maps to DP-600 P1 (choosing data stores/connections) and M2 (reusable assets, avoiding duplication) — relevant if Giulio's org has a shared date or customer dimension that multiple domains/workspaces (e.g. Sales vs Finance built on the same BC data) need without copying it, since shortcuts keep a single source of truth and reduce maintenance overhead."}, {"video_id": "zeo2W__Gj1U", "title": "Microsoft Fabric Domains - Stepping Stones for Data Mesh", "url": "https://www.youtube.com/watch?v=zeo2W__Gj1U", "published": "2023-09-15", "duration": "13m 11s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1"], "topics": ["admin roles", "data mesh", "domains", "endorsement", "governance", "microsoft fabric", "onelake", "workspaces"], "summary": "Reza Rad explains Fabric domains as logical, tenant-level groupings of workspaces/items that support a data-mesh architecture, covering the role hierarchy (fabric admin, domain admin, domain contributor, workspace roles), domain-level endorsement/certification overrides, and a live demo of creating a domain, assigning admins/contributors and workspaces, and filtering OneLake data hub by domain.", "relevance": "Domains, endorsement overrides and admin/contributor role hierarchy are DP-600 M1 governance topics; understanding this hierarchy helps Giulio reason about how BC-related workspaces should be organized and governed if the org scales its Fabric tenant beyond a single team."}, {"video_id": "Gzxi5HOUZrU", "title": "Fabric Copy Data Activity is More Than Copy", "url": "https://www.youtube.com/watch?v=Gzxi5HOUZrU", "published": "2023-08-10", "duration": "13m 33s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1"], "topics": ["copy data activity", "data factory", "data ingestion", "data pipeline", "elt", "etl", "fabric", "staging"], "summary": "Reza Rad explains the Copy Data activity inside a Microsoft Fabric Data Factory pipeline: it's a high-throughput, parallelized data-ingestion tool best suited to ELT patterns (load raw data fast into a high-performance destination like a Lakehouse/Warehouse, then transform there) rather than ETL. He walks through building a pipeline that copies from a Lakehouse table into a Warehouse with staging, parallelism, and logging options.", "relevance": "Directly covers DP-600 P1 (get data / choose data stores) — Copy Data activity is the standard way to land BC data (via connectors, exports, or an intermediate storage layer) into a Fabric Lakehouse or Warehouse at scale before transformation, which is the ELT pattern DP-600 expects candidates to recognize and choose correctly over ad hoc dataflow-only pipelines."}, {"video_id": "eJVYmDq5YCw", "title": "Power BI Direct Lake - What is it and Why it is Important When Working With Fabric", "url": "https://www.youtube.com/watch?v=eJVYmDq5YCw", "published": "2023-06-26", "duration": "12m 17s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "S1", "P1"], "topics": ["direct lake", "directquery", "fabric", "import mode", "lakehouse", "onelake", "parquet", "semantic model", "vertipaq"], "summary": "Reza contrasts Import, DirectQuery and Direct Lake connection modes, explaining that Direct Lake lets the VertiPack engine query enhanced Delta Parquet files directly in OneLake (no copy, no scheduled refresh) for near-import-speed performance, and demonstrates the default vs. custom semantic model created from a Lakehouse plus the 'keep Direct Lake data up to date' setting.", "relevance": "Direct Lake is a headline DP-600 S2 topic; understanding it against Import/DirectQuery is essential groundwork before Giulio evaluates whether a BC-fed Fabric Lakehouse could serve Direct Lake reports instead of scheduled-refresh imports."}, {"video_id": "j2l5u02sBsY", "title": "Microsoft Fabric Notebook — What and Why", "url": "https://www.youtube.com/watch?v=j2l5u02sBsY", "published": "2023-06-19", "duration": "13m 53s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P3", "M2"], "topics": ["data engineering", "data exploration", "fabric notebook", "lakehouse", "pipelines", "pyspark", "spark sql"], "summary": "Reza Rad introduces the Fabric Notebook: a web-based code editor for data engine
