ers/scientists supporting PySpark, Scala, Spark R, and Spark SQL cells, connecting to a Lakehouse, running queries and visual data exploration, adding markdown documentation, and scheduling a notebook manually, on a schedule, or as a pipeline activity.", "relevance": "Notebooks are a core P1/P3 Fabric tool for data engineering ahead of the semantic model layer - useful context for understanding how BC data landed in a Lakehouse could be explored/transformed with Spark SQL before being exposed to a Direct Lake semantic model, even though day-to-day work stays in Power Query/DAX."}, {"video_id": "7bd7aG0s3uQ", "title": "Lakehouse VS Warehouse VS Datamart: The Difference Between The Three Fabric Objects", "url": "https://www.youtube.com/watch?v=7bd7aG0s3uQ", "published": "2023-06-08", "duration": "19m 19s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1"], "topics": ["data architecture", "direct lake", "lakehouse", "microsoft fabric", "onelake", "power bi datamart", "sql endpoint", "warehouse"], "summary": "Reza compares Power BI Datamart, Fabric Lakehouse, and Fabric Warehouse across licensing (PPU vs Fabric capacity), scalability, structured-vs-unstructured data support, SQL endpoint read/write capability, target persona (citizen analyst vs SQL/DB developer vs data engineer), ETL tooling, and how each performs when used as a Power BI source (import vs DirectQuery vs the newer Direct Lake mode for lakehouse/warehouse).", "relevance": "Choosing the right Fabric data store is core DP-600 P1 ('choose stores') content — directly relevant when deciding where BC data should land in a Fabric-based platform (Lakehouse for flexible/mixed data and Direct Lake reporting vs Warehouse for full T-SQL read/write vs Datamart for a lightweight citizen-analyst scenario)."}, {"video_id": "fGsmCGOpiOc", "title": "What is Microsoft Fabric Data Warehouse", "url": "https://www.youtube.com/watch?v=fGsmCGOpiOc", "published": "2023-06-01", "duration": "18m 03s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "S1"], "topics": ["direct lake", "fabric warehouse", "lakehouse", "onelake", "power query online", "semantic model", "sql endpoint", "t-sql"], "summary": "Introduces the Fabric Warehouse item: a high-performance SQL database engine (built on Synapse Data Warehouse tech) that supports full read/write T-SQL, unlike the read-only SQL endpoint of a Lakehouse. Walks through creating a warehouse, loading data via pipelines or T-SQL, using the visual query (Power Query online) editor with query folding to SQL, and the automatically generated Power BI semantic model with Direct Lake / import / DirectQuery connection options.", "relevance": "Core DP-600 P1/S1 content — understanding Warehouse vs Lakehouse vs Direct Lake connectivity is exam-tested, and it's directly applicable if Giulio ever lands BC data into Fabric (via Dataflow Gen2 or pipeline) and needs a writable SQL layer with T-SQL transforms before building the semantic model."}, {"video_id": "5hyTWLWNGiw", "title": "What is Data Factory in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=5hyTWLWNGiw", "published": "2023-05-30", "duration": "12m 44s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1"], "topics": ["connectors", "data factory", "data pipeline", "dataflow gen2", "etl", "microsoft fabric", "orchestration"], "summary": "Explains that Fabric's Data Factory workload is the convergence of Power Query dataflows (transformation) and Azure Data Factory (orchestration, scale, monitoring), covering its three building blocks - connectors, Dataflow Gen2, and Data Pipelines - and how a pipeline can wrap and orchestrate a dataflow.", "relevance": "DP-600 P1 requires knowing Fabric's data-ingestion options and when to use Dataflow Gen2 vs Pipelines; useful for planning a Fabric-based ingestion layer for BC data instead of relying on Power BI Desktop's own Get Data."}, {"video_id": "ub9mpvk6xuU", "title": "Getting Started with Dataflow in Microsoft Fabric Data Factory", "url": "https://www.youtube.com/watch?v=ub9mpvk6xuU", "published": "2023-05-29", "duration": "16m 28s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["dataflow gen2", "etl", "fabric data factory", "lakehouse", "m language", "merge queries", "power query", "star schema"], "summary": "Reza Rad walks through building a Dataflow Gen2 in Fabric Data Factory end to end: getting data from Excel, using merge queries to flatten product/subcategory/category into one star-schema dimension, viewing the generated M script in the Advanced Editor, setting a Lakehouse as the data destination with replace/append load options, and scheduling refresh (standalone or embedded in a Data Pipeline).", "relevance": "Dataflow Gen2 is core DP-600 data-integration content (P1/P2) - this shows the exact ETL pattern (get data, merge/flatten to star schema, land in a Lakehouse) you'd use to stage BC OData/API extracts into Fabric before building the semantic model, and previews the M script behind the graphical steps."}, {"video_id": "Qw229FBlnJA", "title": "Getting Started with Data Pipelines in Fabric Data Factory", "url": "https://www.youtube.com/watch?v=Qw229FBlnJA", "published": "2023-05-26", "duration": "14m 31s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "M2"], "topics": ["activities", "control flow", "data factory", "data pipeline", "dataflow gen2", "etl", "fabric", "orchestration"], "summary": "Reza Rad explains that Fabric Data Factory has two complementary pieces — Dataflow (Power Query transformation) and Data Pipeline (SSIS-like orchestration/control flow) — and builds a simple pipeline with Set Variable, a Dataflow Gen2 activity, and an Office 365 Outlook notification activity, wired together with success/failure branches and dynamic content expressions.", "relevance": "For a DP-600 candidate coming from Power BI, this is the bridge concept: orchestrating a scheduled refresh of a BC-sourced Dataflow Gen2 (with success/failure email notification) is the kind of end-to-end ETL pattern the exam's 'Prepare data' objectives expect, distinct from just building a single Dataflow."}, {"video_id": "qNoOQzMjrfk", "title": "Microsoft Fabric Lakehouse Explained — Create, Load & Query Data (Tutorial)", "url": "https://www.youtube.com/watch?v=qNoOQzMjrfk", "published": "2023-05-25", "duration": "16m 39s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "S1"], "topics": ["dataflow gen2", "default semantic model", "direct query", "import mode", "lakehouse", "microsoft fabric", "relationships", "sql endpoint"], "summary": "End-to-end walkthrough of creating a Fabric Lakehouse, loading data into it with a Dataflow Gen2, exploring tables/files in the Lakehouse Explorer, querying via the auto-generated read-only SQL endpoint (SQL query, visual query, or SSMS connection string), and connecting from Power BI Desktop either live to the auto-generated default semantic model or via the SQL endpoint (import or DirectQuery), including editing relationships in the web modeling view.", "relevance": "Core DP-600 P1/S1 content: this is the practical mechanics of standing up a Lakehouse as a landing zone for BC exports, choosing between the SQL endpoint's import/DirectQuery connection and the auto-generated default semantic model, and building relationships either in Desktop or the new web-based model editor."}, {"video_id": "6t5D7K8jZvc", "title": "Power BI DAX: ALL vs ALLSELECTED Explained with Examples", "url": "https://www.youtube.com/watch?v=6t5D7K8jZvc", "published": "2023-05-18", "duration": "10m 18s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2", "P3"], "topics": ["all", "allselected", "calculate", "dax", "filter context", "percent of total", "star schema"], "summary": "Reza Rad contrasts ALL and ALLSELECTED on an AdventureWorks star schema: ALL ignores every filter on the specified table regardless of source, while ALLSELECTED ignores only filters applied within the current visual but still respects filters coming from outside it (slicers, other visuals, page filters). Demonstrates both feeding two different percent-of-total calculations — percent of grand total vs percent of the current selected context.", "relevance": "This is a classic DP-600 S1/S2 nuance interviewers and exam questions probe — choosing ALL vs ALLSELECTED changes what a percentage measure actually means, directly relevant to any BC report where Giulio needs percent-of-category vs percent-of-grand-total sales breakdowns filtered by slicers."}, {"video_id": "jphj40tBPD8", "title": "Dynamic Row Level Security in Power BI — Full Tutorial", "url": "https://www.youtube.com/watch?v=jphj40tBPD8", "published": "2023-04-30", "duration": "12m 47s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1"], "topics": ["dynamic security", "governance", "relationships", "rls", "row level security", "security roles", "userprincipalname"], "summary": "Reza Rad demonstrates dynamic row-level security (RLS): building a role that filters a users table via USERPRINCIPALNAME() instead of hardcoding individual filter values, publishing the report, adding users to the dataset's security tab (ideally via an Azure AD/O365 group), and confirming that different logged-in users see only their own sales transactions with zero pbix changes needed per user.", "relevance": "This is a direct DP-600 M1 (security & governance) skill Giulio needs for any BC-sourced report shared beyond himself — RLS by USERPRINCIPALNAME lets sales reps or department heads see only their own BC data without maintaining a static role per person."}, {"video_id": "2husIX__ZWg", "title": "Power BI Incremental Refresh and Hybrid Tables", "url": "https://www.youtube.com/watch?v=2husIX__ZWg", "published": "2022-10-05", "duration": "17m 45s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "P1"], "topics": ["directquery", "hybrid tables", "incremental refresh", "partitions", "premium", "query folding", "refresh", "xmla endpoint"], "summary": "Reza explains incremental refresh partitioning (RangeStart/RangeEnd parameters, query folding requirement, retention vs. refresh period, detect-data-changes) and hybrid tables, where the most recent partition stays DirectQuery (Premium-only) while older partitions are imported, then shows how to inspect partitions via XMLA endpoint/SSMS.", "relevance": "Incremental refresh is a named S2 exam topic and a real cost/performance lever for large BC ledger-entry tables; the query-folding prerequisite matters directly for BC/SQL-sourced Power Query steps, and hybrid tables show how to blend near-real-time DirectQuery with imported history."}, {"video_id": "7Nx0i9pNiv0", "title": "Power BI Modelling Using Power Query Part Two", "url": "https://www.youtube.com/watch?v=7Nx0i9pNiv0", "published": "2022-08-16", "duration": "15m 44s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["data modeling", "dimension tables", "fact tables", "factless fact table", "json", "power query", "star schema", "surrogate key"], "summary": "Reza Rad builds a star schema from raw JSON conference data entirely in Power Query, splitting one nested source into two factless fact tables (schedule, session-category) and four dimension tables (speaker, room, session, category), applying surrogate-key/uniqueness checks along the dimensions, and validating the resulting relationships and a matrix visual.", "relevance": "This is a hands-on P2/S1 star-schema modeling walkthrough - splitting a flat/nested source into fact and dimension tables with clean surrogate keys is exactly the transformation needed when BC exports arrive as wide flat tables (e.g. sales lines with embedded customer/item attributes) that should be normalized into a proper star schema."}, {"video_id": "ajCkA5GhJlI", "title": "Power BI Modelling Basics Part One", "url": "https://www.youtube.com/watch?v=ajCkA5GhJlI", "published": "2022-08-15", "duration": "12m 28s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["data modeling", "dimension table", "fact table", "grain", "power bi basics", "star schema"], "summary": "Leila explains the fundamental case for fact and dimension tables in Power BI modeling: why transactional/normalized schemas are bad for reporting, what makes a table a 'fact' (numeric, additive, foreign keys) vs a 'dimension' (descriptive, shallow, wide), and why dumping everything into one flat table is a maintenance and grain-mismatch problem (e.g. quarterly budget vs daily sales).", "relevance": "This is foundational DP-600 S1/P2 star-schema theory — exactly the mental model needed to correctly separate BC data (e.g. G/L Entry as fact; Customer, Item, G/L Account, Date as dimensions) instead of building one wide flattened BC export table, which is a common beginner mistake with BC data."}, {"video_id": "oW1jyK2sgHg", "title": "What is Power BI Dataflow and Why you should use it", "url": "https://www.youtube.com/watch?v=oW1jyK2sgHg", "published": "2022-07-26", "duration": "11m 35s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2", "M2"], "topics": ["azure data lake", "dataflows", "etl", "power query online", "reusable assets", "shared dimension"], "summary": "Explains Power BI dataflows as a cloud-hosted, Power Query-powered ETL service independent from any single semantic model, storing data in Azure Data Lake Storage Gen2 or Dataverse. Covers standard vs analytical dataflows, and use cases: sharing common tables (date, product) across multiple PBIX files without duplicating M code, speeding up desktop refresh by offloading heavy transforms to the cloud, and building a lightweight data warehouse layer.", "relevance": "Relevant to DP-600 P1/P2 (get data, transform) and M2 (reusable assets/dev lifecycle) — dataflows let Giulio centralize shared BC dimension tables (customer, item, date) once instead of duplicating M scripts across multiple Power BI files pulling from Business Central."}, {"video_id": "NHBsbUtMjJg", "title": "Power Query Data Structure: Table, Record, List", "url": "https://www.youtube.com/watch?v=NHBsbUtMjJg", "published": "2022-06-03", "duration": "9m 28s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P3", "P2"], "topics": ["advanced editor", "data structures", "list", "m language", "power query", "record", "table"], "summary": "Explains Power Query M's three core data structures - list (single column, multiple rows), record (single row, multiple fields), and table (rows x columns) - how they're written and nested in M, and how each surfaces in the Power Query UI.", "relevance": "DP-600 P3 expects comfort reading and writing M beyond the GUI; recognizing table/record/list shapes is essential for debugging custom M functions and structured columns Giulio hits when transforming BC OData/API responses."}, {"video_id": "pNs-JCPj57c", "title": "Power BI DAX - Previous Month to Date, Quarter to Date, and Year to Date Calculations", "url": "https://www.youtube.com/watch?v=pNs-JCPj57c", "published": "2022-05-19", "duration": "8m 39s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculate", "date table", "dateadd", "dax", "month to date", "quarter to date", "time intelligence", "year to date"], "summary": "Reza Rad builds MTD/QTD/YTD measures using DATESMTD/DATESQTD/DATESYTD inside CALCULATE, then shows how to compare each against the prior period using DATEADD (going back one month/quarter/year), noting why PARALLELPERIOD isn't ideal here since it returns the whole period rather than the same cut-off date, and stresses the need for a proper marked date table.", "relevance": "Time-intelligence measures are a required DP-600 semantic-model skill (S1) and map directly onto BC fiscal-period reporting - previous-MTD/QTD/YTD sales or purchase comparisons are exactly the kind of measure a BC-over-Power-BI model needs, and this clarifies which time-intelligence function to use versus SAMEPERIODLASTYEAR/PARALLELPERIOD."}, {"video_id": "dx8PBnDEMzU", "title": "ConcatenateX in Power BI and DAX   Concatenate Values of a Column", "url": "https://www.youtube.com/watch?v=dx8PBnDEMzU", "published": "2021-11-09", "duration": "12m 22s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["concatenatex", "dax", "dynamic tooltip", "filter", "relatedtable", "topn", "variables", "virtual tables"], "summary": "Reza Rad demonstrates CONCATENATEX's five parameters (table, expression, delimiter, order-by, direction) using RELATEDTABLE to build per-customer order-number lists, then builds a full measure that combines variables, FILTER, TOPN and FORMAT to produce a dynamic 'top 10 customers by sales' concatenated string that reacts to report filters, and notes its use for debugging virtual tables inside measures.", "relevance": "This covers the DAX table-function/variable/iterator skills DP-600 tests directly, and is a practical way to build dynamic tooltip or summary text over BC data, e.g. a measure that lists the top customers or open documents behind a total, which is a common BC reporting request that plain visuals can't produce."}, {"video_id": "s2FeGeJtzSE", "title": "Power BI Date or Calendar Table Best Method - DAX or Power Query", "url": "https://www.youtube.com/watch?v=s2FeGeJtzSE", "published": "2021-10-06", "duration": "13m 33s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["calendar table", "dataflows", "date table", "dax", "fiscal year", "power query", "role-playing dimension", "star schema"], "summary": "Reza compares building a custom date/calendar table via a DAX calculated table versus a Power Query script, noting both perform similarly, DAX keeps you inside Desktop without opening the query editor, while Power Query enables reuse via dataflows, merging with external data (public holidays, company-specific working days), and creating role-playing date copies more cheaply via a DAX table copy of an already-loaded date table.", "relevance": "Directly maps to DP-600 S1 star-schema design: a custom date dimension with fiscal year/week attributes is foundational for any BC-based model doing period comparisons (YTD, fiscal year), and the reusability argument for building it once in a dataflow is relevant since Giulio likely needs the same date table across multiple BC report models."}, {"video_id": "f7g6EvNGClQ", "title": "Explicit Vs Implicit DAX Measures in Power BI", "url": "https://www.youtube.com/watch?v=f7g6EvNGClQ", "published": "2021-08-10", "duration": "9m 57s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "M2"], "topics": ["analyze in excel", "best practice", "dax", "explicit measure", "implicit measure", "model design"], "summary": "Reza Rad contrasts explicit measures (written with a DAX expression) against implicit measures (a numeric column dragged into a visual and auto-summarized). Covers that performance is identical for simple aggregations, that explicit measures are required for anything beyond basic aggregation (e.g. YTD, top-N averages), and the key practical difference: only explicit measures work as values in Excel's Analyze in Excel / pivot tables — implicit ones fail to aggregate there.", "relevance": "DP-600 S1 model-design best practice: this explains why Giulio should hide raw numeric columns and expose only explicit DAX measures in his BC semantic models, especially since finance stakeholders often consume BC data via Analyze in Excel/pivot tables where implicit measures silently break."}, {"video_id": "zeXQknz4RdI", "title": "All in One Script to Create Calendar Table or Date Dimension using DAX in Power BI", "url": "https://www.youtube.com/watch?v=zeXQknz4RdI", "published": "2021-07-13", "duration": "5m 49s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["calculated table", "date dimension", "date table", "dax", "fiscal year", "mark as date table", "star schema"], "summary": "Reza Rad walks through building a custom date dimension as a DAX calculated table, marking it as a date table, and configuring start/end year and fiscal-year start month so it produces year, quarter, month, fiscal-year and offset columns. He notes Power Query is his preferred method for reusability but shows the DAX calculated-table alternative for one-off files.", "relevance": "A proper custom date table (vs. Power BI's auto date/time default) is core star-schema modeling for DP-600's S1 objective and matters directly for Giulio's BC models, where fiscal-year alignment (BC's fiscal calendar often doesn't match Jan-Dec) needs explicit handling — this also connects to the later RADACAD video showing the storage cost of leaving the default date table on."}, {"video_id": "GVAzp-YICnQ", "title": "Basics of DAX Expression in Power BI", "url": "https://www.youtube.com/watch?v=GVAzp-YICnQ", "published": "2021-07-02", "duration": "11m 46s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculated column", "calculated table", "dax", "dax basics", "measures", "operators", "syntax", "variables"], "summary": "A foundational walkthrough of DAX syntax: the three calculation types (calculated column, calculated table, measure) plus RLS expressions, referencing columns/measures, operators (concatenation, logical, IN), comments, variables (VAR/RETURN), and the tabular vs. scalar function categories, with a note on the DAX editor's color coding.", "relevance": "Pure DAX-fundamentals refresher underpinning every S1/S3 DAX question on DP-600; useful baseline before tackling more advanced DAX (iterators, context transition, calc groups) over BC datasets."}, {"video_id": "8--Yv18rhyA", "title": "DAX CrossFilter Function in Power BI — Write the Formula both directional but keep the relationship", "url": "https://www.youtube.com/watch?v=8--Yv18rhyA", "published": "2021-07-01", "duration": "10m 38s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["bidirectional relationships", "calculate", "crossfilter", "dax", "filter direction", "performance", "relationships", "star schema"], "summary": "Reza Rad shows how to use the DAX CROSSFILTER function inside CALCULATE to temporarily change a relationship's filter direction to bidirectional (or none) for a single measure, instead of setting the physical relationship to bidirectional in the model, including chaining multiple CROSSFILTER calls when several relationships need reversing for one calculation.", "relevance": "CROSSFILTER is a core S1 relationship-and-filter-direction DAX function and the recommended best practice over physically bidirectional relationships (which hurt S2 performance and cause ambiguity) - directly applicable to BC models with multiple fact tables (sales, purchases, quotas) needing cross-fact filtering without paying the bidirectional-relationship performance cost."}, {"video_id": "GqxECuWRiio", "title": "Get a field value from a related table in Power BI DAX RELATED Function Explained", "url": "https://www.youtube.com/watch?v=GqxECuWRiio", "published": "2021-06-07", "duration": "9m 24s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculated column", "dax", "lookupvalue", "related function", "relationships", "star schema"], "summary": "Reza explains DAX's RELATED function: it pulls a single scalar value across an existing many-to-one relationship into a calculated column (or measure), traverses multiple chained relationships automatically in one call, only works in the many-to-one direction (returning one value), and is a simpler alternative to LOOKUPVALUE when a relationship already exists.", "relevance": "RELATED is a fundamental S1 DAX function for enriching a fact/detail table with attributes from a related dimension, e.g. pulling item category or customer group onto a BC ledger-entry table for calculated columns, and understanding its one-value/many-to-one constraint is a common DP-600 exam and real-world gotcha."}, {"video_id": "jcOa4sEMDDs", "title": "FILTER Function in DAX and Power BI — Apply Custom Filter to Calculations", "url": "https://www.youtube.com/watch?v=jcOa4sEMDDs", "published": "2021-06-02", "duration": "6m 42s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["boolean logic", "calculate", "dax", "filter function", "measures", "table functions"], "summary": "Covers the DAX FILTER function as a table function equivalent to a SQL WHERE clause: takes a table (or virtual table) and a boolean expression, returns a filtered table with the same columns. Shows combining FILTER with AND/OR logic, nesting FILTER inside SELECTCOLUMNS, and using it as a filter argument inside CALCULATE for dynamic, slicer-aware measures.", "relevance": "Core DP-600 S1 DAX skill — table-filtering functions and CALCULATE filter arguments are exam-tested, and Giulio can use FILTER to build conditional measures over BC data (e.g. sales only for specific item categories or posting groups) instead of hardcoding slicers."}, {"video_id": "-GYw8x7hJao", "title": "Month over Month Calculation in Power BI using DAX", "url": "https://www.youtube.com/watch?v=-GYw8x7hJao", "published": "2021-05-31", "duration": "7m 09s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["date table", "dateadd", "dax", "month over month", "parallelperiod", "time intelligence", "variance"], "summary": "Teaches month-over-month DAX using PARALLELPERIOD, contrasting syntax for Power BI's default auto date table (needing a .[Date] reference) versus a custom marked date table, then layers variance and percentage-variance measures on top.", "relevance": "Time-intelligence functions and default-vs-custom date table syntax differences are core DP-600 S1/P3 DAX content; Giulio's BC models should use a custom marked date table, so this clarifies exactly which syntax his measures need."}, {"video_id": "FlSpuVKVRmA", "title": "TOPN DAX Function - How it works in Power BI - Comparison against the top group", "url": "https://www.youtube.com/watch?v=FlSpuVKVRmA", "published": "2021-05-26", "duration": "8m 45s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["averagex", "dax", "dynamic measures", "iterators", "ranking", "summarize", "topn", "virtual tables"], "summary": "Reza Rad explains the TOPN function's parameters (n, table, order-by expression, ascending/descending), shows how to build it over virtual tables created with SUMMARIZE, warns that ties can return more rows than requested, and demonstrates a dynamic measure that averages the top-N group (e.g. average sales of the top 3 colors) so the result reacts to slicers.", "relevance": "TOPN combined with virtual tables (SUMMARIZE/ADDCOLUMNS) is a core DP-600 DAX iterator/table-filtering pattern - directly applicable to BC reporting asks like 'top 5 customers by revenue' or 'average of top 3 vendors by spend', and the tie-handling gotcha is a realistic exam trap."}, {"video_id": "FCWVX8W1QZk", "title": "Showing Ranking in a Visual in Power BI using RANKX DAX function", "url": "https://www.youtube.com/watch?v=FCWVX8W1QZk", "published": "2021-05-25", "duration": "10m 52s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["all function", "context transition", "crossjoin", "dax", "filter context", "ranking", "rankx", "related", "ties"], "summary": "Reza Rad breaks down RANKX's parameters (table, expression, value, order, ties), shows why a naive RANKX inside a visual returns 1 for every row because the table argument still respects the visual's filter context, fixes it with ALL()/ALL(column), covers ranking across columns from different tables via CROSSJOIN or RELATED, and explains the SKIP vs DENSE tie-break options.", "relevance": "Ranking BC customers, vendors, or items by sales/purchase amount in a visual is a common ask, and this video's core lesson — that RANKX's table argument is still filtered by the visual unless wrapped in ALL — is a frequent DAX bug in exactly this kind of measure over BC ledger data; understanding SKIP vs DENSE ties also matters for reproducible leaderboard reports."}, {"video_id": "AlROiaxK41c", "title": "Create a subset of the table in Power BI and add calculations using SELECTCOLUMNS DAX Function", "url": "https://www.youtube.com/watch?v=AlROiaxK41c", "published": "2021-05-20", "duration": "6m 35s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["addcolumns", "dax", "dax studio", "query performance", "selectcolumns", "table functions", "virtual tables"], "summary": "Reza explains SELECTCOLUMNS as a table function that returns a chosen subset of columns (optionally with new expression-based columns), contrasts it with ADDCOLUMNS which keeps all existing columns and appends new ones, and uses DAX Studio server timing to show SELECTCOLUMNS producing a much smaller virtual table (and faster query) than ADDCOLUMNS for the same random-row-selection pattern.", "relevance": "Directly supports DP-600 S1 table-function and virtual-table-size knowledge, and the DAX Studio server-timing comparison is a practical S2 optimization technique Giulio can reuse when a measure over a wide BC dimension table (e.g. customer or item with 30+ columns) is slow because it materializes more columns than needed."}, {"video_id": "VxnrH6XQayg", "title": "How to use AddColumns function in DAX and Power BI", "url": "https://www.youtube.com/watch?v=VxnrH6XQayg", "published": "2021-05-13", "duration": "5m 00s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["addcolumns", "dax", "iterators", "row context", "table functions", "topn", "virtual table"], "summary": "Reza Rad explains ADDCOLUMNS as a tabular DAX function that returns a copy of an input table plus one or more new row-context-calculated columns, without modifying the source table. Shows a static example adding computed columns to a customer table, then a dynamic example inside a measure using ADDCOLUMNS with RAND() and TOPN to randomly select a customer.", "relevance": "ADDCOLUMNS is core DP-600 S1 table-function/iterator material used to build virtual tables inside measures (e.g. ranking, selecting a row, feeding downstream table functions) — a technique that generalizes to building helper tables over BC data for ranking top customers or items by measure."}, {"video_id": "B1PYLVHFYT4", "title": "Power BI Dataflow vs Data Warehouse: Which One to Choose", "url": "https://www.youtube.com/watch?v=B1PYLVHFYT4", "published": "2021-01-05", "duration": "11m 19s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["architecture", "azure synapse", "data ingestion", "data warehouse", "dataflows", "etl", "fabric", "power query"], "summary": "Reza Rad compares Power Query dataflows against traditional data warehouse technologies (Azure Synapse, SQL Server/SSIS) across scalability, ease of use, cost, skill requirements, and enterprise administration. Dataflows are cheaper and more accessible to citizen developers but less scalable and less enterprise-ready; data warehouses need a dedicated dev team but scale further and support proper team-based ALM.", "relevance": "This maps to DP-600's P1 (choosing data stores/connections) and P2 (transform) objectives — deciding whether to stage and transform BC data in Power Query dataflows/Fabric Dataflow Gen2 versus pushing it into a Fabric Warehouse or Lakehouse is a real architectural choice Giulio faces for BC-to-Power-BI pipelines, especially as data volumes grow."}, {"video_id": "IX6FgC3cRwI", "title": "Row Level Security on a DirectQuery to Power BI dataset composite model - My Findings", "url": "https://www.youtube.com/watch?v=IX6FgC3cRwI", "published": "2020-12-31", "duration": "9m 18s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["M1", "S1"], "topics": ["calculate", "chained dataset", "composite model", "directquery", "rls", "row level security", "security", "treatas"], "summary": "Reza tests row-level security behavior in a chained/composite model where one dataset has a DirectQuery connection to another Power BI dataset: RLS can only be configured on locally-imported tables, and he demonstrates that RLS filtering does NOT propagate through the relationship into a locally-imported table, showing a CALCULATE + TREATAS workaround to enforce it manually.", "relevance": "Directly relevant to M1 (RLS/security) and S1 (composite models): Giulio may build composite models combining a chained/DirectQuery Power BI dataset with local BC extract tables, and needs to know RLS gaps and the TREATAS workaround rather than assuming security propagates automatically."}, {"video_id": "WowP5vOgeqI", "title": "DirectQuery for Power BI dataset — How does it work", "url": "https://www.youtube.com/watch?v=WowP5vOgeqI", "published": "2020-12-30", "duration": "14m 00s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "M1", "P1"], "topics": ["analysis services", "build permission", "chained datasets", "composite models", "directquery", "gateway", "lineage view", "live connection"], "summary": "Reza Rad walks through composite models built on top of existing Power BI datasets/Analysis Services (DirectQuery to Power BI dataset / chaining datasets), covering the My Workspace limitation, converting a live connection to a local model, combining multiple datasets plus an Excel import, and the gateway and dataset-credential/build-permission steps needed to make the published report actually load.", "relevance": "This is the precursor feature to Fabric's composite models on Power BI datasets/DirectLake-adjacent chaining - understanding DirectQuery-to-dataset, gateway requirements, and build permissions maps to S1 composite models and M1 governance (who needs Build access) for chaining BC-sourced datasets with other sources."}, {"video_id": "EukzA4vbl2w", "title": "Aggregation to speed up the performance of a Power BI report even if all IMPORTED", "url": "https://www.youtube.com/watch?v=EukzA4vbl2w", "published": "2020-12-01", "duration": "9m 42s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S2", "S1"], "topics": ["aggregations", "dax", "import mode", "iscrossfiltered", "performance tuning", "star schema", "vertipaq"], "summary": "Reza demonstrates using aggregated tables to speed up an all-import Power BI model (not composite/DirectQuery), showing that PBI's built-in 'Manage Aggregations' UI only works when the detail table is DirectQuery, so for all-import models you instead write a DAX measure with ISCROSSFILTERED to route calculations to the small aggregated table when possible and fall back to the large fact table only when the visual is sliced by a dimension not covered by the aggregation.", "relevance": "This is a hands-on S2 optimization pattern directly usable on large BC fact tables (e.g. G/L entries, item ledger entries): build a grouped aggregation table and an ISCROSSFILTERED-driven measure to avoid scanning millions of rows for common report slices, even without DirectQuery/Fabric aggregation awareness."}, {"video_id": "NXaK6aCouoY", "title": "Left Outer Join — What it is and how to use it in Power BI and Power Query", "url": "https://www.youtube.com/watch?v=NXaK6aCouoY", "published": "2020-11-03", "duration": "8m 32s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "P1"], "topics": ["data quality", "join kinds", "left outer join", "m", "merge", "power query"], "summary": "Explains left outer join semantics generically (all rows from the left/main table, matching rows from the right, nulls where no match) and demonstrates configuring it as the default merge type in Power Query when combining an orders table with a customer table.", "relevance": "Directly relevant to DP-600 P2 (transform/shape) and P1 (get data) — Giulio regularly merges BC transactional tables (sales lines, ledger entries) with master data (customers, items) and needs to choose join kind deliberately to avoid silently dropping unmatched BC records."}, {"video_id": "xNRtOZae71Q", "title": "Conditional Column in Power BI using Power Query   You can do anything", "url": "https://www.youtube.com/watch?v=xNRtOZae71Q", "published": "2020-10-28", "duration": "11m 03s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2"], "topics": ["calculated column", "conditional column", "data transformation", "if then else", "m language", "power query"], "summary": "Shows how to build if/then/else logic as a calculated column in the Power Query GUI (Add Column > Conditional Column), including multi-condition ordering, and how to hand-edit the underlying M formula for AND/OR logic the GUI can't express directly.", "relevance": "Row-by-row derived columns (e.g., BC customer or item banding) belong in Power Query rather than DAX per DP-600 P2 guidance; understanding clause ordering and M editing is directly testable and applicable to BC transformations."}, {"video_id": "IPziqmQgJFw", "title": "Combining Tables in Power BI - Union Except and Intersect in DAX", "url": "https://www.youtube.com/watch?v=IPziqmQgJFw", "published": "2020-08-24", "duration": "6m 47s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculated tables", "dax", "except", "intersect", "power query", "table functions", "union", "virtual tables"], "summary": "Reza Rad demonstrates DAX's table-combining functions UNION, INTERSECT, and EXCEPT with simple sample tables, explaining that UNION keeps duplicates (pair with DISTINCT/VALUES to dedupe), INTERSECT returns common rows, EXCEPT is order-sensitive (rows in table A not in table B), and that Power Query append/merge should be the default choice for static data transformation while these DAX table functions are for dynamic, in-memory virtual tables.", "relevance": "These are DP-600 DAX table-function fundamentals (S1) used to build calculated tables or virtual tables inside measures - useful for BC scenarios like combining two fiscal-year snapshot tables dynamically or finding customers present in one period's sales but not another's without going back to Power Query."}, {"video_id": "eUIki01a4fU", "title": "How to Use Time and Date Dimensions in a Power BI Model", "url": "https://www.youtube.com/watch?v=eUIki01a4fU", "published": "2020-06-22", "duration": "4m 49s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["data modeling", "date dimension", "drill down", "power query", "star schema", "time dimension", "vertipaq"], "summary": "Reza Rad explains how to split a combined datetime column in a fact table into separate Date and Time columns in Power Query, then connect the fact table separately to a date dimension and a time dimension, instead of merging date and time into one large dimension table.", "relevance": "BC posting/document datetime fields (e.g. Created Date-Time, Last Modified fields on ledger entries) often carry a combined date+time value; splitting these in Power Query and keeping separate date and time dimension tables is exactly the star-schema pattern DP-600 expects and keeps VertiPaq memory down versus one giant combined dimension."}, {"video_id": "M7dkx6uW4u4", "title": "Working with Records, Lists, and Values in Power BI Dataflows", "url": "https://www.youtube.com/watch?v=M7dkx6uW4u4", "published": "2020-05-27", "duration": "4m 56s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["dataflows", "enable load", "lists", "m language", "power query", "records"], "summary": "Reza shows that Power Query queries in a Power BI dataflow (unlike in Desktop) get auto-converted to table format on save, and explains how to keep intermediate steps as list, record, or value objects by unchecking 'Enable load' on helper queries so they aren't materialized to storage but remain usable as inputs to other queries.", "relevance": "Niche Power Query/dataflow behavior rather than semantic-model content, but useful for Giulio if he stages BC data through Power BI dataflows before a Fabric model — knowing to disable load on helper queries keeps dataflow storage clean and avoids unnecessary CSV materialization of intermediate list/record objects."}, {"video_id": "VjTJp2XhN1A", "title": "How to Use ALL in a DAX Expression in Power BI", "url": "https://www.youtube.com/watch?v=VjTJp2XhN1A", "published": "2020-05-25", "duration": "8m 29s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["all", "calculate", "dax", "filter context", "percent of total", "star schema"], "summary": "Reza Rad shows how the ALL function inside CALCULATE removes filters from a specified table (or the whole model when used with no argument), building up from ignoring a single dimension's filters to ignoring two dimensions, an entire fact table, or every table at once. Demonstrates the resulting behavior live in a table visual with slicers.", "relevance": "ALL is the foundation for grand-total and percent-of-total measures, a near-universal DP-600 S1 DAX pattern, and directly applicable to BC dimension tables (customer, product) where Giulio needs sales-vs-total-sales percentages unaffected by report slicers."}, {"video_id": "MI7WIwBFhU0", "title": "Power BI DAX Back to Basics: Scalar vs Tabular Functions", "url": "https://www.youtube.com/watch?v=MI7WIwBFhU0", "published": "2020-04-16", "duration": "11m 26s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["all", "calculate", "calculated table", "crossfilter", "dax", "groupby", "sameperiodlastyear", "scalar functions", "tabular functions"], "summary": "Reza Rad breaks DAX functions into two categories — scalar functions (SUM, CALCULATE, AVERAGE) that return a single value, and tabular functions (ALL, RELATEDTABLE, CALENDAR, SAMEPERIODLASTYEAR) that return a table — and shows how mixing them in the wrong place (e.g. a scalar function as a table's definition) throws errors. He explains how they nest inside each other, using CALCULATE(SUM(...), SAMEPERIODLASTYEAR(...)) as the canonical example, and shows how to check a function's expected input/output types via DAX IntelliSense or docs.microsoft.com.", "relevance": "This is exactly the DAX mental model DP-600 expects for authoring measures, calculated tables, and calculation groups (S1): understanding which functions expect table arguments vs. scalar arguments is what lets Giulio correctly nest time-intelligence and filter functions in his BC-based measures without runtime errors."}, {"video_id": "6Lvy4S_EnAY", "title": "Aggregated Table in Power BI with Extra Options - Summarize Function in DAX", "url": "https://www.youtube.com/watch?v=6Lvy4S_EnAY", "published": "2020-03-30", "duration": "8m 55s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["aggregated table", "dax", "grouping", "issubtotal", "rollup", "rollupgroup", "summarize", "table functions"], "summary": "Reza walks through the DAX SUMMARIZE function for building grouped/aggregated tables, then covers the ROLLUP and ROLLUPGROUP options for adding subtotal/grand-total rows, and ISSUBTOTAL for detecting and customizing calculations (e.g. percent-of-total) on subtotal rows.", "relevance": "SUMMARIZE, ROLLUP and ISSUBTOTAL are table-manipulation and iterator-adjacent DAX functions tested under S1; useful for Giulio when building calculated/aggregated tables over BC data (e.g. a pre-aggregated sales-by-customer table) or writing measures that must behave differently on subtotal rows in a matrix."}, {"video_id": "IWJn2jVyb2o", "title": "Aggregated Table in Power BI — Using GroupBy Function in DAX", "url": "https://www.youtube.com/watch?v=IWJn2jVyb2o", "published": "2020-03-29", "duration": "8m 50s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["countx", "currentgroup", "dax", "groupby", "iterators", "sumx", "table functions", "virtual tables"], "summary": "Reza Rad explains the DAX GROUPBY function as a table function for creating aggregated virtual tables, showing how it differs from simple DISTINCT/VALUES lists once you add aggregation columns using CURRENTGROUP() combined with iterators like COUNTX, SUMX, and AVERAGEX, plus the restriction that CALCULATE cannot be used inside a GROUPBY expression.", "relevance": "GROUPBY and CURRENTGROUP are DAX table-function/iterator concepts tested under S1 (table-filtering functions) - understanding when to use GROUPBY vs SUMMARIZE/SUMMARIZECOLUMNS for virtual tables inside measures is directly relevant to building aggregation measures over BC sales/GL data."}, {"video_id": "YCJjeD8wz5c", "title": "Building a Virtual Relationship in Power BI — Basics of TREATAS DAX Function", "url": "https://www.youtube.com/watch?v=YCJjeD8wz5c", "published": "2020-03-04", "duration": "9m 01s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["context transition", "dax", "role-playing dimension", "star schema", "table functions", "treatas", "virtual relationship"], "summary": "Teaches the TREATAS DAX function: how it takes a table expression and applies its values as a filter context onto another table's columns, effectively creating a virtual relationship without a physical model relationship. Demonstrates filtering an unrelated fact table and building role-playing dimension measures (order date vs ship date) using TREATAS instead of USERELATIONSHIP.", "relevance": "TREATAS is a core S1 DAX table-filtering/context-transition technique for DP-600 — useful when Giulio's BC model has fact/dimension pairs that can't or shouldn't be physically related (e.g. avoiding ambiguous relationships) and for handling role-playing date dimensions like posting date vs due date in BC ledgers."}, {"video_id": "_DuGkki0rfs", "title": "Relationship Based on Multiple Fields in Power BI Using TREATAS DAX Function", "url": "https://www.youtube.com/watch?v=_DuGkki0rfs", "published": "2020-03-04", "duration": "6m 59s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["compound key", "context transition", "dax", "shared dimension", "star schema", "treatas", "virtual relationship"], "summary": "Reza Rad shows how to use TREATAS in DAX to build a virtual (compound-key) relationship between two unrelated tables based on multiple matching columns (title + year), explaining TREATAS's expression/column-list syntax and the column-count/order rules it requires. He's explicit this is for learning TREATAS mechanics, not a modeling recommendation — his real recommendation is a shared dimension with a compound key built in Power Query or a calculated column.", "relevance": "TREATAS-based virtual relationships and its column-order/count constraints are core DP-600 S1 DAX content, and understanding when NOT to use this pattern (vs. a proper shared dimension) is directly applicable to BC models where multiple fact tables (e.g. sales, purchases, budgets) sometimes lack a clean shared key."}, {"video_id": "Vzgdw1EAMZI", "title": "Caution When Using Variables in DAX and Power BI", "url": "https://www.youtube.com/watch?v=Vzgdw1EAMZI", "published": "2020-01-22", "duration": "7m 42s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculate", "context transition", "dax", "debugging dax", "filter context", "time intelligence", "variables"], "summary": "Demonstrates a classic DAX pitfall: a VAR defined outside a CALCULATE expression is evaluated in the outer filter context, not the context CALCULATE later applies, producing wrong same-period-last-year results; moving the VAR inside CALCULATE fixes it.", "relevance": "Filter-context timing of variable evaluation is a frequent DP-600 DAX-variables exam point and a real bug risk in time-intelligence measures Giulio writes over BC sales/GL data (e.g., prior-year comparisons, YTD)."}, {"video_id": "fOErC7eaWZ0", "title": "Write Conditional Statement Using SWITCH in DAX and Power BI", "url": "https://www.youtube.com/watch?v=fOErC7eaWZ0", "published": "2020-01-21", "duration": "8m 50s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["conditional formatting", "conditional logic", "dax", "field value", "if statement", "measures", "switch"], "summary": "Reza Rad shows how SWITCH replaces nested IF statements for conditional DAX measures, using a conditional-formatting example (background color by education category), then shows the SWITCH(TRUE(), ...) trick for handling greater-than/less-than range conditions instead of exact value matches.", "relevance": "SWITCH and SWITCH(TRUE()) are bread-and-butter DP-600 DAX patterns for tiering/bucketing measures over BC data, such as categorizing customers by balance range or aging buckets, and are cleaner and easier to maintain than nested IF chains for exam-style DAX questions."}, {"video_id": "sVACTQh5bOg", "title": "Relationship in Power BI with Multiple Columns", "url": "https://www.youtube.com/watch?v=sVACTQh5bOg", "published": "2019-10-29", "duration": "6m 33s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["composite key", "data modeling", "many-to-many", "merge columns", "power query", "relationships", "star schema"], "summary": "Reza Rad shows why Power BI can't create a relationship on more than one column directly, and demonstrates the workaround: use Power Query's Merge Column transformation to concatenate the join fields (e.g. year + month) into a single composite key column on both tables, then let Power BI auto-detect the single-column relationship.", "relevance": "BC data models frequently need composite-key joins (e.g. Document No. + Line No., or Posting Date year/period joins to a custom period table) that Power BI's relationship UI can't express directly; this is the go-to Power Query pattern for building a valid star-schema relationship in a DP-600 semantic model without duplicating data via extra calculated columns."}, {"video_id": "-3snD-VOqik", "title": "SUM vs SUMX What is the Difference of the two DAX Functions in Power BI", "url": "https://www.youtube.com/watch?v=-3snD-VOqik", "published": "2019-09-26", "duration": "12m 59s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["all function", "calculate", "dax", "iterators", "percent of total", "row context", "sum", "sumx"], "summary": "Reza compares SUM (aggregates one column) with SUMX (an iterator that evaluates a row-by-row expression across a table, then aggregates), showing how SUMX lets you combine columns like sales minus cost without extra helper measures. He also shows SUMX over ALL(table) to get an unfiltered total for percent-of-total calculations.", "relevance": "Core DAX fundamentals for the S1/S3 iterator and row-context concepts DP-600 tests directly, and margin-style calculations (sales minus cost, summed across a table) are exactly what Giulio needs for BC data where margin, discount, or landed-cost fields sit in separate columns of the same fact table."}, {"video_id": "x4KBv-GNohY", "title": "Basics of Time Intelligence in DAX for Power BI; Year to Date, Quarter to Date, Month to Date", "url": "https://www.youtube.com/watch?v=x4KBv-GNohY", "published": "2019-09-03", "duration": "9m 56s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P3"], "topics": ["calculate", "date table", "dax", "fiscal year", "month to date", "quarter to date", "time intelligence", "year to date"], "summary": "Reza Rad demonstrates core DAX time-intelligence measures on the AdventureWorks star schema: CALCULATE with DATESYTD for calendar year-to-date, adjusting the DATESYTD end-date parameter for a fiscal year-to-date, and DATESQTD/DATESMTD for quarter-to-date and month-to-date. Uses a standard Power BI date table/hierarchy as the driving date field.", "relevance": "Year-to-date, fiscal-YTD, quarter-to-date and month-to-date patterns are exactly the DAX time-intelligence building blocks tested under DP-600 S1 (DAX functions) and directly reusable for period-over-period reporting on BC sales/GL data, where fiscal year rarely equals calendar year."}, {"video_id": "SVEGfqCTodc", "title": "Measure vs Calculated Column in Power BI: The Mysterious Question, Not", "url": "https://www.youtube.com/watch?v=SVEGfqCTodc", "published": "2019-08-14", "duration": "16m 01s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1"], "topics": ["calculated column", "dax", "implicit measure", "in-memory storage", "measures", "row context", "vertipaq", "year to date"], "summary": "Reza Rad explains the core distinction between calculated columns and measures in DAX: calculated columns are pre-calculated row-by-row, stored in memory, and static until refresh, while measures are calculated on the fly at query time, return a single aggregated value, and consume CPU rather than memory. He demonstrates both with a margin column and a year-to-date measure on the Adventure Works model.", "relevance": "This is foundational DAX modeling knowledge directly tested in DP-600's S1 semantic-model-design objective (row context vs. dynamic evaluation) and underlies every measure Giulio writes over his Business Central semantic models — knowing when a calculation belongs in Power Query/a column versus a measure affects both model size and report responsiveness."}, {"video_id": "LfVDUiU8vaU", "title": "How to solve Inactive Relationship Problem with Role Playing Dimensions in Power BI", "url": "https://www.youtube.com/watch?v=LfVDUiU8vaU", "published": "2019-07-22", "duration": "8m 44s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["calculatetable", "date table", "dax", "inactive relationship", "modeling", "relationships", "role playing dimensions", "star schema"], "summary": "Reza explains why only one relationship between two tables can be active in Power BI, and demonstrates the role-playing dimension technique: cloning a small date table with DAX CALCULATETABLE/ALL to create Order Date, Ship Date and Due Date tables, each with its own active relationship to a fact table, instead of relying on inactive relationships.", "relevance": "Business Central fact tables (sales lines, ledger entries) often carry multiple date fields (posting date, due date, document date) against one small date dimension, exactly the scenario shown here; role-playing dimensions vs. USERELATIONSHIP is a core S1 modeling decision Giulio needs for star-schema design on his BC models."}, {"video_id": "fGKGDVEtcOU", "title": "Power Query Custom Functions Made Easy in Power BI — Step by Step Tutorial with Example", "url": "https://www.youtube.com/watch?v=fGKGDVEtcOU", "published": "2019-05-22", "duration": "16m 44s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["custom functions", "data ingestion", "get data from web", "invoke custom function", "looping sources", "m language", "parameters", "power query"], "summary": "Reza Rad demonstrates how to turn a Power Query step (scraping public-holiday tables from a website by year) into a reusable custom function using a parameter, then invoke that function across a generated list of years to loop-import and combine many similar sources into one table.", "relevance": "Custom functions plus 'Invoke Custom Function' are the standard pattern for looping a transformation across many files/sheets/URLs with identical structure - directly useful for pulling per-company or per-period exports from Business Central (e.g. one file per legal entity or fiscal year) into a single consolidated Power Query table without copy-pasting queries."}, {"video_id": "T8Ekr_sLP-0", "title": "Unpivot in Power BI and Power Query Transforming Budget Data from Columns to Rows", "url": "https://www.youtube.com/watch?v=T8Ekr_sLP-0", "published": "2019-05-07", "duration": "6m 15s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2"], "topics": ["budget data", "data transformation", "m", "power query", "star schema", "unpivot"], "summary": "Short RADACAD tutorial on using the Unpivot Columns transform in Power Query to turn wide budget data (one column per month/period) into a tall, row-based table suitable for modeling. NOTE: the transcript file for this video is corrupted (auto-captioned as unrelated foreign-language song lyrics, not the actual spoken content), so this record is built from the title/metadata only and should be treated as low-confidence.", "relevance": "Unpivoting wide period-column exports (a very common shape for BC budget, GL, and subledger exports) into a proper fact-row structure is a routine Power Query step before loading into a star schema model, and directly supports the transform/prepare skill area of DP-600."}, {"video_id": "qXH4WjCykLc", "title": "Append vs Merge in Power BI and Power Query", "url": "https://www.youtube.com/watch?v=qXH4WjCykLc", "published": "2018-09-10", "duration": "17m 32s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["P2", "S1"], "topics": ["append", "data preparation", "deduplication", "disable load", "join kinds", "m", "merge", "power query"], "summary": "Explains the two core ways to combine data sources in Power Query: append (stacking rows from tables with the same structure, like SQL UNION ALL, no dedup by default) and merge (joining tables on a key field to flatten structure, with different join kinds). Covers practical tips like disabling load on source queries and cleaning column names before appending.", "relevance": "Foundational Power Query modeling skill directly underpinning DP-600 P2 (transform/shape data) and S1 star-schema prep — Giulio combines multiple BC company/entity exports or historical tables and needs to choose append vs merge correctly, and disable-load intermediate queries to keep his BC semantic models lean."}, {"video_id": "C0nHSaz5ITg", "title": "Composite Model DirectQuery and Import Data Combined Evolution Begins in Power BI", "url": "https://www.youtube.com/watch?v=C0nHSaz5ITg", "published": "2018-07-24", "duration": "12m 34s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "S2"], "topics": ["composite model", "directquery", "dual storage mode", "import mode", "many-to-many relationships", "power bi desktop", "storage mode"], "summary": "Introduces Power BI's original composite model preview feature, combining DirectQuery and Import tables in one model, per-table storage mode settings, the new Dual storage mode for caching DirectQuery tables, and the forced many-to-many relationship requirement between Import and DirectQuery tables.", "relevance": "Composite models and per-table storage mode are core DP-600 S1 design decisions; Giulio's BC-sourced models could keep a huge BC ledger table on DirectQuery while importing lookup/dimension data to control model size and refresh time."}, {"video_id": "EnubM2UkESU", "title": "What is the Direction of Relationship in Power BI", "url": "https://www.youtube.com/watch?v=EnubM2UkESU", "published": "2018-07-11", "duration": "9m 56s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["bidirectional relationship", "crossfilter", "data modeling", "dax", "filter direction", "performance", "relationships", "star schema"], "summary": "Reza Rad explains single-direction vs. both-direction (bidirectional) relationships in Power BI's model, showing with the AdventureWorks example how filter propagation only flows from the one side to the many side unless you switch to bidirectional filtering, and why flipping every relationship to bidirectional causes serious performance problems.", "relevance": "This is core DP-600 star-schema/relationship theory: understanding filter direction is essential before modeling BC data, where you'll often need a dimension (customer, item) to filter another dimension through a fact table and must decide between remodeling vs. a bidirectional relationship vs. CROSSFILTER() in a measure."}, {"video_id": "d7uyGqT2P4g", "title": "Power BI Organizational Hierarchy or Chart of Accounts with Parent child functions in DAX", "url": "https://www.youtube.com/watch?v=d7uyGqT2P4g", "published": "2018-07-09", "duration": "15m 02s", "ch": "RADACAD", "accent": "#0891b2", "axis_label": "DP-600", "tags": ["S1", "P2", "M1"], "topics": ["chart of accounts", "dax", "hierarchy slicer", "lookupvalue", "organizational hierarchy", "parent-child hierarchy", "path function", "pathitem", "pathlength", "row-level security"], "summary": "Reza Rad walks through DAX parent-child functions (PATH, PATHLENGTH, PATHITEM, PATHITEMREVERSE) to unroll a self-referencing employee-key/parent-key table into a fixed number of hierarchy-level columns, then uses LOOKUPVALUE to resolve names and builds a drillable hierarchy in the report with a hierarchy slicer.", "relevance": "BC exposes org charts and chart-of-accounts as self-referencing parent/child tables (e.g. G/L Account Category, Dimension Value hierarchies, employee-manager structures); this is the standard DAX pattern to flatten those into star-schema-friendly level columns for a DP-600 semantic model, and PATHCONTAINS is the classic building block for dynamic org-based RLS."}], CH=[{"short": "Fabric", "accent": "#2563eb", "name": "Microsoft Fabric", "page": "../dp-600/videos.html", "axis_label": "DP-600"}, {"short": "Powercademy", "accent": "#7c3aed", "name": "Powercademy", "page": "powercademy.html", "axis_label": "cert"}, {"short": "Power Squared", "accent": "#0d9488", "name": "Power Squared", "page": "power-squared.html", "axis_label": "cert"}, {"short": "Matthew Devaney", "accent": "#ea580c", "name": "Matthew Devaney", "page": "matthew-devaney.html", "axis_label": "cert"}, {"short": "DamoBird365", "accent": "#e11d48", "name": "DamoBird365", "page": "damobird365.html", "axis_label": "cert"}, {"short": "Reza Dorrani", "accent": "#059669", "name": "Reza Dorrani", "page": "reza-dorrani.html", "axis_label": "cert"}, {"short": "Tiyani 365", "accent": "#d97706", "name": "Tiyani 365", "page": "tiyani-365.html", "axis_label": "cert"}, {"short": "SQLBI", "accent": "#4f46e5", "name": "SQLBI", "page": "sqlbi.html", "axis_label": "DP-600"}, {"short": "M365 Copilot", "accent": "#db2777", "name": "M365 Copilot Connection", "page": "m365-copilot-connection.html", "axis_label": "cert"}, {"short": "RADACAD", "accent": "#0891b2", "name": "RADACAD", "page": "radacad.html", "axis_label": "DP-600"}];
const accent={}; CH.forEach(c=>accent[c.short]=c.accent);
// topic -> {count, channels:Set, vids:[]}
const T={};
DATA.forEach(v=>v.topics.forEach(t=>{ (T[t]=T[t]||{c:0,ch:new Set(),v:[]}); T[t].c++; T[t].ch.add(v.ch); T[t].v.push(v); }));
const topics=Object.keys(T);
const cross=topics.filter(t=>T[t].ch.size>1);
document.getElementById('stat').textContent=`(${DATA.length} videos · ${topics.length} topics · ${cross.length} shared across channels)`;
document.getElementById('chlegend').innerHTML=CH.map(c=>`<span class="inline-flex items-center gap-1.5"><span style="width:10px;height:10px;border-radius:9999px;background:${c.accent}"></span><a href="${c.page}" class="hover:underline">${c.name}</a></span>`).join('');
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function dots(set){return [...set].map(c=>`<span title="${c}" style="width:8px;height:8px;border-radius:9999px;background:${accent[c]||'#999'};display:inline-block"></span>`).join(' ');}
function rank(a,b){ const d=T[b].ch.size-T[a].ch.size; return d||T[b].c-T[a].c; }
let active=null;
function topicChip(t){
  const on=t===active, span=T[t].ch.size>1;
  return `<button data-t="${esc(t)}" class="topic text-sm px-3 py-1.5 rounded-full border transition inline-flex items-center gap-2 ${on?'bg-indigo-600 text-white border-indigo-600':(span?'bg-white border-indigo-200 hover:border-indigo-400':'bg-white border-gray-200 hover:border-gray-300 text-gray-600')}">
    <span>${esc(t)}</span><span class="opacity-70 text-[11px]">${T[t].c}</span>${span?`<span class="inline-flex gap-0.5">${dots(T[t].ch)}</span>`:''}</button>`;
}
function renderTopics(filter){
  const list=topics.filter(t=>!filter||t.includes(filter)).sort(rank);
  document.getElementById('topics').innerHTML=list.map(topicChip).join('');
  const cb=cross.filter(t=>!filter||t.includes(filter)).sort(rank).slice(0,14);
  document.getElementById('crossbar').innerHTML = cb.length?('<div class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wide mb-2">Cross-channel connections</div><div class="flex flex-wrap gap-2 mb-5">'+cb.map(topicChip).join('')+'</div>'):'';
  document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{active=b.dataset.t;renderTopics(document.getElementById('q').value.trim().toLowerCase());renderResults();});
}
function card(v){
  const tags=v.tags.map(t=>`<span style="background:${v.accent}18;color:${v.accent};border:1px solid ${v.accent}44" class="text-[11px] font-semibold px-2 py-0.5 rounded-full">${esc(t)}</span>`).join(' ');
  return `<article class="border border-gray-200 rounded-2xl p-5 bg-white">
   <div class="flex items-start justify-between gap-3">
    <h3 class="font-semibold leading-snug"><a href="${v.url}" target="_blank" rel="noopener" class="hover:underline">${esc(v.title)}</a></h3>
    <span class="shrink-0 inline-flex items-center gap-1.5 text-xs font-medium" style="color:${v.accent}"><span style="width:8px;height:8px;border-radius:9999px;background:${v.accent}"></span>${esc(v.ch)}</span></div>
   <div class="text-xs text-gray-400 mt-0.5">${v.published} · ${v.duration||''}</div>
   <div class="flex flex-wrap gap-1.5 mt-2">${tags||'<span class="text-[11px] text-gray-400">general</span>'}</div>
   <p class="text-sm text-gray-700 mt-2 leading-relaxed">${esc(v.relevance||v.summary)}</p>
   <a href="${v.url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 mt-2 text-sm font-medium" style="color:${v.accent}">&#9654; Watch</a></article>`;
}
function renderResults(){
  const r=document.getElementById('results');
  if(!active){ r.innerHTML='<p class="text-gray-400 text-sm">Pick a topic above to see its videos across channels.</p>'; return; }
  const vids=T[active].v.slice().sort((a,b)=>(b.published||'').localeCompare(a.published||''));
  r.innerHTML=`<div class="flex items-center gap-2 mb-4"><h2 class="text-xl font-bold">${esc(active)}</h2><span class="text-sm text-gray-400">${vids.length} video${vids.length>1?'s':''} · ${[...T[active].ch].join(' + ')}</span></div><div class="grid md:grid-cols-2 gap-4">${vids.map(card).join('')}</div>`;
}
document.getElementById('q').addEventListener('input',e=>renderTopics(e.target.value.trim().toLowerCase()));
renderTopics(''); renderResults();
</script></body></html>
