guides) with more precision than the default indexing, and it's a hands-on Azure AI Search + Foundry embeddings workflow relevant to AI-102/AI-900."}, {"video_id": "LpRdT49U9Cw", "title": "Copilot Studio: ServiceNow Connect Knowledge Base + Helpdesk Tickets", "url": "https://www.youtube.com/watch?v=LpRdT49U9Cw", "published": "2025-08-04", "duration": "26m 49s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "AB-900"], "topics": ["copilot studio", "helpdesk", "knowledge sources", "list records", "oauth", "service principal", "topics", "user context"], "summary": "Connects a Copilot Studio agent to ServiceNow via an OAuth application registry (service principal), adds the ServiceNow knowledge table as a grounded knowledge source for IT support Q&A, then builds a topic that uses list-records actions with maker-provided credentials to fetch the current user's own recent incident tickets filtered by their email.", "relevance": "The pattern (OAuth service-principal setup, knowledge-table grounding, and a user-scoped 'my tickets' topic using maker credentials plus the calling user's email) is a directly reusable template for any 'personal record lookup' agent Giulio might build over BC or an internal ITSM/ticketing system, not just ServiceNow specifically."}, {"video_id": "u-Ef8MYqi-Y", "title": "Copilot Studio Easiest Way To Upload Files In Chat Window", "url": "https://www.youtube.com/watch?v=u-Ef8MYqi-Y", "published": "2025-07-27", "duration": "26m 59s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["copilot studio", "document analysis", "file upload", "generative orchestration", "pdf", "prompts", "question node", "topics"], "summary": "Shows two ways to let a Copilot Studio agent accept file uploads in chat: a topic-driven question node that validates file type and count before analyzing a PDF (an RFP) with a prompt action, and a topicless 'activity occurs' trigger with generative orchestration that auto-processes any uploaded file and saves it to OneDrive.", "relevance": "Directly useful for a 'BC/BI document intake' agent, e.g. letting users upload a PDF invoice or report and having an agent extract and validate structured details, a common ask on the Innovation team."}, {"video_id": "QTuuoUg8Hpg", "title": "Copilot Studio: How I Built A Generative Orchestration Agent", "url": "https://www.youtube.com/watch?v=QTuuoUg8Hpg", "published": "2025-07-06", "duration": "44m 39s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["adaptive cards", "ai agents", "copilot studio", "generative orchestration", "power fx", "state management", "topics", "variables"], "summary": "A full walkthrough of building a 'find meeting times' agent in Copilot Studio using generative orchestration: topic instructions vs general instructions, global table variables for conversation state, adaptive cards for multi-field input, disambiguation via repeated topic calls, timezone-aware Power Fx formulas, and a restart-agent topic that clears state.", "relevance": "This is core AB-620 build craft — global-variable state tracking, adaptive cards, and generative-orchestration instruction design are exactly the patterns Giulio would reuse for a BC/BI helpdesk-style agent that needs to hold multi-turn context (e.g. narrowing down a report, a customer, or a date range) without hard-coding every branch."}, {"video_id": "q-6wTZfF2iQ", "title": "Add Knowledge To Copilot Studio Using A Flow", "url": "https://www.youtube.com/watch?v=q-6wTZfF2iQ", "published": "2025-05-21", "duration": "21m 01s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "PL-900"], "topics": ["agent knowledge", "bound actions", "copilot studio", "dataverse", "knowledge sources", "power automate", "sharepoint"], "summary": "Builds a scheduled Power Automate flow that syncs large files (up to 512MB) from a SharePoint document library into a Copilot Studio agent's knowledge as bound file attachments, bypassing the 7MB direct-upload limit by comparing existing agent knowledge against the library and only uploading new files, then republishing the agent via a bound Dataverse action.", "relevance": "Directly solves a real limitation Giulio would hit grounding a BC/BI helpdesk agent on large financial statements, closing packages, or audit PDFs stored in SharePoint that exceed Copilot Studio's manual upload cap, and shows the underlying copilotcomponents Dataverse table structure useful for any pro-code agent management work."}, {"video_id": "3oGkXMW2HWI", "title": "Insane Copilot Studio SharePoint List Knowledge Workaround!!", "url": "https://www.youtube.com/watch?v=3oGkXMW2HWI", "published": "2025-04-13", "duration": "30m 40s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["AB-620", "PL-400", "PL-900"], "topics": ["agent actions", "ai prompts", "copilot studio", "natural language query", "odata", "power automate", "rest api", "sharepoint"], "summary": "Full build of a Copilot Studio agent that works around the lack of native SharePoint list knowledge support by using a Power Automate flow with an AI prompt that converts a natural-language question into a SharePoint REST API OData filter query, then calls the query via an HTTP action and returns filtered results in chat.", "relevance": "Directly applicable pattern for grounding a Copilot Studio agent against structured tabular data that isn't natively supported as 'knowledge' - the same architecture (natural-language-to-query prompt plus flow/HTTP action) could be adapted to query BC OData/API endpoints instead of SharePoint."}, {"video_id": "TQFwV9GQBYI", "title": "This App Builds Power Apps (100% REAL)", "url": "https://www.youtube.com/watch?v=TQFwV9GQBYI", "published": "2024-07-11", "duration": "11m 17s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["PL-400"], "topics": ["alm", "canvas apps", "code generation", "named formulas", "patch function", "power apps", "yaml"], "summary": "Demonstrates Power Apps' 'view code' YAML feature and shows a self-built canvas app (an 'input generator' and 'form generator') that uses named formulas to generate standardized YAML control code — including full patch-form screens targeting a Dataverse table — which can be pasted directly into the editor as working controls.", "relevance": "Directly relevant to standardizing patch-form patterns across BC/BI Power Apps builds — Giulio could use a similar named-formula code generator to enforce naming conventions and speed up form creation against BC Cloud-backed Dataverse tables instead of relying on the out-of-the-box form control."}, {"video_id": "DVHPmnm7olU", "title": "Search SharePoint In Power Apps With No Delegation Warning", "url": "https://www.youtube.com/watch?v=DVHPmnm7olU", "published": "2023-02-01", "duration": "12m 43s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["canvas apps", "collections", "delegation", "parsejson", "power apps", "power automate", "sharepoint"], "summary": "Walks through building a Power Automate flow workaround for Power Apps' lack of delegation support on the Search function against a large (6,000+ row) SharePoint list: the flow filters with substringof, returns JSON via a Compose action, and the app parses it with ParseJSON/ForAll into a collection for a searchable gallery.", "relevance": "Delegation limits are a real, recurring pain point when building canvas apps over large Dataverse/SQL/SharePoint data sets, and this exact pattern (flow-based search + ParseJSON collection) is the standard workaround Giulio would need for any BC-adjacent app searching large master data lists that exceed the 500/2000-row delegation limit."}, {"video_id": "p_VkZQxG5E8", "title": "Power Apps Tip: Generate Row Numbers In A Collection", "url": "https://www.youtube.com/watch?v=p_VkZQxG5E8", "published": "2022-08-25", "duration": "0m 43s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "collections", "patch", "power apps", "power fx", "row numbers", "sequence"], "summary": "Short Power Apps tip demonstrating a ForAll(Sequence(CountRows(...))) plus Patch pattern to add a sequential row-number field to every record in a collection.", "relevance": "Handy Power Fx pattern for numbering rows in a canvas app gallery, e.g. numbering BC purchase-order lines or invoice items pulled into a collection for display."}, {"video_id": "1PD9KSPN-rw", "title": "Power Apps Tip: Hide The Navigation Bar In Play Mode", "url": "https://www.youtube.com/watch?v=1PD9KSPN-rw", "published": "2022-08-14", "duration": "0m 53s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": [], "topics": ["app sharing", "canvas apps", "power apps", "ui tips", "url parameters"], "summary": "A 53-second tip showing how to append &hideNavBar=true to a canvas app's play URL to remove the purple navigation bar and reclaim screen space when sharing the app link.", "relevance": "Minor but useful when embedding or sharing a canvas app demo with BC/BI stakeholders in Teams or a browser tab where the full-screen app experience matters more than app-switching chrome."}, {"video_id": "mkTFvvYl6Qo", "title": "Power Apps Hack To Style All Form Controls In Seconds", "url": "https://www.youtube.com/watch?v=mkTFvvYl6Qo", "published": "2022-08-07", "duration": "1m 17s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": [], "topics": ["canvas apps", "form controls", "power apps", "productivity tip", "styling", "ui"], "summary": "A quick canvas app trick: toggling a form's layout from vertical to horizontal and back re-selects all its data card titles (or values) at once in the tree view, letting you bulk-restyle every control's font, color, or weight in one shot instead of editing each card individually.", "relevance": "A small productivity trick for building canvas apps faster, which is directly useful whenever Giulio prototypes a Power Apps front end over BC or Dataverse data in the sandbox and wants consistent styling without touching every control by hand."}, {"video_id": "qdSOQj-tcAo", "title": "Power Apps Tip: Remove Duplicate Rows From A Collection (Works Every Time)", "url": "https://www.youtube.com/watch?v=qdSOQj-tcAo", "published": "2022-07-30", "duration": "0m 52s", "ch": "Matthew Devaney", "accent": "#ea580c", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "collections", "deduplication", "distinct", "forall", "power apps", "power fx"], "summary": "Quick Power Apps tip showing the ForAll(Distinct(...)) pattern to strip duplicate rows out of a collection, using a vehicle list with duplicate year/make/model entries as the example.", "relevance": "A basic Power Fx pattern useful whenever Giulio dedupes data pulled from BC via a canvas app or Power Automate flow before displaying it to users; more a syntax reference than a project-shaping idea."}, {"video_id": "-Wz2J724gVk", "title": "Cowork can follow your processes with skills and even make videos", "url": "https://www.youtube.com/watch?v=-Wz2J724gVk", "published": "2026-08-31", "duration": "8m 41s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-730"], "topics": ["cowork", "long-running tasks", "microsoft 365 copilot", "researcher agent", "skills", "video generation", "work iq"], "summary": "Demonstrates Cowork 'skills' — reusable, shareable process definitions Cowork follows step by step — using an 'explainer video' skill: the presenter dictates an explanation, Cowork asks clarifying questions (audience, length, theme), requests screenshots, builds a storyboard and narration, and produces an MP3, transcript, and finished MP4 video. Closes with a recap of when to use Copilot chat vs built-in agents (Researcher, Prompt Coach) vs Copilot in-app vs Cowork for long-running tasks.", "relevance": "Demonstrates the 'skill as procedure' concept in Cowork, which is a template for turning Giulio's own repeatable Innovation-team processes (e.g. a standard report-build or documentation procedure) into a reusable Cowork skill rather than one-off prompting; the closing decision framework (chat vs agent vs in-app vs long-running task) is directly reusable guidance for the team."}, {"video_id": "eWQ_VA-HaUU", "title": "Power Platform Developer Fails: Sit Down If You've Done This", "url": "https://www.youtube.com/watch?v=eWQ_VA-HaUU", "published": "2026-08-22", "duration": "8m 20s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["alm", "best practices", "canvas apps", "connection references", "copilot credits", "environment variables", "expressions", "power automate", "solutions", "trigger conditions"], "summary": "A rapid-fire 'sit down if' format listing 12 common Power Platform architectural mistakes: infinite trigger loops, unnecessary apply-to-each loops instead of expressions/select, writing to Excel row-by-row instead of Graph API/Office Scripts, confusing Power Fx with Logic App expressions, not using containers in canvas apps, never using solutions/ALM, pulling too many rows instead of filtering at source, hardcoding values instead of environment variables, not scheduling repeated Copilot prompts, grounding agents on stale data, running production flows on personal accounts instead of connection references, and not understanding Copilot credits licensing.", "relevance": "A useful self-check list for Giulio's own Power Platform/BC automation practices and governance conversations - several items (environment variables, connection references, ALM/solutions, filtering at source, Copilot credits licensing) map directly to PL-400 exam objectives and real BC integration risk areas."}, {"video_id": "Q-knjZMCnmo", "title": "Copilot Scheduled Prompts: Write Your Weekly Update Automatically", "url": "https://www.youtube.com/watch?v=Q-knjZMCnmo", "published": "2026-08-16", "duration": "7m 53s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-730"], "topics": ["email automation", "microsoft 365 copilot", "prompt coach", "prompt engineering", "scheduled prompts", "status reporting"], "summary": "Shows M365 Copilot's scheduled prompts feature to auto-generate a recurring (e.g. Monday 7am) draft summary email of the past week's mailbox activity, categorized into urgent/lessons-learned/actions with a TL;DR, and iteratively improves the prompt using the 'Prompt Coach' agent to add red/amber/green status formatting.", "relevance": "A quick, low-effort M365 Copilot automation pattern (AB-730) Giulio could reuse for his own weekly status update to his manager or the Innovation team, and the Prompt Coach iteration workflow is a reusable technique for refining any Copilot Studio agent's instructions."}, {"video_id": "8UQT9DXZ4Rg", "title": "Build an Inbound Lead Agent That Responds in Seconds with Copilot Studio", "url": "https://www.youtube.com/watch?v=8UQT9DXZ4Rg", "published": "2026-08-08", "duration": "12m 16s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-900", "PL-400"], "topics": ["classification", "copilot studio", "custom engine agent", "lead routing", "outlook", "sharepoint", "teams", "tools", "workflows"], "summary": "End-to-end build of an inbound-lead triage workflow in the new Copilot Studio Workflows designer: a SharePoint list item (created by an existing public-website contact-form flow) triggers a classification node that buckets the submission into categories (consulting, training, speaking, video/blog idea), then routes to different in-line-built agents — one drafts a reply and pings Teams, another checks a Microsoft List of course pricing and sends a priced reply automatically, with live tests showing sub-minute responses.", "relevance": "A strong, fully worked pattern for classification-then-route agentic workflows that Giulio could adapt for BC/BI-adjacent intake scenarios (e.g. classifying incoming BC support/data requests and routing to different response agents), and a clear walkthrough of building an agent in-line inside a workflow with tools and grounded knowledge from a list."}, {"video_id": "3t34qz-GaLc", "title": "New Copilot Studio UI: What's Different & What It Costs", "url": "https://www.youtube.com/watch?v=3t34qz-GaLc", "published": "2026-08-04", "duration": "11m 04s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "AB-900", "AB-100"], "topics": ["copilot credits", "copilot studio", "github copilot harness", "licensing", "memory", "skills", "standard harness", "workflows"], "summary": "Walks through the new Copilot Studio UI built around the 'GitHub Copilot harness' - simplified instructions, skills, tools/MCP, workflows (replacing agent flows), and memory - contrasted with the classic 'standard harness' (generative orchestration), explaining that anything built or run in the new harness consumes Copilot credits, while standard-harness agents deployed to Teams/M365 remain covered by existing Copilot licenses.", "relevance": "Essential, current licensing and architecture knowledge for Giulio's Innovation team when deciding whether to build new Copilot Studio agents on the classic harness (covered by existing licenses if deployed to Teams) versus the new credit-billed GitHub Copilot harness - directly affects cost planning for BC/BI agent pilots."}, {"video_id": "2NZvxuZZHGM", "title": "Build PowerPoint Decks 10x Faster With This", "url": "https://www.youtube.com/watch?v=2NZvxuZZHGM", "published": "2026-06-28", "duration": "17m 45s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["bulk document generation", "code interpreter", "excel", "expressions", "power automate", "powerpoint", "prompt", "python"], "summary": "Builds a Power Automate flow that populates a PowerPoint template's placeholders (text boxes with curly-brace tokens) using the 'Run a prompt' action with code interpreter enabled, which writes and executes Python behind the scenes; extends the flow to loop through Excel table rows via List rows to bulk-generate one personalized deck per row, plus number/date formatting via expressions (formatNumber, formatDateTime) and troubleshooting type-coercion errors.", "relevance": "A strong PL-400 pro-code-adjacent pattern (prompt-generated Python via code interpreter) for mail-merge-style document generation Giulio could reuse to auto-generate client or board decks from BC or Dataverse rows, with the Excel-loop-to-file-per-row pattern directly transferable to BI reporting deliverables."}, {"video_id": "UlMRzGAC7wg", "title": "How to get a day's work done in 30 minutes (using Copilot, Cowork & Scout)", "url": "https://www.youtube.com/watch?v=UlMRzGAC7wg", "published": "2026-06-14", "duration": "16m 11s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-730"], "topics": ["autonomous agents", "cowork", "human in the loop", "microsoft 365 copilot", "researcher agent", "scout", "skills", "work iq"], "summary": "A fictional scenario demo chaining several Microsoft 365 Copilot surfaces: Copilot chat drafts and sends an email reply grounded on Work IQ; the Researcher agent runs deep multi-step research comparing competitor products; Cowork (long-running task agent, usable via mobile) produces a PDF product brief and an HTML slide deck using a pre-defined branding 'skill' and drafts a follow-up email; Copilot in Word edits a table's formatting agentically; and Scout (a separate autopilot desktop app) reads Work IQ context, drafts a LinkedIn post with an image, opens a browser, and stages the post for human approval.", "relevance": "Good illustration of task-to-tool mapping across the Copilot ecosystem (quick chat vs deep research vs long-running multi-file agent work vs autonomous browser action) that's useful for advising colleagues on which Copilot surface fits which BC/BI-adjacent task, though it is product-tour rather than build-your-own content relevant to certs."}, {"video_id": "ZEQwTEWvpEs", "title": "I Tested Microsoft Scout (The AI That Controls Your PC)", "url": "https://www.youtube.com/watch?v=ZEQwTEWvpEs", "published": "2026-06-09", "duration": "55m 19s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "AB-900", "AB-730"], "topics": ["agentic ai", "browser automation", "copilot cowork", "copilot credits", "copilot studio", "github copilot harness", "mcp", "memory", "microsoft scout", "skills"], "summary": "A live webinar-style deep dive covering three related agentic tools: Copilot 'cowork' for long-running M365 tasks with reusable 'skills' (markdown procedure files) stored in OneDrive; the new Copilot Studio preview UI with a GitHub Copilot 'harness', skills, memory, and Copilot-credit billing; and Microsoft Scout, a desktop agent that runs PowerShell and automates a browser via Playwright MCP, demonstrated by extracting PDF pages and drafting a LinkedIn post.", "relevance": "A high-level view of where Microsoft agentic tooling is heading in 2026 (skills, harnesses, cowork, Scout) - important context for Giulio's Innovation team strategy on which tool to pilot next, and a preview of the new Copilot Studio credit-based billing model that affects cost planning for BC/BI agent projects."}, {"video_id": "JmV2oGPqIrc", "title": "World Cup Newsletter Built Entirely with AI | Here's What Happened", "url": "https://www.youtube.com/watch?v=JmV2oGPqIrc", "published": "2026-05-25", "duration": "9m 52s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-730", "AB-100"], "topics": ["ai agents", "automation", "copilot cowork", "html generation", "reusable procedures", "skills", "teams", "web research"], "summary": "Demonstrates Microsoft Copilot Cowork, a longer-running task-executing agent (as opposed to single-turn chat), used to research the web and generate a polished HTML newsletter by reusing an Anthropic-published front-end design 'skill' saved as a reusable Markdown skill file in OneDrive, then sending the result by email; shows Cowork's session and skills folder structure and mentions applying the same pattern to summarize Teams channel activity into a weekly newsletter.", "relevance": "Introduces Copilot Cowork and the 'skills as reusable Markdown procedures' concept, relevant to AB-730/AB-100, and directly reusable for Giulio's Innovation-team reporting via a Cowork task that reviews Teams channels or BC release notes weekly and drafts a formatted newsletter."}, {"video_id": "K-gbM4r-9eM", "title": "First Look at the NEW Copilot Studio Workflows Interface", "url": "https://www.youtube.com/watch?v=K-gbM4r-9eM", "published": "2026-05-11", "duration": "8m 41s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-400", "PL-900"], "topics": ["agent flows", "ai agents", "copilot studio", "expenses", "grounding", "low-code", "sharepoint", "workflows"], "summary": "First-look tour of the redesigned Copilot Studio 'Workflows' canvas (successor to agent flows): freeform drag-and-drop node layout, per-node testing without running the whole flow, sticky notes, and new AI-native nodes for calling Microsoft 365 Copilot agents (e.g. Researcher), executing an agent and waiting for its response, and classification. Demonstrates an expenses-receipt workflow: SharePoint upload triggers an agent grounded on an expenses policy to flag exceptions and email a summary.", "relevance": "Shows the direction Copilot Studio's automation canvas is heading — agent-calling nodes, per-step testing, and workflows solution-aware by default — relevant to how Giulio should design future BC-adjacent automations (e.g. expense/approval-style agents grounded on BC policy documents)."}, {"video_id": "Iu0M0Urf5gk", "title": "Power Automate: Create Word Documents without the Premium Connector", "url": "https://www.youtube.com/watch?v=Iu0M0Urf5gk", "published": "2026-05-04", "duration": "26m 05s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["base64 images", "document generation", "dynamic content", "html to word", "licensing", "power automate", "standard connector"], "summary": "Detailed Power Automate build showing how to generate a Word document (and PDF) with a dynamic number of embedded images using only standard connectors, by composing raw HTML with base64-encoded images inside an apply-to-each loop and saving it with a .doc extension, which Word auto-converts to .docx - avoiding the premium Word connector entirely and its fixed-image-count limitation.", "relevance": "A practical cost-saving technique for BC/BI reporting scenarios where a document with a variable number of images or attachments (e.g. an audit trail or asset photos) needs to be generated without premium licensing - directly useful given Giulio's standard/no-premium licensing constraints."}, {"video_id": "HiLDKLjXAz8", "title": "Dynamic images in Word with Power Automate tutorial", "url": "https://www.youtube.com/watch?v=HiLDKLjXAz8", "published": "2026-04-26", "duration": "16m 21s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["attachments", "coalesce", "document generation", "error handling", "expressions", "power automate", "sharepoint", "word template"], "summary": "Power Automate tutorial for embedding a variable number of SharePoint list attachment images into fixed image placeholders in a Word template using 'Populate a Word document,' building the attachment array via nested Compose actions, indexing images by array position, and using coalesce() with a fallback placeholder image to gracefully handle missing images (with the known limitation that dynamic/repeating image tables are not supported).", "relevance": "A solid deterministic Power Automate and expression-writing pattern (coalesce, array indexing) for PL-400/PL-900 that Giulio could reuse for any BC-driven document generation involving images, such as asset or product photos on a generated report, independent of any AI component."}, {"video_id": "LIe2LOXFnCQ", "title": "Never Manually Set Out of Office Again | Automate with Copilot & Power Automate", "url": "https://www.youtube.com/watch?v=LIe2LOXFnCQ", "published": "2026-04-18", "duration": "21m 32s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["automation", "copilot", "date time", "excel", "expressions", "filter query", "outlook", "power automate", "recurrence"], "summary": "Two-part tutorial: first, setting an Outlook out-of-office reply conversationally via Microsoft 365 Copilot (dictated prompt, confirmation, applied from either Copilot or Outlook); second, a detailed Power Automate build using the 'set up an automatic reply' action driven by an Excel table of date ranges and messages, covering date/time expression pitfalls (UTC now, formatDateTime, timezone Z-suffix bugs), filter queries on list rows, apply-to-each loops, and converting the flow to a daily recurrence with a lead-time offset.", "relevance": "A concrete, well-explained Power Automate expression/date-time troubleshooting walkthrough (UTC, formatDateTime, filter query syntax) that is directly transferable to any scheduled BC/BI automation Giulio builds, plus a simple example of driving a flow from an Excel/SharePoint data table rather than hardcoded values."}, {"video_id": "31-Afiq1XGM", "title": "I Built a Power App Using Only My Voice and GitHub Copilot CLI", "url": "https://www.youtube.com/watch?v=31-Afiq1XGM", "published": "2026-03-21", "duration": "1h 12m 55s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["ai-assisted development", "code apps", "context window", "dataverse", "github copilot cli", "mcp", "multi-agent", "power apps", "squad framework"], "summary": "A long-form, largely unedited build session where the presenter uses voice dictation and GitHub Copilot CLI with a multi-agent 'squad' framework (each agent with its own persona and context window) to plan, scaffold, and build a Power Apps code app with a Dataverse backend end to end - covering requirements gathering via conversation, schema design, using the Dataverse MCP server to create tables and seed data, parallel agents building screens, context-window management, and iterative bug fixing from user testing.", "relevance": "Highly relevant to Giulio as a pro-code Power Platform developer exploring agentic/AI-assisted development for code apps and Dataverse - demonstrates a repeatable multi-agent workflow for planning, building, and testing a Power Platform code app, plus practical context-window and MCP gotchas worth knowing before trying this on a BC-related app."}, {"video_id": "7P_Lutdlo64", "title": "Community Call: Copilot Studio Deep Dive on Autonomous", "url": "https://www.youtube.com/watch?v=7P_Lutdlo64", "published": "2026-03-05", "duration": "43m 04s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-100", "AB-620", "AB-900", "PL-400"], "topics": ["alm", "autonomous agents", "copilot studio", "evaluation", "execute agent", "generative orchestration", "model selection", "rag", "slot filling"], "summary": "Live community-call whiteboarding and build session architecting an autonomous assessment-marking agent: why RAG-based knowledge search over a SharePoint folder unreliably skips files, the fix of looping a flow per-file into a single-purpose 'execute agent' action, populating Word report templates via a flow-called topic (slot filling in generative orchestration), model choice (GPT chat/reasoning/fine-tuned vs. Claude, data residency), ALM (dev/test/prod) best practice, and the new agent evaluation action.", "relevance": "High-value architecture discussion for AB-100/AB-620: explains exactly why 'throw a folder of files at an agent's knowledge base' fails at scale and the correct pattern (flow loops one file per single-purpose agent execution), directly applicable to any BC/BI document-batch-processing agent Giulio designs, plus candid talk on ALM and model/data-residency tradeoffs relevant to his Innovation-team governance role."}, {"video_id": "8OHgy-RjVFc", "title": "I Built an App at Every Level: Prompt, Low-Code, and Pro-Code", "url": "https://www.youtube.com/watch?v=8OHgy-RjVFc", "published": "2026-02-19", "duration": "1h 18m 31s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-900", "PL-400", "AB-620", "AB-100", "AI-102"], "topics": ["agent 365", "azure ai foundry", "billing", "code apps", "copilot studio", "custom engine agent", "dataverse", "declarative agent", "mcp", "prompts", "vibe coding"], "summary": "A long live-stream tour across the full no-code-to-pro-code spectrum: building a sentiment-analysis prompt in Power Automate and calling it from a flow; using Microsoft 365 Copilot chat, Prompt Coach, and a declarative agent for the same task; building a custom engine agent in Copilot Studio with Jira MCP tools and email/Jira integration; a look at Copilot Studio billing changes; a tour of Agent 365 governance; deploying and chatting with a model in Azure AI Foundry (including Claude/Anthropic) and building a Foundry agent; and finally scaffolding and vibe-coding a pro-code Power Apps 'code app' (React) locally with GitHub Copilot/Claude in VS Code, including a live Kanban app build and Dataverse table inspection.", "relevance": "A comprehensive map of exactly the decision Giulio needs to make repeatedly on the Innovation team — no-code (M365 Copilot agent) vs low-code (Copilot Studio custom engine agent with MCP tools) vs pro-code (Foundry/code apps) — with a working custom engine agent + MCP tools example and a code apps walkthrough directly relevant to PL-400 pro-dev skills."}, {"video_id": "K2MOqJ0JA3g", "title": "How to Connect Copilot Studio to Google Cloud via Agent to Agent (A2A)", "url": "https://www.youtube.com/watch?v=K2MOqJ0JA3g", "published": "2026-02-05", "duration": "5m 53s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-100", "AB-620"], "topics": ["a2a", "agent card", "agent to agent", "copilot studio", "external agents", "multi-agent orchestration"], "summary": "Demonstrates the agent-to-agent (A2A) protocol by connecting a Copilot Studio 'master' agent to an external agent hosted on Google Cloud Platform, using the agent's 'agent card' (a JSON endpoint) to register it as an external connected agent, enabling multi-agent orchestration across platforms with zero extra actions defined manually.", "relevance": "Useful for Giulio's broader Innovation team AI strategy - shows that Copilot Studio can orchestrate agents built on other platforms, relevant if BC or other partner tooling eventually exposes agents outside the Microsoft stack that need to be composed together."}, {"video_id": "_f9w8fM-hjU", "title": "This Power Automate Flow Reads Invoices with AI", "url": "https://www.youtube.com/watch?v=_f9w8fM-hjU", "published": "2026-01-25", "duration": "13m 29s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900", "AB-620"], "topics": ["ai builder", "automation", "document extraction", "excel", "invoice processing", "power automate", "prompt", "shared mailbox"], "summary": "Builds an end-to-end Power Automate flow that triggers on emails with PDF attachments in a shared mailbox, uses a custom AI 'run a prompt' action to extract structured invoice fields from the PDF regardless of layout (no fragile OCR templates), writes the results as a row into an Excel table, and moves the processed email into a folder.", "relevance": "A near-textbook pattern Giulio could adapt for BC: mailbox-triggered flow, AI prompt extracts invoice/PO data, then post directly into BC via API instead of Excel; a concrete, buildable demo for his AP/BI automation work and an honest look at layout-agnostic AI extraction vs. brittle template OCR."}, {"video_id": "9byCozA0f14", "title": "LLMs vs AI Agents: What's the Real Difference?", "url": "https://www.youtube.com/watch?v=9byCozA0f14", "published": "2026-01-17", "duration": "15m 24s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AI-900", "AB-730", "PL-900"], "topics": ["ai agents", "autonomy", "frontier models", "grounding", "human in the loop", "llm", "multimodal", "orchestration"], "summary": "A plain-language glossary walkthrough of core AI terminology: frontier models, LLMs, multimodal, orchestration, prompts, declarative prompting, grounding, tools, automation, human in the loop, agents, and autonomy — each defined with a relatable analogy and a Power Platform/Copilot example.", "relevance": "Solid foundational vocabulary review for Giulio's AI cert prep (especially AI-900/AB-730 terminology) and for explaining agent concepts to non-technical BC/BI colleagues; no hands-on build, but useful as a shared-language primer before demos."}, {"video_id": "WJu3OJdiPak", "title": "Copilot Agents: Generate Word Docs with Copilot Studio & Power Automate", "url": "https://www.youtube.com/watch?v=WJu3OJdiPak", "published": "2026-01-01", "duration": "9m 44s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["agent flows", "copilot studio", "document generation", "power automate", "slot filling", "topics", "word templates"], "summary": "Walks through generating a personalized Word document from a Copilot Studio agent by combining a topic with input parameters for slot filling, an agent flow that runs a document-generation prompt against a Word template with double-curly-brace placeholders, and returning the file as a binary output back to the agent for download - including the workaround needed so the file does not come back corrupted.", "relevance": "Directly reusable for Giulio's Power Platform/BC work - e.g. an agent that generates a standard letter, report cover page, or BC-related document (such as an audit summary) on request, fully via natural language slot filling."}, {"video_id": "eHpeB7SpvvQ", "title": "5 Microsoft Copilot Prompts That Save Hours Weekly", "url": "https://www.youtube.com/watch?v=eHpeB7SpvvQ", "published": "2025-12-06", "duration": "9m 37s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-730"], "topics": ["dictation", "microsoft 365 copilot", "productivity", "prompt engineering", "use case discovery", "web grounding"], "summary": "Five practical M365 Copilot prompt patterns for daily productivity: dictating an end-of-day summary email, recapping a missed meeting via Copilot's grounding, turning a photo of a whiteboard/slide into a categorized use-case table (industry, complexity, ROI), drafting a consumer complaint letter with web grounding, and researching a purchase decision, plus the Win+C shortcut.", "relevance": "Mostly general M365 Copilot productivity, but the photo-to-structured-use-case-table prompt is directly reusable for Giulio's Innovation-team job of triaging AI/automation ideas, and the end-of-day summary pattern fits his own status reporting workflow."}, {"video_id": "EAPtVhDMwXA", "title": "Microsoft 365 Copilot: Run Copilot Studio Agents Free", "url": "https://www.youtube.com/watch?v=EAPtVhDMwXA", "published": "2025-11-15", "duration": "11m 00s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "AB-900", "PL-900"], "topics": ["copilot credits", "copilot studio", "custom engine agent", "governance", "licensing", "microsoft 365 copilot", "premium connectors", "teams"], "summary": "Explains that since 1 September, custom engine agents built in Copilot Studio and used via a Microsoft 365 Copilot license (in Teams/M365/mobile) consume zero additional Copilot Studio credits — only autonomous/proactive usage is billed. Demonstrates a Planner task-creation agent used from a phone via voice, and shows the Power Platform admin center usage report distinguishing billed vs. non-billed message consumption, plus notes that premium connectors are included at no extra license cost inside Copilot Studio agents.", "relevance": "Important licensing/cost knowledge for Giulio's Innovation team role: it means a custom engine agent grounded on BC/BI data or a Dataverse tool set can be deployed to end users with M365 Copilot licenses at effectively zero incremental Copilot Studio cost, which changes the ROI case for pitching agent-building internally."}, {"video_id": "UFJ0Tux5LSI", "title": "Microsoft Copilot vs Copilot Studio: Agents Explained", "url": "https://www.youtube.com/watch?v=UFJ0Tux5LSI", "published": "2025-11-09", "duration": "44m 35s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-900", "AB-620", "AB-100", "AB-900"], "topics": ["agent to agent", "autonomous agents", "computer use agents", "copilot", "copilot studio", "environments", "generative orchestration", "grounding", "licensing", "mcp", "multimodal"], "summary": "A conceptual, non-demo walkthrough explaining the full Microsoft agent landscape: personal/enterprise Copilot vs Copilot Studio, grounding (web vs work vs knowledge), declarative agents in Copilot Studio Light, environments/tenants, generative orchestration, autonomous agents triggered by flows, multimodal prompts (images/documents/Python code interpreter), computer use agents (CUA), MCP, and agent-to-agent (A2A) orchestration.", "relevance": "A strong foundational primer for Giulio's cert study and for framing conversations with his Innovation team about which agent-building approach (declarative vs Copilot Studio vs autonomous) fits a given BC/BI use case, and the licensing/environment boundaries that matter for governance."}, {"video_id": "mdc4gE7fNcs", "title": "Copilot Studio Tutorial: Planner Tasks in M365", "url": "https://www.youtube.com/watch?v=mdc4gE7fNcs", "published": "2025-10-11", "duration": "11m 39s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-900", "AB-100"], "topics": ["copilot studio", "custom engine agent", "generative orchestration", "input parameters", "microsoft 365 copilot", "planner", "teams", "tools"], "summary": "Builds a custom-engine Copilot Studio agent, 'Task Planner', that creates, lists, and updates Microsoft Planner tasks using out-of-the-box Planner connector actions as tools, configuring input parameters (custom value vs. dynamically fill with AI) and tool descriptions that drive generative orchestration, then publishes to Microsoft 365 Copilot/Teams and demos with voice dictation.", "relevance": "A clean, reusable template for configuring tool inputs (custom vs. dynamically-fill-with-AI) and writing descriptions that steer orchestration correctly, directly transferable to building a BC/BI agent that creates or updates records via BC connector actions rather than Planner."}, {"video_id": "TQ_9yzRahbg", "title": "Power Automate's hidden Python feature is insane", "url": "https://www.youtube.com/watch?v=TQ_9yzRahbg", "published": "2025-09-14", "duration": "16m 32s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900", "AB-620"], "topics": ["ai builder", "code interpreter", "copilot studio", "dataverse", "power automate", "prompts", "python", "web api"], "summary": "Deep hands-on demo of the code interpreter (Python) capability inside Power Automate prompts: a CSV uploaded to SharePoint triggers a flow that runs two parallel prompts using generated Python — one converts the CSV to a formatted/highlighted Excel file plus a pie chart, the other performs data-validation and bulk-inserts 500 records into Dataverse via the Web API. Also shows wiring the same prompts into a Copilot Studio agent topic so a Teams/chat upload triggers the identical processing.", "relevance": "Highly relevant for Giulio's BI/BC work: this is a concrete, low-code pattern for bulk data validation and Dataverse ingestion (or, by extension, BC data prep) using AI-generated Python rather than manual Power Query/expression logic, and it shows the same logic reused from both a flow trigger and a Copilot Studio agent."}, {"video_id": "9GjiMBIY3-Y", "title": "Copilot Studio On-Prem SQL Server Tutorial", "url": "https://www.youtube.com/watch?v=9GjiMBIY3-Y", "published": "2025-09-07", "duration": "12m 47s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["actions", "copilot studio", "knowledge", "on-premises data gateway", "slot filling", "sql server", "tools"], "summary": "Shows connecting Copilot Studio to a local on-premises SQL Server via the on-premises data gateway - adding SQL tables as knowledge for natural-language Q&A, and adding a SQL 'insert row' tool/action so the agent can create new customer records with AI-driven slot filling of input parameters.", "relevance": "Very relevant if Giulio needs an agent to reach an on-prem or BC-adjacent SQL source (e.g. a local reporting database) rather than only cloud Dataverse/Fabric - the gateway pattern and description-driven slot filling are core Copilot Studio skills for BC integration scenarios."}, {"video_id": "P8mKbncVNmo", "title": "Copilot Studio Custom Connector Tutorial (Fake API)", "url": "https://www.youtube.com/watch?v=P8mKbncVNmo", "published": "2025-08-30", "duration": "12m 57s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "AB-620", "PL-900"], "topics": ["c#", "copilot studio", "custom connector", "generative orchestration", "mock api", "prototyping", "tools"], "summary": "Step-by-step build of a Copilot Studio custom connector against a nonexistent 'fake' holiday API, using the connector's C# code-behind to return mocked JSON (generated via Copilot chat) for two actions, get hotels and get flights, then wiring both actions as tools into an agent and testing generative orchestration calling both automatically from a single natural-language question.", "relevance": "Directly a PL-400 custom connector skill, and a genuinely useful prototyping technique: build a mock BC-shaped connector with fabricated JSON to prototype an agent's tool-calling behavior before wiring to the real BC OData/API endpoints, de-risking demos and avoiding exposure of live data."}, {"video_id": "0UZdI8MUJAQ", "title": "How to Convert Cloud Flows to Agent Flows (Tutorial)", "url": "https://www.youtube.com/watch?v=0UZdI8MUJAQ", "published": "2025-08-02", "duration": "11m 47s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["PL-400", "PL-900", "AB-620"], "topics": ["agent flows", "alm", "cloud flows", "copilot studio", "licensing", "power automate", "premium connectors", "solutions"], "summary": "Hands-on tutorial explaining agent flows in Copilot Studio: a new message/API-call-based consumption licensing model (no standard/premium connector split, includes AI Builder and premium connectors) versus the traditional per-user cloud flow licensing. Demonstrates building an agent flow directly in Copilot Studio, and converting an existing solution-aware cloud flow into an agent flow via the plan settings in make.powerautomate.com.", "relevance": "Directly relevant to Giulio's flow-building work on BC/BI automations: understanding when to license a flow as an agent flow (consumption-based, includes Dataverse/premium connectors) vs. a standard cloud flow could reduce licensing friction for BC-integrated automations that currently need premium/process licenses."}, {"video_id": "qjMBkk0R_7s", "title": "Copilot Studio MCP Tutorial: Dataverse CRUD Demo", "url": "https://www.youtube.com/watch?v=qjMBkk0R_7s", "published": "2025-07-13", "duration": "13m 16s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-400", "PL-900"], "topics": ["ai agents", "copilot studio", "crud", "custom connector", "dataverse", "mcp", "rag"], "summary": "Explains MCP (Model Context Protocol) in Copilot Studio via two demos: using the Microsoft Learn MCP server for RAG-style knowledge retrieval (built as a custom connector), and using the native Dataverse MCP server to let an agent list tables and create/read/update records in natural language against a Lego inventory table.", "relevance": "MCP plus Dataverse CRUD is central to AB-620 and highly relevant to Giulio's BC/BI work - an agent that can query and update Dataverse tables via natural language (rather than hardcoded actions) could sit on top of staging tables that mirror BC data."}, {"video_id": "-DGZEvhy_t4", "title": "NEW Copilot Studio CUA Automates ERP Invoices", "url": "https://www.youtube.com/watch?v=-DGZEvhy_t4", "published": "2025-07-05", "duration": "11m 26s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "AB-100", "PL-400"], "topics": ["ai builder", "autonomous agents", "computer use agent", "copilot studio", "invoice processing", "power automate", "triggers"], "summary": "Demonstrates Copilot Studio's Computer Use Agent (CUA, preview) reasoning over a screen to log into a legacy ERP with no API and manually enter invoice details, triggered autonomously by an incoming email; a Power Automate flow extracts invoice data as JSON via a prompt and hands it to an autonomous Copilot Studio agent that runs the CUA on a virtual machine.", "relevance": "BC has full APIs so CUA isn't strictly needed there, but the pattern (mailbox-triggered autonomous agent, prompt extracts structured invoice JSON, agent orchestrates a downstream tool) maps directly onto AP automation and clarifies when to reach for screen-based CUA vs. proper API/connector integration, a useful architecture distinction for Giulio's Innovation-team decisions."}, {"video_id": "po3hp-WKCKQ", "title": "Copilot Agents Future: A2A, MCP & CUA Explained", "url": "https://www.youtube.com/watch?v=po3hp-WKCKQ", "published": "2025-06-22", "duration": "13m 47s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "AB-100"], "topics": ["agent to agent", "computer use agents", "copilot studio", "mcp", "multi-agent", "rpa"], "summary": "A vlog-style recap from Damian's travels to Build, European Collaboration Summit, and EPPC, explaining three emerging agent concepts at a conceptual level: agent-to-agent (A2A) for connecting subject-matter-expert agents across platforms, MCP (model context protocol) as a standard way for agents to consume APIs, and computer-use agents (CUA) that operate legacy UIs like a human via screenshots. No hands-on build shown.", "relevance": "Useful conceptual grounding for how Copilot Studio is evolving toward multi-agent architectures and standardized tool access (MCP), which matters for how Giulio should architect future BC/BI agents rather than building monolithic single agents."}, {"video_id": "_J6Sdg4vNDQ", "title": "Autonomous Copilot Agent for Excel Email Automation", "url": "https://www.youtube.com/watch?v=_J6Sdg4vNDQ", "published": "2025-06-14", "duration": "16m 33s", "ch": "DamoBird365", "accent": "#e11d48", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["autonomous agents", "copilot studio", "email triggers", "excel automation", "generative orchestration", "knowledge", "power automate", "topics"], "summary": "Demonstrates an autonomous Copilot Studio agent triggered by an incoming email with an Excel attachment (RFI questions); the agent loops through each row using \"create generative answers\", writes answers back to the Excel table via Power Automate, and replies to the original email - all without a chat UI, using generative orchestration plus a topic with input parameters and a callback flow.", "relevance": "Directly applicable to Giulio's Innovation team work on autonomous 'answer this from our docs' agents - the RFI pattern (loop through structured input, ground each question individually, write back) maps well to answering BC/BI questions from documentation or Dataverse records."}, {"video_id": "VjIMfMFosyw", "title": "Make SharePoint Forms 10x Better with JSON (Sections, Read-Only & Conditional Fields) + Claude AI", "url": "https://www.youtube.com/watch?v=VjIMfMFosyw", "published": "2026-03-09", "duration": "20m 51s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900"], "topics": ["ai-assisted development", "claude", "conditional formatting", "json", "list forms", "power fx", "read-only fields", "sharepoint"], "summary": "Customizes a SharePoint list form via JSON: conditional field visibility formulas, organizing fields into named sections (body JSON), conditional read-only field settings (e.g. locking fields once status is approved/rejected, or unless the current user is the assigned owner), and styled header/footer JSON with a mailto action - then shows using Claude (fed the list's exported CSV schema plus sample JSON snippets from Microsoft's docs) to generate and iterate the header/body/footer JSON instead of hand-writing it, combined with SharePoint rules to auto-assign an owner field.", "relevance": "Demonstrates a concrete, low-effort AI-assisted workflow (export list schema, hand it to Claude with a spec, paste back generated JSON) that Giulio could reuse for any SharePoint-based tracking list adjacent to BC/BI work, and models a general pattern of using an LLM to generate config/JSON for a Microsoft low-code surface rather than manually reading docs."}, {"video_id": "3tcmlvxgafk", "title": "Power Apps Modern Controls: Microsoft's BIGGEST Combo Box Update (Fixes & New Features)", "url": "https://www.youtube.com/watch?v=3tcmlvxgafk", "published": "2026-03-02", "duration": "21m 21s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["combo box", "delegation", "entra id", "forms", "modern controls", "people picker", "power fx", "sharepoint"], "summary": "Covers major modern combo box updates: the 800-item cap removed (bounded instead by app data-row limit up to 2000), server-side delegable search via the control's SearchText output property for large data sets, and building a working multi-select people picker against Microsoft Entra (Office365Users.SearchUserV2) including the tricky patch-back logic for single- and multi-select SharePoint person columns inside a form data card, plus a workaround for a bug when combo boxes live inside form controls.", "relevance": "Detailed pro-code Power Fx patterns (delegable search, multi-select people picker, patching person-type columns) that Giulio would need for any BC-adjacent app requiring searchable large lookups or user/approver selection UI, and a good example of debugging real modern-control limitations."}, {"video_id": "Wzwb5HFTqzk", "title": "How to Create Your Own Microsoft 365 Tenant (Free & Trial Options)", "url": "https://www.youtube.com/watch?v=Wzwb5HFTqzk", "published": "2026-02-23", "duration": "12m 41s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": [], "topics": ["dataverse", "entra id", "environments", "m365 tenant", "power apps developer plan", "sandbox", "trial"], "summary": "Compares options for getting a personal M365 tenant to learn/build in: M365 for Individuals (no Entra ID or Power Platform), the now-restricted M365 Developer Program (free 90-day E5, auto-renewing), and M365 Business plans (30-day free trial, full tenant with Entra ID/Power Platform/SharePoint/Teams). Also shows setting up a free Power Apps developer plan environment (up to 3 per account) for Dataverse premium capabilities without a paid business subscription.", "relevance": "Practical logistics video rather than a technical skill — useful if Giulio ever needs a personal sandbox tenant/environment outside his employer's for independent cert study or experimentation, but has no direct BC/BI content."}, {"video_id": "963VlahSuO8", "title": "SharePoint Just Got WAY Better: Workflows, Approvals, Quick Steps & Rules Explained", "url": "https://www.youtube.com/watch?v=963VlahSuO8", "published": "2026-02-16", "duration": "19m 39s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900"], "topics": ["approvals", "automation", "lists", "power automate", "quick steps", "rules", "sharepoint", "workflows"], "summary": "Tour of new modern SharePoint list/library automation features: the Workflows panel (Power Automate triggers/actions embedded directly in SharePoint, built from templates or from scratch), Quick Steps (one-click custom actions like 'assign to me' or 'complete task' shown conditionally as an actions column), Rules (event-driven actions like due-date reminder emails), and an overhauled Approvals feature (multi-stage approval chains, default/locked approvers, approval-status metadata usable in rules and quick steps).", "relevance": "These SharePoint automation primitives (workflows, quick steps, rules, approvals) are a low-effort alternative or complement to full Power Automate flows for lightweight process automation around lists that could sit alongside BC/BI-adjacent tracking lists (e.g. an issue log or approval tracker) without needing a Dataverse-based Copilot Studio agent."}, {"video_id": "T9C8LYiYlvg", "title": "Power Apps FINALLY Has a REAL Confirm Dialog Box (Stop Building Custom Popups!)", "url": "https://www.youtube.com/watch?v=T9C8LYiYlvg", "published": "2026-02-09", "duration": "14m 13s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "confirm function", "dialog box", "forms", "modern controls", "power fx", "ux patterns"], "summary": "Introduces the new built-in Confirm() function in canvas Power Apps as a replacement for hand-built popup/dialog patterns, covering its syntax (message, title, subtitle, button text) and applied scenarios: delete confirmation, bulk delete with dynamic item counts, choice-tracking with variables, and unsaved-form-changes warnings using the form's Unsaved property.", "relevance": "A small but immediately usable code-quality improvement for any canvas app Giulio builds or maintains — replaces brittle custom dialog components with a single built-in function, reducing app complexity and maintenance for confirm/cancel and unsaved-changes patterns common in data-entry apps over BC data."}, {"video_id": "NPr9bBnD0aQ", "title": "Microsoft Upgraded SharePoint Document Libraries: AI, Knowledge Agent & UX Updates", "url": "https://www.youtube.com/watch?v=NPr9bBnD0aQ", "published": "2026-02-02", "duration": "16m 11s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-730", "PL-900"], "topics": ["ai actions", "autofill", "copilot", "document libraries", "knowledge agent", "m365 copilot", "metadata", "sharepoint"], "summary": "Tours the refreshed modern SharePoint document library UX (streamlined command bar, breadcrumbs, saved/pinned views, forms tied to folders) alongside new Copilot AI actions (summarize, ask-a-question via knowledge agent, generate FAQ, generate audio overview, compare files) and a knowledge agent that can auto-suggest and autofill metadata columns across an entire library by reading file content (e.g., extracting years-of-experience from resumes).", "relevance": "The knowledge-agent autofill-metadata feature is a concrete, low-effort AI win for any BC/BI-adjacent document library (contracts, policy docs, vendor files) where metadata hygiene is usually manual; the ask-a-question/summarize actions are also a quick way to demo grounded Copilot value to non-technical stakeholders."}, {"video_id": "i2ah2PQV4RI", "title": "How to Build a Power Apps Gallery with Horizontal & Vertical Scroll | Editable Table", "url": "https://www.youtube.com/watch?v=i2ah2PQV4RI", "published": "2026-01-26", "duration": "29m 47s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["canvas apps", "crud", "dataverse", "editable table", "gallery control", "patch function", "power fx", "responsive design"], "summary": "Detailed build of an editable spreadsheet-like gallery in a responsive canvas app over a Dataverse inventory table: constructing a horizontal container of mixed input controls (text, combo box, number) per row, enabling simultaneous horizontal and vertical scroll via gallery/container minimum-width and minimum-height formulas, building an aligned header row bound to control widths, and implementing inline row editing with a selected-item variable, conditional display modes, and Patch-based save plus a 'new item' create action - full CRUD in a gallery.", "relevance": "A genuinely advanced, reusable canvas-app pattern (editable data-grid-in-a-gallery with dual scroll and inline edit) that goes well beyond the standard Power Apps data table control, directly useful for building a lightweight editable grid over BC data (e.g. inventory or order lines) inside a canvas app without a premium/pro-code grid."}, {"video_id": "vkmdsIL_zXA", "title": "Power Apps Modern Card Control – Build Stunning Responsive Cards in Minutes 🔥", "url": "https://www.youtube.com/watch?v=vkmdsIL_zXA", "published": "2026-01-15", "duration": "11m 56s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "card control", "galleries", "modern controls", "power fx", "responsive design", "sharepoint", "ui design"], "summary": "Deep dive on the modern card control's properties (title, subtitle, description, image placement/style, header image, on-select, display mode, styling) and two applied builds: a fully responsive document-library card gallery (dynamic wrap count by screen size, SVG file-type icons) and a SharePoint list card gallery linked to a form.", "relevance": "A reusable single-control pattern for building responsive, data-bound card layouts, useful whenever Giulio needs a modern, mobile-friendly list view (e.g. a BC document/asset browser) without stacking multiple controls manually."}, {"video_id": "REmbj0GKnZk", "title": "How to Build a Modern Expandable Navigation Menu in Power Apps", "url": "https://www.youtube.com/watch?v=REmbj0GKnZk", "published": "2026-01-12", "duration": "29m 59s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["access app scope", "canvas apps", "components", "modern controls", "navigation", "power fx", "responsive design", "security trimming"], "summary": "Ground-up pro-code build of a reusable two-level, responsive, collapsible left-navigation component in Power Apps canvas apps: driven by a formula-defined nav-structure table (key/title/screen/icon/submenu/security), using access-app-scope for component-level variables, dynamic icon-only collapsing at small widths, expand/collapse submenu state, and security-role-based menu trimming via Filter.", "relevance": "A reusable, data-driven navigation component is foundational for any multi-screen internal Power Apps tool Giulio builds for BC/BI users, and the security-trimming pattern (filtering nav items by user role) is directly relevant for role-based internal apps."}, {"video_id": "D-VGewJ58GE", "title": "This New Power Apps Grid Container Changes Everything (Responsive Design in Canvas Apps)", "url": "https://www.youtube.com/watch?v=D-VGewJ58GE", "published": "2025-12-17", "duration": "12m 25s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["canvas apps", "containers", "grid container", "low-code", "power apps", "responsive design", "ui controls"], "summary": "Introduces the new grid container control for responsive canvas apps: defining rows/columns/gap/padding to auto-lay-out controls, building a card-based home screen (2x2 grid of image+button cards) and a two-column form layout by placing controls at specific grid row/column positions, and testing responsiveness across widescreen/tablet/mobile with far less container nesting than traditional horizontal/vertical containers.", "relevance": "A core PL-400/PL-900 canvas-app UI-building skill; the grid container simplifies building responsive forms and card layouts, which is directly applicable to any canvas app front end Giulio builds over BC or Dataverse data that needs to work across devices without deep container nesting."}, {"video_id": "2pzFyCMO3Nw", "title": "How Microsoft's Dataverse MCP Server Leveled Up Copilot Studio 🤯 + Power Apps", "url": "https://www.youtube.com/watch?v=2pzFyCMO3Nw", "published": "2025-12-15", "duration": "14m 36s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-620", "AI-102", "PL-400", "PL-900"], "topics": ["ai agents", "copilot studio", "dataverse", "environment settings", "generative pages", "mcp", "model context protocol", "sql query"], "summary": "Explains MCP conceptually (protocol vs. API) then demonstrates Microsoft's built-in Dataverse MCP server: enabling it in environment settings, allow-listing MCP clients (Copilot Studio, Power Apps), and using its tools (list/describe tables, read query, create/update record) from a Copilot Studio agent and from a generative-pages React page in a model-driven app to run live SQL-style queries against Dataverse.", "relevance": "Central to Giulio's Foundry/agent interests and AB-620/AI-102: shows a no-code way to give an agent full CRUD/query access to Dataverse tables with user-level security, plus how to call the same MCP tools directly from custom Power Apps code — a pattern that generalizes to any future BC-data-in-Dataverse scenario."}, {"video_id": "4_pN9jHaNUQ", "title": "This AI Flow Exports ANY SharePoint List to Excel with ONE Prompt 🚀🔥", "url": "https://www.youtube.com/watch?v=4_pN9jHaNUQ", "published": "2025-12-08", "duration": "22m 52s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "AI-900"], "topics": ["ai prompts", "excel export", "flows", "graph api", "natural language query", "odata", "power automate", "schema", "sharepoint"], "summary": "Builds a Power Automate flow that lets a user describe a data-export request in plain natural language; the flow fetches the SharePoint list's schema via a Graph HTTP request, feeds schema plus user query into an AI prompt (custom instructions, few-shot corrections for date formats and person columns) that generates a valid OData filter query, applies it via Get Items, then writes the filtered results to an Excel file in OneDrive via the Graph API and emails it to the requester.", "relevance": "This natural-language-to-query pattern generalizes directly to letting non-technical BC/BI users self-serve filtered exports from Dataverse or SharePoint-backed operational lists without writing OData or FetchXML themselves — a strong Power Automate + AI prompt combo for internal reporting requests."}, {"video_id": "jnV7h-0bu7o", "title": "4 Ways to Build Power Apps: No-Code → Low-Code → Vibe Code → Pro-Code", "url": "https://www.youtube.com/watch?v=jnV7h-0bu7o", "published": "2025-12-01", "duration": "16m 51s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400", "AB-730"], "topics": ["alm", "code apps", "dataverse", "generative pages", "low-code", "no-code", "plan designer", "power apps", "pro-code", "vibe coding"], "summary": "Maps the full Power Apps creation spectrum: the M365 Copilot App Builder agent (no-code, SharePoint-backed), the classic canvas/model-driven Power App Studio via Plan Designer (low-code, Dataverse, full connector ecosystem, ALM-supported solutions), the new vibe.powerapps.com endpoint that generates a full-stack React 'code app' on Dataverse from a natural-language description (with a requirements/data/code/solution agent team), and pro-code development of code apps in VS Code deployed with pac code push - plus the new maker/app inventory reporting in the admin center.", "relevance": "This is the clearest single map of where each Power Platform build approach fits for Giulio's Innovation-team work - choosing between M365 Copilot App Builder for quick team tools, Plan Designer + canvas/model-driven apps for enterprise ALM-managed solutions, vibe.powerapps.com for rapid full-stack prototypes, and code apps/VS Code for pro-code integration with BC APIs."}, {"video_id": "9s94GsxT50g", "title": "Microsoft Just Reinvented App Development: Meet the New Power Apps 🚀", "url": "https://www.youtube.com/watch?v=9s94GsxT50g", "published": "2025-11-19", "duration": "10m 02s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["ai agents", "code apps", "dataverse", "full stack apps", "low-code", "plan designer", "power apps", "vibe coding"], "summary": "First look at vibe.powerapps.com, a new full-stack 'vibe coding' experience where a team of agents (requirements, data, code, solution) build a complete React application with a Dataverse data model from a single natural-language prompt, supporting inline visual editing, chat-based Q&A on the app, and one-click publish/share.", "relevance": "Signals where low-code/pro-code convergence is heading on Power Platform, directly relevant to the Innovation team's AI-adoption mandate as a fast way to prototype internal BC/BI tools without a formal build cycle."}, {"video_id": "MURSkbnO61s", "title": "How to Sort & Filter Like a Pro in Power Apps (Multiple Columns + Delegation Tips)", "url": "https://www.youtube.com/watch?v=MURSkbnO61s", "published": "2025-11-17", "duration": "22m 51s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["canvas apps", "delegation", "filter", "gallery", "modern controls", "performance", "power fx", "sharepoint", "sort"], "summary": "Deep pro-code Power Fx tutorial on building dynamic, delegable multi-column sort and filter UI in a canvas app against a SharePoint list: covers Sort vs SortByColumns, which column types are delegable per SharePoint (number, single text, boolean, datetime — not choice/lookup/person), building sortable column-header buttons with direction indicators, and combining multiple filter conditions with AND/OR while respecting the 2,000-row delegation limit.", "relevance": "Directly applicable pro-code skill for any canvas app Giulio builds over large Dataverse or SharePoint-backed BC data — delegation limits and non-delegable warnings are a common real-world blocker when building list/grid experiences over large datasets, and this is core PL-400 material."}, {"video_id": "CNrPpoYNuQ8", "title": "Inside Microsoft 365 Copilot's NEW App Builder and Workflow Agents — Full Tutorial", "url": "https://www.youtube.com/watch?v=CNrPpoYNuQ8", "published": "2025-11-10", "duration": "14m 18s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-730", "PL-900"], "topics": ["app builder agent", "copilot studio light", "frontier program", "m365 copilot", "no-code", "power automate", "sharepoint", "workflows agent"], "summary": "Walks through three Frontier-program agents inside M365 Copilot: the App Builder agent, which prompts a SharePoint-list-backed React app into existence and lets users iterate and share it like a OneDrive document; the Workflows agent, which builds a scheduled Power Automate flow (query a SharePoint list, filter, email a report) purely from a natural-language description; and Copilot Studio Light ('create agent'), a simplified agent-creation flow grounded on an uploaded document.", "relevance": "These are citizen-developer, no-connector tools for personal/team productivity apps and automations that live entirely inside M365 Copilot (SharePoint-backed, license-gated) - useful for Giulio to know as the lightweight alternative to full Power Apps/Automate for quick team utilities, and to correctly scope PL-900/AB-730 boundaries between M365 Copilot tools and the full Power Platform."}, {"video_id": "JJhbBlMuNHM", "title": "Power Apps Gallery with Tabbed Filters | Step-by-Step Tutorial", "url": "https://www.youtube.com/watch?v=JJhbBlMuNHM", "published": "2025-11-03", "duration": "19m 56s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["canvas apps", "filtering", "galleries", "modern controls", "named formulas", "power fx", "sharepoint", "ui design"], "summary": "Detailed canvas-app build of a tabbed-filter gallery over a SharePoint list: a data-driven tab bar (colors/icons stored in a Power Fx array/named formula), dynamic button styling for the active tab, a filtered vertical gallery keyed to tab selection, and priority/status icon and color-coding.", "relevance": "A reusable canvas-app UX pattern (status-tab filtering with color-coded results) that maps well onto BC status fields (e.g. document/approval status) and gives Giulio concrete Power Fx patterns for data-driven styling rather than hardcoded values."}, {"video_id": "z9IRLTvBInU", "title": "How to Turn Excel Spreadsheets into Power Apps (2025) | Step-by-Step Beginners Tutorial", "url": "https://www.youtube.com/watch?v=z9IRLTvBInU", "published": "2025-10-27", "duration": "22m 45s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["calculated columns", "data flows", "dataverse", "excel import", "generative pages", "lookup columns", "model-driven apps", "solutions", "tables"], "summary": "Full beginner walkthrough of importing a multi-sheet Excel workbook (with pivot tables) into Dataverse: creating a solution/publisher, importing Excel as tables, converting text columns to lookup relationships via defined keys, creating a calculated formula column to replace an Excel calculation, building a model-driven app with full CRUD, and finally using the app agent to generate a modern showcase page and an Excel-like pivot table page.", "relevance": "This is essentially the exact pattern for migrating any BC-adjacent Excel-based tracker (inventory, budgets, reconciliation sheets) into a governed Dataverse app — relevant both as a PL-900/PL-400 foundational skill and as a realistic first sandbox project using BC export data."}, {"video_id": "KxaeTx1i75M", "title": "Power Apps QUIZ App in Minutes", "url": "https://www.youtube.com/watch?v=KxaeTx1i75M", "published": "2025-10-13", "duration": "11m 36s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "data modeling", "dataverse", "generative pages", "low-code", "model-driven apps", "plan designer", "security roles"], "summary": "Showcases a complete quiz application (quiz-taker and admin experiences, timed questions, scoring, attempt limits, Excel bulk-import of questions) and explains how it was built: Plan Designer took a natural-language business requirement, generated a data model (quizzes/questions/attempts/participants) and a technology recommendation, then two model-driven apps plus a generative-pages React UI were created on top of Dataverse, secured with two custom security roles.", "relevance": "A worked example of the full low-code delivery pipeline - Plan Designer for requirements-to-data-model, model-driven apps for admin, gen pages for a polished end-user UI, and security roles for access control - which mirrors the kind of small internal tool (e.g. a BC training/certification quiz for the team) Giulio could deliver end-to-end on Power Platform."}, {"video_id": "S3WVKpNWp2c", "title": "Building Model-Driven Power Apps the Modern Way (2025 Tutorial)", "url": "https://www.youtube.com/watch?v=S3WVKpNWp2c", "published": "2025-10-06", "duration": "13m 38s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["dashboards", "data exploration agent", "dataverse", "generative pages", "model-driven apps", "plan designer", "relationships", "tables"], "summary": "End-to-end modern model-driven app build: creating Dataverse tables/relationships via Copilot-assisted table creation, using Plan Designer to generate a full data model and app from a plain-language business problem, exploring in-app data exploration/visualization agents, and extending the standard app with generative pages (task boards, calendars, dashboards, search).", "relevance": "Solid PL-900/PL-400 foundation and a good template for how Giulio could stand up a governed model-driven app over BC-mirrored Dataverse data quickly, then layer generative pages on top for richer views than out-of-the-box forms/views provide."}, {"video_id": "iFtrlUIQ0P0", "title": "Copilot Studio Agent Flows: Request for Information (RFI) Action Tutorial", "url": "https://www.youtube.com/watch?v=iFtrlUIQ0P0", "published": "2025-09-29", "duration": "21m 59s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-620", "PL-900"], "topics": ["agent flows", "ai prompts", "copilot studio", "dataverse", "human in the loop", "json output", "power automate", "request for information", "validation"], "summary": "Covers the Request for Information (RFI) action in Copilot Studio agent flows: it pauses a flow to send an actionable Outlook email with a custom form and resumes once the recipient responds. Builds a visitor-access-request flow where an AI prompt (with JSON output) validates whether a Microsoft Forms submission has all required details, and if not, uses RFI to request the missing info via email and update a Dataverse record once complete.", "relevance": "RFI plus a validation AI prompt is a strong pattern for BC-adjacent approval workflows where submitted data (expense details, purchase requests) is often incomplete — an agent flow could validate against business rules and auto-request missing information by email before writing to Dataverse."}, {"video_id": "2WpY7NAGPnY", "title": "Power Apps Generative Pages: Code EDITING, Code COMPARE & GPT-5 in Action!", "url": "https://www.youtube.com/watch?v=2WpY7NAGPnY", "published": "2025-09-22", "duration": "12m 20s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["PL-400", "PL-900"], "topics": ["code compare", "code editing", "dataverse", "gen pages", "generative pages", "gpt-5", "model-driven apps", "react"], "summary": "Deep dive on gen pages' pro-code capabilities: generating a React page over the Dataverse user table with GPT-5, then directly hand-editing the generated code (filtering by domain, swapping displayed columns, changing colors via find/replace, adding a Material UI avatar component, adding an Excel export button, adding a record count) alongside agent-driven changes, and using the new code-compare (diff) view to see exactly what changed between versions.", "relevance": "Shows that gen pages is not just no-code prompting but a real hybrid pro-code/low-code surface with a diff/version history - relevant for Giulio evaluating how far he could push a generated Power Apps UI with manual React tweaks (e.g. custom formatting or export logic) beyond what prompting alone achieves."}, {"video_id": "6qLO95rtRGg", "title": "AI Approvals in Agent Flows | Multistage Approvals in Microsoft Copilot Studio", "url": "https://www.youtube.com/watch?v=6qLO95rtRGg", "published": "2025-09-15", "duration": "26m 50s", "ch": "Reza Dorrani", "accent": "#059669", "axis_label": "cert", "tags": ["AB-620", "AB-100", "PL-900"], "topics": ["agent flows", "ai approvals", "approvals", "conditional logic", "copilot studio", "dataverse", "human in the loop", "power automate"], "summary": "Builds a multi-stage claims-approval agent flow in Copilot Studio combining an AI approval stage (instructions-based auto approve/reject, including receipt-image validation) with human-in-the-loop manual approval stages route
