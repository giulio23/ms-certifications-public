se"], "summary": "A Microsoft PM interview explaining why Fabric has schema-enabled and non-schema Lakehouses, the technical differences (Hive/Cosmos DB metastore vs. a new OneLake-native catalog), cross-workspace queries and joins enabled by the new catalog, OneLake security support for both types, and the two-script in-place migration path from non-schema to schema-enabled.", "relevance": "Settles a real architecture decision for Giulio's Fabric sandbox — always create new Lakehouses as schema-enabled since it's required for OneLake security and enables cross-workspace joins, which matters if he later splits BC data across separate dev/test/prod workspaces."}, {"video_id": "8-u26TcA4LM", "title": "What Are Delta Tables in Microsoft Fabric? - Full Guide!", "url": "https://www.youtube.com/watch?v=8-u26TcA4LM", "published": "2026-05-05", "duration": "29m 59s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "S2"], "topics": ["acid transactions", "delta", "optimize", "parquet", "partitioning", "time travel", "transaction log", "v-order", "vacuum"], "summary": "A hands-on deep dive into the Delta table format itself: how inserts/updates/deletes/merges physically rewrite Parquet files, the transaction log, time travel, and the maintenance commands OPTIMIZE, VACUUM, V-Order, plus a full walkthrough of partitioning with a notebook demo showing the resulting folder/file structure.", "relevance": "This is core plumbing knowledge for DP-600's Direct Lake and lakehouse optimization topics — understanding why his BC sales Delta tables accumulate small files after incremental loads, and when OPTIMIZE/VACUUM/partitioning would actually matter at his (currently small) data volume."}, {"video_id": "PV9LieOmYQE", "title": "What's New in Microsoft Fabric? (Latest Features Explained)", "url": "https://www.youtube.com/watch?v=PV9LieOmYQE", "published": "2026-05-04", "duration": "1h 15m 32s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", orts to Delta, and MLVs as a lighter-weight alternative to notebooks for his silver/gold layer logic."}, {"video_id": "4a5X6NwJSZ0", "title": "OneLake Security in Microsoft Fabric: What Works and What Breaks", "url": "https://www.youtube.com/watch?v=4a5X6NwJSZ0", "published": "2026-04-20", "duration": "54m 47s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "S2"], "topics": ["column-level security", "direct lake", "fabric api", "onelake security", "power bi semantic model", "row-level security", "service principal", "sql endpoint"], "summary": "An extensive, honest hands-on test of OneLake security (still preview) — enabling it on a schema-enabled Lakehouse, switching the SQL endpoint to user identity mode, building roles with object/row/column-level security, testing behavior across the Lakehouse UI, SQL endpoint, Spark notebooks, and Power BI semantic models (Direct Lake on OneLake and on SQL), plus managing roles via API and CI/CD caveats.", "relevance": "This is squarely DP-600 security and governance content and highly relevant since Giulio's BC sales data likely has sensitive columns (pricing, margins) — shows OneLake security's RLS/CLS works reliably through Power BI/Direct Lake, his actual consumption path, even though it's flaky in Spark notebooks."}, {"video_id": "MvSJLT55y9g", "title": "Microsoft Fabric Item Soft Delete", "url": "https://www.youtube.com/watch?v=MvSJLT55y9g", "published": "2026-04-13", "duration": "9m 44s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["governance", "item recovery", "item soft delete", "recycle bin", "retention period", "workspace roles"], "summary": "Demonstrates Fabric's item-recovery (recycle bin) feature: enabling it tenant-wide with a 7-90 day retention window, deleting and restoring a lakehouse (data is preserved), dependency blocking (can't hard-delete a notebook a still-recoverable pipeline depends on), name-collision handling on restore, and workspace-role permissions (only admins can permanently delete before retention expires; item-level share permissions are NOT restored).", "relevance": "Squarely a governance/maintenance feature under DP-600's Maintain pillar — knowing that accidental deletion of a lakehouse or semantic model can be recovered (but that sharing permissions must be reapplied) is practical safety-net knowledge for managing his own BC/Fabric sandbox workspace and its item permissions."}, {"video_id": "s5cmFr3uOZ4", "title": "Fix Microsoft Fabric Item Ownership Issues (Service Principal CI/CD)", "url": "https://www.youtube.com/watch?v=s5cmFr3uOZ4", "published": "2026-02-17", "duration": "10m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["azure devops", "ci/cd", "deployment pipelines", "fabric api", "item ownership", "service principal"], "summary": "Shows how personal-account item ownership in Fabric causes scheduled pipelines/notebooks to break when a developer's password expires, and demonstrates the fix — running Fabric deployment pipelines from Azure DevOps using a service principal so deployed items are owned by the SPN instead of a person, including the required Entra security group, admin portal, and workspace permission setup.", "relevance": "DP-600 dev-lifecycle/CI-CD content that's directly applicable once Giulio's BC Fabric sandbox work matures beyond solo experimentation into a real dev/test/prod pipeline his BI team maintains — avoids the classic \"pipeline broke because someone's password expired\" incident."}, {"video_id": "cQWkms3tUgM", "title": "Microsoft Fabric Pipelines Full Course for Beginners (2.5 Hours) | Step-by-Step", "url": "https://www.youtube.com/watch?v=cQWkms3tUgM", "published": "2026-02-09", "duration": "2h 33m 42s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["authentication methods", "connections", "copy data", "fabric pipelines", "parameters", "scheduling", "service principal", "workspace identity"], "summary": "A refreshed, 12-lecture beginner course covering the same core pipeline territory as the earlier full course: activities and their categories (data movement/transformation/control), connections and authentication methods (account key, SAS, OAuth, service principal, workspace identity), parameters/variables, expressions, scheduling/monitoring, and copy data with binary vs. typed CSV-to-table copies including column mapping/type changes, building toward metadata-driven pipelines and best practices.", "relevance": "Same value as the 2024 full course: a solid pipeline-engineering foundation for maintaining and extending his BC ingestion pipeline, with the connections/authentication-methods lecture particularly useful for securely connecting Fabric to BC's API. Mostly DP-700-flavored orchestration content rather than DP-600 exam material beyond basic P1 ingestion concepts."}, {"video_id": "QLD6M_GRu_c", "title": "Microsoft Fabric OneLake & Databases Full Overview", "url": "https://www.youtube.com/watch?v=QLD6M_GRu_c", "published": "2026-01-14", "duration": "53m 35s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "P3"], "topics": ["cosmos db", "delta parquet", "eventhouse", "fabric sql database", "lakehouse", "mirroring", "onelake", "warehouse"], "summary": "A broad \"Fabric data stores fundamentals\" lecture covering OneLake, shortcuts, mirroring, Delta Parquet internals (inserts/updates/deletes, time travel, ACID), then walks through Lakehouse, Warehouse, and Eventhouse strengths/weaknesses, and closes with Fabric's transactional databases (SQL DB, Cosmos DB) and how they auto-mirror into OneLake.", "relevance": "This is essentially a DP-600 \"data stores\" module in one video — helps Giulio map his BC Cloud to Power BI pipeline onto Fabric's store options and understand that if he ever needs a transactional Fabric SQL DB for app-side data, it would auto-mirror into OneLake for reporting."}, {"video_id": "lSl7GwFG10M", "title": "Fabric Forge Announcement - Everything you need to know!", "url": "https://www.youtube.com/watch?v=lSl7GwFG10M", "published": "2026-01-07", "duration": "5m 30s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["affiliate program", "dp-600 dp-700 exam prep", "fabric forge", "paid course", "skool community"], "summary": "A promotional launch video for 'Fabric Forge,' a paid learning-hub/community on Skool covering Fabric fundamentals through end-to-end solutions, run by the channel host plus three other Fabric/Power BI experts, with pricing, affiliate program, and weekly call details.", "relevance": "A marketing announcement, not technical content; not relevant to DP-600 study material itself, though the underlying course topics it advertises (notebooks, DAX, CI/CD) overlap with Giulio's interests if he later wants a paid community."}, {"video_id": "ADCE7uzR8C8", "title": "Realistic Practice Exams for Microsoft Certifications!", "url": "https://www.youtube.com/watch?v=ADCE7uzR8C8", "published": "2025-12-16", "duration": "5m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["case study questions", "cert.com", "certification prep", "dp-600", "dp-700", "practice exams"], "summary": "Demos the cert.com full-length, timed practice exam experience (including case studies) for certifications like DP-700 and DP-600 — question counts, flagging, review screens, custom exam configuration, and results scoring.", "relevance": "Useful as a DP-600 exam-prep resource rather than technical content — a realistic, timed case-study format matches how the actual DP-600 exam is structured, which is worth using in Giulio's study plan."}, {"video_id": "CTrU8MhkF0k", "title": "Understanding Materialized Lake Views in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=CTrU8MhkF0k", "published": "2025-12-02", "duration": "15m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["bronze silver gold", "constraints", "delta", "incremental refresh", "lineage", "materialized lake view", "medallion architecture", "spark sql"], "summary": "Explains Fabric materialized lake views (MLVs): declarative Spark SQL CREATE MATERIALIZED LAKE VIEW statements that build a physical Delta table with row-level constraints, chained bronze->silver->gold layers, lineage-aware refresh, scheduling, and refresh via API, demoed by building a 3-table medallion pipeline.", "relevance": "This is a clean, modern P2 pattern for exactly the kind of medallion pipeline Giulio would want for his BC sales data: instead of hand-written notebook transform logic, a declarative SQL MLV can clean/join/aggregate bronze BC tables into silver/gold with automatic dependency-aware refresh and lineage."}, {"video_id": "DKRfvGz0v54", "title": "Understanding Microsoft Fabric Warehouse", "url": "https://www.youtube.com/watch?v=DKRfvGz0v54", "published": "2025-11-24", "duration": "29m 19s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "P3"], "topics": ["copy into", "cross-database query", "fabric warehouse", "stored procedures", "t-sql", "table cloning", "time travel", "views"], "summary": "A thorough tour of the Fabric Warehouse as a data store — its structured-only nature, standard database objects (schemas, tables, views, functions, stored procedures), ingestion methods (pipelines, dataflows, T-SQL notebooks, COPY INTO), and its two standout Delta-powered features: 30-day time travel and zero-copy table cloning, all demoed with SQL, SSMS, and a cross-database query against a Lakehouse.", "relevance": "This is core DP-600 Warehouse content and maps directly onto how Giulio might promote his cleaned BC sales data into a Warehouse gold layer with stored procedures and views, using COPY INTO to load from Azure Blob and table cloning to safely test changes without touching production data."}, {"video_id": "UnxklVHrfSg", "title": "Get DP-700 & DP-600 Certified FOR FREE!", "url": "https://www.youtube.com/watch?v=UnxklVHrfSg", "published": "2025-11-02", "duration": "2m 56s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certas practice questions", "dp-600 exam voucher", "exam prep resources", "fabric data days", "free certification"], "summary": "Announces Microsoft's Fabric Data Days event (starting Nov 4) offering 100% discount vouchers for the DP-600 and DP-700 exams, plus points to free prep resources - the Certas practice-question site and Aleksi's own DP-600/DP-700 YouTube playlists.", "relevance": "Directly actionable for Giulio's DP-600 goal - a free exam voucher opportunity plus a pointer to a free practice-question resource - though it carries no technical exam content itself."}, {"video_id": "eZD89I6xLXg", "title": "Master Microsoft Fabric Delta Tables & Lakehouses", "url": "https://www.youtube.com/watch?v=eZD89I6xLXg", "published": "2025-10-27", "duration": "27m 38s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "S1", "S2"], "topics": ["delta", "lakehouse", "onelake", "optimize", "partitioning", "shortcut cache", "shortcuts", "sql analytics endpoint", "v-order", "vacuum"], "summary": "Deep dive into Fabric lakehouses and the Delta Parquet format: files vs. tables, shortcuts (internal and external, including shortcut caching), how inserts/updates/deletes actually work under the hood as Parquet files plus a Delta log, optimize/vacuum/V-Order maintenance, table partitioning trade-offs, and the read-only TSQL SQL analytics endpoint vs. the writable Spark/notebook interface -- filmed entirely in the presenter's own DP-600 tutorial workspace.", "relevance": "This is core, hands-on DP-600 material end to end -- shortcuts, Delta internals, and the lakehouse-vs-SQL-endpoint distinction are exactly what Giulio needs to land BC sales data in a Fabric lakehouse and later build a Direct Lake semantic model over it, and the video is explicitly built as DP-600 exam prep rather than DP-700."}, {"video_id": "RiRpt0o7rwA", "title": "Microsoft Fabric & OneLake Explained in 2026", "url": "https://www.youtube.com/watch?v=RiRpt0o7rwA", "published": "2025-10-20", "duration": "22m 03s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "S1"], "topics": ["delta parquet", "fabric structure", "lakehouse vs warehouse", "mirroring", "onelake", "shortcuts", "workspace creation"], "summary": "An updated, DP-600-flavored re-run of the fabric structure/terminology topic: tenant → capacity → workspace → domain → item → object layers, OneLake as the single Delta Parquet lake behind every store, shortcuts for virtualizing external data (S3, Dataverse, ADLS, cross-workspace), and mirroring for near-real-time database replication into OneLake — with a live demo creating a schema-enabled lakehouse and a warehouse in a new DP-600-tutorial workspace.", "relevance": "Near-identical content to the January 2025 structure video but explicitly framed for DP-600 study, reinforcing that a lakehouse or warehouse is just a metadata view over OneLake — directly relevant to deciding how to land BC data (lakehouse vs warehouse) and whether a OneLake shortcut vs a copied Delta table is the right approach for his BC API pipeline."}, {"video_id": "t_bykXb5FwE", "title": "DP-600: Microsoft Fabric Analytics Engineer | Intro, Scope & Strategies", "url": "https://www.youtube.com/watch?v=t_bykXb5FwE", "published": "2025-10-13", "duration": "16m 51s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "M2", "P1", "P2", "P3", "S1", "S2"], "topics": ["certification prep", "dp-600", "exam scope", "microsoft learn", "practice exams", "study strategy"], "summary": "Series-launch episode for the presenter's DP-600 course: introduces the exam's three sections (Maintain, Prepare data ~50%, Implement/manage semantic models), question formats, the 700/1000 passing score, official Microsoft study resources, and two study strategies (full learning-path walkthrough vs. a 'fast track' gap-focused approach using practice-exam diagnostics).", "relevance": "This is the master roadmap for exactly the certification Giulio is studying; it maps directly onto the DP-600 taxonomy used across this whole batch and is the video to revisit when planning which topics (DAX/semantic models, star schema, Direct Lake, security) need the most sandbox practice time."}, {"video_id": "LIAX-AgBanQ", "title": "Microsoft Fabric Autobinding Across Multiple Workspaces", "url": "https://www.youtube.com/watch?v=LIAX-AgBanQ", "published": "2025-10-06", "duration": "16m 43s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["autobinding", "ci/cd", "cross-workspace shortcuts", "deployment pipelines", "dev/test/prod", "multi-workspace architecture"], "summary": "Explains and demonstrates Fabric's item autobinding feature across multi-workspace deployment pipelines: cross-workspace shortcuts and invoke-pipeline/notebook references automatically repoint to the paired workspace at each stage (dev to test to prod) as long as every workspace is attached to a deployment pipeline with the same number of stages, plus gotchas around deployment order and shortcuts lagging behind until a redeploy.", "relevance": "Squarely M2 (dev lifecycle / deployment pipelines) — directly relevant if he sets up a proper dev/test/prod structure for his BC to Power BI Fabric project with a shared 'raw/extract' workspace shortcutted into a 'reporting' workspace, which is exactly the multi-workspace pattern demonstrated here."}, {"video_id": "yR3JDJjKXaM", "title": "Our Honest Thoughts on FabCon Announcements", "url": "https://www.youtube.com/watch?v=yR3JDJjKXaM", "published": "2025-09-17", "duration": "28m 07s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "M2", "P1", "S2"], "topics": ["fabcon announcements", "git cicd coverage", "materialized lake views", "onelake security", "power bi web modeling", "shortcut transformations", "variable libraries", "warehouse performance"], "summary": "Two Fabric MVPs (Aleksi Partanen and Oscar Heeken) debrief FabCon announcements: Copilot in the Power BI app, the Fabric MCP server and data agents, Git/CI-CD reaching 100% item coverage, variable libraries reaching GA, OneLake row/column-level security spanning all engines, private links and outbound network restrictions, shortcut transformations for JSON/Parquet, materialized lake views, Python notebooks and Fabric SQL/Cosmos DB databases reaching GA, warehouse performance gains (~36% average) and a GA migration assistant, real-time intelligence schema enforcement/anomaly detection, and Power BI web modeling reaching GA.", "relevance": "A high-value news roundup covering several DP-600-relevant maturity milestones at once: OneLake security (governance pillar), Git/CI-CD and variable libraries (dev-lifecycle pillar), materialized lake views and shortcut transformations (prepare-data pillar), and warehouse performance work (optimize pillar) — good for keeping his exam knowledge current on what's now GA vs. preview."}, {"video_id": "NSWQ4_0vXBc", "title": "The Truth About Shortcut Transformations in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=NSWQ4_0vXBc", "published": "2025-09-15", "duration": "12m 51s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2"], "topics": ["capacity cost", "csv ingestion", "delta", "lakehouse", "onelake shortcuts", "preview feature", "schema drift", "shortcut file transformation"], "summary": "Walks through Fabric's preview 'shortcut file transformation' feature: creating a shortcut to CSV files in Azure Data Lake and having Fabric auto-convert them into a managed lakehouse Delta table with no pipeline. Tests how it handles new files, deleted files, added columns (silently dropped, schema drift unsupported), removed columns and a changed delimiter (both silently produce no new rows), and explains the underlying per-file partitioning and Spark-job/capacity cost.", "relevance": "A directly relevant no-code ingestion path for landing BC CSV exports as Delta tables without building a pipeline or notebook, a fast P1/P2 option worth knowing for DP-600 and for his own BC sandbox, with real caveats (CSV-only, no schema drift support, capacity-heavy, fragmentation risk) worth testing against real BC exports."}, {"video_id": "i7yuklGMLHQ", "title": "Notebook AI Functions in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=i7yuklGMLHQ", "published": "2025-09-09", "duration": "11m 27s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["ai functions", "data enrichment", "fabric notebooks", "gpt-4o mini", "sentiment analysis", "text classification"], "summary": "Demonstrates Fabric notebook built-in AI functions (similarity, classify, analyze_sentiment, extract, fix_grammar, summarize, translate, generate_response) applied to Spark dataframes using GPT-4o mini, including prompt-template mode for generating row-specific content.", "relevance": "A concrete transform/enrich technique Giulio could apply to text fields in his BC data, such as classifying free-text sales comments, sentiment-scoring customer feedback, or cleaning inconsistent item descriptions, directly inside a Fabric notebook without external AI services."}, {"video_id": "C2lInFnM-rU", "title": "Azure Key Vault Secrets with SPN in Microsoft Fabric Data Pipelines", "url": "https://www.youtube.com/watch?v=C2lInFnM-rU", "published": "2025-08-25", "duration": "9m 46s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1", "P1"], "topics": ["azure key vault", "fabric data pipelines", "secret management", "secure output", "service principal", "web activity"], "summary": "Shows how to fetch a secret from Azure Key Vault into a Fabric Data Pipeline using a service principal and the Key Vault REST API via a Web activity, and how to mask the value with secure input/output so it never appears in pipeline run logs.", "relevance": "Relevant to DP-600 M1/P1 — secure, non-personal-account credential handling for pipeline connections is a governance best practice, directly applicable if Giulio's BC API pipeline needs to authenticate without embedding secrets in pipeline definitions."}, {"video_id": "7d1vvDadGEM", "title": "Microsoft Fabric Variable Library | Simplify CI/CD and Environment Management", "url": "https://www.youtube.com/watch?v=7d1vvDadGEM", "published": "2025-08-18", "duration": "28m 37s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["ci/cd", "deployment pipelines", "environment management", "git integration", "notebookutils", "shortcuts", "value sets", "variable library"], "summary": "Deep-dive demo of Fabric variable libraries: creating a dev/prod value-set variable library to dynamically parameterize lakehouse shortcuts, cross-workspace notebook IDs, and invoke-pipeline activity IDs, so a deployment pipeline promotion no longer requires manual post-deployment fixes to hard-coded workspace/item IDs.", "relevance": "This is core DP-600 M2 dev-lifecycle content and maps directly onto a real problem Giulio would hit the moment he has a dev and a prod Fabric workspace for his BC pipeline - hard-coded lakehouse shortcuts and pipeline references breaking on deployment."}, {"video_id": "jTDSP7KBavI", "title": "DP-700 Exam Full Course | Microsoft Fabric Data Engineer Associate", "url": "https://www.youtube.com/watch?v=jTDSP7KBavI", "published": "2025-08-04", "duration": "11h 09m 56s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["access control", "data pipelines", "deployment pipelines", "dp-700", "event house", "exam course", "fabric data engineer", "lakehouse", "notebooks", "slowly changing dimensions", "warehouse"], "summary": "An 11-hour, 26-episode compilation covering the entire DP-700 (Fabric Data Engineer Associate) exam syllabus end to end: core Fabric concepts, SQL/PySpark/KQL basics, event streams, data pipelines, Dataflow Gen2, notebooks, Spark settings and structured streaming, lakehouse/warehouse/event house data stores, slowly changing dimensions, mirroring, access control (workspace through OS/RLS/CLS), dynamic data masking, governance (tags/endorsement/sensitivity labels), git version control, deployment pipelines, SQL database projects, tool selection, Activator, and monitoring -- each with theory, a hands-on demo, and exam-style questions.", "relevance": "This is the DP-700 (Data Engineer) exam course, not DP-600 -- the presenter explicitly states in the intro that semantic modeling and Power BI are out of scope for this exam. Several individual episodes overlap conceptually with DP-600 topics Giulio does need (SQL/KQL/PySpark basics, lakehouse/warehouse fundamentals, OS/RLS/CLS security, Delta, Spark settings), but those are already covered as standalone videos elsewhere in this channel's catalog with the same or better depth for DP-600 purposes; treating an 11-hour DP-700-scoped course as a whole is honestly of limited direct use for DP-600 study."}, {"video_id": "NzT6OUy8eVA", "title": "The Missing Piece in Your Microsoft Fabric Journey", "url": "https://www.youtube.com/watch?v=NzT6OUy8eVA", "published": "2025-08-04", "duration": "2m 28s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certas", "channel announcement", "discord community", "fabric community"], "summary": "Announces a new free community Discord server for Fabric discussions, explains the motivation (public Q&A instead of private DMs), states technical questions will now be answered there or in YouTube comments, and gives a quick tour of the server's channels.", "relevance": "Not educational content; a community/announcement video whose only relevance is as an optional ongoing Q&A resource Giulio could join, not a DP-600 or BC/Power BI content source."}, {"video_id": "0HVN53x87yg", "title": "Microsoft Fabric Monitoring | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=0HVN53x87yg", "published": "2025-07-28", "duration": "33m 09s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["S2", "M1"], "topics": ["capacity metrics app", "dmvs", "long running queries", "monitoring hub", "query insights", "warehouse monitoring", "workspace monitoring"], "summary": "Covers Fabric's monitoring layers: the Monitoring Hub (tracks pipeline/notebook/spark job/semantic-model-refresh runs tenant-wide, filterable/customizable), the Capacity Metrics App (PowerBI app for capacity/storage consumption per item), workspace monitoring (KQL database of workspace-level logs, capacity-heavy), admin monitoring workspace, and warehouse/SQL-endpoint query monitoring via sys DMVs (live connections/sessions/requests) and the queryinsights schema (past request/session history, long-running and frequently-run queries) with a live demo killing a stuck session.", "relevance": "The queryinsights views (frequently_run_queries, long_running_queries) are exactly the DP-600 semantic-model/warehouse optimization toolkit for finding slow queries hitting his BC data warehouse or SQL endpoint, and the Monitoring Hub is his go-to place to debug a failed BC ingestion pipeline run."}, {"video_id": "-2Gnp6msG6U", "title": "Event Triggers & Alerts with Microsoft Fabric Activator | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=-2Gnp6msG6U", "published": "2025-07-16", "duration": "23m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["activator", "dp-700", "event-driven triggers", "onelake events", "rules and actions", "teams alerts"], "summary": "DP-700 exam-prep episode on Fabric Activator: covers its core concepts (events, objects, properties, rules), the four action types (email, Teams message, Power Automate, run pipeline/notebook), and demos an Eventstream-fed temperature object plus a OneLake file-created trigger that fires a data pipeline with trigger parameters.", "relevance": "Activator and event-based pipeline triggers are DP-700 monitoring/orchestration topics not covered in the DP-600 taxonomy (which stops at Maintain/Prepare/Semantic-models); tangential to DP-600 study, though the OneLake file-created trigger pattern could be handy operationally."}, {"video_id": "HsVOOuaJK7Y", "title": "Choosing Data Stores & Tools in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=HsVOOuaJK7Y", "published": "2025-07-09", "duration": "22m 38s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "S1"], "topics": ["data store selection", "dataflow gen2", "decision framework", "dp-700", "eventstream", "lakehouse vs warehouse", "spark notebooks"], "summary": "Side-by-side comparison of Fabric data engineering tools (Data Pipeline copy activity, Dataflow Gen2, Eventstream, Spark notebooks) and data stores (Lakehouse, Warehouse, Eventhouse) across transformation complexity, coding requirement, developer skill set, streaming vs batch, and security, ending with scenario-based practice questions on picking the right combination.", "relevance": "The Lakehouse-vs-Warehouse decision framework (structured/TSQL-friendly data goes to Warehouse; flexible/raw files or a Spark-first team favors Lakehouse; multi-table transactions require Warehouse) maps directly onto DP-600's \"choose an appropriate data store\" skill area and is exactly the decision he needs to make for landing his structured BC relational data in Fabric."}, {"video_id": "wnVruONnRS8", "title": "SQL Database Project with Warehouse | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=wnVruONnRS8", "published": "2025-07-02", "duration": "19m 08s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["ci/cd", "dacpac", "dp-700", "git integration", "sql database project", "vs code", "warehouse deployment"], "summary": "Shows an alternative to Fabric deployment pipelines for warehouse CI/CD: syncing a warehouse to Git as a SQL Database Project (folders/files of CREATE statements per schema/object type), editing it in VS Code with the SQL Database Projects extension, building it into a DACPAC, and publishing that DACPAC to a target warehouse's SQL endpoint (structure only, no data).", "relevance": "Relevant to DP-600's dev-lifecycle pillar as an alternate, code-based deployment path for a Fabric warehouse, useful if Giulio ever wants scriptable/VS Code-based promotion of warehouse schema instead of clicking through Fabric's deployment pipelines UI — though for his day-to-day Power BI semantic model work, Fabric deployment pipelines remain the more directly relevant tool."}, {"video_id": "VQnnd1Ph8go", "title": "You Won't Believe What I Found in Microsoft Fabric", "url": "https://www.youtube.com/watch?v=VQnnd1Ph8go", "published": "2025-06-26", "duration": "2m 36s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["hidden feature", "invoke pipeline activity", "pipeline json editing", "resilience", "retries"], "summary": "Shows an undocumented feature: although the pipeline UI offers no retry setting for the Invoke Pipeline activity, editing the pipeline's underlying JSON lets you add a retry count, and a test run confirms Fabric actually honors it (a failing child pipeline is retried before the parent fails).", "relevance": "A niche pipeline-engineering trick for making nested/orchestrator pipelines more resilient. Marginal for DP-600 exam content but could harden a future multi-pipeline BC ingestion setup."}, {"video_id": "D9VLkImgTO0", "title": "Deployment Pipelines in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=D9VLkImgTO0", "published": "2025-06-25", "duration": "26m 26s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["ci/cd", "deployment pipelines", "deployment rules", "git integration", "item pairing", "stages"], "summary": "Explains Fabric deployment pipelines end to end: stages (dev/test/prod), source vs target stage, item pairing and the four comparison statuses, deployment rules for swapping data sources between stages, selective deployment, and how deployment pipelines are independent of but complementary to git integration.", "relevance": "Directly maps to DP-600's dev-lifecycle scope (deployment pipelines, reusable assets, promoting content between environments), exactly the kind of workflow Giulio would use to promote his BC lakehouse/pipeline/notebook items from a dev workspace to a production Fabric workspace."}, {"video_id": "Y6yUPhGPEuE", "title": "Version Control in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=Y6yUPhGPEuE", "published": "2025-06-17", "duration": "36m 41s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M2"], "topics": ["azure devops", "branch out feature", "branching", "ci/cd", "git integration", "pull requests", "version control", "workspace roles"], "summary": "Full walkthrough of Fabric Git integration — tenant/workspace settings, connecting a workspace to Azure DevOps, what item types sync to Git and what doesn't (data, schedules, permissions excluded), workspace role permissions for Git operations, and the \"branch out to a new workspace\" feature demoed end-to-end with a feature branch, PR, and merge.", "relevance": "Directly maps to DP-600 M2 (dev lifecycle) — this is the exact git/branching workflow Giulio would need to manage his BC-to-Power-BI Fabric artifacts (pipelines, notebooks, lakehouse metadata) safely across dev/test/prod with proper version control."}, {"video_id": "Dn4Xm7vACsA", "title": "Governance in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=Dn4Xm7vACsA", "published": "2025-06-09", "duration": "17m 43s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["certified", "endorsement", "governance", "lineage view", "master data", "promoted", "purview", "sensitivity labels", "tags"], "summary": "Covers Fabric governance features: the three endorsement types (promoted, certified, master data) and their permission rules, custom tags (admin-created, up to 10 per item), sensitivity labels (managed in Microsoft Purview, propagate downstream), and the workspace/item lineage views for impact analysis, demoed live in the admin portal and workspace UI.", "relevance": "Although labeled a DP-700 episode, this content is squarely DP-600's M1 governance scope (endorsement, tags, sensitivity labels, lineage) and directly applicable to Giulio's own Fabric sandbox where he should be endorsing/labeling his BC lakehouse and semantic models as he builds them out."}, {"video_id": "huq8mLss4jo", "title": "Dynamic Data Masking in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=huq8mLss4jo", "published": "2025-06-04", "duration": "21m 59s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["column-level security", "data governance", "dynamic data masking", "fabric warehouse", "sql endpoint", "t-sql security", "unmask permission"], "summary": "A deep exam-prep episode on Dynamic Data Masking (DDM) in Fabric warehouse and lakehouse SQL endpoints - covers the four masking functions (default, email, random, partial), how to apply/alter/drop masks via T-SQL, the GRANT/REVOKE UNMASK permission, why workspace admins/members/contributors always see unmasked data by default, a live demo, and a security caveat that masking can be bypassed via inference through WHERE clauses.", "relevance": "Directly maps to the DP-600 Maintain domain's security and governance content (alongside RLS/CLS/sensitivity labels) even though it's filed as DP-700 prep - dynamic data masking is exactly the column-level protection Giulio would apply to sensitive BC fields (customer names, prices, salaries) exposed through a Fabric warehouse SQL endpoint before those tables reach a semantic model."}, {"video_id": "mw2cWlroGOk", "title": "Row, Column & Object-Level Security in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=mw2cWlroGOk", "published": "2025-05-27", "duration": "24m 07s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["column-level security", "governance", "grant deny revoke", "object-level security", "onelake security", "row-level security", "tsql"], "summary": "Explains and demos object-, column-, and row-level security in a Fabric warehouse using TSQL GRANT/DENY/REVOKE statements and a row-level security predicate function/policy, then introduces the newer, engine-agnostic OneLake security (RBAC) feature that applies consistently across TSQL, Spark, and Power BI.", "relevance": "Directly M1 material: this is exactly the governance layer Giulio would need if BC sales data landed in a Fabric lakehouse/warehouse has to be restricted by region or department before it ever reaches Power BI, and it's a useful complement to (or alternative for) RLS he might otherwise build only inside the semantic model."}, {"video_id": "FNPlg_FHzhY", "title": "Microsoft Fabric Roles and Access Levels Explained | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=FNPlg_FHzhY", "published": "2025-05-20", "duration": "40m 43s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["M1"], "topics": ["domain admin", "fabric admin roles", "item level permissions", "lakehouse sharing", "least privilege", "warehouse sharing", "workspace roles"], "summary": "Comprehensive access-control walkthrough from tenant down to item level: global admin vs fabric admin vs capacity admin vs domain admin/contributor, the four workspace roles (viewer/contributor/member/admin), the principle of least privilege, and item-level sharing permissions for lakehouses (read all SQL endpoint data, read all Apache Spark, build reports on default semantic model) and warehouses (read all using SQL, read all OneLake data, monitor, audit, reshare) — all demoed live by granting a second account incrementally more access.", "relevance": "This is exactly DP-600's M1 (security & governance) study area applied to lakehouses/warehouses/workspaces — understanding when a colleague needs only 'build reports on default semantic model' vs full workspace contributor access is directly useful for governing Giulio's own Fabric workspace and any BC data he shares with teammates."}, {"video_id": "j2n4csp0Fa4", "title": "Mirroring data into Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=j2n4csp0Fa4", "published": "2025-05-12", "duration": "29m 49s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1"], "topics": ["cdc", "database mirroring", "delta parquet", "metadata mirroring", "mirroring", "near real-time sync", "onelake", "open mirroring"], "summary": "Explains and demos the three Fabric mirroring types — database mirroring (Azure SQL DB, Cosmos DB, Snowflake, etc. replicated as Delta tables), metadata mirroring (Databricks Unity Catalog via shortcuts), and open mirroring (custom CDC feeds) — showing near-real-time sync of an Azure SQL database with inserts/updates/deletes reflected in Fabric within seconds.", "relevance": "Directly relevant to DP-600's 'get data'/OneLake objective and to Giulio's own BC-to-Power-BI pipeline: mirroring is a no-pipeline alternative to his current BC API-pages copy approach, and its read-only/views-unsupported limitations matter when choosing the right ingestion pattern for BC data."}, {"video_id": "31ZKY-bfi-w", "title": "Eventhouse in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=31ZKY-bfi-w", "published": "2025-05-06", "duration": "30m 12s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["dp-700", "eventhouse", "kql", "materialized views", "onelake availability", "real-time intelligence", "retention policy"], "summary": "Deep dive on Fabric Eventhouse/KQL databases for DP-700: real-time/telemetry data store strengths and weaknesses versus Warehouse, key objects (query sets, tables, materialized views, functions, shortcuts), retention and caching policies, and a hands-on KQL demo building materialized views with and without backfill plus a reusable KQL function.", "relevance": "Eventhouse and KQL are DP-700 real-time data engineering content and sit outside DP-600's scope for his BC/Power BI batch-reporting work — his BC sales data is structured, low-frequency batch data with no streaming/telemetry component, so this is honestly tangential, though it's useful to know Real-Time Intelligence exists as a Fabric data store option."}, {"video_id": "XsBTgckLkdI", "title": "Different Slowly Changing Dimensions (SCD) | Microsoft Fabric DP-700 Exam", "url": "https://www.youtube.com/watch?v=XsBTgckLkdI", "published": "2025-04-28", "duration": "22m 13s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["S1", "P2"], "topics": ["fact and dimension tables", "scd type 1", "scd type 2", "scd type 3", "slowly changing dimensions", "snowflake schema", "star schema", "surrogate keys"], "summary": "Core data-modeling theory: why normalize, primary/foreign keys, fact vs. dimension tables, star vs. snowflake schema tradeoffs, then a hands-on T-SQL demo in a Fabric warehouse building SCD Type 1 (overwrite), Type 2 (new row with start/end dates and current flag, surrogate key), and Type 3 (previous-value column) dimensions.", "relevance": "This is squarely DP-600 semantic-model territory — star schema design, fact/dimension modeling, and slowly changing dimensions are exactly what the Design-and-build-semantic-models pillar tests, and SCD Type 2 is the standard way to properly track history for a BC customer or item dimension that changes over time (e.g. address, price, or salesperson changes)."}, {"video_id": "LKQIY7ja0qY", "title": "FREE DP-700 Live Learning - Don't miss out!", "url": "https://www.youtube.com/watch?v=LKQIY7ja0qY", "published": "2025-04-23", "duration": "2m 02s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certification", "dp-700", "exam prep", "live learning", "microsoft reactor"], "summary": "A short promotional video pointing viewers to Microsoft Reactor's free live DP-700 exam-prep sessions, noting the presenter is speaking at one of the seven sessions.", "relevance": "Promotes DP-700 (Data Engineering), not DP-600. No technical content and not directly relevant to Giulio's exam track."}, {"video_id": "DlmVcSc2a64", "title": "Microsoft Fabric Warehouse | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=DlmVcSc2a64", "published": "2025-04-22", "duration": "29m 55s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "S1"], "topics": ["copy into", "cross-database query", "fabric warehouse", "stored procedures", "t-sql", "time travel", "views", "zero-copy clone"], "summary": "Covers the Fabric Warehouse data store in depth: schemas, tables, views, functions, stored procedures, ingestion options (pipelines, dataflows, notebooks, COPY INTO), querying via T-SQL/SSMS, cross-database queries against a Lakehouse SQL endpoint, and the Delta-backed time travel and zero-copy table cloning features.", "relevance": "Core DP-600 material even though framed as DP-700 prep: Warehouse is one of the Fabric data stores DP-600 covers, and the views/stored procedures/COPY INTO/cross-database query content maps directly onto transform and semantic-model-design skills; the time travel and cloning demos are great hands-on material for his sandbox."}, {"video_id": "uBuLva9lPzo", "title": "Lakehouse in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=uBuLva9lPzo", "published": "2025-04-15", "duration": "26m 39s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "S2"], "topics": ["delta parquet", "lakehouse", "onelake", "optimize", "shortcut caching", "shortcuts", "sql analytics endpoint", "time travel", "v-order", "vacuum"], "summary": "Deep dive on the Fabric Lakehouse — OneLake, files vs tables, Delta Parquet internals, access interfaces (Spark, T-SQL endpoint, ABFSS), shortcuts to external sources with shortcut caching rules, and Delta table maintenance (VACUUM, OPTIMIZE, V-Order) via both UI and notebook, plus practice questions.", "relevance": "Highly relevant despite the DP-700 label — Lakehouse, Delta tables, shortcuts, and VACUUM/OPTIMIZE/V-Order are core DP-600 P1/P2/S2 topics. Directly explains the storage layer a Direct Lake semantic model over BC data would read from, and how to keep those Delta tables performant."}, {"video_id": "BTCXmsKNqpM", "title": "Spark Structured Streaming with PySpark | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=BTCXmsKNqpM", "published": "2025-04-09", "duration": "24m 07s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["checkpoint location", "delta", "dp-700", "micro-batches", "pyspark", "readstream", "spark structured streaming", "writestream"], "summary": "DP-700 exam-prep episode explaining Spark structured streaming (spark.readStream/writeStream, checkpoints, micro-batches, max files per trigger) with a notebook demo that streams incrementally-arriving JSON files into a Lakehouse Delta table and monitors/stops the stream.", "relevance": "Streaming ingestion patterns are DP-700 data-engineering scope, not DP-600, and Giulio's BC data pipeline is batch/refresh-based rather than streaming, so this is not relevant to his current work despite being solid Fabric content."}, {"video_id": "BucPcWzJNY0", "title": "Secrets Revealed! - Channel Update Video", "url": "https://www.youtube.com/watch?v=BucPcWzJNY0", "published": "2025-03-28", "duration": "3m 52s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["certas practice platform", "channel update", "community", "dp-700 series", "fabcon"], "summary": "A personal channel-update video - Aleksi confirms he's a real person (not AI), shows his recording setup, gives a status update on the Certas practice-question platform and the DP-700 video series, and mentions attending FabCon in Las Vegas.", "relevance": "Not educational content; purely channel and community news with no direct bearing on Giulio's BC/Power BI/Fabric work."}, {"video_id": "N51X78f0i5E", "title": "Configure Spark in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=N51X78f0i5E", "published": "2025-03-24", "duration": "25m 47s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": [], "topics": ["custom pool", "fabric environments", "high concurrency", "session timeout", "spark configuration", "spark pools", "starter pool"], "summary": "Explains Fabric's Spark pool architecture (driver/head node, worker nodes, executors, tasks) via a pizza-shop analogy, then covers starter pool vs. custom pool trade-offs, environments (for CI/CD-friendly Spark config), high-concurrency sessions across notebooks/pipelines, and job/core reservation settings, for DP-700 exam prep.", "relevance": "This is Spark compute administration and capacity tuning, which sits in DP-700 (data engineering) exam scope, not DP-600's Prepare/Semantic Model domains; nothing here is required for Giulio's DP-600 study or his current BC/Power BI work, since he isn't tuning Spark pool sizing."}, {"video_id": "MVmFuewXjm4", "title": "Notebooks in Microsoft Fabric | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=MVmFuewXjm4", "published": "2025-03-17", "duration": "29m 31s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P1", "P2", "M2"], "topics": ["exit values", "fabric notebooks", "notebook orchestration", "notebook parameters", "notebookutils", "pyspark", "spark sql magic commands"], "summary": "Deep dive into Fabric notebooks: Spark/Python/T-SQL notebook types, mixing languages per cell with magic commands (%%sql), notebookutils (fs, notebook, credentials/Key Vault, lakehouse utilities), notebook parameter cells and exit values, and the different ways to run/orchestrate notebooks (run magic, notebookutils.notebook.run/runMultiple with a DAG-style JSON, or as a Notebook activity in a data pipeline) — demoed by reading CSVs from a lakehouse, writing to Delta tables, and running a parameterized notebook from a pipeline.", "relevance": "This is the exact pattern Giulio would use for his BC API → Fabric pipeline: parameterizing a notebook (e.g. which BC entity/table to process) and calling it from a pipeline's Notebook activity, with an exit value passed back for downstream logic — directly transferable regardless of DP-700 vs DP-600 labeling since notebooks are also core DP-600 transform tooling."}, {"video_id": "hcuKkqqrLy0", "title": "Microsoft Fabric Dataflow Gen2 Explained | DP-700 Exam Prep", "url": "https://www.youtube.com/watch?v=hcuKkqqrLy0", "published": "2025-03-11", "duration": "23m 38s", "ch": "Fabric", "accent": "#2563eb", "axis_label": "DP-600", "tags": ["P2"], "topics": ["data transformation", "dataflow gen2", "lakehouse destination", "m query", "merge queries", "power query online"], "summary": "DP-700 exam-prep deep dive into Dataflow Gen2: the Power Query Online UI (queries pane, diagram view, data preview, query settings), supported sources/destinations, and a hands-on demo merging two CSV files and writing the merged result to a Lakehouse table.", "relevance": "Dataflow Gen2 is squarely a DP-600 'Prepare: transform' tool too, even though this video is framed for DP-700; the merge-two-sources-and-write-to-Lakehouse pattern is exactly how Giulio could shape BC entities before modeling them."}, {"video_id": "3vBbALjdwyM", "title": "Use PySpark to Read & Write
