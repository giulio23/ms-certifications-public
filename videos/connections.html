ry table, no code apps in some reports yet, disjointed agent surfaces) and conclude it's the beginning of the end for the CoE Starter Kit, but not the end.", "relevance": "Useful awareness for tracking apps/agents/usage across a Power Platform tenant without deploying the full CoE Starter Kit - relevant if Giulio's Innovation team wants lightweight, native visibility into demo sprawl and Copilot Studio agent usage rather than standing up the full starter kit."}, {"video_id": "EtdVhzISEdI", "title": "Microsoft Learn Extractor: Track Skills & Certifications Easily", "url": "https://www.youtube.com/watch?v=EtdVhzISEdI", "published": "2025-12-16", "duration": "20m 55s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-400", "AB-900"], "topics": ["alternate key", "canvas app", "certifications tracking", "dataverse", "governance", "http connector", "odata", "power automate", "skills database", "upsert"], "summary": "Charles demos his free, open-source Microsoft Learn Extractor: a canvas app plus parent/child Power Automate flows that pull a user's certifications, applied skills, and completed modules from an undocumented Microsoft Learn API and upsert them into Dataverse using alternate keys, with gotchas around OData binds, pluralization, and HTTP batch requests to Dataverse.", "relevance": "A ready-made, deployable pattern Giulio could adapt to auto-track his own and colleagues' Microsoft AI/Power Platform certification progress in Dataverse, then report on team skill coverage via Power BI for the Innovation team's upskilling plan; the upsert-with-alternate-key flow pattern is also directly reusable for other BC-data sync flows."}, {"video_id": "mx8LQZXlyDQ", "title": "Assess before you build in Power Platform", "url": "https://www.youtube.com/watch?v=mx8LQZXlyDQ", "published": "2025-12-09", "duration": "23m 30s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["business value", "citizen deve a real anecdote of a Dataverse AI prompt column burning 700,000 credits."}, {"video_id": "6fJsrsFdmL0", "title": "Microsoft Ignite 2025 Power Platform & Governance Bombshells!", "url": "https://www.youtube.com/watch?v=6fJsrsFdmL0", "published": "2025-11-24", "duration": "29m 17s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["AB-900", "AB-100", "AB-620"], "topics": ["agent 365", "agent governance", "ai builder", "app builder", "code apps", "copilot studio", "dataverse", "managed platform", "shadow it", "zones"], "summary": "A breakdown of Ignite 2025's governance announcements: the '10,000 agents for 10 users / 10 agents for 10,000 users' concept and its three-tier zone model (safe/personal, supported/collaborative, IT-managed), Agent 365 as a unified cross-M365/Power Platform/Foundry agent governance portal, Copilot Studio's Managed Platform pillars, AI Builder-to-Copilot credit licensing changes, the new maker welcome-message experience, and the App Builder / code apps / Power Apps Studio spectrum.", "relevance": "Gives Giulio a practical framework — the three-tier zone model — for classifying and governing the agents and apps the Innovation team will build across Copilot Studio, M365 Copilot, and Foundry, plus early visibility into Agent 365 as the coming cross-platform governance hub relevant to his AI-adoption remit."}, {"video_id": "i3xzkZS0SoM", "title": "An introduction to Environment Variables in Power Platform", "url": "https://www.youtube.com/watch?v=i3xzkZS0SoM", "published": "2025-11-18", "duration": "32m 08s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "canvas app", "connection reference", "dataverse", "environment variables", "managed solution", "power automate", "power platform", "sharepoint", "solutions"], "summary": "Live-demo walkthrough of environment variables: creating text and data-source variables, wiring them into a canvas app and a Power Automate flow so hardcoded values (email address, SharePoint site/list) become dynamic, then exporting a managed solution and importing it into a second environment where the variable values are set per environment without touching the app's code.", "relevance": "Directly applicable to Giulio's demo-building workflow: any BC/BI demo he moves from his dev sandbox to a test environment needs its BC environment/company reference, notification email, or SharePoint list swapped per environment, which is exactly the pattern shown here."}, {"video_id": "natG5kjFQbc", "title": "Admin tools, community contributions, PCF governance and more with Valentin Mazhar", "url": "https://www.youtube.com/watch?v=natG5kjFQbc", "published": "2025-11-17", "duration": "9m 24s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": [], "topics": ["admin tools", "coe starter kit", "community", "copilot agents", "governance", "licensing", "low code plugins", "managed environments", "pcf components"], "summary": "Power Platform MVP Valentin Mazhar discusses why he builds and freely releases governance tools, the gap in visibility around what PCF components actually call, licensing gaps that persist even with managed environments and the CoE Kit, and his emerging tooling for administering Copilot/agent metadata (deleting orphaned agents, surfacing which tools/agents an agent calls).", "relevance": "Reinforces that even with managed environments and the CoE Kit there are real governance gaps around AI agents (deleting agents, inspecting what tools/agents an agent uses) - relevant context for Giulio as he starts building and administering Copilot Studio agents for BC/BI use cases on the Innovation team."}, {"video_id": "VssfXGZQzy0", "title": "Reducing Power Platform risks with the Endpoint Collector", "url": "https://www.youtube.com/watch?v=VssfXGZQzy0", "published": "2025-11-11", "duration": "9m 56s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["A unts and SharePoint-to-Dataverse workarounds, and upcoming AI Builder-to-Copilot credit changes.", "relevance": "Directly informs any business case Giulio needs to build for premium Power Platform licensing at the BC consultancy, and the multiplexing/service-account warning is a real risk to check before wiring a Power Automate flow or code app to Dataverse on behalf of many BC users."}, {"video_id": "CTkRVQCnbc8", "title": "What Are Managed and Unmanaged Solutions in Power Platform?", "url": "https://www.youtube.com/watch?v=CTkRVQCnbc8", "published": "2025-10-14", "duration": "29m 04s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "connection references", "dataverse", "dependencies", "managed solutions", "power platform", "publisher", "solution layering", "solutions", "unmanaged solutions"], "summary": "Explains solutions in Power Platform: unmanaged solutions as editable references vs managed solutions as locked, production-ready containers; solution layering, dependencies, the 'block unmanaged customizations' setting, preferred solutions, publishers, what can/can't be solutionized, and a live demo of exporting/importing a solution plus versioning basics.", "relevance": "Core ALM skill Giulio needs to package any BC-connected canvas app, flow, or Dataverse component he builds in his sandbox into a solution he can move cleanly from dev to a test environment when showing his Innovation team or BI team a working demo, rather than leaving everything unsolutionized in one environment."}, {"video_id": "rK3asrBrsI4", "title": "Inside the COE Starter Kit: Manage Permissions & More", "url": "https://www.youtube.com/watch?v=rK3asrBrsI4", "published": "2025-10-07", "duration": "22m 32s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900"], "topics": ["coe starter kit", "compliance", "data loss prevention", "dataverse", "governance", "manage permissions", "managed environments", "power apps admin"], "summary": "Two Power Platform admins tour more CoE Starter Kit apps: Data Policy Impact Analysis (testing DLP changes before applying them), the Manage Permissions app (transferring app/flow ownership, inspecting cross-tenant connections), the CoE Command Center (starter kit health and sync-flow errors), and the Developer Compliance Center (makers self-service metadata that surfaces back to admins).", "relevance": "Useful reference for how a BC consultancy's Innovation team could govern a growing library of Power Platform/AI demos and pilots - especially DLP impact analysis before locking down connectors, and ownership handover when a demo moves from Giulio's sandbox to a team-owned solution."}, {"video_id": "Ue0pWsZh-GA", "title": "Getting started with the Center of Excellence (CoE) Starter Kit", "url": "https://www.youtube.com/watch?v=Ue0pWsZh-GA", "published": "2025-09-30", "duration": "25m 30s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900"], "topics": ["admin view", "alm", "canvas apps", "center of excellence", "coe starter kit", "dataverse", "dlp policies", "governance", "inventory", "power bi"], "summary": "Two governance practitioners cover common CoE Starter Kit installation gotchas (direct admin role assignment, Power Apps/Automate/BI licensing, API limits), then demo the setup and upgrade wizard and the Admin View app, showing Dataverse-backed inventory via sync flows, app/flow ownership management, and canvas app quarantining.", "relevance": "The CoE kit's Dataverse inventory tables and Power BI reporting are a direct template for giving the Innovation team visibility into the consultancy's growing app/flow estate, and the ownership/quarantine features map onto real BC-consultancy governance needs as more BI solutions get built."}, {"video_id": "cFFfjAeB6fQ", "title": "Data Policies in Power Platform", "url": "https://www.youtube.com/watch?v=cFFfjAeB6fQ", "published": "2025-09-23", "duration": "25m 25s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900", "PL-400"], "topics": ["connectors", "custom connectors", "data policies", "dataverse", "dlp", "governance", "least privilege", "power platform"], "summary": "Explains what data policies (formerly DLP policies) are and walks through creating one in the admin center: the default group, blocked/non-business/business connector categories, endpoint filtering (preview), custom connector pattern matching, policy scope, and how overlapping policies resolve via least privilege.", "relevance": "Directly relevant to Giulio's demos that connect BC/Dataverse data to Power Automate, Teams, or email: he needs to know how to classify the BC connector and related connectors as 'business' so BC data can't leak to non-business connectors like personal email, which matters when pitching AI adoption to a consultancy that is protective of client data."}, {"video_id": "xF4pYQqkkao", "title": "Environment Creation in Power Platform", "url": "https://www.youtube.com/watch?v=xF4pYQqkkao", "published": "2025-09-16", "duration": "25m 25s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "dataverse", "environment creation", "environment groups", "governance", "managed environments", "pac cli", "power platform admin center", "security groups"], "summary": "Power Squared hosts walk through creating a Power Platform environment from the admin center, covering naming conventions, managed environments, environment groups, region, environment type, Dataverse, security groups, and pay-as-you-go with Azure. They then survey automation options: the Power Platform for Admins connector, pac CLI, Azure DevOps/GitHub pipelines, PowerShell, and the unsupported BAP API.", "relevance": "Directly applicable to Giulio's Innovation-team remit of standing up sandbox environments for BC/BI demos - naming conventions, security groups, and Dataverse decisions matter every time he provisions a new environment for a Copilot Studio or Foundry pilot."}, {"video_id": "18uhsKGbOp0", "title": "Essential Tenant Settings for Power Platform", "url": "https://www.youtube.com/watch?v=18uhsKGbOp0", "published": "2025-09-09", "duration": "24m 45s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "AB-900"], "topics": ["admin center", "ai builder credits", "copilot studio", "customer lockbox", "data residency", "governance", "managed environments", "power automate", "tenant isolation", "tenant settings"], "summary": "Power Squared walks through the most important tenant-level settings in the Power Platform admin center: tenant isolation, developer/trial/production environment assignments, environment routing, AI Builder credit allocation, customer lockbox, Power Automate flow-run resubmission, the weekly digest/analytics, and the data-residency risk of preview features like Copilot in Power Apps and Copilot Studio agents.", "relevance": "As BI consultant on the Innovation team piloting AI adoption, these are the exact tenant controls that determine how safely Giulio can trial Copilot Studio/AI Builder against BC data without leaking data cross-region or letting AI Builder credits get consumed unpredictably."}, {"video_id": "NjgShlaLY00", "title": "An introduction to Power Platform Environments", "url": "https://www.youtube.com/watch?v=NjgShlaLY00", "published": "2025-09-02", "duration": "46m 20s", "ch": "Power Squared", "accent": "#0d9488", "axis_label": "cert", "tags": ["PL-900", "PL-400"], "topics": ["alm", "coe starter kit", "dataverse", "default environment", "environment routing", "environments", "governance", "managed environments", "managed solutions", "power platform"], "summary": "Debut Power Squared episode explaining Power Platform environments: environment types, the messy default environment and how to govern it, ALM strategy (dev/test/prod), managed vs unmanaged solutions, Dataverse data isolation per environment, geographic/security considerations, the CoE Starter Kit, and how premium features (managed environments, environment routing, environment groups) strengthen governance.", "relevance": "Foundational for Giulio's Innovation-team role: any BC/BI Power Platform sandbox work he demos needs a defensible environment/ALM strategy before it can be proposed to the wider BC consultancy, and this maps directly to how his own tenant's default environment and sandbox should be organized."}], CH=[{"short": "Fabric", "accent": "#2563eb", "name": "Microsoft Fabric", "page": "../dp-600/videos.html", "axis_label": "DP-600"}, {"short": "Powercademy", "accent": "#7c3aed", "name": "Powercademy", "page": "powercademy.html", "axis_label": "cert"}, {"short": "Power Squared", "accent": "#0d9488", "name": "Power Squared", "page": "power-squared.html", "axis_label": "cert"}];
const accent={}; CH.forEach(c=>accent[c.short]=c.accent);
// topic -> {count, channels:Set, vids:[]}
const T={};
DATA.forEach(v=>v.topics.forEach(t=>{ (T[t]=T[t]||{c:0,ch:new Set(),v:[]}); T[t].c++; T[t].ch.add(v.ch); T[t].v.push(v); }));
const topics=Object.keys(T);
const cross=topics.filter(t=>T[t].ch.size>1);
document.getElementById('stat').textContent=`(${DATA.length} videos · ${topics.length} topics · ${cross.length} shared across channels)`;
document.getElementById('chlegend').innerHTML=CH.map(c=>`<span class="inline-flex items-center gap-1.5"><span style="width:10px;height:10px;border-radius:9999px;background:${c.accent}"></span><a href="${c.page}" class="hover:underline">${c.name}</a></span>`).join('');
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function dots(set){return [...set].map(c=>`<span title="${c}" style="width:8px;height:8px;border-radius:9999px;background:${accent[c]||'#999'};display:inline-block"></span>`).join(' ');}
function rank(a,b){ const d=T[b].ch.size-T[a].ch.size; return d||T[b].c-T[a].c; }
let active=null;
function topicChip(t){
  const on=t===active, span=T[t].ch.size>1;
  return `<button data-t="${esc(t)}" class="topic text-sm px-3 py-1.5 rounded-full border transition inline-flex items-center gap-2 ${on?'bg-indigo-600 text-white border-indigo-600':(span?'bg-white border-indigo-200 hover:border-indigo-400':'bg-white border-gray-200 hover:border-gray-300 text-gray-600')}">
    <span>${esc(t)}</span><span class="opacity-70 text-[11px]">${T[t].c}</span>${span?`<span class="inline-flex gap-0.5">${dots(T[t].ch)}</span>`:''}</button>`;
}
function renderTopics(filter){
  const list=topics.filter(t=>!filter||t.includes(filter)).sort(rank);
  document.getElementById('topics').innerHTML=list.map(topicChip).join('');
  const cb=cross.filter(t=>!filter||t.includes(filter)).sort(rank).slice(0,14);
  document.getElementById('crossbar').innerHTML = cb.length?('<div class="text-[11px] font-semibold text-indigo-600 uppercase tracking-wide mb-2">Cross-channel connections</div><div class="flex flex-wrap gap-2 mb-5">'+cb.map(topicChip).join('')+'</div>'):'';
  document.querySelectorAll('.topic').forEach(b=>b.onclick=()=>{active=b.dataset.t;renderTopics(document.getElementById('q').value.trim().toLowerCase());renderResults();});
}
function card(v){
  const tags=v.tags.map(t=>`<span style="background:${v.accent}18;color:${v.accent};border:1px solid ${v.accent}44" class="text-[11px] font-semibold px-2 py-0.5 rounded-full">${esc(t)}</span>`).join(' ');
  return `<article class="border border-gray-200 rounded-2xl p-5 bg-white">
   <div class="flex items-start justify-between gap-3">
    <h3 class="font-semibold leading-snug"><a href="${v.url}" target="_blank" rel="noopener" class="hover:underline">${esc(v.title)}</a></h3>
    <span class="shrink-0 inline-flex items-center gap-1.5 text-xs font-medium" style="color:${v.accent}"><span style="width:8px;height:8px;border-radius:9999px;background:${v.accent}"></span>${esc(v.ch)}</span></div>
   <div class="text-xs text-gray-400 mt-0.5">${v.published} · ${v.duration||''}</div>
   <div class="flex flex-wrap gap-1.5 mt-2">${tags||'<span class="text-[11px] text-gray-400">general</span>'}</div>
   <p class="text-sm text-gray-700 mt-2 leading-relaxed">${esc(v.relevance||v.summary)}</p>
   <a href="${v.url}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 mt-2 text-sm font-medium" style="color:${v.accent}">&#9654; Watch</a></article>`;
}
function renderResults(){
  const r=document.getElementById('results');
  if(!active){ r.innerHTML='<p class="text-gray-400 text-sm">Pick a topic above to see its videos across channels.</p>'; return; }
  const vids=T[active].v.slice().sort((a,b)=>(b.published||'').localeCompare(a.published||''));
  r.innerHTML=`<div class="flex items-center gap-2 mb-4"><h2 class="text-xl font-bold">${esc(active)}</h2><span class="text-sm text-gray-400">${vids.length} video${vids.length>1?'s':''} · ${[...T[active].ch].join(' + ')}</span></div><div class="grid md:grid-cols-2 gap-4">${vids.map(card).join('')}</div>`;
}
document.getElementById('q').addEventListener('input',e=>renderTopics(e.target.value.trim().toLowerCase()));
renderTopics(''); renderResults();
</script></body></html>
